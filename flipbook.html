cx=\"28\" cy=\"316\" r=\"3\" fill=\"#2B2B2B\"/>\n      <path d=\"M 12 338 Q 20 344 30 338\" fill=\"none\"/>\n      <path d=\"M -2 344 Q 6 352 14 344\" fill=\"none\"/>\n    </g>\n    <g id=\"biscuit\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <ellipse cx=\"0\" cy=\"500\" rx=\"70\" ry=\"52\" fill=\"#E9C46A\"/>\n      <ellipse cx=\"0\" cy=\"516\" rx=\"44\" ry=\"30\" fill=\"#FFF8EC\"/>\n      <line x1=\"-44\" y1=\"530\" x2=\"-44\" y2=\"552\"/>\n      <line x1=\"-16\" y1=\"536\" x2=\"-16\" y2=\"554\"/>\n      <line x1=\"16\" y1=\"536\" x2=\"16\" y2=\"554\"/>\n      <line x1=\"44\" y1=\"530\" x2=\"44\" y2=\"552\"/>\n      <ellipse cx=\"-44\" cy=\"554\" rx=\"12\" ry=\"6\" fill=\"#E9C46A\"/>\n      <ellipse cx=\"44\" cy=\"554\" rx=\"12\" ry=\"6\" fill=\"#E9C46A\"/>\n      <path d=\"M -66 486 Q -88 470 -80 446\" fill=\"none\"/>\n      <circle cx=\"52\" cy=\"452\" r=\"40\" fill=\"#E9C46A\"/>\n      <ellipse cx=\"70\" cy=\"466\" rx=\"22\" ry=\"16\" fill=\"#FFF8EC\"/>\n      <ellipse cx=\"84\" cy=\"462\" rx=\"8\" ry=\"6\" fill=\"#2B2B2B\"/>\n      <circle cx=\"56\" cy=\"444\" r=\"4\" fill=\"#2B2B2B\"/>\n      <path d=\"M 30 424 Q 20 404 36 400 Q 48 402 44 424 Z\" fill=\"#8B5E3C\"/>\n      <path d=\"M 66 478 Q 74 486 84 478\" fill=\"none\"/>\n      <path d=\"M 40 486 Q 52 494 64 486\" fill=\"none\"/>\n    </g>\n    <g id=\"captain-chomp\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <path d=\"M -40 500 Q -70 490 -74 460 Q -70 440 -52 446\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"0\" cy=\"490\" rx=\"52\" ry=\"60\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"6\" cy=\"506\" rx=\"30\" ry=\"36\" fill=\"#E9C46A\"/>\n      <line x1=\"-6\" y1=\"486\" x2=\"18\" y2=\"486\"/>\n      <line x1=\"-6\" y1=\"502\" x2=\"18\" y2=\"502\"/>\n      <line x1=\"-6\" y1=\"518\" x2=\"18\" y2=\"518\"/>\n      <ellipse cx=\"-22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <line x1=\"-30\" y1=\"450\" x2=\"-48\" y2=\"470\"/>\n      <line x1=\"30\" y1=\"450\" x2=\"50\" y2=\"468\"/>\n      <circle cx=\"6\" cy=\"400\" r=\"42\" fill=\"#2A9D8F\"/>\n      <path d=\"M 30 380 L 56 388 L 32 398 Z\" fill=\"#2A9D8F\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"3\" fill=\"#2B2B2B\"/>\n      <circle cx=\"-12\" cy=\"392\" r=\"8\" fill=\"#E9C46A\"/>\n      <line x1=\"-16\" y1=\"388\" x2=\"-8\" y2=\"396\"/>\n      <line x1=\"-8\" y1=\"388\" x2=\"-16\" y2=\"396\"/>\n      <path d=\"M 20 416 Q 30 424 42 416\" fill=\"none\"/>\n      <path d=\"M -20 362 L -14 348 L -6 362 L 2 348 L 10 362\" fill=\"none\"/>\n    </g>\n  </defs>\n  <rect x=\"0\" y=\"0\" width=\"800\" height=\"600\" fill=\"#FFF8EC\"/>\n  <rect x=\"480\" y=\"300\" width=\"240\" height=\"260\" fill=\"#8B5E3C\"/>\n  <rect x=\"500\" y=\"240\" width=\"200\" height=\"60\" fill=\"#C9A66B\"/>\n  <path d=\"M 560 520 q 0 -26 34 -26 q 34 0 34 26 l 0 12 l -68 0 Z\" fill=\"#2A9D8F\"/>\n  <ellipse cx=\"600\" cy=\"470\" rx=\"60\" ry=\"20\" fill=\"#FFF8EC\" stroke-dasharray=\"6 6\"/>\n  <line x1=\"700\" y1=\"320\" x2=\"700\" y2=\"380\"/>\n  <circle cx=\"700\" cy=\"390\" r=\"10\" fill=\"none\"/>\n  <use href=\"#snell\" transform=\"translate(300,112) scale(0.8)\"/>\n  <use href=\"#pip\" transform=\"translate(120,280) scale(0.5)\"/>\n  <use href=\"#ollie\" transform=\"translate(220,320) scale(0.45)\"/>\n  <text x=\"400\" y=\"60\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"22\" fill=\"#8B5E3C\">the dog-shaped hole</text>\n  <text x=\"400\" y=\"592\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"15\" fill=\"#2B2B2B\">never once late</text></svg>\n", "head": "Chapter 23 - The Dog-Shaped Hole", "paras": ["<p>On the seventh day, they went back, and Snell made tea, and he made the biscuits, the dog kind, and he set them on a plate, and he looked at the plate for a long moment before he set it down, and Pip saw the look, and filed it, and did not say anything.</p>", "<p>They sat in the keeping room, among the shelves and the kept things, and the Keeper hummed under the floor, and Snell folded his long hands, and he said, \"You asked about the dog. About Biscuit. I... I would like to tell you. If you'd like to hear. Nobody's... nobody's asked about Biscuit in a long time. And I think... I think I would like to say his name out loud. To someone. I've been saying it to the Keeper. And the Keeper hums. But the Keeper doesn't... the Keeper doesn't remember him. Not the way I remember him. And I think I would like someone to remember him with me.\"</p>", "<p>\"We'd like to hear,\" said Pip.</p>", "<p>And Snell told them.</p>", "<p>\"Biscuit was a stray,\" he said. \"Did you know that? He wasn't a dog I bought. He was a dog that came. I was... I was alone, then. I've always been alone, mostly. I'm a maker. I make things. And makers are alone, mostly, because the things don't talk back. And I was alone, and I left the bowl out. Just... just a bowl. By the door. For strays. For the strays that come in the night. And one night, a dog came. A biscuit-colored dog. Thin, then. Not fat. Thin, and wary, and hungry. And he drank from the bowl. And he looked at me. And I... I left the bowl out the next night. And he came back. And I left it out the next. And he came back. And after a while, he stopped being a stray. He stopped being a stray, and he started being Biscuit. And I... I named him Biscuit, because he was the color of a biscuit, and because he was the only thing in my life that was never once late.\"</p>", "<p>Snell paused, and he looked at the plate of dog biscuits, and his face was the face of a man looking at a thing he has lost and has not stopped loving.</p>", "<p>\"He was a good dog,\" he said. \"He was a very good dog. He used to sit by the oven while I made things. He used to... he used to put his head on my foot when I worked. Just his head. On my foot. And I would work, and he would sleep, and his head would be on my foot, and I... I was not alone. For the first time in a long time, I was not alone. Because there was a dog, and his head was on my foot, and he was never once late.\"</p>", "<p>The silence that followed had a temperature, and the temperature was a dog's head on a man's foot, and a man who was not alone for the first time in a long time.</p>", "<p>\"And then,\" said Snell, and his voice went soft, \"and then he ran off.\"</p>", "<p>\"He... he chased something,\" said Snell. \"A rabbit. Or a sound. Or a... I don't know. I don't know what he chased. I was in the workshop. I was making something. And I heard the gate, and I heard the... the running, and I came out, and he was gone. Down the lane. And I called. And I called. And he didn't come back.\" Snell's long hands folded tighter. \"He didn't come back. And I looked. I looked for a long time. I put up posters. I put up... I put up posters with his picture. And the posters got rained on. And I put up more. And they got rained on. And I... I took them down. Eventually. I took them down. And I stopped coming in to the bakery. And I closed the curtains. And I... I built the Keeper.\"</p>", "<p>\"Because you couldn't bear it,\" said Pip.</p>", "<p>\"Because I couldn't bear it,\" Snell agreed. \"Because I couldn't bear the thought of a thing I love being lost. Being gone. Being... being out there, somewhere, cold, and hungry, and wondering why I didn't come. And I thought... I thought, if I could build a thing that keeps, a thing that never loses, then I would never have to feel this again. This... \" He put his hand on his chest, over his heart, and he said, \"This hole. This dog-shaped hole. I thought, if I keep everything, I'll never have another hole. I'll never have another... another dog-shaped hole.\" He looked at Pip with his kind, tired eyes. \"But the hole is still there. The Keeper keeps everything, and the hole is still there. Because the hole is not... the hole is not about the things. The hole is about Biscuit. And the Keeper can't keep Biscuit. Because Biscuit is gone. And the Keeper can keep everything else, but it can't keep Biscuit. And the hole is still there.\"</p>", "<p>Pip felt the ground under the fog go warm and sad. The man knew. The man knew, somewhere, under the keeping, under the dusting, under the telling-things-they're-loved, the man knew that the Keeper could not fill the hole. The man knew the hole was about Biscuit, and that keeping everything else would not bring him back. And he kept anyway. Because keeping was the thing he could do, and the hole was the thing he could not fix, and keeping was the only thing left that looked like love.</p>", "<p>Ollie, who had been listening with his whole face, who had been quiet for an unusually long time, said, \"Mr. Snell. I lost Captain Chomp. My dinosaur. He's a secret pirate. And he was under my chin, and then he wasn't. And I... I know the hole. I know the dog-shaped hole. I have a dinosaur-shaped hole. And it's... it's the worst. It's the worst hole.\" He looked at Snell with his whole face. \"And I'm getting him back. On Finding Day. He's being loved back. He's remembering the way home. And I'm going to get him back.\" He paused, and he said, the bravest thing, the small, loud, brave thing, \"And maybe... maybe Biscuit is being loved back too. Maybe Biscuit is remembering the way home. Maybe Biscuit is... maybe Biscuit is not gone. Maybe Biscuit is just lost. And lost is not the same as gone.\"</p>", "<p>Snell looked at the six-year-old who had just said <em>lost is not the same as gone</em>, and the crack opened wider than it had ever been. He put his long hands over his face and made a sound that was not quite a sob and not quite a hum - eight years of keeping, coming loose.</p>", "<p>Goldie reached out and put her hand on Snell's arm - a thing you did to a bell, not to a man shaped like an umbrella - and said, \"Lost is not the same as gone, Mr. Snell. Lost is not the same as gone. And the love stays. Even when the thing is lost. The love stays. That's the thing. That's the whole thing. The love stays.\"</p>", "<p>And Snell, under his long hands, said, \"The love stays,\" soft and broken and wondering, the way you say a thing you have been avoiding for eight years and have just been told is true.</p>", "<p>The love stays.</p>", "<p>Under the floor, the Keeper hummed. And for a second, just a second, the hum did something it had never done. It faltered. It skipped. It... it missed a beat, the way a heart misses a beat when it hears a thing it has been avoiding. And then it caught, and it went on, patient and keeping, but the beat had been missed, and Pip heard it, and filed it, and put a little star on the tag.</p>", "<p>The Keeper had heard. The Keeper had heard <em>the love stays</em>, and the Keeper had missed a beat. And a machine that misses a beat is a machine that has a crack. And a crack is where the light gets in. And a crack is where the answer starts.</p>", "<p>They stayed a little longer. They finished their tea. They ate the biscuits, the dog kind, because Snell had made them, and because you did not leave biscuits unfinished in a house that had made them, and because the biscuits were the only thing left that looked like love. And Snell, when they left, did not say <em>thank you for coming</em>. He said, \"The love stays,\" softly, to himself, the way you say a thing you are trying to believe. And the door closed, gently, the way he did everything.</p>", "<p>And they stood in the lane, the three of them, and the house with too many curtains held its breath, and the Keeper hummed, patient and keeping, but the beat had been missed, and the crack was there, and the love was still there, even after eight years, even with the curtains closed.</p>", "<p>And Pip, who was eleven, who had a label maker, who had just watched a six-year-old ring a bell with the words <em>lost is not the same as gone</em>, felt the shape of the answer settle into him, hard and clear. They were going to answer the heartbreak. They were going to show the man the love stays. They were going to get nineteen things home for Finding Day, and one dinosaur, and one dog-shaped hole.</p>", "<p>They were going to do it tomorrow. On Finding Day. With a pocket full of useless junk, and a cat with a stamp, and a walrus who says no, and a six-year-old who counts to zero.</p>", "<p>But tonight, there was a man saying <em>the love stays</em> to himself, softly, the way you say a thing you are trying to believe.</p>", "<p>And tonight, that was a start.</p>"]}, {"id": "ch24", "label": "Chapter 24", "title": "Chapter 24 - Watch Me", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\">\n<defs>\n    <g id=\"pip\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <line x1=\"-10\" y1=\"372\" x2=\"-10\" y2=\"384\"/>\n      <line x1=\"10\" y1=\"372\" x2=\"10\" y2=\"384\"/>\n      <rect x=\"-32\" y=\"382\" width=\"64\" height=\"88\" fill=\"#E4572E\"/>\n      <line x1=\"-32\" y1=\"398\" x2=\"-52\" y2=\"446\"/>\n      <line x1=\"32\" y1=\"398\" x2=\"56\" y2=\"438\"/>\n      <circle cx=\"-52\" cy=\"450\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"46\" y=\"428\" width=\"34\" height=\"22\" fill=\"#E9C46A\"/>\n      <line x1=\"52\" y1=\"439\" x2=\"74\" y2=\"439\"/>\n      <rect x=\"80\" y=\"435\" width=\"12\" height=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"56\" cy=\"442\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"-32\" y=\"466\" width=\"64\" height=\"20\" fill=\"#2B2B2B\"/>\n      <line x1=\"-14\" y1=\"486\" x2=\"-14\" y2=\"550\"/>\n      <line x1=\"14\" y1=\"486\" x2=\"14\" y2=\"550\"/>\n      <ellipse cx=\"-16\" cy=\"552\" rx=\"16\" ry=\"8\" fill=\"#2B2B2B\"/>\n      <ellipse cx=\"18\" cy=\"552\" rx=\"16\" ry=\"8\" fill=\"#2B2B2B\"/>\n      <circle cx=\"0\" cy=\"338\" r=\"40\" fill=\"#FFF8EC\"/>\n \" y2=\"440\"/>\n      <line x1=\"30\" y1=\"376\" x2=\"54\" y2=\"436\"/>\n      <circle cx=\"-52\" cy=\"444\" r=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"54\" cy=\"440\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"-18\" y=\"352\" width=\"36\" height=\"12\" fill=\"#E9C46A\"/>\n      <circle cx=\"0\" cy=\"318\" r=\"36\" fill=\"#FFF8EC\"/>\n      <path d=\"M -36 310 Q -36 280 0 280 Q 36 280 36 310 L 36 302 Q 0 288 -36 302 Z\" fill=\"#9AA5B1\"/>\n      <circle cx=\"8\" cy=\"316\" r=\"9\" fill=\"none\"/>\n      <circle cx=\"28\" cy=\"316\" r=\"9\" fill=\"none\"/>\n      <line x1=\"17\" y1=\"316\" x2=\"19\" y2=\"316\"/>\n      <circle cx=\"8\" cy=\"316\" r=\"3\" fill=\"#2B2B2B\"/>\n      <circle cx=\"28\" cy=\"316\" r=\"3\" fill=\"#2B2B2B\"/>\n      <path d=\"M 12 338 Q 20 344 30 338\" fill=\"none\"/>\n      <path d=\"M -2 344 Q 6 352 14 344\" fill=\"none\"/>\n    </g>\n    <g id=\"biscuit\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <ellipse cx=\"0\" cy=\"500\" rx=\"70\" ry=\"52\" fill=\"#E9C46A\"/>\n      <ellipse cx=\"0\" cy=\"516\" rx=\"44\" ry=\"30\" fill=\"#FFF8EC\"/>\n      <line x1=\"-44\" y1=\"530\" x2=\"-44\" y2=\"552\"/>\n      <line x1=\"-16\" y1=\"536\" x2=\"-16\" y2=\"554\"/>\n      <line x1=\"16\" y1=\"536\" x2=\"16\" y2=\"554\"/>\n      <line x1=\"44\" y1=\"530\" x2=\"44\" y2=\"552\"/>\n      <ellipse cx=\"-44\" cy=\"554\" rx=\"12\" ry=\"6\" fill=\"#E9C46A\"/>\n      <ellipse cx=\"44\" cy=\"554\" rx=\"12\" ry=\"6\" fill=\"#E9C46A\"/>\n      <path d=\"M -66 486 Q -88 470 -80 446\" fill=\"none\"/>\n      <circle cx=\"52\" cy=\"452\" r=\"40\" fill=\"#E9C46A\"/>\n      <ellipse cx=\"70\" cy=\"466\" rx=\"22\" ry=\"16\" fill=\"#FFF8EC\"/>\n      <ellipse cx=\"84\" cy=\"462\" rx=\"8\" ry=\"6\" fill=\"#2B2B2B\"/>\n      <circle cx=\"56\" cy=\"444\" r=\"4\" fill=\"#2B2B2B\"/>\n      <path d=\"M 30 424 Q 20 404 36 400 Q 48 402 44 424 Z\" fill=\"#8B5E3C\"/>\n      <path d=\"M 66 478 Q 74 486 84 478\" fill=\"none\"/>\n      <path d=\"M 40 486 Q 52 494 64 486\" fill=\"none\"/>\n    </g>\n    <g id=\"captain-chomp\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <path d=\"M -40 500 Q -70 490 -74 460 Q -70 440 -52 446\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"0\" cy=\"490\" rx=\"52\" ry=\"60\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"6\" cy=\"506\" rx=\"30\" ry=\"36\" fill=\"#E9C46A\"/>\n      <line x1=\"-6\" y1=\"486\" x2=\"18\" y2=\"486\"/>\n      <line x1=\"-6\" y1=\"502\" x2=\"18\" y2=\"502\"/>\n      <line x1=\"-6\" y1=\"518\" x2=\"18\" y2=\"518\"/>\n      <ellipse cx=\"-22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <line x1=\"-30\" y1=\"450\" x2=\"-48\" y2=\"470\"/>\n      <line x1=\"30\" y1=\"450\" x2=\"50\" y2=\"468\"/>\n      <circle cx=\"6\" cy=\"400\" r=\"42\" fill=\"#2A9D8F\"/>\n      <path d=\"M 30 380 L 56 388 L 32 398 Z\" fill=\"#2A9D8F\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"3\" fill=\"#2B2B2B\"/>\n      <circle cx=\"-12\" cy=\"392\" r=\"8\" fill=\"#E9C46A\"/>\n      <line x1=\"-16\" y1=\"388\" x2=\"-8\" y2=\"396\"/>\n      <line x1=\"-8\" y1=\"388\" x2=\"-16\" y2=\"396\"/>\n      <path d=\"M 20 416 Q 30 424 42 416\" fill=\"none\"/>\n      <path d=\"M -20 362 L -14 348 L -6 362 L 2 348 L 10 362\" fill=\"none\"/>\n    </g>\n  </defs>\n  <rect x=\"0\" y=\"0\" width=\"800\" height=\"600\" fill=\"#FFF8EC\"/>\n  <use href=\"#goldie\" transform=\"translate(250,112) scale(0.8)\"/>\n  <circle cx=\"360\" cy=\"430\" r=\"18\" fill=\"#2A9D8F\"/>\n  <path d=\"M 400 414 l 0 32 q 0 10 10 10\" fill=\"none\" stroke=\"#9AA5B1\" stroke-width=\"5\"/>\n  <circle cx=\"450\" cy=\"430\" r=\"16\" fill=\"none\" stroke=\"#E4572E\" stroke-width=\"6\"/>\n  <use href=\"#snell\" transform=\"translate(600,112) scale(0.8)\"/>\n  <rect x=\"520\" y=\"440\" width=\"180\" height=\"50\" fill=\"#E9C46A\"/>\n  <text x=\"610\" y=\"473\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"24\" fill=\"#2B2B2B\">WATCH ME</text>\n  <use href=\"#pip\" transform=\"translate(120,280) scale(0.5)\"/>\n  <text x=\"400\" y=\"60\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"22\" fill=\"#8B5E3C\">can't keep everything</text>\n  <text x=\"400\" y=\"592\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"15\" fill=\"#2B2B2B\">the love stays</text></svg>\n", "head": "Chapter 24 - Watch Me", "paras": ["<p>They brought the thing about the warm, and the thing about the warm was Goldie's pocket.</p>", "<p>That was the plan, the one they had made in the lane, the one that Ollie had improved by saying <em>just show him the pocket, the pocket knows things</em>, and the plan was this: they would show Snell the pocket, the marble and the paperclip and the rubber band, the three useless things that were loved and were not kept, and they would show him the difference, and the difference would be the crack, and the crack would be where the light got in.</p>", "<p>So they went back, on the seventh day, in the afternoon, and Snell made tea, and he made the dog kind, and he set them on the plate, and he looked at the plate, and Pip saw the look, and filed it, and did not say anything. And they sat in the keeping room, among the shelves and the kept things, and the Keeper hummed under the floor, and Goldie turned her pocket half inside out, the way she did, and let the contents spill into her palm.</p>", "<p>\"Exhibit A,\" she said. \"The pocket of useless junk.\"</p>", "<p>There, in her hand, were the three things. The marble, the cat's-eye, the swirl of green and gold. The paperclip, silver and bent. The rubber band, red and cracked and stretched.</p>", "<p>\"Mr. Snell,\" said Goldie. \"These are mine. They're useless. You can't eat them, you can't wear them, they're no good for anything. And I love them. I love them a lot. The marble's got a chip from the church steps. The paperclip's bent because I bent it thinking about my dad. The rubber band held my hair the day I learned to ride a bike.\" She held them out, and the lamplight caught them, and they were small and useless and loved. \"And here's the thing, Mr. Snell. Here's the whole thing. I love them. And I don't mind when they go.\"</p>", "<p>Snell looked at the three things. \"You... you don't mind?\"</p>", "<p>\"I don't mind,\" said Goldie. \"The marble'll roll under something I can't reach. The paperclip'll fall out of a hole in this pocket. The rubber band'll snap. And I'll be sad. And then I'll remember the church steps, and my dad, and the bike. And the sad'll be the good kind. The kind that means it was real.\" She closed her hand around the three things, and the pocket jingled the small, satisfied jingle. \"I love them. And I let them go. And the love stays. That's the thing. That's the whole thing. The love stays, even when the thing goes. The love stays.\"</p>", "<p>Snell was quiet for a long moment. He looked at the three useless things, and he looked at his shelves, at the kept things, at the music boxes that were not playing and the books that were not read and the gloves that were not worn, and his face was the face of a man who is being shown a thing he has been avoiding for eight years.</p>", "<p>\"But... but what if they're gone forever?\" he said. \"What if the marble rolls under something, and you never see it again? What if the paperclip falls out, and it's gone? What if the rubber band snaps, and it's... and it's gone? What then? What then, Goldie? What do you do then?\"</p>", "<p>\"Then I remember,\" said Goldie. \"Then I remember the church steps, and my dad, and the bike. And the remembering is the love. And the love stays. Even when the thing is gone. The love stays.\" She looked at Snell with her shortcut eyes, her kind, calm, shortcut eyes. \"Mr. Snell. You can't keep everything you love. You can't. Nobody can. The things go. That's what things do. And if you try to keep everything, you... you don't get to love them. You just get to keep them. And keeping is not loving. Keeping is... keeping is being afraid, with a machine.\"</p>", "<p>And Snell, who was a man shaped like an umbrella, who had been alone eight years, who had built a machine so nothing he loves is ever lost again, looked at the girl with the pocket of useless junk, and the crack opened, wider than it had ever been, and for a long moment he did not speak. And then he said, in a voice that was soft and broken and wondering, \"You can't keep everything you love.\"</p>", "<p>\"No,\" said Goldie. \"You can't.\"</p>", "<p>\"You can't keep everything you love,\" said Snell, and he said it again, the way you say a thing you are trying to believe, the way you say a thing that is true and is a relief and is a terror, all at once. And then he did the thing that was funny and was sad and was the whole heartbreak in one gesture. He stood up, and he looked at his shelves, at the kept things, at the Keeper humming under the floor, and he said, \"Watch me.\"</p>", "<p>\"Watch me,\" said Silas Snell, the saddest man in town, the man who had built a machine so nothing he loves is ever lost again. \"Watch me. I'm going to keep everything. I'm going to keep everything I love. And I'm going to prove it. I'm going to prove that you can keep everything you love. Watch me.\"</p>", "<p>And the Keeper hummed, patient and keeping, and the hum was loud, and the hum was proud, and the hum was the hum of a machine that has been told <em>watch me</em> and has decided to rise to the occasion. And Pip felt the ground under the fog go cold, because <em>watch me</em> was not the answer. <em>Watch me</em> was the heartbreak doubling down. <em>Watch me</em> was the man who had been shown the crack and had decided to build a bigger wall. And the Keeper was going to rise to the occasion. And the Keeper was going to keep everything. And the Keeper was going to prove it.</p>", "<p>\"Mr. Snell,\" said Pip. \"That's not... that's not the point. The point is not to keep everything. The point is to love everything. And loving is not keeping. Loving is... loving is letting the thing be a thing. Letting it be warm. Letting it risk being lost. The point is not to prove you can keep everything. The point is to... to let the love stay, even when the thing goes.\"</p>", "<p>\"Watch me,\" said Snell, and he was not listening, and he was not being mean, and he was being gentle and heartbroken and afraid, and he had decided to build a bigger wall. \"Watch me. I'm going to keep everything. And on Finding Day... on Finding Day, the Keeper is going to keep everything. Everything that's lost. Everything that's loved. Everything. And nothing will ever be lost again. And I'll prove it. I'll prove that you can keep everything you love.\"</p>", "<p>Pip felt the shape of the problem settle into him, hard and clear and cold. The man was not going to let go. The man was going to double down. The man was going to keep everything, on Finding Day, and the Keeper was going to rise to the occasion, and the Keeper was going to keep everything, and nothing would ever be lost again, and nothing would ever be warm again, and nothing would ever go home.</p>", "<p>\"Mr. Snell,\" said Pip. \"Please. Please don't. The things... the things want to go home. The people are waiting. The people are going to forget. Please. Let them go home. Let the love stay. Please.\"</p>", "<p>And Snell, who was a man shaped like an umbrella, who had been alone eight years, looked at Pip with his kind, tired eyes, and the crack was there, wide, wider than it had ever been, and for a long moment Pip thought the man was going to say yes. And then the man said, \"I'll make you a deal. I'll... I'll let one go home. One thing. The dinosaur. I'll let the dinosaur go home. Because... because the boy has a dinosaur-shaped hole. And I know the hole. And I'll let the dinosaur go home.\" He paused, and his voice went soft. \"But just the one. Just the dinosaur. The rest... the rest I'm keeping. The rest I'm keeping. Watch me.\"</p>", "<p>And that was the deal. One dinosaur. One thing back. The rest kept. The rest kept, on Finding Day, when the Keeper was going to keep everything, and nothing would ever be lost again, and nothing would ever be warm again.</p>", "<p>Pip felt the ground under the fog go cold and solid. The deal was a trap and a kindness and the heartbreak. It was going to get Captain Chomp home, and keep everything else, and it was not the answer.</p>", "<p>But it was a start. It was a crack. It was one dinosaur. And one dinosaur was a brother's hole, filled. And one dinosaur was a start.</p>", "<p>\"We'll take the dinosaur,\" said Pip. \"But we're not done. We're not done, Mr. Snell. We're going to show you. We're going to show you the love stays. And we're going to do it on Finding Day. And you're going to see. You're going to see that you can't keep everything you love. And you're going to see that the love stays anyway.\"</p>", "<p>\"Watch me,\" said Snell, softly, to himself, the way you say a thing you are trying to believe.</p>", "<p>And they went out into the lane, into the dusk, and the house with too many curtains held its breath, and the Keeper hummed, patient and keeping, rising to the occasion, getting ready for Finding Day.</p>", "<p>And tomorrow was Finding Day. And the Keeper was going to keep everything. And Pip was going to prove that the love stays.</p>", "<p>But tonight, there was a deal, and one dinosaur, and a man saying <em>watch me</em> to himself, softly, the way you say a thing you are trying to believe.</p>", "<p>And tonight, that was a start.</p>"]}, {"id": "ch25", "label": "Chapter 25", "title": "Chapter 25 - The Bureau Declares a Working Holiday", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\">\n<defs>\n    <g id=\"pip\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" 5 - The Bureau Declares a Working Holiday", "paras": ["<p>On the seventh day, the Bureau declared a working holiday, which was a thing Barnaby made up, and which meant that everyone worked, but with biscuits, and with a sense of occasion, and with the particular grim cheer of people who are preparing for the best day of the year while knowing that the best day of the year might be ruined.</p>", "<p>\"Finding Day,\" Barnaby announced, standing on a lost step, leaking contentedly, \"is the best day. The best day of the year. The day the big door opens. The day the way home is straight. The day everything that is ready goes home.\" He paused, and his whiskers moved, and he said, \"This year, the Keeper is going to try to keep everything. This year, the best day might be... might be the worst day. So we are going to prepare. We are going to prepare with biscuits. And with a sense of occasion. And with the grim cheer of people who are not going to let the best day be the worst day. I have made up a title for it. You are all now Knights of the Grim Cheer. It is not official. But it is true.\"</p>", "<p>\"I'm already a Knight of the Shortcut,\" said Goldie. \"Can I be two knights?\"</p>", "<p>\"You can be two knights,\" said Barnaby. \"You can be all the knights. The knighthood is not a limited resource. The knighthood is a feeling.\"</p>", "<p>And so they prepared. They prepared the way the Bureau prepared, which was with dusting, and with labeling, and with the particular furious grace of people who believe that writing a thing down is a way of keeping it. Miss Whisk went through the ledger, and she marked the things that were ready, the things that were claimed, the things that were going home, and she did not mark the eighteen clean squares, because the eighteen clean squares were not going home, and the marking of them would have been a lie, and Miss Whisk did not lie, because the record was the truth.</p>", "<p>But she did something else. She took a fresh page, and she wrote, at the top, in her precise hand, THE EIGHTEEN, and under it she wrote the names. The music box. The telescope. The harmonica. The red mitten. And the rest. She wrote them all, the eighteen, and under each one she wrote the person who loved it, the person who was waiting, the person who was going to forget if the thing stayed lost too long. And she set the page where everyone could see it, and she said, \"We count them. We remember them. And we bring them home. That's the job. That's the whole job.\"</p>", "<p>Thimble prepared the socks. He went through the sock wing, and he sorted the lonely socks, the single socks, the ones that smelled like toast and rain and grass and someone else's house, and he put them in a special bin, a bin he labeled READY / GOING HOME / SMELLS LIKE SOMEONE. And Pip, watching, said, \"Why those? Why the lonely ones?\"</p>", "<p>\"Because the lonely ones want their pairs,\" said Thimble. \"A lonely sock wants its pair more than anything. More than a glove wants its glove. More than a key wants its lock. A lonely sock is a homing thing. It wants home. It wants home more than anything.\" He placed a small gray sock in the bin, gently. \"On Finding Day, the lonely socks go home. They find their pairs. They find their people. They... they lead the way. The lonely socks lead the way home. That's the thing about lonely socks. They're not just lost. They're... they're homing. They're homing things.\"</p>", "<p>And Pip, who was eleven, who had a label maker, who had just heard a hedgehog say <em>the lonely socks lead the way home</em>, felt something click, quietly, in the drawer where he kept the things that mattered. He filed it. He filed it with a little star on the tag. <em>The lonely socks lead the way home.</em> He did not know why it mattered. He did not know it was going to matter more than anything. He only knew that it was a thing worth filing, and he filed it, and he went back to the dusting.</p>", "<p>Barnaby prepared the big door. He went to the back of the Bureau, to the great door that none of them had ever seen open, the one that Snell had come through, the one that was the only way in or out, and he polished the brass, and he oiled the hinges, and he said, \"Tomorrow, this door opens. Tomorrow, the way home is straight. Tomorrow, everything that is ready goes home.\" He paused, and his flipper rested on the brass, and he said, \"And tomorrow, the Keeper is going to try to keep everything. And tomorrow, we are going to answer the heartbreak. And tomorrow, we are going to prove that the love stays.\" He looked at Pip with his small, kind eyes. \"Are you ready, Friend of the Lost?\"</p>", "<p>\"I'm ready,\" said Pip. And he was. He was ready. He had a pocket full of useless junk that was going to help, and a cat with a stamp, and a walrus who says no, and a hedgehog who sorts the socks, and a six-year-old who counts to zero. He was ready. He did not know the how. He did not know the exactly. But he was ready, and being ready was the thing you could do, and the how was the thing that would come, and the how would come because he was ready.</p>", "<p>Ollie prepared the counting. He took his page, the one that said OFFICIAL COUNTER, OLLIE PARKER, AGE 6, VERY GOOD AT COUNTING, and he wrote the number at the top. NINETEEN. And under it he wrote, GOING TO ZERO. And he said, \"I'm going to count to zero. I'm going to count the things home. And when I get to zero, that means nothing's missing. And zero is the best number. And I'm going to get to zero.\" He looked at Pip with his whole face. \"I promise. That's my job. I'm the Official Counter. I count to zero.\"</p>", "<p>And Pip, who was eleven, who had a brother who was very good at counting, felt the ground under the fog go solid, because a room where a six-year-old promises to count to zero is a room that has decided what winning looks like. Zero. Nothing missing. Everything home.</p>", "<p>They prepared until the lamps were low, and the shadows were long, and the lost things stood in their rows like a crowd that had been told to wait and had decided to be patient about it. And the umbrella orchard made its rain-that-wasn't-there sound, and the jar of keys hummed its question, and under the floor, under the hill, the Keeper hummed, patient and keeping, getting ready for Finding Day.</p>", "<p>And Barnaby, at the end, when the biscuits were gone and the dusting was done, said, \"Tomorrow is Finding Day. Tomorrow is the best day. And tomorrow, we are going to answer the heartbreak. And I want you to remember something. I want you to remember that the man in the curtained house is not a monster. He is a bell. And we do not shout at a bell. We ring it. We ring it softly, and we listen, and we hope it remembers the sound.\" He looked at Pip. \"And I want you to remember that the love stays. Even when the thing is lost. Even when the thing is kept. Even when the thing is gone. The love stays. That's the thing we're going to prove. That's the whole thing. The love stays.\"</p>", "<p>\"The love stays,\" said Pip.</p>", "<p>\"The love stays,\" said Goldie.</p>", "<p>\"The love stays,\" said Ollie, at full volume, which was his way of signing a contract.</p>", "<p>And Miss Whisk, who was the Head Cataloguer, who kept the record of everyone's loving, who had a bell in the back under administrative, said, \"The love stays,\" and her paw went to her empty collar, and she left the drawer open a little, so it got some air, so it knew it was not forgotten.</p>", "<p>And Thimble, who sorted the socks, who gave spare buttons to lost coats, who was prepared for loss, said, \"The love stays,\" and his quills clicked, and the red star button was still gone, and he was going to get it back, and he was going to have a word.</p>", "<p>And under the hill, the Keeper hummed, patient and keeping, and it had nineteen things, and it wanted the twentieth, and it was getting bigger, and it was getting ready.</p>", "<p>But the Bureau was ready too. The Bureau was ready with biscuits, and with a sense of occasion, and with the grim cheer of people who are not going to let the best day be the worst day.</p>", "<p>And tomorrow was Finding Day. And tomorrow, they were going to prove that the love stays.</p>", "<p>But tonight, there was a working holiday, and a page that said THE EIGHTEEN, and a bin of lonely socks that smelled like someone, and a six-year-old who was going to count to zero.</p>", "<p>And tonight, that was a start.</p>"]}, {"id": "ch26", "label": "Chapter 26", "title": "Chapter 26 - The Heart of the House", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\">\n<defs>\n    <g id=\"pip\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <line x1=\"-10\" y1=\"372\" x2=\"-10\" y2=\"384\"/>\n      <line x1=\"10\" y1=\"372\" x2=\"10\" y2=\"384\"/>\n      <rect x=\"-32\" y=\"382\" width=\"64\" height=\"88\" fill=\"#E4572E\"/>\n      <line x1=\"-32\" y1=\"398\" x2=\"-52\" y2=\"446\"/>\n      <line x1=\"32\" y1=\"398\" x2=\"56\" y2=\"438\"/>\n      <circle cx=\"-52\" cy=\"450\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"46\" y=\"428\" width=\"34\" height=\"22\" fill=\"#E9C46A\"/>\n      <line x1=\"52\" y1=\"439\" x2=\"74\" y2=\"439\"/>\n      <rect x=\"80\" y=\"435\" width=\"12\" height=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"56\" cy=\"442\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"-32\" y=\"466\" width=\"64\" height=\"20\" fill=\"#2B2B2B\"/>\n      <line x1=\"-14\" y1=\"486\" x2=\"-14\" y2=\"550\"/>\n      <line x1=\"14\" y1=\"486\" x2=\"14\" y2=\"550\"/>\n      <ellipse cx=\"-16\" cy=\"552\" rx=\"16\" ry=\"8\" fill=\"#2B2B2B\"/>\n      <ellipse cx=\"18\" cy=\"552\" rx=\"16\" ry=\"8\" fill=\"#2B2B2B\"/>\n      <circle cx=\"0\" cy=\"338\" r=\"40\" fill=\"#FFF8EC\"/>\n      <path d=\"M -40 334 Q -40 296 0 296 Q 40 296 40 334 Q 26 314 0 316 Q -26 314 -40 334 Z\" fill=\"#2B2B2B\"/>\n      <circle cx=\"8\" cy=\"336\" troke-linecap=\"round\" stroke-linejoin=\"round\">\n      <path d=\"M -40 500 Q -70 490 -74 460 Q -70 440 -52 446\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"0\" cy=\"490\" rx=\"52\" ry=\"60\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"6\" cy=\"506\" rx=\"30\" ry=\"36\" fill=\"#E9C46A\"/>\n      <line x1=\"-6\" y1=\"486\" x2=\"18\" y2=\"486\"/>\n      <line x1=\"-6\" y1=\"502\" x2=\"18\" y2=\"502\"/>\n      <line x1=\"-6\" y1=\"518\" x2=\"18\" y2=\"518\"/>\n      <ellipse cx=\"-22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <line x1=\"-30\" y1=\"450\" x2=\"-48\" y2=\"470\"/>\n      <line x1=\"30\" y1=\"450\" x2=\"50\" y2=\"468\"/>\n      <circle cx=\"6\" cy=\"400\" r=\"42\" fill=\"#2A9D8F\"/>\n      <path d=\"M 30 380 L 56 388 L 32 398 Z\" fill=\"#2A9D8F\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"3\" fill=\"#2B2B2B\"/>\n      <circle cx=\"-12\" cy=\"392\" r=\"8\" fill=\"#E9C46A\"/>\n      <line x1=\"-16\" y1=\"388\" x2=\"-8\" y2=\"396\"/>\n      <line x1=\"-8\" y1=\"388\" x2=\"-16\" y2=\"396\"/>\n      <path d=\"M 20 416 Q 30 424 42 416\" fill=\"none\"/>\n      <path d=\"M -20 362 L -14 348 L -6 362 L 2 348 L 10 362\" fill=\"none\"/>\n    </g>\n  </defs>\n  <rect x=\"0\" y=\"0\" width=\"800\" height=\"600\" fill=\"#FFF8EC\"/>\n  <rect x=\"200\" y=\"200\" width=\"400\" height=\"360\" fill=\"#E9C46A\"/>\n  <circle cx=\"280\" cy=\"280\" r=\"40\" fill=\"#C9A66B\"/>\n  <circle cx=\"280\" cy=\"280\" r=\"12\" fill=\"#8B5E3C\"/>\n  <circle cx=\"520\" cy=\"300\" r=\"34\" fill=\"#C9A66B\"/>\n  <circle cx=\"520\" cy=\"300\" r=\"10\" fill=\"#8B5E3C\"/>\n  <circle cx=\"300\" cy=\"480\" r=\"30\" fill=\"#C9A66B\"/>\n  <circle cx=\"500\" cy=\"480\" r=\"26\" fill=\"#C9A66B\"/>\n  <rect x=\"360\" y=\"330\" width=\"80\" height=\"100\" fill=\"#FFF8EC\"/>\n  <rect x=\"384\" y=\"360\" width=\"32\" height=\"20\" fill=\"#9AA5B1\"/>\n  <circle cx=\"400\" cy=\"370\" r=\"4\" fill=\"#2B2B2B\"/>\n  <use href=\"#snell\" transform=\"translate(120,168) scale(0.7)\"/>\n  <use href=\"#pip\" transform=\"translate(680,224) scale(0.6)\"/>\n  <text x=\"400\" y=\"60\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"22\" fill=\"#8B5E3C\">the heart</text>\n  <text x=\"400\" y=\"592\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"15\" fill=\"#2B2B2B\">the first thing</text></svg>\n", "head": "Chapter 26 - The Heart of the House", "paras": ["<p>They went to arrange the dinosaur, and Snell showed them the Keeper, and the Keeper was the heart of the house, and the heart of the house was a machine that was too big for the house.</p>", "<p>\"Come,\" said Snell, when they had finished their tea, when the biscuits, the dog kind, had been eaten, because you did not leave biscuits unfinished in a house that had made them. \"Come. You should see it. You should see the Keeper. If... if you're going to understand, you should see it. I've never shown it to anyone. Nobody's seen it. But you... you've seen the whole thing. You've seen the almost. And I think... I think you should see the heart.\"</p>", "<p>He led them down. Down a stair that had not been there, down into a room that the outside of the house did not have room for, down into the heart of the house. And the Keeper was there.</p>", "<p>The Keeper was brass. It was brass and gears and springs and little copper wires, and it was the size of a room, and it was growing. Pip could see it growing. It was a slow thing, a thing you saw the way you see a plant grow, which is to say you saw it if you looked, and if you looked away and looked back it was a little bigger. The gears turned. The springs coiled and uncoiled. The copper wires hummed. And the whole thing was warm and cold at the same time, warm like a thing that is loved, cold like a thing that is kept, and it hummed, patient and keeping, and the hum was the hum they had been hearing all week, the hum under the floor, the hum under the hill, and it was loud here, and it was the loudest it had ever been, and it was a hum you felt in your teeth, in your bones, in the part of you that knows when a thing is too big for the room it is in.</p>", "<p>\"Is it alive?\" Ollie asked, very quietly, for him.</p>", "<p>Snell looked at the machine, and his face did the thing, the soft-sad thing. \"No,\" he said. \"No, it's not alive. It's... it's a machine. It's a machine that keeps. It's not alive.\" He paused, and his long hand rested on the brass, and the Keeper hummed happy. \"But sometimes... sometimes I think it's the closest thing to alive I've got. And that's... that's the sad part. That's the sad part, isn't it. That the closest thing to alive I've got is a machine that keeps.\"</p>", "<p>And Ollie, who was six, who was brave in small, loud ways, said, \"That's the saddest thing I ever heard,\" and Snell said, \"Yes. Yes, it is,\" and the Keeper hummed, and nobody said anything for a moment.</p>", "<p>\"This is the Keeper,\" said Snell, and his voice was proud and afraid, both at once. \"This is... this is the thing I built. So nothing I love is ever lost again. It keeps. It keeps everything. It brings the lost things here, and it keeps them, and they're never lost again.\" He put his long hand on the brass, gently, the way he did everything, and the Keeper hummed happy, the way it did when he was close. \"It hums happy when I'm close. It's the only thing that hums happy when I'm close.\"</p>", "<p>And Pip, who was eleven, who had a label maker, who was looking at the heart of the house, saw the thing that made his stomach do a thing. In the middle of the Keeper, in the very heart of it, there was a jar. A small glass jar, set into the brass, held there by the gears, the way a heart is held by the ribs. And in the jar there was something small. Something metal. Something that caught the lamplight.</p>", "<p>\"What's in the jar?\" Pip asked.</p>", "<p>Snell went very still. His long hand folded tighter. And for a long moment he did not speak. And then he said, in a voice that was so soft it was almost not there, \"The first thing. The first thing I kept. The... the thing that started it.\" He did not say what it was. He did not have to. Pip looked at the small metal thing in the jar, and he thought: <em>a collar tag. A dog's collar tag. Biscuit's collar tag.</em> And he filed it, and he put a little star on the tag, and he did not say it out loud, because the man was not ready, and because you did not shout at a bell, you rang it softly.</p>", "<p>\"The Keeper keeps the first thing in the heart,\" said Snell. \"So it remembers. So it remembers what it's for. So nothing it loves is ever lost again.\" He looked at the jar, at the small metal thing, and his face was the face of a man looking at a thing he has lost and has not stopped loving. \"So it remembers the dog. So it remembers... so it remembers Biscuit.\"</p>", "<p>And Pip, who was eleven, who had a label maker, who had just seen the heart of the house, felt the shape of the answer settle into him, hard and clear. The Keeper was built around a dog's collar tag. The Keeper was a love letter to a dog, written in brass and gears, and the love letter was eating the town, and the love letter was going to keep everything on Finding Day, and the love letter did not know that the love stays, even when the dog is gone.</p>", "<p>\"Mr. Snell,\" said Pip. \"The Keeper. It's... it's too big for the house. It's growing. And on Finding Day, it's going to keep everything. Everything that's lost. Everything that's loved. And the people are going to forget. And the things are going to be cold. And the almost is going to be... the almost is going to be everything. Please. Please don't. Please let them go home. Please let the love stay.\"</p>", "<p>And Snell, who was a man shaped like an umbrella, who had been alone eight years, looked at the Keeper, at the heart of the house, at the jar with the small metal thing, and the crack was there, wide, wider than it had ever been, and for a long moment Pip thought the man was going to say yes. And then the man said, \"Watch me.\"</p>", "<p>\"Watch me,\" said Silas Snell, the saddest man in town. \"Watch me. I'm going to keep everything. And I'm going to prove it. I'm going to prove that you can keep everything you love. Watch me.\" He paused, and his voice went soft. \"But the dinosaur. The dinosaur I'll let go home. The dinosaur I'll let go home. Because the boy has a dinosaur-shaped hole. And I know the hole. And I'll let the dinosaur go home. Today. Before Finding Day. Before... before the Keeper keeps everything. I'll let the dinosaur go home first. That's the deal. That's the deal.\"</p>", "<p>And that was the deal. One dinosaur, let go home first, before the Keeper kept everything. The rest kept. The rest kept, on Finding Day, when the Keeper was going to keep everything, and nothing would ever be lost again, and nothing would ever be warm again.</p>", "<p>\"Thank you,\" said Pip. \"For the dinosaur. Thank you. But we're not done. We're not done, Mr. Snell. We're going to show you. We're going to show you the love stays. And we're going to do it on Finding Day. And you're going to see.\"</p>", "<p>\"Watch me,\" said Snell, softly, to himself, the way you say a thing you are trying to believe.</p>", "<p>And they went up the stair that had not been there, up out of the heart of the house, up into the keeping room, and the Keeper hummed behind them, patient and keeping, growing, getting ready for Finding Day. And Pip, at the door, looked back, and he saw the jar in the heart of the machine, the small metal thing, the first thing, the thing that started it, and he thought: <em>the love stays. Even when the dog is gone. The love stays. And the Keeper is built around the love. And the Keeper does not know that the love stays without the keeping. And we're going to prove it.</em></p>", "<p>They went out into the lane, into the dusk, and the house with too many curtains held its breath, and the Keeper hummed, patient and keeping, and tomorrow was Finding Day, and the Keeper was going to keep everything, and one dinosaur was going to go home today.</p>", "<p>But tonight, there was a heart of brass, and a jar with a small metal thing, and a man saying <em>watch me</em> to himself, softly, the way you say a thing you are trying to believe.</p>", "<p>And tonight, that was a start.</p>"]}, {"id": "ch27", "label": "Chapter 27", "title": "Chapter 27 - One Dinosaur, Express Delivery", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\">\n<defs>\n    <g id=\"pip\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <line x1=\"-10\" y1=\"372\" x2=\"-10\" y2=\"384\"/>\n      <line x1=\"10\" y1=\"372\" x2=\"10\" y2=\"384\"/>\n      <rect x=\"-32\" y=\"382\" width=\"64\" height=\"88\" fill=\"#E4572E\"/>\n      <line x1=\"-32\" y1=\"398\" x2=\"-52\" y2=\"446\"/>\n      <line x1=\"32\" y1=\"398\" x2=\"56\" y2=\"438\"/>\n      <circle cx=\"-52\" cy=\"450\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"46\" y=\"428\" width=\"34\" height=\"22\" fill=\"#E9C46A\"/>\n      <line x1=\"52\" y1=\"439\" x2=\"74\" y2=\"439\"/>\n      <rect x=\"80\" y=\"435\" width=\"12\" height=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"56\" cy=\"442\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"-32\" y=\"466\" width=\"64\" height=\"20\" fill=\"#2B2B2B\"/>\n      <line x1=\"-14\" y1=\"486\" x2=\"-14\" y2=\"550\"/>\n      <line x1=\"14\" y1=\"486\" x2=\"14\" y2=\"550\"/>\n      <ellipse cx=\"-16\" cy=\"552\" rx=\"16\" ry=\"8\" fill=\"#2B2B2B\"/>\n      <ellipse cx=\"18\" cy=\"552\" rx=\"16\" ry=\"8\" fill=\"#2B2B2B\"/>\n      <circle cx=\"0\" cy=\"338\" r=\"40\" fill=\"#FFF8EC\"/>\n      <path d=\"M -40 334 Q -40 296 0 296 Q 40 296 40 334 Q 26 314 0 316 Q -26 314 -40 334 Z\" fill=\"#2B2B2B\"/>\n      <circle cx=\"8\" cy=\"336\" r=\"4\" fill=\"#2  cy=\"440\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"-18\" y=\"352\" width=\"36\" height=\"12\" fill=\"#E9C46A\"/>\n      <circle cx=\"0\" cy=\"318\" r=\"36\" fill=\"#FFF8EC\"/>\n      <path d=\"M -36 310 Q -36 280 0 280 Q 36 280 36 310 L 36 302 Q 0 288 -36 302 Z\" fill=\"#9AA5B1\"/>\n      <circle cx=\"8\" cy=\"316\" r=\"9\" fill=\"none\"/>\n      <circle cx=\"28\" cy=\"316\" r=\"9\" fill=\"none\"/>\n      <line x1=\"17\" y1=\"316\" x2=\"19\" y2=\"316\"/>\n      <circle cx=\"8\" cy=\"316\" r=\"3\" fill=\"#2B2B2B\"/>\n      <circle cx=\"28\" cy=\"316\" r=\"3\" fill=\"#2B2B2B\"/>\n      <path d=\"M 12 338 Q 20 344 30 338\" fill=\"none\"/>\n      <path d=\"M -2 344 Q 6 352 14 344\" fill=\"none\"/>\n    </g>\n    <g id=\"biscuit\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <ellipse cx=\"0\" cy=\"500\" rx=\"70\" ry=\"52\" fill=\"#E9C46A\"/>\n      <ellipse cx=\"0\" cy=\"516\" rx=\"44\" ry=\"30\" fill=\"#FFF8EC\"/>\n      <line x1=\"-44\" y1=\"530\" x2=\"-44\" y2=\"552\"/>\n      <line x1=\"-16\" y1=\"536\" x2=\"-16\" y2=\"554\"/>\n      <line x1=\"16\" y1=\"536\" x2=\"16\" y2=\"554\"/>\n      <line x1=\"44\" y1=\"530\" x2=\"44\" y2=\"552\"/>\n      <ellipse cx=\"-44\" cy=\"554\" rx=\"12\" ry=\"6\" fill=\"#E9C46A\"/>\n      <ellipse cx=\"44\" cy=\"554\" rx=\"12\" ry=\"6\" fill=\"#E9C46A\"/>\n      <path d=\"M -66 486 Q -88 470 -80 446\" fill=\"none\"/>\n      <circle cx=\"52\" cy=\"452\" r=\"40\" fill=\"#E9C46A\"/>\n      <ellipse cx=\"70\" cy=\"466\" rx=\"22\" ry=\"16\" fill=\"#FFF8EC\"/>\n      <ellipse cx=\"84\" cy=\"462\" rx=\"8\" ry=\"6\" fill=\"#2B2B2B\"/>\n      <circle cx=\"56\" cy=\"444\" r=\"4\" fill=\"#2B2B2B\"/>\n      <path d=\"M 30 424 Q 20 404 36 400 Q 48 402 44 424 Z\" fill=\"#8B5E3C\"/>\n      <path d=\"M 66 478 Q 74 486 84 478\" fill=\"none\"/>\n      <path d=\"M 40 486 Q 52 494 64 486\" fill=\"none\"/>\n    </g>\n    <g id=\"captain-chomp\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <path d=\"M -40 500 Q -70 490 -74 460 Q -70 440 -52 446\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"0\" cy=\"490\" rx=\"52\" ry=\"60\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"6\" cy=\"506\" rx=\"30\" ry=\"36\" fill=\"#E9C46A\"/>\n      <line x1=\"-6\" y1=\"486\" x2=\"18\" y2=\"486\"/>\n      <line x1=\"-6\" y1=\"502\" x2=\"18\" y2=\"502\"/>\n      <line x1=\"-6\" y1=\"518\" x2=\"18\" y2=\"518\"/>\n      <ellipse cx=\"-22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <line x1=\"-30\" y1=\"450\" x2=\"-48\" y2=\"470\"/>\n      <line x1=\"30\" y1=\"450\" x2=\"50\" y2=\"468\"/>\n      <circle cx=\"6\" cy=\"400\" r=\"42\" fill=\"#2A9D8F\"/>\n      <path d=\"M 30 380 L 56 388 L 32 398 Z\" fill=\"#2A9D8F\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"3\" fill=\"#2B2B2B\"/>\n      <circle cx=\"-12\" cy=\"392\" r=\"8\" fill=\"#E9C46A\"/>\n      <line x1=\"-16\" y1=\"388\" x2=\"-8\" y2=\"396\"/>\n      <line x1=\"-8\" y1=\"388\" x2=\"-16\" y2=\"396\"/>\n      <path d=\"M 20 416 Q 30 424 42 416\" fill=\"none\"/>\n      <path d=\"M -20 362 L -14 348 L -6 362 L 2 348 L 10 362\" fill=\"none\"/>\n    </g>\n  </defs>\n  <rect x=\"0\" y=\"0\" width=\"800\" height=\"600\" fill=\"#FFF8EC\"/>\n  <rect x=\"600\" y=\"180\" width=\"160\" height=\"380\" fill=\"#8B5E3C\"/>\n  <circle cx=\"620\" cy=\"370\" r=\"10\" fill=\"#E9C46A\"/>\n  <use href=\"#snell\" transform=\"translate(280,112) scale(0.8)\"/>\n  <use href=\"#captain-chomp\" transform=\"translate(400,280) scale(0.5)\"/>\n  <use href=\"#ollie\" transform=\"translate(500,252) scale(0.55)\"/>\n  <use href=\"#barnaby\" transform=\"translate(120,168) scale(0.7)\"/>\n  <rect x=\"360\" y=\"480\" width=\"180\" height=\"40\" fill=\"#FFF8EC\"/>\n  <text x=\"450\" y=\"506\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#2B2B2B\">GOING HOME</text>\n  <text x=\"400\" y=\"60\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"22\" fill=\"#8B5E3C\">one dinosaur, express delivery</text>\n  <text x=\"400\" y=\"592\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"15\" fill=\"#2B2B2B\">the Keeper protested</text></svg>\n", "head": "Chapter 27 - One Dinosaur, Express Delivery", "paras": ["<p>Snell came to the Bureau to let the dinosaur go, and he came through the big door, the one at the back, the one that was the only way in or out, and he came quietly, the way he did everything, and he was shaped like an umbrella, and he was carrying a plate of biscuits, the dog kind, because you did not let a dinosaur go without biscuits, because it was a rule, he had just made it up, but it was true.</p>", "<p>Barnaby met him at the big door. The walrus and the man shaped like an umbrella stood there, in the Bureau, among the shelves and the waiting things, and the Keeper hummed under the hill, and for a long moment neither of them spoke. And then Barnaby said, \"Silas. It's been a long time.\"</p>", "<p>\"It has,\" said Snell. \"It's been eight years. I... I didn't come. I didn't come in. I was... I was building. I was building the Keeper. And I didn't come in.\" He looked at the Bureau, at the waiting things, at the umbrella orchard and the jar of humming keys, and his face was the face of a man looking at a thing he used to know. \"I used to come in. Before. I used to bring the... I used to bring the lost things. I used to help. Did you know that? I used to help. I was a Friend of the Lost. Before. Before the dog. Before the Keeper. I was a Friend of the Lost.\"</p>", "<p>\"I know,\" said Barnaby, softly. \"I made up the title. You were one of the first. You were... you were very good at it. You were very good at the waiting. You were very good at the loving back.\" He paused, and his small eyes were very gentle. \"You still are, Silas. You still are. You've just... you've just forgotten the difference between the waiting and the keeping. And I think... I think you're starting to remember.\"</p>", "<p>And Snell, who was a man shaped like an umbrella, who had been alone eight years, looked at the walrus who had made up the title, and the crack opened, wider than it had ever been, and for a long moment he did not speak. And then he said, \"The dinosaur. I came to let the dinosaur go. That's the deal. That's the deal. One dinosaur. Let go home. Before... before the Keeper keeps everything. I came to let the dinosaur go.\"</p>", "<p>\"I know,\" said Barnaby. \"Come. He's behind my desk. He's been... he's been being dusted. He's been being waited with. He's been remembering the way home.\" He led Snell to the desk, and Captain Chomp was there, on his shelf, with his two mismatched buttons and his twice-sewn tail, and he was warm, he was the warmest thing, he was being loved back, and he was remembering.</p>", "<p>And Snell, who was a man shaped like an umbrella, who had built a machine so nothing he loves is ever lost again, looked at the small green dinosaur, and he picked him up, gently, the way he did everything, and he held him, and he said, \"There now. There now. You're... you're going home. You're going home. You're not... you're not going to be kept. You're going home.\" And his voice broke on the word <em>home</em>, the way a voice breaks when a man has been keeping everything for eight years and has just decided to let one thing go.</p>", "<p>And the Keeper protested.</p>", "<p>Under the hill, under the floor, the Keeper hummed, and the hum did something it had never done. It faltered. It skipped. It... it whined, a small, mechanical whine, the sound of a machine that has been told to let go and does not want to. And the shelves shook, just a little, just a tremor, and a button popped off a coat somewhere, and the umbrella orchard made its rain-that-wasn't-there sound, louder, and the jar of keys hummed its question, louder, and the Keeper whined, and it did not want to let go.</p>", "<p>\"Let him go,\" said Snell, to the Keeper, to the machine, to the heart of the house. \"Let him go. He's... he's going home. He's going home. Let him go.\" And his voice was gentle, and it was firm, and it was the voice of a man who has decided to let one thing go, and the Keeper whined, and it faltered, and it... it let go. The hum went down, down, down, and the tremor stopped, and the shelves were still, and Captain Chomp was warm, and he was free, and he was going home.</p>", "<p>And Miss Whisk, who kept the record, stamped the ledger, and the stamp said GOING HOME, and it was the first GOING HOME she had stamped all week, and her paw did not shake, and the almost-smile was there, in the corner, permanent now.</p>", "<p>And Snell, who was a man shaped like an umbrella, who had just let one thing go, held the dinosaur out to Ollie, and he said, \"Here. Here's the captain. Here's the... here's the secret pirate. He's going home. He's... he's not going to be kept. He's going home.\" And his long hands were shaking, just a little, just a tremor, the way a man's hands shake when he has let go of a thing he has been keeping, and Ollie took the dinosaur with both hands, the way you take a thing that is made of glass, that is made of gold, and he held him to his chin, and he said, \"Captain Chomp. Captain Chomp. You're home. You're home. You're home.\"</p>", "<p>And Captain Chomp's loose button caught the light, and his twice-sewn tail seemed to wag, just a little, just a tremor, and he was home, he was home, he was home.</p>", "<p>And Snell, who was a man shaped like an umbrella, who had just let one thing go, watched the boy hold the dinosaur, and his face was the face of a man who has just remembered a thing he has been avoiding for eight years, which was that letting go is not the same as losing, and that the love stays, even when the thing goes home. And the crack was there, wide, wider than it had ever been, and for a long moment Pip thought the man was going to say <em>the love stays</em>. And then the man said, \"Watch me,\" softly, to himself, the way you say a thing you are trying to believe, and the crack closed, just a little, just a crack, and the man turned to go.</p>", "<p>\"Mr. Snell,\" said Pip. \"Thank you. For the dinosaur. Thank you. But we're not done. We're not done. We're going to show you. We're going to show you the love stays. And we're going to do it on Finding Day. And you're going to see.\"</p>", "<p>\"Watch me,\" said Snell, softly, and he went out the big door, quietly, the way he did everything, and the door closed behind him, and the Keeper hummed, patient and keeping, and it had let one thing go, and it did not like it, and it was going to keep everything else, and it was getting ready for Finding Day.</p>", "<p>And Ollie, who was six, who was brave in small, loud ways, held Captain Chomp to his chin, and he said, \"We're going home. We're going home. We're going home. And tomorrow is Finding Day. And tomorrow, everything's going home. And I'm going to count to zero. I'm going to count to zero. I promise.\"</p>", "<p>And Pip, who was eleven, who had a label maker, who had just watched a man shaped like an umbrella let one thing go, felt the ground under the fog go warm and cold at the same time, because the man had let one thing go, and the man had said <em>watch me</em>, and the man was going to keep everything else, and the love was still there, even after eight years, even with the curtains closed, and they were going to prove it.</p>", "<p>They were going to prove it. Tomorrow. On Finding Day. With a pocket full of useless junk, and a cat with a stamp, and a walrus who says no, and a hedgehog who sorts the socks, and a six-year-old who counts to zero.</p>", "<p>But tonight, there was a dinosaur going home, and a man who had let one thing go, and a Keeper that did not like it, and a boy who had decided to answer a heartbreak.</p>", "<p>And tonight, that was a start.</p>"]}, {"id": "ch28", "label": "Chapter 28", "title": "Chapter 28 - The Long Way Home", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\">\n<defs>\n    <g id=\"pip\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <line x1=\"-10\" y1=\"372\" x2=\"-10\" y2=\"384\"/>\n      <line x1=\"10\" y1=\"372\" x2=\"10\" y2=\"384\"/>\n      <rect x=\"-32\" y=\"382\" width=\"64\" height=\"88\" fill=\"#E4572E\"/>\n      <line x1=\"-32\" y1=\"398\" x2=\"-52\" y2=\"446\"/>\n      <line x1=\"32\" y1=\"398\" x2=\"56\" y2=\"438\"/>\n      <circle cx=\"-52\" cy=\"450\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"46\" y=\"428\" width=\"34\" height=\"22\" fill=\"#E9C46A\"/>\n      <line x1=\"52\" y1=\"439\" x2=\"74\" y2=\"439\"/>\n      <rect x=\"80\" y=\"435\" width=\"12\" height=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"56\" cy=\"442\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"-32\" y=\"466\" width=\"64\" height=\"20\" fill=\"#2B2B2B\"/>\n      <line x1=\"-14\" y1=\"486\" x2=\"-14\" y2=\"550\"/>\n      <line x1=\"14\" y1=\"486\" x2=\"14\" y2=\"550\"/>\n      <ellipse cx=\"-16\" cy=\"552\" rx=\"16\" ry=\"8\" fill=\"#2B2B2B\"/>\n      <ellipse cx=\"18\" cy=\"552\" rx=\"16\" ry=\"8\" fill=\"#2B2B2B\"/>\n      <circle cx=\"0\" cy=\"338\" r=\"40\" fill=\"#FFF8EC\"/>\n      <path d=\"M -40 334 Q -40 296 0 296 Q 40 296 40 334 Q 26 314 0 316 Q -26 314 -40 334 Z\" fill=\"#2B2B2B\"/>\n      <circle cx=\"8\" cy=\"336\" r=\"4\" fill=\"#2B2B2B\"/>\n      <circle cx=\"26\" cy=\"336\" r=\"4\" fill=\"#2B2B2B\"/>\n      <path d=\"M 12 356 Q 22 364 32 356\" fill=\"none\"/>\n    </g>\n    <g id=\"goldie\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <line x1=\"-12\" y1=\"470\" x2=\"-12\" y2=\"550\"/>\n      <line x1=\"12\" y1=\"470\" x2=\"12\" y2=\"550\"/>\n      <ellipse cx=\"-14\" cy=\"552\" rx=\"15\" ry=\"8\" fill=\"#2B2B2B\"/>\n      <ellipse cx=\"16\" cy= le cx=\"8\" cy=\"316\" r=\"3\" fill=\"#2B2B2B\"/>\n      <circle cx=\"28\" cy=\"316\" r=\"3\" fill=\"#2B2B2B\"/>\n      <path d=\"M 12 338 Q 20 344 30 338\" fill=\"none\"/>\n      <path d=\"M -2 344 Q 6 352 14 344\" fill=\"none\"/>\n    </g>\n    <g id=\"biscuit\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <ellipse cx=\"0\" cy=\"500\" rx=\"70\" ry=\"52\" fill=\"#E9C46A\"/>\n      <ellipse cx=\"0\" cy=\"516\" rx=\"44\" ry=\"30\" fill=\"#FFF8EC\"/>\n      <line x1=\"-44\" y1=\"530\" x2=\"-44\" y2=\"552\"/>\n      <line x1=\"-16\" y1=\"536\" x2=\"-16\" y2=\"554\"/>\n      <line x1=\"16\" y1=\"536\" x2=\"16\" y2=\"554\"/>\n      <line x1=\"44\" y1=\"530\" x2=\"44\" y2=\"552\"/>\n      <ellipse cx=\"-44\" cy=\"554\" rx=\"12\" ry=\"6\" fill=\"#E9C46A\"/>\n      <ellipse cx=\"44\" cy=\"554\" rx=\"12\" ry=\"6\" fill=\"#E9C46A\"/>\n      <path d=\"M -66 486 Q -88 470 -80 446\" fill=\"none\"/>\n      <circle cx=\"52\" cy=\"452\" r=\"40\" fill=\"#E9C46A\"/>\n      <ellipse cx=\"70\" cy=\"466\" rx=\"22\" ry=\"16\" fill=\"#FFF8EC\"/>\n      <ellipse cx=\"84\" cy=\"462\" rx=\"8\" ry=\"6\" fill=\"#2B2B2B\"/>\n      <circle cx=\"56\" cy=\"444\" r=\"4\" fill=\"#2B2B2B\"/>\n      <path d=\"M 30 424 Q 20 404 36 400 Q 48 402 44 424 Z\" fill=\"#8B5E3C\"/>\n      <path d=\"M 66 478 Q 74 486 84 478\" fill=\"none\"/>\n      <path d=\"M 40 486 Q 52 494 64 486\" fill=\"none\"/>\n    </g>\n    <g id=\"captain-chomp\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <path d=\"M -40 500 Q -70 490 -74 460 Q -70 440 -52 446\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"0\" cy=\"490\" rx=\"52\" ry=\"60\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"6\" cy=\"506\" rx=\"30\" ry=\"36\" fill=\"#E9C46A\"/>\n      <line x1=\"-6\" y1=\"486\" x2=\"18\" y2=\"486\"/>\n      <line x1=\"-6\" y1=\"502\" x2=\"18\" y2=\"502\"/>\n      <line x1=\"-6\" y1=\"518\" x2=\"18\" y2=\"518\"/>\n      <ellipse cx=\"-22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <line x1=\"-30\" y1=\"450\" x2=\"-48\" y2=\"470\"/>\n      <line x1=\"30\" y1=\"450\" x2=\"50\" y2=\"468\"/>\n      <circle cx=\"6\" cy=\"400\" r=\"42\" fill=\"#2A9D8F\"/>\n      <path d=\"M 30 380 L 56 388 L 32 398 Z\" fill=\"#2A9D8F\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"3\" fill=\"#2B2B2B\"/>\n      <circle cx=\"-12\" cy=\"392\" r=\"8\" fill=\"#E9C46A\"/>\n      <line x1=\"-16\" y1=\"388\" x2=\"-8\" y2=\"396\"/>\n      <line x1=\"-8\" y1=\"388\" x2=\"-16\" y2=\"396\"/>\n      <path d=\"M 20 416 Q 30 424 42 416\" fill=\"none\"/>\n      <path d=\"M -20 362 L -14 348 L -6 362 L 2 348 L 10 362\" fill=\"none\"/>\n    </g>\n  </defs>\n  <rect x=\"0\" y=\"0\" width=\"800\" height=\"600\" fill=\"#FFF8EC\"/>\n  <path d=\"M 40 120 Q 200 160 400 120 Q 600 160 760 120\" fill=\"none\" stroke=\"#E4572E\" stroke-width=\"5\"/>\n  <path d=\"M 120 138 l 14 26 l 14 -26 Z\" fill=\"#E9C46A\"/>\n  <path d=\"M 320 138 l 14 26 l 14 -26 Z\" fill=\"#2A9D8F\"/>\n  <path d=\"M 520 138 l 14 26 l 14 -26 Z\" fill=\"#E9C46A\"/>\n  <rect x=\"480\" y=\"240\" width=\"240\" height=\"120\" fill=\"#FFF8EC\"/>\n  <text x=\"600\" y=\"280\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#2B2B2B\">FIRST DAY OF FALL</text>\n  <text x=\"600\" y=\"308\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#2B2B2B\">PICNIC - TOMORROW</text>\n  <text x=\"600\" y=\"336\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" fill=\"#8B5E3C\">bring a thing</text>\n  <use href=\"#ollie\" transform=\"translate(200,224) scale(0.6)\"/>\n  <use href=\"#captain-chomp\" transform=\"translate(300,308) scale(0.45)\"/>\n  <use href=\"#pip\" transform=\"translate(400,168) scale(0.7)\"/>\n  <text x=\"400\" y=\"60\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"22\" fill=\"#8B5E3C\">the long way home</text>\n  <text x=\"400\" y=\"592\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"15\" fill=\"#2B2B2B\">the label's a promise</text></svg>\n", "head": "Chapter 28 - The Long Way Home", "paras": ["<p>They took the long way home, because Ollie wanted to, because Ollie wanted Captain Chomp to see the town, because Ollie said <em>he's been lost, he should see everything on the way back, so he remembers it, so he never forgets the way again</em>, and because Goldie said the long way was actually a shortcut if you thought about it right, which was the kind of thing Goldie said, and which nobody could argue with, because it was Goldie.</p>", "<p>So they took the long way. They went down the hill, past the school, past the lost-and-found bin, which was emptier now, because the Bureau had been busy, because the Bureau was always busy, and the red mitten was gone, because the red mitten was kept, because the red mitten was cold, and Pip looked at the empty bin and thought: <em>tomorrow. Tomorrow the bin gets filled back up. Tomorrow everything goes home. Tomorrow the bin is just a bin again, and not a... not a waiting room.</em></p>", "<p>They went past the bakery, and The Warm Loaf smelled like the inside of a good decision, and Mrs. Crumb was in the window, hanging a sign, and the sign said FIRST DAY OF FALL PICNIC - TOMORROW - BRING A THING YOU LOVE, and Pip read it, and he thought: <em>bring a thing you love.</em> And he thought: <em>that's the whole thing. That's the whole thing about Finding Day. Bring a thing you love. And let it go home. And let the love stay.</em></p>", "<p>\"Mrs. Crumb!\" Ollie called, at full volume, which was his way of saying hello. \"Captain Chomp's home! He's home! He's home!\"</p>", "<p>And Mrs. Crumb came to the door, wiping her floury hands, and she looked at the dinosaur under Ollie's chin, and her face did the soft thing, the kind thing, the thing that had decided a long time ago to be kind and had never found a reason to stop. \"Well,\" she said. \"Well, look at that. The captain's home. The secret pirate's home.\" She looked at Ollie. \"I knew he would be. I knew it. I left the bowl out. That's the job. You leave the bowl out, and the things come home.\" She paused, and she looked at Pip, and something moved in her face, a thought, a almost-thought. \"You left the bowl out too, Pip. You and the walrus and the cat. You left the bowl out. And the captain came home.\" She looked at the hill, toward the curtained house, and her face did the soft-sad thing. \"Now if only... if only the man on the hill would leave the bowl out. Now if only he'd let the things come home.\"</p>", "<p>\"He will,\" said Pip. \"Tomorrow. He'll see. We're going to show him. The love stays. He'll see.\"</p>", "<p>\"I hope so,\" said Mrs. Crumb. \"I've been leaving the bowl out eight years. It's nice to think somebody's finally going to ring the bell.\" She reached into the window, and she brought out a bun, a warm one, shaped like a knot, and she handed it to Ollie. \"For the captain. For the homecoming. It's a rule. I just made it up. But it's true.\"</p>", "<p>And Ollie took the bun, and he fed Captain Chomp a bite of crust, the way he always did, the way he had on the first night in the new house, and Captain Chomp's loose button caught the light, and the homecoming was a homecoming, and the long way home was a long way home, and the town was preparing for the first day of fall.</p>", "<p>They went on. They went past the park, where the swing moved by itself in the wind like it was thinking, and past the little library box on the post, and past the bench by the war memorial, and past the gap in the hedge where the cat lived, and the cat looked at them with the flat, unimpressed face of a creature who had never lost anything in its life and did not intend to start, and Goldie greeted the cat by name, because Goldie knew everyone, because Goldie knew every shortcut, and the cat was a shortcut, somehow, the cat was a shortcut to somewhere, and Pip did not ask, because it was Goldie, and because the long way was actually a shortcut if you thought about it right.</p>", "<p>And the town was preparing. The town was hanging bunting, and setting out tables, and stringing lights, and the tables were for the picnic, the first-day-of-fall picnic, the bring-a-thing-you-love picnic, and the town was going to sit together, in the park, on the first day of fall, and eat, and be together, and bring a thing they loved. And Pip looked at the tables, at the bunting, at the lights, and he thought: <em>tomorrow. Tomorrow the town sits together. And tomorrow the things go home. And tomorrow the Keeper keeps everything. And tomorrow we answer the heartbreak.</em> And he thought: <em>the picnic is the answer. The picnic is the thing we're going to show him. The picnic is the love stays.</em></p>", "<p>He did not know how. He did not know the exactly. But he knew the picnic was the answer, the way Goldie knew the pocket knew things, the way the pocket had been knowing things for years, and he filed it, and he put a little star on the tag, and he went on, down the long way, toward the house, toward the home.</p>", "<p>And the hum followed.</p>", "<p>It was faint, at the edge of things, under the hill, under the town, a low, steady, keeping note, and it followed them the whole long way home, patient and keeping, and it was not careful this time, it was not turned down, it was reaching, and the socks in the Bureau were leaning away from it, and the things in the keeping room were cold, and the Keeper was getting ready for Finding Day. And Pip heard it, and he did not say anything, because Ollie was feeding Captain Chomp a bun, because the homecoming was a homecoming, because the long way home was a long way home, and because the hum was tomorrow's problem.</p>", "<p>But Goldie heard it too. And Goldie, who knew every shortcut, who had a pocket full of useless junk, said, quietly, \"Pip. The hum. It's following us.\"</p>", "<p>\"I know,\" said Pip.</p>", "<p>\"It's reaching,\" said Goldie. \"It's reaching for the captain. It let him go, but it's... it's still reaching. It doesn't want to let him go. It's... it's going to try again.\"</p>", "<p>\"I know,\" said Pip. \"Tomorrow. Tomorrow we answer it. Tomorrow we show it the love stays. Tomorrow we... we make it stop.\" He looked at the hill, toward the curtained house, and he said, \"Tomorrow.\"</p>", "<p>And they went on, down the long way, toward the house, toward the home, and the hum followed, patient and keeping, and the town was preparing for the first day of fall, and the picnic was the answer, and the love was still there, even after eight years, even with the curtains closed.</p>", "<p>And when they got home, the narrow house, the house with the creaky middle stair and the refrigerator that hummed like it knew a secret, Ollie put Captain Chomp under his chin, the way he always did, the way he had on the first night, and he said, \"You're home. You're home. You're home. And you're never going to be lost again. I promise. I'll label you. I'll label you so you never get lost again.\"</p>", "<p>And Pip, who was eleven, who had a label maker, who had decided on the first night that nothing in this family would ever get lost, took out the label maker, and he printed a label, and he pressed it onto Captain Chomp's foot, gently, the way you press a label onto a thing that is not going anywhere. And the label said:</p>", "<p class=\"chip\">CAPTAIN CHOMP. HOME. COMES BACK TO.</p>", "<p>And Ollie looked at the label, and he looked at Pip, and he said, \"You labeled him. You labeled the captain.\"</p>", "<p>\"I labeled him,\" said Pip. \"So he knows where home is. So he never forgets the way again.\"</p>", "<p>And Ollie, who had said <em>you don't label a person, he's not a thing, he's Captain Chomp</em>, looked at the label, and he looked at the dinosaur, and he said, \"Okay. Okay, you can label him. Because... because the label's not a thing. The label's a promise. The label's a... the label's a spare button. The label says I expect you to come loose, and I expect to fix you, and I am not going anywhere.\" He looked at Pip with his whole face. \"That's what the label says. That's what Thimble said. The spare is a promise. And the label's a spare. And the label's a promise.\"</p>", "<p>And Pip, who was eleven, who had a label maker, who had just heard his six-year-old brother say <em>the label's a promise</em>, felt something go warm in his chest, the rearranging, the furniture-moving, the thing he did not have a label for yet. And he thought: <em>the love stays. Even when the thing is lost. Even when the thing is kept. Even when the thing is gone. The love stays. And the label is the love. And the label is the promise. And the label is the thing we're going to show the man on the hill.</em></p>", "<p>And tomorrow was Finding Day. And tomorrow, they were going to prove it.</p>", "<p>But tonight, there was a dinosaur under a chin, and a label that said HOME, COMES BACK TO, and a long way home that was actually a shortcut, and a hum that followed, patient and keeping.</p>", "<p>And tonight, that was a start.</p>"]}, {"id": "ch29", "label": "Chapter 29", "title": "Chapter 29 - Captain Chomp Reports for Duty", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\">\n<defs>\n    <g id=\"pip\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <line x1=\"-10\" y1=\"372\" x2=\"-10\" y2=\"384\"/>\n      <line x1=\"10\" y1=\"372\" x2=\"10\" y2=\"384\"/>\n      <rect x=\"-32\" y=\"382\" width=\"64\" height=\"88\" fill=\"#E4572E\"/>\n      <line x1=\"-32\" y1=\"398\" x2=\"-52\" y2=\"446\"/>\n      <line x1=\"32\" y1=\"398\" x2=\"56\" y2=\"438\"/>\n      <circle cx=\"-52\" cy=\"450\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"46\" y=\"428\" width=\"34\" height=\"22\" fill=\"#E9C46A\"
