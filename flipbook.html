"16\" cy=\"552\" rx=\"16\" ry=\"8\" fill=\"#2B2B2B\"/>\n      <path d=\"M -30 360 L 30 360 L 40 472 L -40 472 Z\" fill=\"#8B5E3C\"/>\n      <line x1=\"0\" y1=\"360\" x2=\"0\" y2=\"472\"/>\n      <line x1=\"-30\" y1=\"376\" x2=\"-52\" y2=\"440\"/>\n      <line x1=\"30\" y1=\"376\" x2=\"54\" y2=\"436\"/>\n      <circle cx=\"-52\" cy=\"444\" r=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"54\" cy=\"440\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"-18\" y=\"352\" width=\"36\" height=\"12\" fill=\"#E9C46A\"/>\n      <circle cx=\"0\" cy=\"318\" r=\"36\" fill=\"#FFF8EC\"/>\n      <path d=\"M -36 310 Q -36 280 0 280 Q 36 280 36 310 L 36 302 Q 0 288 -36 302 Z\" fill=\"#9AA5B1\"/>\n      <circle cx=\"8\" cy=\"316\" r=\"9\" fill=\"none\"/>\n      <circle cx=\"28\" cy=\"316\" r=\"9\" fill=\"none\"/>\n      <line x1=\"17\" y1=\"316\" x2=\"19\" y2=\"316\"/>\n      <circle cx=\"8\" cy=\"316\" r=\"3\" fill=\"#2B2B2B\"/>\n      <circle cx=\"28\" cy=\"316\" r=\"3\" fill=\"#2B2B2B\"/>\n      <path d=\"M 12 338 Q 20 344 30 338\" fill=\"none\"/>\n      <path d=\"M -2 344 Q 6 352 14 344\" fill=\"none\"/>\n    </g>\n    <g id=\"biscuit\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <ellipse cx=\"0\" cy=\"500\" rx=\"70\" ry=\"52\" fill=\"#E9C46A\"/>\n      <ellipse cx=\"0\" cy=\"516\" rx=\"44\" ry=\"30\" fill=\"#FFF8EC\"/>\n      <line x1=\"-44\" y1=\"530\" x2=\"-44\" y2=\"552\"/>\n      <line x1=\"-16\" y1=\"536\" x2=\"-16\" y2=\"554\"/>\n      <line x1=\"16\" y1=\"536\" x2=\"16\" y2=\"554\"/>\n      <line x1=\"44\" y1=\"530\" x2=\"44\" y2=\"552\"/>\n      <ellipse cx=\"-44\" cy=\"554\" rx=\"12\" ry=\"6\" fill=\"#E9C46A\"/>\n      <ellipse cx=\"44\" cy=\"554\" rx=\"12\" ry=\"6\" fill=\"#E9C46A\"/>\n      <path d=\"M -66 486 Q -88 470 -80 446\" fill=\"none\"/>\n      <circle cx=\"52\" cy=\"452\" r=\"40\" fill=\"#E9C46A\"/>\n      <ellipse cx=\"70\" cy=\"466\" rx=\"22\" ry=\"16\" fill=\"#FFF8EC\"/>\n      <ellipse cx=\"84\" cy=\"462\" rx=\"8\" ry=\"6\" fill=\"#2B2B2B\"/>\n      <circle cx=\"56\" cy=\"444\" r=\"4\" fill=\"#2B2B2B\"/>\n      <path d=\"M 30 424 Q 20 404 36 400 Q 48 402 44 424 Z\" fill=\"#8B5E3C\"/>\n      <path d=\"M 66 478 Q 74 486 84 478\" fill=\"none\"/>\n      <path d=\"M 40 486 Q 52 494 64 486\" fill=\"none\"/>\n    </g>\n    <g id=\"captain-chomp\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <path d=\"M -40 500 Q -70 490 -74 460 Q -70 440 -52 446\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"0\" cy=\"490\" rx=\"52\" ry=\"60\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"6\" cy=\"506\" rx=\"30\" ry=\"36\" fill=\"#E9C46A\"/>\n      <line x1=\"-6\" y1=\"486\" x2=\"18\" y2=\"486\"/>\n      <line x1=\"-6\" y1=\"502\" x2=\"18\" y2=\"502\"/>\n      <line x1=\"-6\" y1=\"518\" x2=\"18\" y2=\"518\"/>\n      <ellipse cx=\"-22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <line x1=\"-30\" y1=\"450\" x2=\"-48\" y2=\"470\"/>\n      <line x1=\"30\" y1=\"450\" x2=\"50\" y2=\"468\"/>\n      <circle cx=\"6\" cy=\"400\" r=\"42\" fill=\"#2A9D8F\"/>\n      <path d=\"M 30 380 L 56 388 L 32 398 Z\" fill=\"#2A9D8F\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"3\" fill=\"#2B2B2B\"/>\n      <circle cx=\"-12\" cy=\"392\" r=\"8\" fill=\"#E9C46A\"/>\n      <line x1=\"-16\" y1=\"388\" x2=\"-8\" y2=\"396\"/>\n      <line x1=\"-8\" y1=\"388\" x2=\"-16\" y2=\"396\"/>\n      <path d=\"M 20 416 Q 30 424 42 416\" fill=\"none\"/>\n      <path d=\"M -20 362 L -14 348 L -6 362 L 2 348 L 10 362\" fill=\"none\"/>\n    </g>\n  </defs>\n  <rect x=\"0\" y=\"0\" width=\"800\" height=\"600\" fill=\"#FFF8EC\"/>\n  <use href=\"#goldie\" transform=\"translate(300,56) scale(0.9)\"/>\n  <use href=\"#pip\" transform=\"translate(560,112) scale(0.8)\"/>\n  <circle cx=\"430\" cy=\"330\" r=\"22\" fill=\"#2A9D8F\"/>\n  <path d=\"M 420 322 q 10 -8 20 0\" fill=\"none\" stroke=\"#E9C46A\" stroke-width=\"5\"/>\n  <path d=\"M 480 310 l 0 40 q 0 12 12 12 l 0 -44\" fill=\"none\" stroke=\"#9AA5B1\" stroke-width=\"6\"/>\n  <circle cx=\"560\" cy=\"330\" r=\"20\" fill=\"none\" stroke=\"#E4572E\" stroke-width=\"7\"/>\n  <text x=\"430\" y=\"380\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#2B2B2B\">marble</text>\n  <text x=\"492\" y=\"380\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#2B2B2B\">paperclip</text>\n  <text x=\"560\" y=\"380\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#2B2B2B\">rubber band</text>\n  <text x=\"400\" y=\"60\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"22\" fill=\"#8B5E3C\">useless junk</text>\n  <text x=\"400\" y=\"592\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"15\" fill=\"#2B2B2B\">useless, so ready</text></svg>\n", "head": "Chapter 5 - The Pocket of Useless Junk", "paras": ["<p>The form was four pages long and asked, among other things, for the dinosaur's name, rank, and distinguishing marks, and Pip was filling in <em>secret pirate</em> under OCCUPATION when the door opened again and Goldie Finch came in, eating an apple.</p>", "<p>\"Hey,\" she said. \"You found it. I figured you would. You've got the look.\"</p>", "<p>Pip stared at her. \"You can see the door?\"</p>", "<p>\"Obviously I can see the door.\" Goldie took a bite of apple. \"I've been coming here since I was seven. Gran used to bring me. She'd lose a button on purpose just to get the door to show, and then she'd say hello to Barnaby and have a biscuit and go home. It was her whole social life.\" She nodded at the walrus. \"Hi, Barnaby.\"</p>", "<p>\"Miss Finch,\" said Barnaby, warmly, leaking. \"A pleasure, as always. You are just in time for the form.\"</p>", "<p>\"I'm never just in time for the form,\" said Goldie. \"I'm allergic to the form. I'll be over here.\" She wandered off toward the shelves with the easy, shortcutting walk of a girl who knew every aisle, and Pip, abandoning OCCUPATION, went after her, because he had a question that had been growing in him since the driveway.</p>", "<p>\"How?\" he said. \"The door. It only shows if you've lost something you truly love. But you-\" He gestured at her pocket, which jingled. \"You lose things all the time. You don't even mind. You lost your good acorn yesterday and you just shrugged.\"</p>", "<p>Goldie stopped at a shelf of single mittens and looked at him. For a second the easy, shortcutting look went off her face, and underneath it was something older and quieter.</p>", "<p>\"I love my stuff,\" she said. \"I just don't mind when it goes. Those are two different things, Pip. People think they're the same thing. They're not.\"</p>", "<p>She put the apple core in her pocket - Pip watched her do it, watched the pocket accept it without complaint - and then she turned the pocket half inside out, the way she had at the house, and let the contents spill into her palm.</p>", "<p>\"Exhibit A,\" she said. \"The pocket of useless junk.\"</p>", "<p>There, in her hand, were three things. A marble, a paperclip, and a rubber band.</p>", "<p>The marble was glass, a cat's-eye, a swirl of green and gold trapped inside it like a small frozen weather. The paperclip was silver and bent, bent the way a paperclip gets when it has been picked at and twisted and thought with. The rubber band was red, and a little cracked, and stretched out of shape from a life of holding things together that were not its job to hold.</p>", "<p>\"This,\" said Goldie, holding up the marble, \"is a marble. It's useless. You can't eat it, you can't wear it, it's no good for anything except rolling, and it's always rolling under things. I've had it since I was six. I love it.\" She set it on the shelf, and it rolled an inch, and she stopped it with one finger without looking. \"This,\" holding up the paperclip, \"is a paperclip. It's bent. It's useless. It can't hold paper anymore, not really. I love it.\" She hooked it onto her collar. \"And this,\" holding up the rubber band, \"is a rubber band. It's cracked. It's useless. It's about to snap, honestly, any day now. I love it.\"</p>", "<p>Pip looked at the three useless things. \"Why do you love them if they're useless?\"</p>", "<p>Goldie looked at him like he'd asked why the sky was up. \"Because they're mine,\" she said. \"Because I've had them. Because the marble's got a chip on it from the time I dropped it on the church steps, and the paperclip's bent because I bent it thinking about my dad, and the rubber band held my hair the day I learned to ride a bike. Useless isn't the opposite of loved, Pip. Useless is just what a thing is after it's done being useful. The loving's still in there.\"</p>", "<p>She put the marble back in the pocket, and the paperclip, and the rubber band, and the pocket jingled its small, satisfied jingle, and Pip felt something in his chest rearrange itself, quietly, like furniture being moved in a room he hadn't known he had.</p>", "<p>\"You're going to lose them someday,\" he said. It wasn't a question. He was eleven. He had decided things. He knew how this went.</p>", "<p>\"Probably,\" said Goldie, and she smiled, and the smile was the calmest thing Pip had ever seen. \"The marble'll roll under something I can't reach. The paperclip'll fall out of a hole in this pocket. The rubber band'll snap.\" She patted the pocket. \"And I'll be sad. And then I'll remember the church steps, and your dad, and the bike. And the sad'll be the good kind. The kind that means it was real.\"</p>", "<p>Pip thought of Captain Chomp, being dusted somewhere in this enormous room. He thought of Ollie, over by the low shelf, not touching the waiting animals. He thought of a house with too many curtains, holding its breath, keeping everything, never letting anything go, never letting anything be the good kind of sad.</p>", "<p>\"I don't think I can do that,\" he said honestly. \"The not-minding part.\"</p>", "<p>\"You don't have to,\" said Goldie. \"Not yet. Maybe not ever. That's okay too.\" She hooked her arm through his, which was a very Goldie thing to do, a shortcut through a conversation. \"Come on. I'll show you the good shelves. Barnaby'll do the form till the cows come home, and the cows, by the way, are also lost, we have a whole field of them, don't ask.\"</p>", "<p>She led him down an aisle, and then another, taking turns Pip was sure didn't exist, past the umbrella orchard and the jar of humming keys, past a shelf of single earrings that glittered like a city at night, past a bin labeled LEFT SHOES, ALL OF THEM, WHY.</p>", "<p>In a low, warm corner they came to a hedgehog. He was small and round and the color of toast, and he was standing on a stool in front of a shelf of single socks, holding one up to his nose with the gravity of a scientist holding a beaker. His quills were full of buttons - dozens of them, stuck in among the spines like fruit in a very prickly bush - and they clicked softly when he moved.</p>", "<p>\"That's Thimble,\" Goldie whispered. \"He sorts the socks by smell. Don't interrupt him. He's doing the toast ones.\"</p>", "<p>The hedgehog sniffed the sock, closed his eyes, and placed it gently into a bin labeled WARM / BREAKFAST / SOMEONE'S KITCHEN. Then he picked up another, sniffed, and frowned. \"Rain,\" he murmured. \"And dog. And a little bit of sadness. That's a difficult one.\" He set it aside in a bin labeled COMPLICATED, and only then did he notice them, and give a small, formal nod, and go back to his smelling.</p>", "<p>\"He's been here longer than anyone,\" Goldie said, as they moved on. \"He says every sock smells like the person who lost it. He says if you smell hard enough you can find your way home.\" She said it lightly, but Pip filed it, the way he filed everything, in a drawer he was starting to suspect he would need.</p>", "<p>And as they walked, Goldie talked, and the Bureau unfolded around them, and Pip - who had come here to find a dinosaur - began, slowly, to find something else, something he didn't have a label for yet, something about the difference between a thing that is lost and a thing that is gone, and the difference between loving a thing and keeping it, and how the pocket of a girl who didn't mind could hold more than a house with too many curtains.</p>", "<p>\"We'll get him back,\" Goldie said, quietly, like she'd been reading the back of his head. \"Captain Chomp. That's what this place is for. Things come home here. That's the whole point of the whole place.\" She squeezed his arm once, let go, and pointed her apple-less hand down the aisle like a captain. \"Now come on. Barnaby's about to explain Finding Day, and he uses props.\"</p>", "<p>Behind them, at the desk, Barnaby stamped the form with a flipper, and the stamp said RECEIVED, and the ink was a little smudged, because the pen was still leaking, and because some things, in the Bureau of Lost Things, are allowed to be a little smudged and still be true.</p>"]}, {"id": "ch06", "label": "Chapter 6", "title": "Chapter 6 - Form 27-B: Missing, Possibly Forever", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\">\n<defs>\n    <g id=\"pip\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <line x1=\"-10\" y1=\"372\" x2=\"-10\" y2=\"384\"/>\n      <line x1=\"10\" y1=\"372\" x2=\"10\" y2=\"384\"/>\n      <rect x=\"-32\" y=\"382\" width=\"64\" height=\"88\" fill=\"#E4572E\"/>\n      <line x1=\"-32\" y1=\"398\" x2=\"-52\" y2=\"446\"/>\n      <line x1=\"32\" y1=\"398\" x2=\"56\" y2=\"438\"/>\n      <circle cx=\"-52\" cy=\"450\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"46\" y=\"428\" width=\"34\" height=\"22\" fill=\"#E9C46A\"/>\n      <line x1=\"52\" y1=\"439\" x2=\"74\" y2=\"439\"/>\n      <rect x=\"80\" y=\"435\" width=\"12\" height=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"56\" cy=\"442 >\n      <line x1=\"-12\" y1=\"470\" x2=\"-12\" y2=\"550\"/>\n      <line x1=\"12\" y1=\"470\" x2=\"12\" y2=\"550\"/>\n      <ellipse cx=\"-14\" cy=\"552\" rx=\"16\" ry=\"8\" fill=\"#2B2B2B\"/>\n      <ellipse cx=\"16\" cy=\"552\" rx=\"16\" ry=\"8\" fill=\"#2B2B2B\"/>\n      <path d=\"M -30 360 L 30 360 L 40 472 L -40 472 Z\" fill=\"#8B5E3C\"/>\n      <line x1=\"0\" y1=\"360\" x2=\"0\" y2=\"472\"/>\n      <line x1=\"-30\" y1=\"376\" x2=\"-52\" y2=\"440\"/>\n      <line x1=\"30\" y1=\"376\" x2=\"54\" y2=\"436\"/>\n      <circle cx=\"-52\" cy=\"444\" r=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"54\" cy=\"440\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"-18\" y=\"352\" width=\"36\" height=\"12\" fill=\"#E9C46A\"/>\n      <circle cx=\"0\" cy=\"318\" r=\"36\" fill=\"#FFF8EC\"/>\n      <path d=\"M -36 310 Q -36 280 0 280 Q 36 280 36 310 L 36 302 Q 0 288 -36 302 Z\" fill=\"#9AA5B1\"/>\n      <circle cx=\"8\" cy=\"316\" r=\"9\" fill=\"none\"/>\n      <circle cx=\"28\" cy=\"316\" r=\"9\" fill=\"none\"/>\n      <line x1=\"17\" y1=\"316\" x2=\"19\" y2=\"316\"/>\n      <circle cx=\"8\" cy=\"316\" r=\"3\" fill=\"#2B2B2B\"/>\n      <circle cx=\"28\" cy=\"316\" r=\"3\" fill=\"#2B2B2B\"/>\n      <path d=\"M 12 338 Q 20 344 30 338\" fill=\"none\"/>\n      <path d=\"M -2 344 Q 6 352 14 344\" fill=\"none\"/>\n    </g>\n    <g id=\"biscuit\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <ellipse cx=\"0\" cy=\"500\" rx=\"70\" ry=\"52\" fill=\"#E9C46A\"/>\n      <ellipse cx=\"0\" cy=\"516\" rx=\"44\" ry=\"30\" fill=\"#FFF8EC\"/>\n      <line x1=\"-44\" y1=\"530\" x2=\"-44\" y2=\"552\"/>\n      <line x1=\"-16\" y1=\"536\" x2=\"-16\" y2=\"554\"/>\n      <line x1=\"16\" y1=\"536\" x2=\"16\" y2=\"554\"/>\n      <line x1=\"44\" y1=\"530\" x2=\"44\" y2=\"552\"/>\n      <ellipse cx=\"-44\" cy=\"554\" rx=\"12\" ry=\"6\" fill=\"#E9C46A\"/>\n      <ellipse cx=\"44\" cy=\"554\" rx=\"12\" ry=\"6\" fill=\"#E9C46A\"/>\n      <path d=\"M -66 486 Q -88 470 -80 446\" fill=\"none\"/>\n      <circle cx=\"52\" cy=\"452\" r=\"40\" fill=\"#E9C46A\"/>\n      <ellipse cx=\"70\" cy=\"466\" rx=\"22\" ry=\"16\" fill=\"#FFF8EC\"/>\n      <ellipse cx=\"84\" cy=\"462\" rx=\"8\" ry=\"6\" fill=\"#2B2B2B\"/>\n      <circle cx=\"56\" cy=\"444\" r=\"4\" fill=\"#2B2B2B\"/>\n      <path d=\"M 30 424 Q 20 404 36 400 Q 48 402 44 424 Z\" fill=\"#8B5E3C\"/>\n      <path d=\"M 66 478 Q 74 486 84 478\" fill=\"none\"/>\n      <path d=\"M 40 486 Q 52 494 64 486\" fill=\"none\"/>\n    </g>\n    <g id=\"captain-chomp\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <path d=\"M -40 500 Q -70 490 -74 460 Q -70 440 -52 446\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"0\" cy=\"490\" rx=\"52\" ry=\"60\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"6\" cy=\"506\" rx=\"30\" ry=\"36\" fill=\"#E9C46A\"/>\n      <line x1=\"-6\" y1=\"486\" x2=\"18\" y2=\"486\"/>\n      <line x1=\"-6\" y1=\"502\" x2=\"18\" y2=\"502\"/>\n      <line x1=\"-6\" y1=\"518\" x2=\"18\" y2=\"518\"/>\n      <ellipse cx=\"-22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <line x1=\"-30\" y1=\"450\" x2=\"-48\" y2=\"470\"/>\n      <line x1=\"30\" y1=\"450\" x2=\"50\" y2=\"468\"/>\n      <circle cx=\"6\" cy=\"400\" r=\"42\" fill=\"#2A9D8F\"/>\n      <path d=\"M 30 380 L 56 388 L 32 398 Z\" fill=\"#2A9D8F\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"3\" fill=\"#2B2B2B\"/>\n      <circle cx=\"-12\" cy=\"392\" r=\"8\" fill=\"#E9C46A\"/>\n      <line x1=\"-16\" y1=\"388\" x2=\"-8\" y2=\"396\"/>\n      <line x1=\"-8\" y1=\"388\" x2=\"-16\" y2=\"396\"/>\n      <path d=\"M 20 416 Q 30 424 42 416\" fill=\"none\"/>\n      <path d=\"M -20 362 L -14 348 L -6 362 L 2 348 L 10 362\" fill=\"none\"/>\n    </g>\n  </defs>\n  <rect x=\"0\" y=\"0\" width=\"800\" height=\"600\" fill=\"#FFF8EC\"/>\n  <rect x=\"250\" y=\"430\" width=\"300\" height=\"130\" fill=\"#8B5E3C\"/>\n  <circle cx=\"330\" cy=\"380\" r=\"46\" fill=\"#FFF8EC\"/>\n  <rect x=\"316\" y=\"360\" width=\"28\" height=\"40\" fill=\"#2A9D8F\"/>\n  <rect x=\"300\" y=\"420\" width=\"60\" height=\"14\" fill=\"#8B5E3C\"/>\n  <rect x=\"430\" y=\"380\" width=\"90\" height=\"50\" fill=\"#FFF8EC\"/>\n  <line x1=\"440\" y1=\"395\" x2=\"510\" y2=\"395\"/>\n  <line x1=\"440\" y1=\"408\" x2=\"510\" y2=\"408\"/>\n  <line x1=\"440\" y1=\"421\" x2=\"490\" y2=\"421\"/>\n  <use href=\"#barnaby\" transform=\"translate(400,140) scale(0.75)\"/>\n  <use href=\"#pip\" transform=\"translate(140,168) scale(0.7)\"/>\n  <use href=\"#ollie\" transform=\"translate(650,252) scale(0.55)\"/>\n  <text x=\"400\" y=\"60\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"22\" fill=\"#8B5E3C\">Finding Day</text>\n  <text x=\"400\" y=\"592\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"15\" fill=\"#2B2B2B\">paved with details</text></svg>\n", "head": "Chapter 6 - Form 27-B: Missing, Possibly Forever", "paras": ["<p>Barnaby did, in fact, use props.</p>", "<p>He produced, from somewhere under the desk, a snow globe. Inside the snow globe was a tiny green door. He set it on the desk between them with the ceremony of a magician producing a dove, and then he produced a second prop, which was a biscuit, which he ate, because explaining made him peckish.</p>", "<p>\"Right,\" he said, crumbs on his whiskers. \"The rules. There are three. I will say them once, and then I will say them again, because I am a walrus and we are thorough.\"</p>", "<p>Pip sat up straight. Ollie sat up straighter. Goldie leaned against the desk, already bored, already knowing this part.</p>", "<p>\"Rule one,\" said Barnaby, holding up a flipper. \"You can only see the door if you have lost something you truly love. Not something you merely like. Not something you are merely inconvenienced by. Something you love. The door knows the difference. The door is very good at its job.\" He tapped the snow globe. \"You three have all lost something you love. That is why you are here. That is why the door showed itself. It is not a magic trick. It is a sympathy.\"</p>", "<p>\"Rule two,\" he continued, holding up the other flipper, which still had a little biscuit on it. \"A thing that is lost is not gone. It is waiting. We keep it safe. We dust it. We help it remember.\" He leaned forward, and his voice went softer, and the whole enormous room seemed to lean in with him. \"Because here is the thing about being lost, and it is the hard thing, so I will say it gently. When a thing is lost, it starts to forget. It forgets the way home. And if it stays lost too long - if it is not claimed, if it is not loved back - then the person who lost it starts to forget too. Not the thing. The <em>loving</em>. They forget how much they loved it. And then the thing is not lost anymore. It is just... gone.\"</p>", "<p>The room was very quiet. Ollie's hand found Pip's again.</p>", "<p>\"That's why we wait with them,\" said Barnaby. \"So they don't forget. So the loving stays warm. A thing that is waited with remembers. A thing that is loved back finds its way.\" He looked at Ollie. \"Captain Chomp is being waited with. He is being loved back. He has not forgotten you. He roars in his sleep. The staff find it very comforting.\"</p>", "<p>Ollie's face did the complicated thing again, but this time it landed somewhere warm. \"He does?\" he whispered.</p>", "<p>\"He does,\" said Barnaby. \"A secret pirate's roar. Very fierce. Very small.\"</p>", "<p>\"Rule three,\" said Barnaby, and he set down the snow globe and folded his flippers, and for the first time he looked not just kind but serious, in the way that kind people look when they are about to tell you the true thing. \"Once a year, on the first day of fall, we open the big door. Not the little green one you came through. The big one. The one at the back that none of you have seen yet. And on that day, every lost thing that is ready - every thing that has been claimed and loved back and remembers the way - gets to go home. All at once. One day. We call it Finding Day.\"</p>", "<p>\"When is it?\" said Pip.</p>", "<p>Barnaby produced a third prop, which was a calendar, and it was a calendar of autumn leaves, and he turned it to a page with a single leaf circled in red.</p>", "<p>\"Six days from today,\" he said. \"The first day of fall. Finding Day. It is the one day the way home is open and clear. The rest of the year the way is... difficult. Twisted. A lost thing can wander for months and not find it. But on Finding Day, the door is wide, and the road is straight, and everything that is ready goes home.\" He looked at Pip. \"Captain Chomp was very lost when he came in. Frightened. He has forgotten a good deal of the way. He needs the week to remember. And he needs to be claimed, and loved back, and helped. That is your job, if you want it.\"</p>", "<p>\"I want it,\" said Pip, so fast it surprised him.</p>", "<p>\"I want it too,\" said Ollie, at full volume, which was his way of signing a contract.</p>", "<p>\"Then you will come,\" said Barnaby. \"Every day, if you like. You will sit with him. You will tell him about home. You will remind him of the grape juice and the chin and the roaring. You will love him back. And on Finding Day, if he is ready, he will go home with you.\" He paused, and his small eyes were very gentle. \"Most things are ready. Most things go home. It is a good day. The best day.\"</p>", "<p>Pip heard the <em>most</em>. He was eleven. He heard the word that was doing the quiet work in that sentence, the word that meant <em>not all</em>, the word that meant there was a reason Barnaby had said rule two so gently. He thought of Miss Whisk's <em>and every thing that doesn't, which lately is a longer list than it ought to be.</em> He filed it, and he did not say it out loud, because Ollie was signing contracts at full volume and did not need the <em>most</em> right now.</p>", "<p>\"What happens,\" Pip asked carefully, \"to the things that aren't ready?\"</p>", "<p>Barnaby was quiet for a moment. \"They wait another year,\" he said. \"We keep them safe. We keep loving them back. And we hope.\" He did not say the rest, the <em>and if they wait too long the loving goes out</em>, because he had already said it gently once and did not believe in saying hard things twice to a six-year-old. But Pip heard it anyway, in the shape of the silence.</p>", "<p>\"Okay,\" said Pip. \"Then we'll make sure he's ready.\"</p>", "<p>Barnaby beamed the large, damp beaming. \"Splendid. Now. The rest of the form.\" He pushed the four pages toward Pip. \"Sign here. And here. And initial the dinosaur's rank. And I will need a description of the home, for the file. The more love in the description, the better. The way home is paved with the details.\"</p>", "<p>So Pip wrote. He wrote about the narrow house and the creaky middle stair and the refrigerator that hummed like it knew a secret. He wrote about the pizza on the floor and the box labeled TABLE, LEGS, PROBABLY. He wrote about Ollie's wrong-footed brave shoes and the duck sock that smelled like toast and the grape-juice smell and the chin and the roaring. He wrote until the description of home was a page long, and then, because Barnaby said the more love the better, he wrote a little more.</p>", "<p>When he was done, Barnaby stamped it, and the stamp said RECEIVED, and he filed it in a drawer that was exactly the size of the paper, because the Bureau was like that.</p>", "<p>\"Welcome to the Bureau, Pip Parker,\" said Barnaby. \"You are now a Friend of the Lost. It is not an official title. I just made it up. But it is true.\"</p>", "<p>\"He makes up a lot of titles,\" Goldie said. \"I'm a Knight of the Shortcut. It's not official either. There's no sword. I asked.\"</p>", "<p>\"There is a sword,\" said Barnaby, with dignity. \"It is lost. We are keeping it for you.\"</p>", "<p>Pip looked at the stamp, and at the snow globe with the tiny green door, and at Ollie, who was already planning his first visit out loud, at full volume, to a dinosaur who was somewhere in this enormous, kindly room, roaring in his sleep, being waited with, not forgotten.</p>", "<p>One week. Finding Day. They had one week to love a dinosaur back to remembering.</p>", "<p>Pip decided, then and there, that he was going to be the best Friend of the Lost this Bureau had ever seen. He did not know, yet, that something in the Bureau was taking things in the night, and that the list of the not-ready was growing, and that a lonely man on a hill was building a machine so that nothing he loved would ever be lost again.</p>", "<p>He only knew that he had a week, and a form, and a brother, and a small green dinosaur who roared in his sleep.</p>", "<p>It was, he thought, enough to start with.</p>"]}, {"id": "ch07", "label": "Chapter 7", "title": "Chapter 7 - The Very Serious Science of Left Socks", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\">\n<defs>\n    <g id=\"pip\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <line x1=\"-10\" y1=\"372\" x2=\"-10\" y2=\"384\"/>\n      <line x1=\"10\" y1=\"372\" x2=\"10\" y2=\"384\"/>\n      <rect x=\"-32\" y=\"382\" width=\"64\" height=\"88\" fill=\"#E4572E\"/>\n      <line x1=\"-32\" y1=\"398\" x2=\"-52\" y2=\"446\"/>\n      <line x1=\"32\" y1=\"398\" x2=\"56\" y2=\"438\"/>\n      <circle cx=\"-52\" cy=\"450\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"46\" y=\"428\" width=\"34\" height=\"22\" fill=\"#E9C46A\"/>\n      <line x1=\"52\" y1=\"439\" x2=\"74\" y2=\"439\"/>\n      <rect x=\"80\" y=\"435\" width=\"12\" height=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"56\" cy=\"442\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"-32\" y=\"466\" width=\"64\" height=\"20\" fill=\"#2B2B2B\"/>\n      <line x1=\"-14\" y1=\"486\" x2=\"-14\" y2=\"550\"/>\n      <li \"M 70 340 q 0 -24 20 -24 q 20 0 20 24 l 0 16 l -40 0 Z\" fill=\"#9AA5B1\"/>\n  <path d=\"M 150 340 q 0 -24 20 -24 q 20 0 20 24 l 0 16 l -40 0 Z\" fill=\"#E9C46A\"/>\n  <path d=\"M 70 420 q 0 -24 20 -24 q 20 0 20 24 l 0 16 l -40 0 Z\" fill=\"#2A9D8F\"/>\n  <path d=\"M 150 420 q 0 -24 20 -24 q 20 0 20 24 l 0 16 l -40 0 Z\" fill=\"#E4572E\"/>\n  <rect x=\"60\" y=\"500\" width=\"180\" height=\"30\" fill=\"#FFF8EC\"/>\n  <text x=\"150\" y=\"521\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" fill=\"#2B2B2B\">WARM BREAKFAST RADIO</text>\n  <use href=\"#thimble\" transform=\"translate(430,224) scale(0.6)\"/>\n  <use href=\"#pip\" transform=\"translate(600,168) scale(0.7)\"/>\n  <use href=\"#ollie\" transform=\"translate(720,252) scale(0.55)\"/>\n  <text x=\"400\" y=\"60\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"22\" fill=\"#8B5E3C\">sock science</text>\n  <text x=\"430\" y=\"592\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"15\" fill=\"#2B2B2B\">a sock cannot lie</text></svg>\n", "head": "Chapter 7 - The Very Serious Science of Left Socks", "paras": ["<p>On the third day, Pip and Ollie came to the Bureau to love Captain Chomp back to remembering, and instead they got recruited by a hedgehog.</p>", "<p>It happened like this. They had found Captain Chomp on a low shelf in a section labeled SOFT / BRAVE / PRETEND, and Ollie was sitting cross-legged in front of him, telling him about the house in great detail, at a volume that was respectful for Ollie, which is to say only slightly louder than a normal person's shout. Captain Chomp sat with his two mismatched buttons and his twice-sewn tail, and he was, Pip noticed, a little faded, a little unsure, the way a thing gets when it has been lost. But when Ollie said <em>and the middle stair goes SKREEE</em>, one of Captain Chomp's buttons seemed to catch the light, just a little, like an eye remembering.</p>", "<p>\"It's working,\" Pip whispered.</p>", "<p>\"Of course it's working,\" said Ollie. \"I'm very good at remembering.\"</p>", "<p>And that was when the hedgehog appeared, pushing a little cart of single socks, and stopped, and looked at them, and said, \"You. You have a nose.\"</p>", "<p>Pip touched his nose. \"I... do?\"</p>", "<p>\"Everyone does. Most people don't use it.\" The hedgehog set down the cart. He was small and round and the color of toast, and his quills were full of buttons, and he had the air of someone who had been interrupted in the middle of something important and had decided to make it your problem. \"I am Thimble. I sort the socks. You are the new Friends of the Lost. Barnaby told me. He makes up titles. It's charming. Come with me. I need a second nose.\"</p>", "<p>\"I'm six,\" said Ollie.</p>", "<p>\"Excellent,\" said Thimble. \"Six-year-old noses are the most honest. They haven't learned to be polite yet. Come.\"</p>", "<p>And because you did not argue with Thimble - Pip would learn this was a law of the Bureau, like gravity, or forms - they went.</p>", "<p>The sock wing was enormous. It went on and on, shelves and bins and drawers of single socks, each one tagged, each one folded, each one waiting. And Thimble walked them down it the way a general walks a battlefield, or a conductor walks an orchestra, with a small baton that was actually a knitting needle.</p>", "<p>\"The sock,\" said Thimble, \"is the most honest thing a person owns. A shoe lies. A shoe says <em>I am a sensible shoe</em> when really it stepped in something. A hat lies. A hat says <em>I am a hat</em> when really it is hiding a bad haircut. But a sock cannot lie. A sock has been against the skin all day. A sock knows.\" He stopped at a bin and held up a small gray sock. \"Smell.\"</p>", "<p>Pip smelled. \"Toast,\" he said.</p>", "<p>\"Toast,\" Thimble agreed, pleased. \"And underneath?\"</p>", "<p>Pip smelled again. \"Someone's kitchen. A warm one. There's a... a radio?\"</p>", "<p>\"A radio,\" said Thimble, and he closed his eyes with the bliss of a scholar whose theory has been confirmed. \"You see. This sock belongs to someone who makes toast in a warm kitchen with the radio on. That is a whole life. That is a whole person. And the sock remembers it, even when the person has forgotten the sock.\" He placed it gently in a bin labeled WARM / BREAKFAST / RADIO. \"This is the taxonomy. We sort by smell. It is the only honest way.\"</p>", "<p>He led them on, and the taxonomy unfolded, and it was, Pip realized, completely insane and completely perfect.</p>", "<p>There was a bin labeled GRASS / SATURDAY / SOMEONE'S BEST DAY, full of socks that smelled of cut grass and sunshine. There was a bin labeled RAIN / BUS STOP / PATIENCE. There was a bin labeled DOG / MUD / NO REGRETS. There was a bin labeled HOSPITAL / WAITING / BRAVE, and Thimble touched that one gently and did not make a joke, and Pip understood that the taxonomy was not just a system, it was a kindness, a way of saying <em>your life was here, it mattered, we noticed.</em></p>", "<p>And there was a bin labeled COMPLICATED.</p>", "<p>\"The complicated ones,\" said Thimble, \"smell like more than one thing. Like a person who is going through something. We keep those separate. We give them extra dusting.\" He picked one up, sniffed, and frowned. \"Rain. And dog. And a little bit of sadness. This one's been here a while.\" He set it back. \"We wait with the complicated ones the longest.\"</p>", "<p>Ollie, who had been listening with his whole face, said, \"Do you ever get them wrong?\"</p>", "<p>Thimble stopped. He looked at Ollie for a long moment. Then he said, with enormous seriousness, \"Yes. Sometimes a sock smells like toast but it is actually a sock that belongs to someone who is very sad and makes toast to feel better. So I put it in WARM / BREAKFAST, but I also put a little star on the tag. The star means <em>be gentle with this one.</em>\" He looked at Ollie. \"The system is not perfect. The system is a guess. But it is a guess that pays attention. That is the best a system can be.\"</p>", "<p>Pip felt something go warm in his chest. He thought of his label maker, of STAIRS, WATCH THE MIDDLE ONE, of FRIDGE, COLD, MOSTLY. He had always thought labels were for knowing. Thimble's tags were for noticing. They were not the same thing. He was starting to learn they were not the same thing at all.</p>", "<p>It was then that Pip noticed the buttons.</p>", "<p>They were everywhere in Thimble's quills. Dozens of them. Buttons of every color and size, stuck in among the spines like fruit in a very prickly bush, clicking softly when he moved. A blue one. A brass one. A little pearl one. A red one shaped like a star.</p>", "<p>\"You have buttons in your quills,\" said Pip.</p>", "<p>\"I do,\" said Thimble.</p>", "<p>\"Why?\"</p>", "<p>Thimble looked at him, and then he did something Pip did not expect. He reached up, very carefully, and worked a button loose from his quills - a small brown one, four-holed - and he held it out in his palm.</p>", "<p>\"Because every coat loses one,\" he said. \"Eventually. Every coat, every shirt, every dinosaur.\" He glanced at Ollie, and at Captain Chomp, who was back on his shelf, listening. \"A button is the thing that holds a thing together. And buttons come loose. They always come loose. So I keep spares. When a thing comes in here with a button missing, or a button loose, I give it one of mine. I sew it on. I make it ready to go home.\" He closed his palm around the brown button. \"I have been doing this a long time. I have a great many spares. I am, you might say, prepared for loss.\"</p>", "<p>He said it lightly, but Pip heard the floor under the lightness, the way he'd heard it under Miss Whisk. <em>Prepared for loss.</em> A hedgehog who kept spare buttons because he knew, better than anyone, that things come loose, that things come apart, that the holding-together is the fragile part.</p>", "<p>\"Can I have one?\" said Ollie. \"For Captain Chomp? His eye's loose.\"</p>", "<p>Thimble looked at Ollie. Then he reached up and worked loose a button - a green one, round, four-holed, almost exactly the green of Captain Chomp. He held it out.</p>", "<p>\"For the captain,\" he said. \"A spare. In case. That is what spares are for.\"</p>", "<p>Ollie took it with both hands, like it was made of glass, like it was made of gold. \"Thank you,\" he said, and it came out so sincere and so loud that several shelves of socks seemed to lean in.</p>", "<p>Thimble looked embarrassed, which on a hedgehog is a small, prickly event. \"Yes. Well. Go on. Love your dinosaur back. I have the rain ones to do. The rain ones are difficult. They smell like bus stops.\" He picked up his cart. And then, over his shoulder, so quietly Pip almost missed it: \"The spare is a promise, you know. It says <em>I expect you to come loose, and I expect to fix you, and I am not going anywhere.</em> That is what a spare button says.\"</p>", "<p>He trundled off down the sock wing, and his quills clicked, and Pip stood there holding the shape of that sentence in his head, turning it over, filing it in the drawer he was building for things that mattered.</p>", "<p>Ollie was already running back to Captain Chomp, the green button clutched in his fist, ready to tell a dinosaur about a spare, about a promise, about a hedgehog who was prepared for loss and was not going anywhere.</p>", "<p>Pip followed. And as he went, he glanced back once at the sock wing, at the bins and the tags and the little stars that meant <em>be gentle with this one</em>, and he thought that if being lost was a thing that happened to everyone, then being noticed - being smelled and sorted and waited with - was the thing that made it bearable.</p>", "<p>He did not notice, then, the small thing that would matter later. He did not notice that one of the bins in the sock wing - a bin labeled WARM / BREAKFAST / RADIO - was emptier than it had been yesterday. He did not notice that a single gray duck sock, which Ollie had brought from home to show Captain Chomp, was gone from the shelf where he'd set it down.</p>", "<p>He only noticed, later, that the humming had started. But that was later. For now, there was a dinosaur to love back, and a spare button, and a promise.</p>", "<p>For now, that was enough.</p>"]}, {"id": "ch08", "label": "Chapter 8", "title": "Chapter 8 - The Cat Who Kept the Record", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\">\n<defs>\n    <g id=\"pip\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <line x1=\"-10\" y1=\"372\" x2=\"-10\" y2=\"384\"/>\n      <line x1=\"10\" y1=\"372\" x2=\"10\" y2=\"384\"/>\n      <rect x=\"-32\" y=\"382\" width=\"64\" height=\"88\" fill=\"#E4572E\"/>\n      <line x1=\"-32\" y1=\"398\" x2=\"-52\" y2=\"446\"/>\n      <line x1=\"32\" y1=\"398\" x2=\"56\" y2=\"438\"/>\n      <circle cx=\"-52\" cy=\"450\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"46\" y=\"428\" width=\"34\" height=\"22\" fill=\"#E9C46A\"/>\n      <line x1=\"52\" y1=\"439\" x2=\"74\" y2=\"439\"/>\n      <rect x=\"80\" y=\"435\" width=\"12\" height=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"56\" cy=\"442\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"-32\" y=\"466\" width=\"64\" height=\"20\" fill=\"#2B2B2B\"/>\n      <line x1=\"-14\" y1=\"486\" x2=\"-14\" y2=\"550\"/>\n      <line x1=\"14\" y1=\"486\" x2=\"14\" y2=\"550\"/>\n      <ellipse cx=\"-16\" cy=\"552\" rx=\"16\" ry=\"8\" fill=\"#2B2B2B\"/>\n      <ellipse cx=\"18\" cy=\"552\" rx=\"16\" ry=\"8\" fill=\"#2B2B2B\"/>\n      <circle cx=\"0\" cy=\"338\" r=\"40\" fill=\"#FFF8EC\"/>\n      <path d=\"M -40 334 Q -40 296 0 296 Q 40 296 40 334 Q 26 314 0 316 Q -26 314 -40 334 Z\" fill=\"#2B2B2B\"/>\n      <circle cx=\"8\" cy=\"336\" r=\"4\" fill=\"#2B2B2B\"/>\n      <circle cx=\"26\" cy=\"336\" r=\"4\" fill=\"#2B2B2B\"/>\n      <path d=\"M 12 356 Q 22 364 32 356\" fill=\"none\"/>\n    </g>\n    <g id=\"goldie\" stroke=\"#2B2B2B\ \"#miss-whisk\" transform=\"translate(600,168) scale(0.7)\"/>\n  <use href=\"#pip\" transform=\"translate(400,224) scale(0.6)\"/>\n  <text x=\"400\" y=\"60\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"22\" fill=\"#8B5E3C\">the record</text>\n  <text x=\"215\" y=\"340\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#E4572E\">a clean square</text></svg>\n", "head": "Chapter 8 - The Cat Who Kept the Record", "paras": ["<p>Miss Whisk did not like visitors, and she did not like interruptions, and she did not like the way Barnaby leaked on the intake log, and she made all three of these things clear by the simple method of continuing to work while Pip and Ollie stood in front of her desk, waiting.</p>", "<p>Her desk was the tidiest thing in the Bureau. Everything on it had a place, and everything was in its place, and the places were labeled in a handwriting so precise it looked printed. IN. OUT. PENDING. DO NOT. There was a stamp for each, and Miss Whisk used them the way a pianist uses keys, without looking, with a kind of furious grace.</p>", "<p>\"What's the DO NOT stamp for?\" Ollie asked, pointing.</p>", "<p>\"Things that must not,\" said Miss Whisk.</p>", "<p>\"Like what?\"</p>", "<p>\"Like being touched by six-year-olds,\" said Miss Whisk, and stamped the air near Ollie's hand, DO NOT, and Ollie giggled, which was the first giggle anyone had gotten out of her all week, and she pretended it had not happened, which was also a kind of grace.</p>", "<p>\"You're the dinosaur people,\" she said, not looking up.</p>", "<p>\"Captain Chomp,\" said Ollie. \"He's a secret pirate.\"</p>", "<p>\"He's a dinosaur who was lost and is now found and is being loved back, which is more than most things get, so he should count himself lucky.\" Miss Whisk stamped something IN. \"I'm the Head Cataloguer. I keep the record. Every thing that comes in, every thing that goes out. If it's not in the record, it didn't happen. If it is in the record, it happened whether you like it or not. The record is the truth. I am the truth's secretary. It's a living.\"</p>", "<p>Pip, who loved records, who loved labels, who loved the idea that a thing could be written down and therefore held, felt an immediate and embarrassing kinship with this cat. \"Can I see it?\" he asked. \"The record?\"</p>", "<p>Miss Whisk looked up for the first time. She looked at Pip the way you look at a dog that has offered to do your taxes. \"You want to see the record.\"</p>", "<p>\"Yes.\"</p>", "<p>\"Why?\"</p>", "<p>\"Because,\" said Pip, and he thought about it, because it was a real question, \"because if it's written down, it can't get lost. The record keeps the things. Even if the things go somewhere, the record still has them. That's... that's the whole point of writing things down. Isn't it?\"</p>", "<p>Miss Whisk stared at him for a long moment. Then she did something Pip would remember for the rest of his life, which was that the corner of her mouth moved, very slightly, in a direction that was almost a smile.</p>", "<p>\"Huh,\" she said. \"The boy gets it.\" She heaved the great ledger around so it faced him. \"Fine. Look. Don't touch. The record is not a pet.\"</p>", "<p>The ledger was enormous. It was the size of a door, and it was full of entries, each one in Miss Whisk's precise hand. Pip read them, and they were not what he expected. He had expected a list of objects. What he got was a list of loves.</p>", "<p><em>One red mitten. Left hand. Knitted by a grandmother, since gone. The wool remembers her hands. Claimed by a girl who cries when she holds it. Status: waiting. Be gentle.</em></p>", "<p><em>One toy car, one wheel. Belonged to a boy who is now taller. The boy does not want the car. The boy wants the being-small. We cannot file the being-small. We keep the car. Status: complicated.</em></p>", "<p><em>One spectacle frame, no lens. Belonged to a man who read to his dog. The dog is gone. The man reads to the frame. Status: waiting. Extra dusting.</em></p>", "<p>Pip read, and read, and felt his chest do the thing it had been doing all week, the rearranging, the furniture-moving. The record was not a list of things. It was a list of what the things meant. Miss Whisk did not catalogue objects. She catalogued the loving.</p>", "<p>\"You write down the love,\" he said.</p>", "<p>\"I write down the relevant information,\" said Miss Whisk, but her ears did a small, pleased thing. \"The love is relevant. A thing without its love is just inventory. We are not a warehouse. We are a... \" She paused, and for a second the precise, sarcastic surface went thin, and underneath it was something so tender it made Pip look away to give her privacy. \"We are a waiting room,\" she said. \"For the loving. The things are just the coats it wears.\"</p>", "<p>Ollie, who had been quiet for an unusually long time, said, \"Do you have a coat?\"</p>", "<p>Miss Whisk went very still.</p>", "<p>\"I beg your pardon,\" she said.</p>", "<p>\"A coat,\" said Ollie, undeterred, six and honest. \"For your loving. Do you have a thing you're waiting for?\"</p>", "<p>The silence that followed had edges. Pip grabbed for Ollie's hand, but Ollie did not need grabbing; he stood there, small and loud and unafraid, asking the question nobody asked the cat, and Miss Whisk looked at him, and her tail went still, and her spectacles caught the lamplight so Pip couldn't see her eyes.</p>", "<p>\"I have a file,\" she said, at last. Her voice was flat. \"Everyone has a file. Mine is in the back. It is not interesting. It is a bell.\" She turned the ledger back around, firmly, the audience over. \"A bell. From a collar. It is lost. It has been lost a long time. I do not wait for it. I merely keep the file. There is a difference. The file is administrative.\"</p>", "<p>But her paw, Pip noticed, had gone to her own collar - a plain leather collar with no bell on it - and touched it, once, the way you touch a place where something used to be. And then she stamped something PENDING with more force than was necessary, and said, \"Go love your dinosaur. The record keeps itself. That's the point of the record.\"</p>", "<p>Pip went. He pulled Ollie along. But at the end of the aisle he looked back, and Miss Whisk was not stamping. She was looking at the ledger, at one particular entry, and her paw was on her empty collar, and her face was the face of someone who kept the record of everyone's loving and had filed her own in the back, under <em>administrative</em>, where nobody would think to look.</p>", "<p>Pip filed it. He filed it carefully, with a little star on the tag, the way Thimble did. <em>Be gentle with this one.</em></p>", "<p>They found Captain Chomp on his shelf, and Ollie told him about the cat and the bell and the record, and Captain Chomp's loose button caught the light. And it was then, as Pip reached to straighten the dinosaur's tag, that he saw the thing that would keep him awake that night.</p>", "<p>On the shelf next to Captain Chomp, there was a tag. A neat little tag, in Miss Whisk's precise hand. It said:</p>", "<p><em>One music box. Plays a waltz. Belonged to a woman who danced in her kitchen. Claimed. Ready. Status: going home on Finding Day.</em></p>", "<p>But there was no music box.</p>", "<p>There was a clean square in the dust, the exact shape of a music box, and a tag that said it was there, and nothing else. Pip looked at the clean square, and at the tag, and at the shelf, and he felt the floor tilt the way it had tilted in Ollie's room.</p>", "<p>\"Ollie,\" he said. \"Where's the music box?\"</p>", "<p>Ollie looked. \"There isn't one.\"</p>", "<p>\"The tag says there is.\"</p>", "<p>\"Then the tag's wrong,\" said Ollie, with the easy logic of six.</p>", "<p>But Pip knew, with a certainty that went from his stomach to his shoes, that the tag was not wrong. Miss Whisk's tags were never wrong. The record was the truth. And the truth said there was a music box here, a music box that played a waltz, that belonged to a woman who danced in her kitchen, that was claimed and ready and going home on Finding Day.</p>", "<p>And the truth was a clean square in the dust.</p>", "<p>Pip looked down the long, quiet aisle, at the shelves and the bins and the waiting things, and for the first time the Bureau did not feel like a waiting room. It felt like a room where something had been, and was not, and had not left a note.</p>", "<p>From somewhere far off, very faintly, came a humming.</p>"]}, {"id": "ch09", "label": "Chapter 9", "title": "Chapter 9 - The Bowl for Stray Customers", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\">\n<defs>\n    <g id=\"pip\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <line x1=\"-10\" y1=\"372\" x2=\"-10\" y2=\"384\"/>\n      <line x1=\"10\" y1=\"372\" x2=\"10\" y2=\"384\"/>\n      <rect x=\"-32\" y=\"382\" width=\"64\" height=\"88\" fill=\"#E4572E\"/>\n      <line x1=\"-32\" y1=\"398\" x2=\"-52\" y2=\"446\"/>\n      <line x1=\"32\" y1=\"398\" x2=\"56\" y2=\"438\"/>\n      <circle cx=\"-52\" cy=\"450\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"46\" y=\"428\" width=\"34\" height=\"22\" fill=\"#E9C46A\"/>\n      <line x1=\"52\" y1=\"439\" x2=\"74\" y2=\"439\"/>\n      <rect x=\"80\" y=\"435\" width=\"12\" height=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"56\" cy=\"442\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"-32\" y=\"466\" width=\"64\" height=\"20\" fill=\"#2B2B2B\"/>\n      <line x1=\"-14\" y1=\"486\" x2=\"-14\" y2=\"550\"/>\n      <line x1=\"14\" y1=\"486\" x2=\"14\" y2=\"550\"/>\n      <ellipse cx=\"-16\" cy=\"552\" rx=\"16\" ry=\"8\" fill=\"#2B2B2B\"/>\n      <ellipse cx=\"18\" cy=\"552\" rx=\"16\" ry=\"8\" fill=\"#2B2B2B\"/>\n      <circle cx=\"0\" cy=\"338\" r=\"40\" fill=\"#FFF8EC\"/>\n      <path d=\"M -40 334 Q -40 296 0 296 Q 40 296 40 334 Q 26 314 0 316 Q -26 314 -40 334 Z\" fill=\"#2B2B2B\"/>\n      <circle cx=\"8\" cy= \n      <circle cx=\"54\" cy=\"440\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"-18\" y=\"352\" width=\"36\" height=\"12\" fill=\"#E9C46A\"/>\n      <circle cx=\"0\" cy=\"318\" r=\"36\" fill=\"#FFF8EC\"/>\n      <path d=\"M -36 310 Q -36 280 0 280 Q 36 280 36 310 L 36 302 Q 0 288 -36 302 Z\" fill=\"#9AA5B1\"/>\n      <circle cx=\"8\" cy=\"316\" r=\"9\" fill=\"none\"/>\n      <circle cx=\"28\" cy=\"316\" r=\"9\" fill=\"none\"/>\n      <line x1=\"17\" y1=\"316\" x2=\"19\" y2=\"316\"/>\n      <circle cx=\"8\" cy=\"316\" r=\"3\" fill=\"#2B2B2B\"/>\n      <circle cx=\"28\" cy=\"316\" r=\"3\" fill=\"#2B2B2B\"/>\n      <path d=\"M 12 338 Q 20 344 30 338\" fill=\"none\"/>\n      <path d=\"M -2 344 Q 6 352 14 344\" fill=\"none\"/>\n    </g>\n    <g id=\"biscuit\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <ellipse cx=\"0\" cy=\"500\" rx=\"70\" ry=\"52\" fill=\"#E9C46A\"/>\n      <ellipse cx=\"0\" cy=\"516\" rx=\"44\" ry=\"30\" fill=\"#FFF8EC\"/>\n      <line x1=\"-44\" y1=\"530\" x2=\"-44\" y2=\"552\"/>\n      <line x1=\"-16\" y1=\"536\" x2=\"-16\" y2=\"554\"/>\n      <line x1=\"16\" y1=\"536\" x2=\"16\" y2=\"554\"/>\n      <line x1=\"44\" y1=\"530\" x2=\"44\" y2=\"552\"/>\n      <ellipse cx=\"-44\" cy=\"554\" rx=\"12\" ry=\"6\" fill=\"#E9C46A\"/>\n      <ellipse cx=\"44\" cy=\"554\" rx=\"12\" ry=\"6\" fill=\"#E9C46A\"/>\n      <path d=\"M -66 486 Q -88 470 -80 446\" fill=\"none\"/>\n      <circle cx=\"52\" cy=\"452\" r=\"40\" fill=\"#E9C46A\"/>\n      <ellipse cx=\"70\" cy=\"466\" rx=\"22\" ry=\"16\" fill=\"#FFF8EC\"/>\n      <ellipse cx=\"84\" cy=\"462\" rx=\"8\" ry=\"6\" fill=\"#2B2B2B\"/>\n      <circle cx=\"56\" cy=\"444\" r=\"4\" fill=\"#2B2B2B\"/>\n      <path d=\"M 30 424 Q 20 404 36 400 Q 48 402 44 424 Z\" fill=\"#8B5E3C\"/>\n      <path d=\"M 66 478 Q 74 486 84 478\" fill=\"none\"/>\n      <path d=\"M 40 486 Q 52 494 64 486\" fill=\"none\"/>\n    </g>\n    <g id=\"captain-chomp\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <path d=\"M -40 500 Q -70 490 -74 460 Q -70 440 -52 446\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"0\" cy=\"490\" rx=\"52\" ry=\"60\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"6\" cy=\"506\" rx=\"30\" ry=\"36\" fill=\"#E9C46A\"/>\n      <line x1=\"-6\" y1=\"486\" x2=\"18\" y2=\"486\"/>\n      <line x1=\"-6\" y1=\"502\" x2=\"18\" y2=\"502\"/>\n      <line x1=\"-6\" y1=\"518\" x2=\"18\" y2=\"518\"/>\n      <ellipse cx=\"-22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <line x1=\"-30\" y1=\"450\" x2=\"-48\" y2=\"470\"/>\n      <line x1=\"30\" y1=\"450\" x2=\"50\" y2=\"468\"/>\n      <circle cx=\"6\" cy=\"400\" r=\"42\" fill=\"#2A9D8F\"/>\n      <path d=\"M 30 380 L 56 388 L 32 398 Z\" fill=\"#2A9D8F\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"3\" fill=\"#2B2B2B\"/>\n      <circle cx=\"-12\" cy=\"392\" r=\"8\" fill=\"#E9C46A\"/>\n      <line x1=\"-16\" y1=\"388\" x2=\"-8\" y2=\"396\"/>\n      <line x1=\"-8\" y1=\"388\" x2=\"-16\" y2=\"396\"/>\n      <path d=\"M 20 416 Q 30 424 42 416\" fill=\"none\"/>\n      <path d=\"M -20 362 L -14 348 L -6 362 L 2 348 L 10 362\" fill=\"none\"/>\n    </g>\n  </defs>\n  <rect x=\"0\" y=\"0\" width=\"800\" height=\"600\" fill=\"#FFF8EC\"/>\n  <rect x=\"40\" y=\"180\" width=\"300\" height=\"14\" fill=\"#8B5E3C\"/>\n  <rect x=\"40\" y=\"280\" width=\"300\" height=\"14\" fill=\"#8B5E3C\"/>\n  <ellipse cx=\"110\" cy=\"160\" rx=\"40\" ry=\"22\" fill=\"#E9C46A\"/>\n  <ellipse cx=\"220\" cy=\"158\" rx=\"44\" ry=\"24\" fill=\"#C9A66B\"/>\n  <ellipse cx=\"150\" cy=\"260\" rx=\"42\" ry=\"22\" fill=\"#E9C46A\"/>\n  <rect x=\"480\" y=\"200\" width=\"240\" height=\"360\" fill=\"#FFF8EC\"/>\n  <rect x=\"500\" y=\"240\" width=\"200\" height=\"60\" fill=\"#E9C46A\"/>\n  <text x=\"600\" y=\"278\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"18\" fill=\"#2B2B2B\">THE WARM LOAF</text>\n  <path d=\"M 560 520 q 0 -30 40 -30 q 40 0 40 30 l 0 14 l -80 0 Z\" fill=\"#2A9D8F\"/>\n  <ellipse cx=\"600\" cy=\"520\" rx=\"40\" ry=\"8\" fill=\"#9AA5B1\"/>\n  <use href=\"#pip\" transform=\"translate(180,168) scale(0.7)\"/>\n  <use href=\"#ollie\" transform=\"translate(320,252) scale(0.55)\"/>\n  <use href=\"#goldie\" transform=\"translate(420,224) scale(0.6)\"/>\n  <text x=\"400\" y=\"60\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"22\" fill=\"#8B5E3C\">stray customers</text>\n  <text x=\"600\" y=\"592\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"15\" fill=\"#2B2B2B\">leave the bowl out</text></svg>\n", "head": "Chapter 9 - The Bowl for Stray Customers", "paras": ["<p>On the third day, Goldie took them to the bakery by a shortcut that involved a fence, a gap in a hedge, and a cat who lived in the gap and who Goldie greeted by name, and Pip decided that Goldie did not walk through the town so much as the town agreed to let her through.</p>", "<p>\"Barnaby sent us,\" Goldie explained, as they emerged, smelling of hedge, into the alley behind the bakery. \"The Bureau runs on buns. It's a whole thing. The Chief gets low if he doesn't have a bun by eleven. It's in his contract. He made up the contract. He's both parties.\"</p>", "<p>The bakery was called The Warm Loaf, and it smelled like the inside of a good decision. The smell got into Pip's clothes and stayed there, and for the rest of his life, whenever he smelled bread, he would remember this day, though he did not know that yet.</p>", "<p>Mrs. Crumb was behind the counter. She was a large, floury, unhurried woman with forearms like a rower and a face that had decided, a long time ago, to be kind and had never found a reason to stop. She looked at the three of them and she did not ask why they were there, because in Marrow's End you did not ask, you just added more buns.</p>", "<p>\"The usual for the Chief,\" she said, reaching for a bag. \"And one for the road. And one for the small one, because the small one looks like he's been through something.\" She handed Ollie a bun shaped like a knot. Ollie accepted it with both hands and the gravity of a knight receiving a sword.</p>", "<p>\"Thank you,\" said Ollie. \"I have been through something. My dinosaur's lost. But he's found. But he's not home yet. It's complicated.\"</p>", "<p>\"That's the worst kind,\" said Mrs. Crumb, without a flicker of mockery. \"The found-but-not-home. I've had a few of those myself.\" She said it lightly, but Pip, who was learning to hear the floors under lightness, heard a floor. He filed it.</p>", "<p>It was then that he noticed the bowl.</p>", "<p>It was by the door, just inside, a blue ceramic bowl with a chip in the rim, full of clean water. It was not a decorative bowl. It was a working bowl, the kind you put down for a dog. And it was full, and the water was fresh, and there was a little mat under it, and the mat had a faded picture of a bone on it.</p>", "<p>\"You have a dog?\" Pip asked.</p>", "<p>Mrs. Crumb followed his gaze, and her face did something soft. \"No,\" she said. \"No dog of my own. But I keep the bowl. For stray customers.\"</p>", "<p>\"Stray customers?\"</p>", "<p>\"Strays,\" said Mrs. Crumb. \"The ones without a home. The ones who come in the night, or the early morning, when the shop's quiet. They don't come in for bread. They come in for the water, and the warm by the oven, and the being-noticed. I keep the bowl full. I keep the mat clean. And sometimes, in the morning, the bowl's empty, and there's a little mud by the door, and I know somebody came in out of the cold.\" She wiped her hands on her apron. \"You don't have to own a thing to take care of it. You just have to leave the bowl out.\"</p>", "<p>Pip looked at the blue bowl with the chipped rim, and he thought of the Bureau, of the waiting, of the <em>a thing that is waiting should not wait alone.</em> Mrs. Crumb did not know about the Bureau. Mrs. Crumb did not need to. Mrs. Crumb had figured out the whole thing on her own, with a bowl and a mat and an oven, and Pip felt a sudden, enormous respect for her that he did not have words for.</p>", "<p>\"Does the stray have a name?\" Ollie asked.</p>", "<p>Mrs. Crumb smiled. \"I don't name them. Naming's a kind of keeping, and strays aren't for keeping. They're for feeding.\" She paused, and she looked out the window, toward the hill, toward the house with too many curtains. \"Though there was one, once. Years ago. Belonged to the old inventor up the hill. Mr. Snell. Used to come in every morning, the dog did, with Mr. Snell, and sit by the oven while he bought his loaf. A good dog. A biscuit-colored dog, if you can believe that. Named Biscuit, because Mr. Snell said he was the color of a biscuit and also because he was, and I quote, 'the only thing in my life that's never once been late.'\"</p>", "<p>She said it fondly. But then her face did the thing, the soft-sad thing.</p>", "<p>\"That was eight years ago,\" she said. \"The dog ran off. Mr. Snell looked for a while. Put up posters. The posters got rained on. He took them down. And he stopped coming in.\" She looked back at the bowl. \"I kept the bowl out, though. After. In case. You keep the bowl out. That's the job.\"</p>", "<p>Pip felt something click, quietly, in the drawer where he kept the things that mattered. The house with too many curtains. The man who stopped coming in. The dog that ran off eight years ago. The bowl that stayed full. He did not have the whole picture. He had a corner of it. But the corner was enough to make him look up the hill, through the bakery window, at the curtained house, holding its breath.</p>", "<p>\"Does he ever come back?\" Ollie asked. \"The dog?\"</p>", "<p>Mrs. Crumb was quiet for a moment. \"I don't know,\" she said, honestly. \"I like to think he's somewhere warm. I like to think somebody left a bowl out for him.\" She turned back to the counter, and her voice went bright again, the way kind people's voices do when they have decided not to be sad in front of children. \"Now. Who wants a cinnamon knot? On the house. For the found-but-not-home. It's a difficult condition. It requires sugar.\"</p>", "<p>They took the buns for the Chief, and the cinnamon knots, and Goldie took them back by a different shortcut, because Goldie never took the same shortcut twice, and Pip walked home with the smell of bread in his clothes and the blue bowl in his head.</p>", "<p>He thought about Mrs. Crumb, who kept a bowl for a stray she did not own. He thought about Mr. Snell, who had stopped coming in. He thought about the difference between leaving a bowl out and closing all the curtains, and he could not quite say what the difference was, but he could feel it, the way you feel a step in the dark.</p>", "<p>When they got to the Bureau, Barnaby ate his bun with the solemn joy of a walrus who has been low and is now restored, and he said, \"Mrs. Crumb is a Friend of the Lost. She doesn't know it. I make up the titles. It's fine.\" And Pip, delivering the bun, said, \"She keeps a bowl out. For strays.\"</p>", "<p>Barnaby stopped chewing. He looked at Pip with his small, kind eyes, and for a moment he looked very old, and very tired, and very hopeful, all at once.</p>", "<p>\"Yes,\" he said, softly. \"She does. She's been keeping that bowl out a long time.\" He finished his bun, and he brushed the crumbs from his waistcoat, and he said, in a voice that was almost to himself, \"The bowl is the easy part. It's the waiting that's hard. It's the not-knowing-if. Mrs. Crumb is very brave. Braver than she knows.\"</p>", "<p>And Pip, who was eleven, who had a label maker, who was learning the difference between a thing that is lost and a thing that is gone, filed that too, with a little star on the tag.</p>", "<p>He did not know, then, that the biscuit-colored dog was alive, and fat, and happy, and asleep, at that very moment, under the proofing rack at The Warm Loaf, three streets from the man who had stopped coming in. He did not know that the bowl had been empty every morning for eight years, and that Mrs. Crumb refilled it every night, and that the mud by the door was real.</p>", "<p>He only knew that the bowl was full, and that somebody drank from it, and that leaving it out was a kind of love that did not need to own the thing it loved.</p>", "<p>It was, he thought, the bravest thing he had ever seen. And he had seen a six-year-old put his shoes on the wrong feet on purpose.</p>"]}, {"id": "ch10", "label": "Chapter 10", "title": "Chapter 10 - The Umbrella Orchard (Please Do Not Water)", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\">\n<defs>\n    <g id=\"pip\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <line x1=\"-10\" y1=\"372\" x2=\"-10\" y2=\"384\"/>\n      <line x1=\"10\" y1=\"372\" x2=\"10\" y2=\"384\"/>\n      <rect x=\"-32\" y=\"382\" width=\"64\" height=\"88\" fill=\"#E4572E\"/>\n      <line x1=\"-32\" y1=\"398\" x2=\"-52\" y2=\"446\"/>\n      <line x1=\"32\" y1=\"398\" x2=\"56\" y2=\"438\"/>\n      <circle cx=\"-52\" cy=\"450\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"46\" y=\"428\" width=\"34\" height=\"22\" fill=\"#E9C46A\"/>\n      <line x1=\"52\" y1=\"439\" x2=\"74\" y2=\"439\"/>\n      <rect x=\"80\" y=\"435\" width=\"12\" height=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"56\" cy=\"442\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"-32\" y=\"466\" width=\"64\" height=\"20\" fill=\"#2B2B2B\"/>\n      <line x1=\"-14\" y1=\"486\" x2=\"-14\" y2=\"550\"/>\n      <line x1=\"14\" y1=\"486\" x2=\"14\" y2=\"550\"/>\n      <ellipse cx=\"-16\" cy=\"552\" rx=\"16\" ry=\"8\" fill=\"#2B2B2B\"/>\n      <ellipse cx=\"18\" cy=\"552\" rx=\"16\" ry=\"8\" fill=\"#2B2B2B\"/>\n      <circle cx=\"0\" cy=\"338\" r=\"40\" fill=\"#FFF8EC\"/>\n      <path d=\"M -40 334 Q -40 296 0 296 Q 40 296 40 334 Q 26 314 0 >\n    </g>\n    <g id=\"captain-chomp\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <path d=\"M -40 500 Q -70 490 -74 460 Q -70 440 -52 446\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"0\" cy=\"490\" rx=\"52\" ry=\"60\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"6\" cy=\"506\" rx=\"30\" ry=\"36\" fill=\"#E9C46A\"/>\n      <line x1=\"-6\" y1=\"486\" x2=\"18\" y2=\"486\"/>\n      <line x1=\"-6\" y1=\"502\" x2=\"18\" y2=\"502\"/>\n      <line x1=\"-6\" y1=\"518\" x2=\"18\" y2=\"518\"/>\n      <ellipse cx=\"-22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <line x1=\"-30\" y1=\"450\" x2=\"-48\" y2=\"470\"/>\n      <line x1=\"30\" y1=\"450\" x2=\"50\" y2=\"468\"/>\n      <circle cx=\"6\" cy=\"400\" r=\"42\" fill=\"#2A9D8F\"/>\n      <path d=\"M 30 380 L 56 388 L 32 398 Z\" fill=\"#2A9D8F\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"3\" fill=\"#2B2B2B\"/>\n      <circle cx=\"-12\" cy=\"392\" r=\"8\" fill=\"#E9C46A\"/>\n      <line x1=\"-16\" y1=\"388\" x2=\"-8\" y2=\"396\"/>\n      <line x1=\"-8\" y1=\"388\" x2=\"-16\" y2=\"396\"/>\n      <path d=\"M 20 416 Q 30 424 42 416\" fill=\"none\"/>\n      <path d=\"M -20 362 L -14 348 L -6 362 L 2 348 L 10 362\" fill=\"none\"/>\n    </g>\n  </defs>\n  <rect x=\"0\" y=\"0\" width=\"800\" height=\"600\" fill=\"#FFF8EC\"/>\n  <path d=\"M 90 200 L 90 480 M 70 200 Q 90 160 110 200 Z\" fill=\"#2A9D8F\"/>\n  <path d=\"M 170 220 L 170 480 M 150 220 Q 170 180 190 220 Z\" fill=\"#E4572E\"/>\n  <path d=\"M 250 200 L 250 480 M 230 200 Q 250 160 270 200 Z\" fill=\"#E9C46A\"/>\n  <rect x=\"60\" y=\"480\" width=\"240\" height=\"20\" fill=\"#8B5E3C\"/>\n  <rect x=\"480\" y=\"220\" width=\"160\" height=\"340\" fill=\"#2A9D8F\"/>\n  <circle cx=\"615\" cy=\"390\" r=\"10\" fill=\"#E9C46A\"/>\n  <rect x=\"500\" y=\"430\" width=\"120\" height=\"34\" fill=\"#FFF8EC\" transform=\"rotate(-4 560 447)\"/>\n  <text x=\"560\" y=\"452\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" fill=\"#2B2B2B\" transform=\"rotate(-4 560 447)\">FOUND. COMES BACK TO.</text>\n  <use href=\"#pip\" transform=\"translate(380,112) scale(0.8)\"/>\n  <text x=\"400\" y=\"60\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"22\" fill=\"#8B5E3C\">the umbrella orchard</text>\n  <text x=\"180\" y=\"540\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#2B2B2B\">PLEASE DO NOT WATER</text></svg>\n", "head": "Chapter 10 - The Umbrella Orchard (Please Do Not Water)", "paras": ["<p>By the end of the third day, Pip had a job.</p>", "<p>He had not meant to get a job. He had meant to love Captain Chomp back to remembering and then go home. But the Bureau was enormous and the staff were few, and there is a law - older than forms, older than the door - that when a willing boy stands in a room full of work, the work finds him.</p>", "<p>It started with the dusting. Barnaby handed him a cloth and said, \"The things like to be dusted. It reminds them they are still things. A thing that is not dusted begins to feel like a memory. We do not want that.\" So Pip dusted. He dusted the single gloves and the jar of humming keys and the spectacle frames with no lenses, and he found that dusting was not cleaning, exactly. It was a way of saying <em>I see you. You are still here. You are still a thing.</em> And the things, he could have sworn, stood a little straighter under the cloth.</p>", "<p>Then it was the labeling. Miss Whisk, who did not like visitors, took one look at Pip's label maker and said, \"Huh. A machine that makes the record smaller.\" And she let him - actually let him - make tags for the new intake, because her paw cramped in the evenings and she would not admit it. Pip printed tags in his careful block letters, and Miss Whisk corrected his spelling without looking, and they worked in a silence that was, Pip realized, the comfortable silence of two people who both believed that writing a thing down was a way of keeping it.</p>", "<p>And then it was the waiting.</p>", "<p>This was the part Pip had not understood, the part Barnaby had said was the important part. Every thing in the Bureau needed to be waited with. Not all the time. But some of the time. A thing that was waited with remembered. So Pip sat with them. He sat with the red mitten and told it about the grandmother who had knitted it, which he did not know, so he made up a grandmother who was probably close, and the mitten seemed to like it. He sat with the toy car with one wheel and told it about being small, which he did know, and the car's one wheel turned a little, as if remembering a specific carpet. He sat with the spectacle frame and read to it, the way the man used to read to his dog, and he read the labels on the nearby shelves, which was not a story, but was, he thought, a kind of story, the story of all the things that were waiting.</p>", "<p>And in between, he saw the wonders.</p>", "<p>He saw the umbrella orchard, which was a whole grove of furled umbrellas standing in rows like trees, and when the light hit them they made a sound like rain that wasn't there, and the sign said PLEASE DO NOT WATER, and Goldie told him that once a pigeon had watered them out of spite and they had all bloomed at once and it had taken a week to get them furled again, and Barnaby had been very diplomatic about it but his whiskers had never forgiven the pigeon.</p>", "<p>He saw the field of lost cows. It was actually a field, in a room that should not have fit a field, and the cows were gray and patient and mooed softly, and they were all the cows that had ever been lost, which was more cows than Pip would have guessed, and they were waiting for the farmers who had lost them, and some of the farmers had been gone a long time, and the cows did not know that, and the Bureau did not tell them, because the waiting was the kind part.</p>", "<p>He saw the jar of keys, which hummed when you passed it, and he asked Barnaby why, and Barnaby said, \"They are remembering their locks. A key without a lock is a question. The hum is the question.\" And Pip thought that was the saddest and most beautiful thing he had ever heard, and he put his hand on the jar, and the hum went through his palm and up his arm, and he felt, for a second, every locked door in Marrow's End, and every person who had ever stood in front of one, patting their pockets.</p>", "<p>He saw the drawer of homework excuses, valid and dubious, and he laughed, and Miss Whisk said, \"The dubious ones are more honest. The valid ones are trying too hard,\" and Pip laughed harder.</p>", "<p>And every day, twice a day, he sat with Captain Chomp, and Ollie sat with him, and they told the dinosaur about home, about the middle stair and the refrigerator and the pizza on the floor, and Captain Chomp's loose button caught the light a little more each day, and his twice-sewn tail seemed a little less unsure, and once - once - when Ollie did the roar, the dinosaur's whole body seemed to lean into it, the way a plant leans into the sun.</p>", "<p>\"He's remembering,\" Barnaby said, watching. \"You can see it. The loving is paving the way.\"</p>", "<p>And Pip, dusting and labeling and waiting, realized something that he had to sit down on a lost step (STEP. STILL LOOKING.) to think about.</p>", "<p>He had come to Marrow's End feeling like a lost thing. He had labeled his shoe STILL HERE because he had not been sure it was true. He had labeled the house HOME because he had not been sure it was. He had been a thing set down somewhere and not picked back up, a single sock in a town of dryers, waiting to be claimed.</p>", "<p>And now he had a job. He had a title, Friend of the Lost, which was not official but was true. He had a cat who corrected his spelling and a hedgehog who gave him spare buttons and a walrus who made up contracts and a girl who took him through fences. He had a dinosaur to love back and a brother to be brave for and a bowl to remember and a record to keep.</p>", "<p>He was not a lost thing anymore. He was a thing that had been found. Not by being claimed - nobody had claimed Pip. But by being useful. By being waited with. By having a place in the enormous, kindly, slightly chaotic room where the lost things were kept, and by being, himself, one of the keepers.</p>", "<p>Feeling lost, he understood now, was not the same as being unloved. He had felt lost, and he had been loved the whole time - by his mother with the tired-and-proud look, by his father who wrestled chairs, by Ollie who put his shoes on the wrong feet on purpose. The lost feeling had been a fog. The loving had been the ground under the fog. It had been there the whole time. He just hadn't been able to see it, because he had been new, and new is a kind of lost, and lost is a kind of fog.</p>", "<p>He sat on the lost step and he felt the ground under the fog, and it was solid, and it was warm, and it was his.</p>", "<p>\"Pip,\" said Ollie, appearing with Captain Chomp under his arm, because it was going-home time. \"Ready?\"</p>", "<p>\"Ready,\" said Pip.</p>", "<p>They said goodnight to Barnaby, who was leaking contentedly, and to Miss Whisk, who said, \"Don't let the door hit you. It's shy, but it's also heavy,\" and to Thimble, who was doing the rain ones and did not look up but raised one quill in salute, the buttons clicking. And they went to the little green door, and Pip put his hand on the brass knob, and he paused.</p>", "<p>\"Can I label it?\" he asked. \"The door. So I can find it again. So I know it's here.\"</p>", "<p>Barnaby considered this. \"The door finds you,\" he said. \"You know that. You don't need a label.\"</p>", "<p>\"I know,\" said Pip. \"But I want to give it one. Not so I can find it. So it knows it's found.\"</p>", "<p>Barnaby's small eyes went very soft. \"Yes,\" he said. \"I think that's allowed. I think that's very allowed.\"</p>", "<p>So Pip printed a label, and he pressed it onto the little green door, right under the brass plate that said BUREAU OF LOST THINGS. PLEASE KNOCK. And the label said:</p>", "<p class=\"chip\">FOUND. COMES BACK TO.</p>", "<p>He looked at it, and it looked back, and he felt the ground under the fog, solid and warm.</p>", "<p>Then they stepped through, into the schoolyard, into the dusk, into Marrow's End, and the door swung shut behind them, and the smell of dust and lavender and old paper went out like a candle.</p>", "<p>Pip did not notice, then, that the label was slightly crooked. He did not notice that it would matter, later, that it was crooked, that a crooked label on a door that moves is a thing you can follow. He only noticed that the door was green, and that it was found, and that he would be back tomorrow.</p>", "<p>And from somewhere under the hill, very faintly, something hummed. It was a patient hum. A keeping hum. The hum of a machine that had decided, quietly, that nothing it loved would ever be lost again.</p>", "<p>Pip heard it, and stopped, and looked down the hill.</p>", "<p>\"Pip?\" said Ollie. \"What is it?\"</p>", "<p>\"Nothing,\" said Pip. \"I thought I heard... nothing.\"</p>", "<p>They went home. And the humming went on, patient and keeping, under the hill, under the house with too many curtains, getting ready.</p>", "<p>But that was tomorrow's problem. Tonight there was a dinosaur who was almost remembering, and a label that said FOUND, and a boy who had stopped being a lost thing.</p>", "<p>Tonight, that was enough.</p>"]}, {"id": "ch11", "label": "Chapter 11", "title": "Chapter 11 - The Shelf That Forgot Its Shelf", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\">\n<defs>\n    <g id=\"pip\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <line x1=\"-10\" y1=\"372\" x2=\"-10\" y2=\"384\"/>\n      <line x1=\"10\" y1=\
