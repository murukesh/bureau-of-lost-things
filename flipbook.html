 cy=\"392\" r=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"3\" fill=\"#2B2B2B\"/>\n      <circle cx=\"-12\" cy=\"392\" r=\"8\" fill=\"#E9C46A\"/>\n      <line x1=\"-16\" y1=\"388\" x2=\"-8\" y2=\"396\"/>\n      <line x1=\"-8\" y1=\"388\" x2=\"-16\" y2=\"396\"/>\n      <path d=\"M 20 416 Q 30 424 42 416\" fill=\"none\"/>\n      <path d=\"M -20 362 L -14 348 L -6 362 L 2 348 L 10 362\" fill=\"none\"/>\n    </g>\n  </defs>\n  <rect x=\"0\" y=\"0\" width=\"800\" height=\"600\" fill=\"#FFF8EC\"/>\n  <rect x=\"40\" y=\"260\" width=\"360\" height=\"16\" fill=\"#8B5E3C\"/>\n  <rect x=\"40\" y=\"380\" width=\"360\" height=\"16\" fill=\"#8B5E3C\"/>\n  <rect x=\"70\" y=\"210\" width=\"70\" height=\"50\" fill=\"#FFF8EC\" stroke-dasharray=\"6 6\"/>\n  <rect x=\"180\" y=\"210\" width=\"70\" height=\"50\" fill=\"#FFF8EC\" stroke-dasharray=\"6 6\"/>\n  <rect x=\"290\" y=\"210\" width=\"70\" height=\"50\" fill=\"#FFF8EC\" stroke-dasharray=\"6 6\"/>\n  <rect x=\"75\" y=\"270\" width=\"60\" height=\"20\" fill=\"#FFF8EC\"/>\n  <rect x=\"185\" y=\"270\" width=\"60\" height=\"20\" fill=\"#FFF8EC\"/>\n  <rect x=\"295\" y=\"270\" width=\"60\" height=\"20\" fill=\"#FFF8EC\"/>\n  <rect x=\"120\" y=\"330\" width=\"180\" height=\"34\" fill=\"#E9C46A\"/>\n  <text x=\"210\" y=\"353\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" fill=\"#2B2B2B\">MISSING. NOT GONE.</text>\n  <use href=\"#ollie\" transform=\"translate(520,224) scale(0.6)\"/>\n  <line x1=\"560\" y1=\"430\" x2=\"585\" y2=\"470\"/>\n  <use href=\"#miss-whisk\" transform=\"translate(680,168) scale(0.7)\"/>\n  <text x=\"400\" y=\"60\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"22\" fill=\"#8B5E3C\">the empty shelf</text>\n  <text x=\"520\" y=\"592\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"15\" fill=\"#2B2B2B\">the Official Counter counts</text></svg>\n", "head": "Chapter 11 - The Shelf That Forgot Its Shelf", "paras": ["<p>On the fourth day, the music box was still gone, and now the thing next to it was gone too.</p>", "<p>Pip saw it the moment he came through the green door, because he had learned the shelves the way you learn a face, and a face with a missing tooth is a face you notice. The clean square in the dust where the music box had been was still there. But beside it, where there had been a small brass telescope - <em>One telescope. Belonged to a boy who wanted to see the moon. Claimed. Ready.</em> - there was now a second clean square.</p>", "<p>Two clean squares. Two tags. No things.</p>", "<p>\"Miss Whisk,\" said Pip, and his voice came out thinner than he meant it to.</p>", "<p>Miss Whisk was already there. She was standing in front of the shelf with the great ledger open in her paws, and she was not stamping, and she was not being sarcastic, and that, more than the clean squares, made Pip's stomach go cold.</p>", "<p>\"I know,\" she said. \"I've been counting.\"</p>", "<p>\"Counting what?\"</p>", "<p>\"The discrepancies.\" She turned the ledger so he could see. There were marks in the margin, small precise marks, and there were a great many of them. \"A discrepancy is when the record says a thing is here, and the thing is not here. The record is the truth. So when there is a discrepancy, either the truth is wrong, or the thing is wrong.\" She looked at Pip over her spectacles. \"The truth is not wrong. I have checked. I have checked four times. The things are wrong. The things are gone.\"</p>", "<p>Barnaby came up the aisle at his best speed, which for a walrus was a kind of urgent waddle, his waistcoat pockets swinging, his leaking pen forgotten. He looked at the two clean squares, and his whiskers went down, and he made a sound like a kettle deciding not to boil.</p>", "<p>\"The telescope,\" he said. \"The boy who wanted to see the moon. He was going to get it on Finding Day. He's been waiting. He's been so patient.\" He put a flipper on the empty shelf, gently, the way you'd touch a shoulder. \"He was ready.\"</p>", "<p>\"Things that are ready don't leave,\" said Miss Whisk. \"That's the point of ready. Ready means going home. It does not mean going... elsewhere.\" She said the word <em>elsewhere</em> like it was a word she had found on the floor and did not want to hold.</p>", "<p>Pip looked down the aisle. The Bureau was quiet, the full-quiet, the library-quiet. But now the quiet had a different shape. It was the quiet of a room where something had been taken, and the something had not left a note, and the room did not know how to say so.</p>", "<p>\"How many?\" Pip asked.</p>", "<p>Miss Whisk looked at her marks. \"Since the first of the week,\" she said, \"seventeen.\"</p>", "<p>\"Seventeen things?\"</p>", "<p>\"Seventeen things that were claimed and ready and going home on Finding Day.\" She closed the ledger, and the sound was very loud in the quiet. \"Seventeen things that somebody loved, that were loved back, that remembered the way, and that are now... not here. The record says they are here. The shelf says they are not. I do not know how to file that. There is no stamp for that.\"</p>", "<p>Barnaby sat down on a lost step, heavily, and the step said STEP. STILL LOOKING. and Barnaby said, \"I know, old friend. I know.\" And for a moment the Chief of the Bureau of Lost Things looked like what he was, which was a very old, very kind, very tired walrus who had spent his whole life keeping things safe and had just learned that safe was not a thing you could promise.</p>", "<p>Pip felt something rise in him. It was not fear, exactly. It was the thing he felt when a label was wrong, when a thing was not where it was supposed to be, when the world needed to be put back in order. It was the label-maker feeling. It was the <em>I will find this and I will write it down and I will make it right</em> feeling.</p>", "<p>\"We need to find them,\" he said.</p>", "<p>\"Pip,\" said Barnaby, gently, \"the door is the only way in or out. The door is shy. It only opens for people who have lost something they love. Nothing can come in that does not belong. Nothing can take a thing out. That is the rule. That is the whole rule.\"</p>", "<p>\"Then how-\"</p>", "<p>\"I don't know,\" said Barnaby, and it was the first time Pip had heard the walrus say those words, and they sounded strange in his deep, wet, certain voice, like a cello playing a note it had never played. \"I don't know how. And I have been Chief here for a very long time, and I have never not known how.\"</p>", "<p>Ollie, who had been holding Captain Chomp and listening, said, in a small voice, \"Is Captain Chomp safe?\"</p>", "<p>Barnaby looked at Ollie, and he made his face be a thing you could stand on. \"Captain Chomp is on his shelf,\" he said. \"He is being dusted. He is being waited with. He is safe.\" He paused, and he added, because he was honest, \"I will put him somewhere closer. Somewhere I can see him. Just to be sure.\"</p>", "<p>And Pip, watching Barnaby waddle off to move a dinosaur to a safer shelf, felt the floor tilt again, and he thought: <em>safe is not a thing you can promise.</em> And he thought: <em>then I will make it a thing you can promise.</em> And he did not know how, and he was eleven, and he had a label maker, and he had decided things before.</p>", "<p>He took out the label maker. He printed a tag, and he pressed it onto the empty shelf, right between the two clean squares. And the tag said:</p>", "<p class=\"chip\">MISSING. NOT GONE. WE WILL FIND YOU.</p>", "<p>Miss Whisk looked at the tag. She looked at Pip. And the corner of her mouth did the almost-smile again, the one that was rarer than a blue moon.</p>", "<p>\"That's not a real stamp,\" she said.</p>", "<p>\"It's a real promise,\" said Pip.</p>", "<p>Miss Whisk was quiet for a moment. Then she reached into her desk, and she took out a stamp Pip had never seen, a stamp with no label on the handle, and she pressed it onto the tag, next to his printing. And the stamp said:</p>", "<p class=\"chip\">COUNTED.</p>", "<p>\"Everything that is missing gets counted,\" she said. \"That's the rule I'm making up right now. If it's counted, it's not forgotten. If it's not forgotten, it's not gone.\" She looked at the two clean squares, and her paw went, once, to her empty collar. \"Seventeen,\" she said. \"We count them. We find them. And whoever is doing this-\" and her voice went flat and precise and dangerous, the voice of the truth's secretary, \"-is going to be very sorry they picked a room full of people who know how to wait.\"</p>", "<p>\"I can count,\" Ollie announced. \"I'm very good at counting. I can count to a hundred. And then I can count to a hundred again, which is harder, because you have to remember you already did it.\"</p>", "<p>Miss Whisk looked at Ollie. Then she took a fresh page, and she wrote, at the top, in her precise hand, OFFICIAL COUNTER, and under it, OLLIE PARKER, AGE 6, VERY GOOD AT COUNTING. She handed him a pencil that was almost as big as he was.</p>", "<p>\"You are now the Official Counter,\" she said. \"It is not an official title. I just made it up. But it is true. Your job is to count the missing things, and to tell me if the number changes. Do not lose the pencil.\"</p>", "<p>\"I won't,\" said Ollie, with enormous seriousness. \"I'll label it.\"</p>", "<p>And Pip, watching his brother hold the pencil like a sword, felt the floor stop tilting, just a little, because a room where a six-year-old is given a job is a room that has decided to do something, and a room that has decided to do something is not a room that is lost.</p>", "<p>From somewhere under the hill, very faintly, came the humming. It was a patient hum. A keeping hum. And this time, Pip did not think it was nothing. This time, Pip listened, and he filed the sound in the drawer where he kept the things that mattered, and he put a little star on the tag.</p>", "<p><em>Be gentle with this one,</em> he thought. <em>But find it. Find it fast.</em></p>", "<p>The Bureau had seventeen missing things, and one crooked promise, and a cat who had just made up a rule.</p>", "<p>It was, Pip thought, enough to start with. It would have to be. Because Finding Day was in four days, and seventeen somebodies were waiting for things that were not there, and the humming under the hill was getting louder.</p>"]}, {"id": "ch12", "label": "Chapter 12", "title": "Chapter 12 - A Humming in the Key of Missing", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\">\n<defs>\n    <g id=\"pip\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <line x1=\"-10\" y1=\"372\" x2=\"-10\" y2=\"384\"/>\n      <line x1=\"10\" y1=\"372\" x2=\"10\" y2=\"384\"/>\n      <rect x=\"-32\" y=\"382\" width=\"64\" height=\"88\" fill=\"#E4572E\"/>\n      <line x1=\"-32\" y1=\"398\" x2=\"-52\" y2=\"446\"/>\n      <line x1=\"32\" y1=\"398\" x2=\"56\" y2=\"438\"/>\n      <circle cx=\"-52\" cy=\"450\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"46\" y=\"428\" width=\"34\" height=\"22\" fill=\"#E9C46A\"/>\n      <line x1=\"52\" y1=\"439\" x2=\"74\" y2=\"439\"/>\n      <rect x=\"80\" y=\"435\" width=\"12\" height=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"56\" cy=\"442\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"-32\" y=\"466\" width=\"64\" height=\"20\" fill=\"#2B2B2B\"/>\n      <line x1=\"-14\" y1=\"486\" x2=\"-14\" y2=\"550\"/>\n      <line x1=\"14\" y1=\"486\" x2=\"14\" y2=\"550\"/>\n      <ellipse cx=\"-16\" cy=\"552\" rx=\"16\" ry=\"8\" fill=\"#2B2B2B\"/>\n      <ellipse cx=\"18\" cy=\"552\" rx=\"16\" ry=\"8\" fill=\"#2B2B2B\"/>\n      <circle cx=\"0\" cy=\"338\" r=\"40\" fill=\"#FFF8EC\"/>\n      <path d=\"M -40 334 Q -40 296 0 296 Q 40 296 40 334 Q 26 314 0 316 Q -26 314 -40 334 Z\" fill=\"#2B2B2B\"/>\n      <circle cx=\"8\" cy=\"336\" r=\"4\" fill=\"#2B2B2B\"/>\n      <circle cx=\"26\" cy=\"336\" r=\"4\" fill=\"#2B2B2B\"/>\n      <path d=\"M 12 356 Q 22 364 32 356\" fill=\"none\"/>\n    </g>\n "490\" rx=\"52\" ry=\"60\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"6\" cy=\"506\" rx=\"30\" ry=\"36\" fill=\"#E9C46A\"/>\n      <line x1=\"-6\" y1=\"486\" x2=\"18\" y2=\"486\"/>\n      <line x1=\"-6\" y1=\"502\" x2=\"18\" y2=\"502\"/>\n      <line x1=\"-6\" y1=\"518\" x2=\"18\" y2=\"518\"/>\n      <ellipse cx=\"-22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <line x1=\"-30\" y1=\"450\" x2=\"-48\" y2=\"470\"/>\n      <line x1=\"30\" y1=\"450\" x2=\"50\" y2=\"468\"/>\n      <circle cx=\"6\" cy=\"400\" r=\"42\" fill=\"#2A9D8F\"/>\n      <path d=\"M 30 380 L 56 388 L 32 398 Z\" fill=\"#2A9D8F\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"3\" fill=\"#2B2B2B\"/>\n      <circle cx=\"-12\" cy=\"392\" r=\"8\" fill=\"#E9C46A\"/>\n      <line x1=\"-16\" y1=\"388\" x2=\"-8\" y2=\"396\"/>\n      <line x1=\"-8\" y1=\"388\" x2=\"-16\" y2=\"396\"/>\n      <path d=\"M 20 416 Q 30 424 42 416\" fill=\"none\"/>\n      <path d=\"M -20 362 L -14 348 L -6 362 L 2 348 L 10 362\" fill=\"none\"/>\n    </g>\n  </defs>\n  <rect x=\"0\" y=\"0\" width=\"800\" height=\"600\" fill=\"#FFF8EC\"/>\n  <path d=\"M 480 560 Q 600 300 760 240 L 800 240 L 800 560 Z\" fill=\"#C9A66B\"/>\n  <rect x=\"620\" y=\"180\" width=\"120\" height=\"120\" fill=\"#8B5E3C\"/>\n  <rect x=\"640\" y=\"200\" width=\"30\" height=\"30\" fill=\"#FFF8EC\"/>\n  <rect x=\"690\" y=\"200\" width=\"30\" height=\"30\" fill=\"#FFF8EC\"/>\n  <line x1=\"120\" y1=\"300\" x2=\"120\" y2=\"560\"/>\n  <line x1=\"60\" y1=\"340\" x2=\"180\" y2=\"340\"/>\n  <rect x=\"130\" y=\"360\" width=\"120\" height=\"28\" fill=\"#FFF8EC\"/>\n  <text x=\"190\" y=\"380\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" fill=\"#2B2B2B\">HUM: LOUDER HERE</text>\n  <rect x=\"130\" y=\"410\" width=\"110\" height=\"28\" fill=\"#FFF8EC\"/>\n  <text x=\"185\" y=\"430\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" fill=\"#2B2B2B\">HUM: UNDER</text>\n  <use href=\"#pip\" transform=\"translate(300,168) scale(0.7)\"/>\n  <use href=\"#goldie\" transform=\"translate(430,224) scale(0.6)\"/>\n  <text x=\"400\" y=\"60\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"22\" fill=\"#8B5E3C\">the hum</text>\n  <text x=\"400\" y=\"592\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"15\" fill=\"#2B2B2B\">mapping a noise</text></svg>\n", "head": "Chapter 12 - A Humming in the Key of Missing", "paras": ["<p>The humming was not in Pip's head, and he could prove it, because Ollie could hear it too, and Ollie was six and did not have the kind of head that made things up on purpose.</p>", "<p>\"It's a bee,\" said Ollie, the first time.</p>", "<p>\"It's not a bee,\" said Pip. \"Bees don't hum in the same note for an hour. Bees get bored.\"</p>", "<p>\"It's a very patient bee,\" said Ollie.</p>", "<p>But it was not a bee, and by the fourth day Pip had stopped pretending it might be. The humming was always there, at the edge of things, under the floor of the Bureau, under the hill of the town, a low, steady, keeping note, like a refrigerator that had decided to become a religion. It was the sound of something that was never going to stop. And Pip, who had labeled his refrigerator COLD, MOSTLY, knew the sound of a machine that had a job to do, and this machine's job, he was starting to think, was <em>keep</em>.</p>", "<p>He decided to find it. He decided it the way he decided everything, which was out loud, with a label.</p>", "<p>\"We are going to find the hum,\" he told Goldie, in the Bureau, between the umbrella orchard and the jar of keys. \"I'm going to label it when I find it. I'm going to write down where it is. And then it won't be a mystery anymore. It'll be a location.\"</p>", "<p>Goldie looked at him with the look of a girl who knew every shortcut and therefore knew that some things did not have shortcuts. \"You can't label a sound, Pip.\"</p>", "<p>\"I can label where it comes from.\"</p>", "<p>\"Sounds come from everywhere. That's the whole thing about sounds.\"</p>", "<p>\"Then I'll label everywhere,\" said Pip, \"until the sound runs out of places to be.\"</p>", "<p>Goldie considered this. Then she grinned, the shortcut grin, the <em>this is a terrible idea and I'm in</em> grin. \"Okay,\" she said. \"Okay, Friend of the Lost. Let's go find your hum. But we do it my way. We don't walk in straight lines. Straight lines are how you get noticed. We go the crooked way.\"</p>", "<p>They went the crooked way.</p>", "<p>They started in the Bureau, because the humming was loudest there, under the floor. Pip put his ear to the floor of the sock wing, and the humming came up through the wood, steady, patient, and Thimble, who was doing the rain ones, said, without looking up, \"It's been there a week. It's getting louder. The socks don't like it. The socks can hear it better than we can. They've been leaning away from it.\" And Pip looked, and the socks in the bins nearest the floor were, in fact, leaning, very slightly, all of them, like a field of small gray wheat in a wind that came from below.</p>", "<p>\"That's not possible,\" said Pip.</p>", "<p>\"A lot of things aren't,\" said Thimble. \"The socks lean. I file it under COMPLICATED. Go away. I'm doing the rain ones.\"</p>", "<p>They went outside, into the town, and Goldie took him the crooked way, through the gap in the hedge, past the cat who lived in the gap, down the lane that went uphill. And as they went, Pip listened, and he labeled. He labeled a fence post HUM: LOUDER HERE. He labeled a drain HUM: UNDER. He labeled a particular paving stone, which he was almost sure was the right one, HUM: CLOSE. The labels were a trail, a crooked trail, a trail of small white flags that said <em>the sound is this way</em>, and Goldie watched him do it and said, \"You know you're making a map of a noise.\"</p>", "<p>\"Yes,\" said Pip.</p>", "<p>\"That's the most Pip thing I've ever seen,\" said Goldie, and she said it with such fondness that Pip's ears went warm, and he kept labeling.</p>", "<p>The trail went uphill. It went toward the house with too many curtains. Pip noticed this, and his stomach did a small thing, and he kept labeling, because labeling was a thing you could do with your hands when your stomach was doing things.</p>", "<p>And then, at the corner of the lane, just below the curtained house, the humming stopped.</p>", "<p>It did not fade. It did not get quieter. It stopped, all at once, the way a radio stops when someone unplugs it, and the silence that replaced it was so sudden and so complete that Pip and Goldie both froze, mid-step, like two animals who have just realized they are not alone in the field.</p>", "<p>\"It knows we're listening,\" said Goldie, very quietly.</p>", "<p>\"Machines don't know things,\" said Pip, but his voice was quiet too.</p>", "<p>\"This one does,\" said Goldie. \"Listen.\"</p>", "<p>They listened. The silence had a shape. It was the silence of something holding its breath. It was the silence of the house with too many curtains, and it was the same silence, exactly the same, and Pip felt the two silences click together like two halves of a thing that had been broken.</p>", "<p>Then, from the house, very faintly, came a sound that was not the humming. It was a click. A small, mechanical click. And then another. And then a whir, soft, like a thing turning over in its sleep, and then the humming came back, but quieter now, careful, the way you hum when you are trying not to be heard.</p>", "<p>\"It turned itself down,\" said Goldie. \"Pip. It turned itself down so we wouldn't hear it. Machines don't do that.\"</p>", "<p>Pip looked up at the house. Every window was curtained. Every curtain was drawn. The house was holding its breath, and under the breath, under the floor, under the hill, something was keeping, keeping, keeping, and it had just noticed two children on the lane, and it had decided to be quiet.</p>", "<p>\"We should go,\" said Goldie, and for the first time since Pip had known her, the shortcut girl did not sound like she was enjoying the shortcut.</p>", "<p>They went. They went the crooked way, back down the hill, and Pip did not label anything on the way back, because his hands were busy holding the thing he had learned, which was too big for a label. He held it all the way to the Bureau, and he set it down in front of Barnaby, and he said, \"The hum comes from the Snell place. And it knows when we're listening. And it turned itself down.\"</p>", "<p>Barnaby was quiet for a long moment. His whiskers moved. His leaking pen dripped, once, onto the intake log, and he did not dab at it.</p>", "<p>\"The Snell place,\" he said, softly. \"Silas Snell.\" He said the name the way you say a name you have not said in a long time, a name that has a story attached, a name that is heavy with the story. \"I knew him once. Before. He was a maker. An inventor. He made things that... \" Barnaby paused, and his small eyes went far away. \"He made things to keep. He was always making things to keep. Even then. Even before he lost the dog.\" He looked at Pip. \"I had hoped he was just a sad man in a curtained house. I had hoped the hum was nothing. I am the Chief of the Bureau of Lost Things, and I had hoped, because hoping is easier than knowing.\"</p>", "<p>\"What does he want?\" Pip asked.</p>", "<p>Barnaby looked at the seventeen marks in Miss Whisk's ledger, at the two clean squares in the dust, at the crooked trail of labels that led uphill.</p>", "<p>\"I think,\" he said, slowly, \"he wants what everyone wants. He wants the things he loves to stay. He wants them to never be lost. He wants them to never leave.\" He sighed, the long, soggy, contented sigh, but this time it was not contented. \"And I think he has built a way to make that happen. And I think, Pip, that a man who has built a way to keep everything he loves is the most dangerous kind of man there is.\"</p>", "<p>\"Dangerous?\" said Pip. \"But he's just sad. Mrs. Crumb said he's just sad.\"</p>", "<p>\"Yes,\" said Barnaby. \"That's what makes him dangerous. Not because he's cruel. Because he's sad, and he's clever, and he has decided that the answer to losing things is to never let them go. And that answer, Pip, is a machine. And machines do not know when to stop.\"</p>", "<p>The humming came up through the floor, patient, keeping, careful. And Pip, who was eleven, who had a label maker, who had just mapped a noise uphill to a house with too many curtains, felt the ground under the fog go a little cold, and he thought: <em>a machine that does not know when to stop.</em></p>", "<p>He thought of Goldie's pocket, of the marble and the paperclip and the rubber band, of <em>things go, that's what things do.</em> He thought of Mrs. Crumb's bowl, left out for a stray she did not own. He thought of the difference between leaving a bowl out and closing all the curtains.</p>", "<p>And he thought: <em>we have to find out what that machine is. Before Finding Day. Before it keeps something it can't give back.</em></p>", "<p>\"Tomorrow,\" he said. \"Tomorrow we find out what it is.\"</p>", "<p>Barnaby nodded, slowly, and his whiskers moved, and the humming went on, patient and keeping, under the hill, under the house, turning itself down when it was listened to, turning itself up when it was not.</p>", "<p>It was, Pip thought, the most patient thing he had ever met. And he had met a walrus who could wait for a cow.</p>"]}, {"id": "ch13", "label": "Chapter 13", "title": "Chapter 13 - The Trail of Nervous Buttons", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\">\n<defs>\n    <g id=\"pip\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <line x1=\"-10\" y1=\"372\" x2=\"-10\" y2=\"384\"/>\n      <line x1=\"10\" y1=\"372\" x2=\"10\" y2=\"384\"/>\n      <rect x=\"-32\   <ellipse cx=\"0\" cy=\"516\" rx=\"44\" ry=\"30\" fill=\"#FFF8EC\"/>\n      <line x1=\"-44\" y1=\"530\" x2=\"-44\" y2=\"552\"/>\n      <line x1=\"-16\" y1=\"536\" x2=\"-16\" y2=\"554\"/>\n      <line x1=\"16\" y1=\"536\" x2=\"16\" y2=\"554\"/>\n      <line x1=\"44\" y1=\"530\" x2=\"44\" y2=\"552\"/>\n      <ellipse cx=\"-44\" cy=\"554\" rx=\"12\" ry=\"6\" fill=\"#E9C46A\"/>\n      <ellipse cx=\"44\" cy=\"554\" rx=\"12\" ry=\"6\" fill=\"#E9C46A\"/>\n      <path d=\"M -66 486 Q -88 470 -80 446\" fill=\"none\"/>\n      <circle cx=\"52\" cy=\"452\" r=\"40\" fill=\"#E9C46A\"/>\n      <ellipse cx=\"70\" cy=\"466\" rx=\"22\" ry=\"16\" fill=\"#FFF8EC\"/>\n      <ellipse cx=\"84\" cy=\"462\" rx=\"8\" ry=\"6\" fill=\"#2B2B2B\"/>\n      <circle cx=\"56\" cy=\"444\" r=\"4\" fill=\"#2B2B2B\"/>\n      <path d=\"M 30 424 Q 20 404 36 400 Q 48 402 44 424 Z\" fill=\"#8B5E3C\"/>\n      <path d=\"M 66 478 Q 74 486 84 478\" fill=\"none\"/>\n      <path d=\"M 40 486 Q 52 494 64 486\" fill=\"none\"/>\n    </g>\n    <g id=\"captain-chomp\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <path d=\"M -40 500 Q -70 490 -74 460 Q -70 440 -52 446\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"0\" cy=\"490\" rx=\"52\" ry=\"60\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"6\" cy=\"506\" rx=\"30\" ry=\"36\" fill=\"#E9C46A\"/>\n      <line x1=\"-6\" y1=\"486\" x2=\"18\" y2=\"486\"/>\n      <line x1=\"-6\" y1=\"502\" x2=\"18\" y2=\"502\"/>\n      <line x1=\"-6\" y1=\"518\" x2=\"18\" y2=\"518\"/>\n      <ellipse cx=\"-22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <line x1=\"-30\" y1=\"450\" x2=\"-48\" y2=\"470\"/>\n      <line x1=\"30\" y1=\"450\" x2=\"50\" y2=\"468\"/>\n      <circle cx=\"6\" cy=\"400\" r=\"42\" fill=\"#2A9D8F\"/>\n      <path d=\"M 30 380 L 56 388 L 32 398 Z\" fill=\"#2A9D8F\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"3\" fill=\"#2B2B2B\"/>\n      <circle cx=\"-12\" cy=\"392\" r=\"8\" fill=\"#E9C46A\"/>\n      <line x1=\"-16\" y1=\"388\" x2=\"-8\" y2=\"396\"/>\n      <line x1=\"-8\" y1=\"388\" x2=\"-16\" y2=\"396\"/>\n      <path d=\"M 20 416 Q 30 424 42 416\" fill=\"none\"/>\n      <path d=\"M -20 362 L -14 348 L -6 362 L 2 348 L 10 362\" fill=\"none\"/>\n    </g>\n  </defs>\n  <rect x=\"0\" y=\"0\" width=\"800\" height=\"600\" fill=\"#FFF8EC\"/>\n  <path d=\"M 0 560 Q 300 520 500 400 Q 650 310 780 280 L 800 280 L 800 560 Z\" fill=\"#C9A66B\"/>\n  <circle cx=\"120\" cy=\"530\" r=\"12\" fill=\"#8B5E3C\"/>\n  <circle cx=\"220\" cy=\"505\" r=\"12\" fill=\"#2A9D8F\"/>\n  <circle cx=\"320\" cy=\"470\" r=\"12\" fill=\"#E9C46A\"/>\n  <circle cx=\"420\" cy=\"425\" r=\"12\" fill=\"#E4572E\"/>\n  <circle cx=\"520\" cy=\"375\" r=\"12\" fill=\"#9AA5B1\"/>\n  <circle cx=\"620\" cy=\"330\" r=\"12\" fill=\"#E9C46A\"/>\n  <circle cx=\"120\" cy=\"530\" r=\"3\" fill=\"#2B2B2B\"/>\n  <circle cx=\"320\" cy=\"470\" r=\"3\" fill=\"#2B2B2B\"/>\n  <circle cx=\"520\" cy=\"375\" r=\"3\" fill=\"#2B2B2B\"/>\n  <use href=\"#thimble\" transform=\"translate(200,280) scale(0.5)\"/>\n  <use href=\"#pip\" transform=\"translate(360,224) scale(0.6)\"/>\n  <use href=\"#goldie\" transform=\"translate(480,252) scale(0.55)\"/>\n  <text x=\"400\" y=\"60\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"22\" fill=\"#8B5E3C\">nervous buttons</text>\n  <text x=\"400\" y=\"592\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"15\" fill=\"#2B2B2B\">somebody undid my promise</text></svg>\n", "head": "Chapter 13 - The Trail of Nervous Buttons", "paras": ["<p>Ollie, who was the Official Counter, found the first button, because Official Counters look at the floor, and the floor is where the clues are.</p>", "<p>He was counting the missing things - he was up to seventeen, and he had counted to seventeen four times to be sure, and he had labeled his pencil OFFICIAL, DO NOT LOSE - when he saw it, by the leg of Miss Whisk's desk. A button. A small brown button, four-holed, lying on the floor like it had fallen off something and was too embarrassed to mention it.</p>", "<p>\"Button,\" said Ollie, and he picked it up, and he held it up, and he said, \"This is not a missing thing. This is a found thing. Do I count found things? The rule says missing things. I need a ruling.\"</p>", "<p>Miss Whisk, who was deep in the ledger, said, without looking, \"Count everything. The rule is whatever I say it is. Bring it here.\"</p>", "<p>Ollie brought it. Miss Whisk took the button, and she looked at it, and her spectacles caught the lamplight, and she went very still.</p>", "<p>\"This is a coat button,\" she said. \"A nervous one.\"</p>", "<p>\"A nervous button?\" said Pip.</p>", "<p>\"Buttons come in two kinds,\" said Miss Whisk, and she set the button on the desk with the care of someone setting down evidence. \"There are the buttons that stay. And there are the buttons that pop. A button that pops is a button that was on a thing that was pulled. A thing that is pulled - pulled hard, pulled sudden - its buttons pop. They fly. They land. They roll.\" She looked at the button. \"This button was on a coat. The coat was pulled. The button popped. And the coat went... elsewhere. And the button stayed.\"</p>", "<p>\"Seventeen things,\" said Pip. \"Seventeen things went elsewhere. And they left their buttons.\"</p>", "<p>\"Not all of them,\" said Miss Whisk. \"But some. The ones with coats. The ones with buttons.\" She was already moving, already scanning the floor, her precise eyes missing nothing. \"If a thing was pulled, and its buttons popped, then the buttons would fall along the way. Along the path. The path the thing was taken.\" She looked up. \"There would be a trail.\"</p>", "<p>There was a trail.</p>", "<p>They found it together, the four of them - Pip and Ollie and Goldie and Miss Whisk, and Barnaby waddling behind, and Thimble summoned from the sock wing, grumbling about the rain ones. They found the buttons one by one, then in twos and threes, a crooked line of them leading from the back of the Bureau, from the great door that none of them had ever seen open, out into the alley, down the lane, uphill.</p>", "<p>A blue button. A brass button. A little pearl button. A red one shaped like a star. Each one a piece of a coat that had been pulled. Each one a clue that said <em>this way, the thing went this way.</em></p>", "<p>Thimble picked up the red star button and held it to the light, and his quills clicked, and he made a small sound.</p>", "<p>\"I know this button,\" he said.</p>", "<p>\"You do?\" said Pip.</p>", "<p>\"I gave this button,\" said Thimble. \"I gave it to a coat. A small coat. A child's coat, came in lost, missing a button, and I gave it this one, from my quills, and I sewed it on, and I said the promise. <em>I expect you to come loose, and I expect to fix you, and I am not going anywhere.</em>\" He held the red star button in his palm, and his small black eyes were bright. \"And now the button is here. On the floor. Popped. Which means the coat was pulled. Which means the coat went elsewhere. Which means-\" and his voice did a thing, a small, prickly, furious thing, \"-which means somebody undid my promise.\"</p>", "<p>The silence that followed had a temperature. Thimble, who was small and round and the color of toast, who sorted socks by smell and gave spare buttons to lost coats, stood there holding the red star button, and he was, Pip realized, angrier than anyone in the Bureau, because the thing that had been taken was not just a coat. It was a promise. It was a <em>I am not going anywhere.</em> And somebody had gone somewhere with it.</p>", "<p>\"We follow the trail,\" said Thimble. \"Now. We follow it to the end. And we find whoever undid my promise. And we have a word.\"</p>", "<p>\"Thimble,\" said Barnaby, gently, \"we will follow the trail. But we will be careful. We will be kind. We do not know yet what we are walking toward.\"</p>", "<p>\"I know what I'm walking toward,\" said Thimble. \"I'm walking toward my button. The rest of you can walk toward whatever you like.\" And he set off down the trail, his quills clicking, the red star button clutched in his paw, and the rest of them followed, because you did not argue with Thimble, and because, Pip thought, sometimes the smallest person in the room is the one who has decided.</p>", "<p>They followed the buttons uphill. Goldie took the crooked way, but the buttons took the straight way, and for once Goldie followed the buttons instead of the shortcuts, because the buttons were a map that did not need a shortcut. The trail went past the fence post Pip had labeled HUM: LOUDER HERE. It went past the drain HUM: UNDER. It went past the paving stone HUM: CLOSE. And Pip, following, felt the two maps click together, the map of the noise and the map of the buttons, both of them pointing the same way, both of them saying <em>uphill, uphill, to the house with too many curtains.</em></p>", "<p>The trail ended at the gate of the Snell place.</p>", "<p>The last button - a big brass one, the kind that holds a heavy coat together - lay at the foot of the gate, and beyond the gate the path went up to the house, and every window was curtained, and every curtain was drawn, and the house was holding its breath.</p>", "<p>And from under the house, under the hill, came the humming. Patient. Keeping. Careful. It had turned itself down, the way it did when it was listened to, but it was there, and it was loud enough now that Pip could feel it in his teeth, and he understood, with a certainty that went from his stomach to his shoes, that the humming was the machine, and the machine was the thing that had pulled the coats, and the coats had gone into the house, and the buttons had popped and fallen and rolled downhill, all the way to the Bureau, all the way to Miss Whisk's desk, all the way to Ollie's Official Counter eyes.</p>", "<p>\"Seventeen things,\" said Pip. \"They're in there. They're all in there.\"</p>", "<p>\"Seventeen things,\" said Miss Whisk, \"and one red star button, and one promise.\" She looked at the gate. \"And one man who thinks he's saving them.\"</p>", "<p>Pip looked at her. \"Saving them?\"</p>", "<p>Miss Whisk was quiet for a moment. Then she said, \"A man who takes a thing and keeps it safe and never lets it go - he doesn't call that stealing. He calls that saving. He calls that love.\" Her paw went to her empty collar. \"I know the difference. I keep the file on the difference. It's in the back. It's administrative.\" She looked at the curtained house. \"But I'll tell you this, Friend of the Lost. The difference between saving a thing and keeping a thing is whether the thing gets to go home. And nothing in that house is going home. I can smell it. And I don't even sort the socks.\"</p>", "<p>Thimble, who did sort the socks, said, quietly, \"She's right. The buttons smell like kept. Not like lost. Lost smells like waiting. Kept smells like... never.\" He shivered, and his quills clicked. \"I don't like never. Never is not a smell a thing should have.\"</p>", "<p>They stood at the gate, the five of them and Ollie, and they looked up at the house with too many curtains, and the humming went on, patient and keeping, and Pip felt the ground under the fog go cold and solid at the same time, because now he knew where, and now he knew what, and the only thing left was the who and the why, and the who was a sad man named Silas Snell, and the why was a dog that ran off eight years ago.</p>", "<p>\"Tomorrow,\" said Pip. \"Tomorrow we knock.\"</p>", "<p>\"Tomorrow,\" Barnaby agreed. \"But tonight, we count. Tonight, we make sure Captain Chomp is safe. And tonight, we remember that the man in that house is not a monster. He is a man who lost something he loved, and could not bear it, and built a machine so he would never have to bear it again.\" He looked at Pip with his small, kind eyes. \"That is not a monster, Pip. That is a heartbreak with a workshop. And heartbreaks are harder to fight than monsters, because you cannot punch a heartbreak. You can only... \" He paused, and he searched for the word, and he found it. \"You can only answer it.\"</p>", "<p>\"Answer it with what?\" said Pip.</p>", "<p>Barnaby was quiet for a long moment. Then he said, \"I don't know yet. But I think you will. I think you are the one who will.\" He turned, and his flippers made the sound of two wet hands applauding, and he waddled back down the hill, and the rest of them followed.</p>", "<p>And behind them, in the house with too many curtains, the humming turned itself up, just a little, the way a machine does when it thinks no one is listening anymore.</p>", "<p>It had seventeen things. It had one red star button's worth of promise. And it was getting ready for Finding Day.</p>", "<p>But that was tomorrow's problem. Tonight there was a trail of nervous buttons, and a small hedgehog holding a red star, and a boy who had decided to knock.</p>", "<p>Tonight, that was enough.</p>"]}, {"id": "ch14", "label": "Chapter 14", "title": "Chapter 14 - The Case Board (Now with Labels)", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\">\n<defs>\n    <g id=\"pip\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <line x1=\"-10\" y1=\"372\" x2=\"-10\" y2=\"384\"/>\n      <line x1=\"10\" y1=\"372\" x2=\"10\" y2=\"384\"/>\n      <rect x=\"-32\" y=\"382\" width=\"64\" height=\"88\" fill=\"#E4572E\"/>\n      <line x1=\"-32\" y1=\"398\" x2=\"-52\" y2=\"446\"/>\n      <line x1=\"32\" y1=\"398\" x2=\"56\" y2=\"438\"/>\n      <circle cx=\"-52\" cy=\"450\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"46\" y=\"428\" width=\"34\" height=\"22\" fill=\"#E9C46A\"/>\n      <line x1=\"52\" y1=\"439\" x2=\"74\" y2=\"439\"/>\n      <rect x=\"80\" y=\"435\" width=\"12\" height=\"8\" fill=\"#FFF8EC\"/>\n #FFF8EC\"/>\n  <rect x=\"120\" y=\"240\" width=\"560\" height=\"280\" fill=\"#8B5E3C\"/>\n  <rect x=\"150\" y=\"270\" width=\"130\" height=\"40\" fill=\"#FFF8EC\"/>\n  <text x=\"215\" y=\"296\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#2B2B2B\">THE HUM</text>\n  <rect x=\"330\" y=\"270\" width=\"130\" height=\"40\" fill=\"#FFF8EC\"/>\n  <text x=\"395\" y=\"296\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#2B2B2B\">THE BUTTONS</text>\n  <rect x=\"510\" y=\"270\" width=\"140\" height=\"40\" fill=\"#FFF8EC\"/>\n  <text x=\"580\" y=\"296\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" fill=\"#2B2B2B\">SEVENTEEN THINGS</text>\n  <rect x=\"330\" y=\"380\" width=\"140\" height=\"60\" fill=\"#E9C46A\"/>\n  <text x=\"400\" y=\"418\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"26\" fill=\"#2B2B2B\">WHY?</text>\n  <line x1=\"215\" y1=\"310\" x2=\"360\" y2=\"380\"/>\n  <line x1=\"395\" y1=\"310\" x2=\"400\" y2=\"380\"/>\n  <line x1=\"580\" y1=\"310\" x2=\"440\" y2=\"380\"/>\n  <circle cx=\"400\" cy=\"470\" r=\"20\" fill=\"#E9C46A\"/>\n  <circle cx=\"400\" cy=\"470\" r=\"6\" fill=\"#8B5E3C\"/>\n  <use href=\"#pip\" transform=\"translate(80,224) scale(0.6)\"/>\n  <use href=\"#goldie\" transform=\"translate(720,252) scale(0.55)\"/>\n  <text x=\"400\" y=\"60\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"22\" fill=\"#8B5E3C\">the case board</text>\n  <text x=\"400\" y=\"592\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"15\" fill=\"#2B2B2B\">the Keeper</text></svg>\n", "head": "Chapter 14 - The Case Board (Now with Labels)", "paras": ["<p>Pip built the case board on the back of a lost door.</p>", "<p>The door was lying flat in the Bureau, labeled DOOR. FORMERLY A DOOR. NOW A TABLE., and it was the perfect size for a case board, which Pip knew because he had seen case boards in books, and case boards were where detectives put the things they knew so the things they knew could look at each other and become the thing they didn't know yet.</p>", "<p>He used his label maker. He used it the way a painter uses a brush, the way Miss Whisk uses her stamps, with a kind of furious grace. He printed the things they knew, and he stuck them to the door, and he connected them with pieces of string that Goldie found in her pocket, because Goldie's pocket had string in it, of course it did.</p>", "<p>THE HUM,\" said one label. \"COMES FROM THE SNELL PLACE. KNOWS WHEN WE LISTEN. TURNS ITSELF DOWN.\"</p>", "<p>THE BUTTONS,\" said another. \"NERVOUS ONES. POPPED OFF COATS THAT WERE PULLED. TRAIL LEADS UPHILL.\"</p>", "<p>SEVENTEEN THINGS,\" said a third. \"CLAIMED. READY. GOING HOME ON FINDING DAY. NOW ELSEWHERE.\"</p>", "<p>And in the middle, in big letters, the thing they didn't know yet:</p>", "<p class=\"chip\">WHY?</p>", "<p>\"WHY is the important one,\" said Pip, stepping back. \"WHO is Silas Snell. WHERE is the house. WHAT is a machine. But WHY is the one we need. Because if we know WHY, we know how to answer it. Barnaby said you can't punch a heartbreak. You can only answer it. So we need to know what the heartbreak is asking.\"</p>", "<p>Goldie looked at the case board. \"That's a lot of string for one why.\"</p>", "<p>\"Why is a big question.\"</p>", "<p>\"It's the biggest,\" Goldie agreed. \"Okay. What do we know about the why?\"</p>", "<p>They sat around the lost door, the five of them and Ollie, and they pooled what they knew, and Miss Whisk wrote it down in the ledger because the record was the truth, and Barnaby leaked on it, and nobody minded.</p>", "<p>What they knew was this: Silas Snell was an inventor. He made things to keep. Eight years ago his dog Biscuit ran away. He looked for a while. He put up posters. The posters got rained on. He took them down. He stopped coming in to the bakery. He closed all the curtains. And somewhere in those eight years, he built a machine that hummed, and the machine took lost things, and it kept them, and it did not let them go home.</p>", "<p>\"So the why is the dog,\" said Ollie, who had been listening with his whole face. \"He's sad about the dog. So he's keeping everything. So nothing else runs away.\"</p>", "<p>The silence that followed was the kind where everyone looks at the six-year-old, because the six-year-old has just said the whole thing, simply, the way six-year-olds do, without the string and the labels and the case board.</p>", "<p>\"Yes,\" said Barnaby, softly. \"Yes, Ollie. That's the why. He lost the dog, and he could not bear it, and he decided that the answer was to make a world where nothing is ever lost. Where everything stays. Where nothing runs away.\" He sighed. \"It is a very old answer. It is the answer everyone wants, for about a minute. And then they learn that it is not an answer. It is a cage. But he has not learned that yet. He has been building the cage for eight years, and he thinks it is a home.\"</p>", "<p>\"A cage,\" said Goldie, and her hand went to her pocket, to the marble and the paperclip and the rubber band, and she patted them, the way you pat a thing you are afraid of losing. \"He's caging them.\"</p>", "<p>\"He thinks he's saving them,\" said Miss Whisk. \"That's the trouble. He thinks the cage is a home. And the things in it - they're not waiting anymore. They're kept. And kept is not waiting. Kept is... \" She searched for the word. \"Kept is waiting that has been told to stop.\"</p>", "<p>Pip looked at the case board, at the WHY in the middle, and he felt the shape of the problem settle into him, the way a label settles onto a thing. The problem was not a monster. The problem was a man who loved so much he could not let go, and a machine that loved the same way, and seventeen things - and Captain Chomp - caught in the loving.</p>", "<p>\"So we have to teach him,\" said Pip. \"That it's okay to let go. That things come back. That... \" He thought of Goldie's pocket. \"That the sad is the good kind, if you let it be.\"</p>", "<p>\"Yes,\" said Barnaby. \"But you cannot teach a man who has built a machine to avoid the lesson. The machine is the lesson he refused to learn. And the machine is getting stronger. And Finding Day is in four days.\" He looked at the case board. \"So we need to understand the machine. Not just the why. The what. The how. Because if we are going to answer the heartbreak, we need to know what the heartbreak has built.\"</p>", "<p>It was then that Ollie, who was the Official Counter, and who therefore looked at the floor, said, \"There's a thing under the door.\"</p>", "<p>They looked. Under the lost door, where it lay flat on the floor, there was a small brass object, half in the dust. Pip reached under and pulled it out.</p>", "<p>It was a gear. A small brass gear, the size of a coin, with teeth around its edge and a hole in the middle. And on its face, engraved in tiny, careful letters, was a word:</p>", "<p class=\"chip\">KEEPER.</p>", "<p>\"The Keeper,\" said Pip. He held the gear up, and the lamplight caught it, and it turned, slowly, in his fingers, though there was no reason for it to turn. \"That's what the machine is called. The Keeper.\"</p>", "<p>\"How do you know it's the machine's name and not just a word?\" Goldie asked.</p>", "<p>\"Because it's engraved on a gear that fell off a machine that keeps things,\" said Pip. \"And because...\" He turned the gear over. On the back, in the same tiny letters, was a second line: <em>SO NOTHING I LOVE IS EVER LOST AGAIN.</em></p>", "<p>The silence that followed had a temperature, and the temperature was sad.</p>", "<p>\"He wrote it on the gear,\" said Miss Whisk, quietly. \"He wrote the why on the gear. So the machine would remember. So even the machine would know what it was for.\" Her paw went to her empty collar. \"That's not a monster's machine. That's a... \" She stopped. She did not finish. But Pip heard the finish anyway. <em>That's a love letter. He built a love letter to a dog, and the love letter is eating the town.</em></p>", "<p>Barnaby took the gear gently in his flipper, and he looked at it for a long time, and his whiskers moved.</p>", "<p>\"The Keeper,\" he said. \"So nothing I love is ever lost again.\" He set the gear on the case board, right under the WHY, and he connected it with a piece of Goldie's string. \"Now we know its name. And its why. And its how, a little. A machine that keeps. A machine that pulls. A machine that does not know when to stop.\" He looked at Pip. \"You have built a good case board, Friend of the Lost. But a case board is not an answer. It is a question, arranged neatly. And we are running out of days to answer it.\"</p>", "<p>Pip looked at the case board, at the labels and the string and the gear and the WHY, and he felt the ground under the fog, solid and cold. He had a name. He had a why. He had a gear. He had four days.</p>", "<p>\"Tomorrow,\" he said. \"Tomorrow we find out what the Keeper does. Exactly. We watch it. We see it take something. And then we'll know the how.\"</p>", "<p>\"Tomorrow,\" Barnaby agreed. \"But tonight, we move Captain Chomp. Tonight, we put him somewhere the Keeper cannot reach. Because the Keeper takes the things that are loved, and Captain Chomp is loved, and I will not have him kept.\"</p>", "<p>And Pip, who was eleven, who had a label maker, who had just built a case board on a lost door, felt the thing he had been feeling all week settle into a decision, hard and clear, like a label pressed onto a thing that was not going anywhere.</p>", "<p>He was going to answer the heartbreak. He was going to teach the machine to stop. He was going to get seventeen things home for Finding Day, and one dinosaur, and one red star button's worth of promise.</p>", "<p>He did not know how. He was eleven. But he had a case board, and a gear, and a why, and four days, and a brother who was very good at counting.</p>", "<p>It was, he thought, enough to start with. It would have to be. Because under the hill, the Keeper hummed, patient and keeping, and it had just noticed that one of its gears was missing.</p>", "<p>And a machine that keeps things does not like to lose its own.</p>"]}, {"id": "ch15", "label": "Chapter 15", "title": "Chapter 15 - The Things That Were Loved Best", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\">\n<defs>\n    <g id=\"pip\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <line x1=\"-10\" y1=\"372\" x2=\"-10\" y2=\"384\"/>\n      <line x1=\"10\" y1=\"372\" x2=\"10\" y2=\"384\"/>\n      <rect x=\"-32\" y=\"382\" width=\"64\" height=\"88\" fill=\"#E4572E\"/>\n      <line x1=\"-32\" y1=\"398\" x2=\"-52\" y2=\"446\"/>\n      <line x1=\"32\" y1=\"398\" x2=\"56\" y2=\"438\"/>\n      <circle cx=\"-52\" cy=\"450\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"46\" y=\"428\" width=\"34\" height=\"22\" fill=\"#E9C46A\"/>\n      <line x1=\"52\" y1=\"439\" x2=\"74\" y2=\"439\"/>\n      <rect x=\"80\" y=\"435\" width=\"12\" height=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"56\" cy=\"442\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"-32\" y=\"466\" width=\"64\" height=\"20\" fill=\"#2B2B2B\"/>\n      <line x1=\"-14\" y1=\"486\" x2=\"-14\" y2=\"550\"/>\n      <line x1=\"14\" y1=\"486\" x2=\"14\" y2=\"550\"/>\n      <ellipse cx=\"-16\" cy=\"552\" rx=\"16\" ry=\"8\" fill=\"#2B2B2B\"/>\n      <ellipse cx=\"18\" cy=\"552\" rx=\"16\" ry=\"8\" fill=\"#2B2B2B\"/>\n      <circle cx=\"0\" cy=\"338\" r=\"40\" fill=\"#FFF8EC\"/>\n      <path d=\"M -40 334 Q -40 296 0 296 Q 40 296 40 334 Q 26 314 0 316 Q -26 314 -40 334 Z\" fill=\"#2B2B2B\"/>\n      <circle cx=\"8\" cy=\"336\" r=\"4\" fill=\"#2B2B2B\"/>\n      <circle cx=\"26\" cy=\"336\" r=\"4\" fill=\"#2B2B2B\"/>\n      <path d=\"M 12 356 Q 22 364 32 356\" fill=\"none\"/>\n    </g>\n    <g id=\"goldie\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <line x1=\"-12\" y  x1=\"-6\" y1=\"486\" x2=\"18\" y2=\"486\"/>\n      <line x1=\"-6\" y1=\"502\" x2=\"18\" y2=\"502\"/>\n      <line x1=\"-6\" y1=\"518\" x2=\"18\" y2=\"518\"/>\n      <ellipse cx=\"-22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <line x1=\"-30\" y1=\"450\" x2=\"-48\" y2=\"470\"/>\n      <line x1=\"30\" y1=\"450\" x2=\"50\" y2=\"468\"/>\n      <circle cx=\"6\" cy=\"400\" r=\"42\" fill=\"#2A9D8F\"/>\n      <path d=\"M 30 380 L 56 388 L 32 398 Z\" fill=\"#2A9D8F\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"3\" fill=\"#2B2B2B\"/>\n      <circle cx=\"-12\" cy=\"392\" r=\"8\" fill=\"#E9C46A\"/>\n      <line x1=\"-16\" y1=\"388\" x2=\"-8\" y2=\"396\"/>\n      <line x1=\"-8\" y1=\"388\" x2=\"-16\" y2=\"396\"/>\n      <path d=\"M 20 416 Q 30 424 42 416\" fill=\"none\"/>\n      <path d=\"M -20 362 L -14 348 L -6 362 L 2 348 L 10 362\" fill=\"none\"/>\n    </g>\n  </defs>\n  <rect x=\"0\" y=\"0\" width=\"800\" height=\"600\" fill=\"#FFF8EC\"/>\n  <rect x=\"40\" y=\"240\" width=\"300\" height=\"16\" fill=\"#8B5E3C\"/>\n  <rect x=\"70\" y=\"190\" width=\"60\" height=\"50\" fill=\"#FFF8EC\" stroke-dasharray=\"6 6\"/>\n  <rect x=\"160\" y=\"190\" width=\"60\" height=\"50\" fill=\"#FFF8EC\" stroke-dasharray=\"6 6\"/>\n  <rect x=\"250\" y=\"190\" width=\"60\" height=\"50\" fill=\"#FFF8EC\" stroke-dasharray=\"6 6\"/>\n  <rect x=\"480\" y=\"420\" width=\"240\" height=\"140\" fill=\"#8B5E3C\"/>\n  <use href=\"#barnaby\" transform=\"translate(600,140) scale(0.75)\"/>\n  <use href=\"#captain-chomp\" transform=\"translate(560,308) scale(0.45)\"/>\n  <use href=\"#pip\" transform=\"translate(180,224) scale(0.6)\"/>\n  <use href=\"#ollie\" transform=\"translate(320,280) scale(0.5)\"/>\n  <text x=\"400\" y=\"60\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"22\" fill=\"#8B5E3C\">loved best</text>\n  <text x=\"600\" y=\"592\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"15\" fill=\"#2B2B2B\">the warmest thing</text></svg>\n", "head": "Chapter 15 - The Things That Were Loved Best", "paras": ["<p>On the fifth day, the number changed, and Ollie, who was the Official Counter, was the one who noticed, because Official Counters notice when the number changes.</p>", "<p>\"Eighteen,\" he said. He was standing in front of the shelf with his pencil and his page, and his face was doing the thing it did when a number was wrong, which was the same thing it did when a dinosaur was lost. \"It was seventeen. I counted it four times. It was seventeen. And now it's eighteen. And I didn't even count a new one. It just... became eighteen.\"</p>", "<p>Pip came to the shelf. There was a new clean square in the dust. A new tag. <em>One harmonica. Plays a song that sounds like a train. Belonged to a man who played it to his plants. Claimed. Ready. Going home on Finding Day.</em> And no harmonica.</p>", "<p>\"It took another one,\" said Pip.</p>", "<p>\"It took another one,\" Miss Whisk agreed. She was already marking the ledger, already making the small precise mark in the margin, and her paw was steady but her ears were flat. \"In the night. While we were all here. While the door was shut. While the rule was the rule.\" She looked at the great door at the back of the Bureau, the one that none of them had ever seen open. \"The door is the only way in or out. The door was shut. And yet.\"</p>", "<p>\"And yet,\" Barnaby agreed, heavily. He had moved Captain Chomp in the night, to a shelf right behind his own desk, where he could see him, where his flipper could rest on the dinosaur while he worked. Captain Chomp sat there now, being dusted, being waited with, his loose button catching the light. He was safe. He was as safe as a thing could be in a room where safe was not a thing you could promise.</p>", "<p>Pip looked at the eighteen clean squares, and he looked at the shelves around them, and he felt the label-maker feeling, the <em>there is a pattern here and I will find it</em> feeling. He walked the aisle. He looked at the things that were gone, and he looked at the things that were still there, and he compared them, the way you compare two lists to find the thing that is on one and not the other.</p>", "<p>And then he saw it.</p>", "<p>\"Miss Whisk,\" he said. \"The things that are gone. They're all... claimed.\"</p>", "<p>Miss Whisk looked up. \"What?\"</p>", "<p>\"The things that are gone. The music box. The telescope. The harmonica. All the eighteen. They're all claimed. They're all ready. They're all going home on Finding Day.\" He pointed down the aisle. \"But the things that are still here - the ones that aren't claimed, the ones that are just... waiting, the ones nobody's come for - they're all still here. Every one. The Keeper didn't take a single unclaimed thing.\"</p>", "<p>The silence that followed was the kind where a pattern clicks into place, and the click is loud.</p>", "<p>Miss Whisk turned the ledger. She checked. She checked the eighteen, and she checked the unclaimed, and she checked four times, because she was Miss Whisk and the truth was not wrong. And then she set the ledger down, and she said, in a voice that was very flat and very precise, \"He's right. The Keeper takes the claimed. The ready. The ones that are loved back. The ones that remember the way home.\" She looked at Pip over her spectacles. \"It does not take the unloved. It does not take the forgotten. It takes the things that are loved best.\"</p>", "<p>\"Why?\" said Goldie. \"Why only the loved ones?\"</p>", "<p>Barnaby was quiet for a long moment. His whiskers moved. His flipper rested on Captain Chomp, and the dinosaur's loose button caught the light.</p>", "<p>\"Because,\" he said, slowly, \"the Keeper is a machine that keeps. And a machine that keeps does not want the things nobody wants. It wants the things that are wanted. It wants the love. It wants the... \" He searched for the word. \"The warmth. A thing that is loved is warm. A thing that is claimed is warm. And the Keeper is cold, and it is trying to be warm, and it is taking the warm things and putting them inside itself, and it thinks that will make it warm.\" He looked at the eighteen clean squares. \"It is not stealing things. It is stealing the loving. It is taking the things that are loved best, because it wants to be loved best, and it does not know that you cannot get loved by keeping. You can only get loved by letting go.\"</p>", "<p>The silence that followed had a temperature, and the temperature was the temperature of a machine that was cold and trying to be warm, and of a man who was lonely and trying to be not-lonely, and of eighteen things that were warm and were now kept.</p>", "<p>Pip felt the ground under the fog go cold, because he understood, now, the thing that made the Keeper dangerous, and it was not that it was cruel. It was that it was hungry. It was hungry for the exact thing that Captain Chomp was full of. Captain Chomp, who was loved back, who was claimed, who was remembering the way home, who was warm. Captain Chomp was the warmest thing in the Bureau. And the Keeper took the warm things.</p>", "<p>\"Barnaby,\" said Pip. \"Captain Chomp. He's... he's the warmest. He's claimed. He's ready. He's almost remembering. He's exactly what the Keeper takes.\"</p>", "<p>Barnaby's flipper tightened on the dinosaur, gently, the way you hold a thing you are afraid of losing. \"I know,\" he said. \"That is why he is behind my desk. That is why I do not leave him. That is why I am the Chief, and why I have been the Chief for a very long time, and why I will be the Chief until this is answered.\" He looked at Pip with his small, kind eyes. \"The Keeper will come for him. It will come for the warmest thing. And when it does, I will be here. And I will say no. And we will see whether a machine that keeps things can keep a thing that a walrus is holding.\"</p>", "<p>It was a brave thing to say, and it was a sad thing to say, and Pip loved Barnaby for saying it, and he was also, for the first time, a little afraid for Barnaby, because a walrus is very large and very kind, but a machine that does not know when to stop is a machine that does not know when to stop, and kindness is not a thing you can hold against a gear.</p>", "<p>\"We have to answer it first,\" said Pip. \"Before it comes for Chomp. Before Finding Day. We have to teach it to stop.\"</p>", "<p>\"Yes,\" said Barnaby. \"But we do not yet know how. And the machine is getting stronger. It took a thing in the night, while the door was shut. It is reaching further. It is... \" He paused, and he looked at the case board, at the gear under the WHY. \"It is missing a gear. And a machine that is missing a gear reaches harder. It compensates. It pulls. It is pulling harder than it was.\"</p>", "<p>Pip felt the thing he had been afraid of settle into him. The gear. The gear they had taken. The Keeper had noticed its gear was missing, and it was reaching harder, and it was taking more, and it was going to take the warmest thing, and the warmest thing was a small green dinosaur who roared in his sleep.</p>", "<p>\"Three days,\" said Pip. \"Finding Day is in three days. We have three days to answer a heartbreak and teach a machine to stop.\"</p>", "<p>\"Three days,\" Barnaby agreed. \"And a case board. And a gear. And a why. And a six-year-old who is very good at counting.\"</p>", "<p>Ollie, who was the Official Counter, looked up from his page. \"Eighteen,\" he said. \"I'm going to keep counting. And when it goes back down - when the things come home - I'm going to count them down. And I'm going to count all the way to zero. And zero is the best number. Zero means nothing's missing.\" He looked at Pip with his whole face. \"I'm going to count to zero, Pip. I promise. That's my job. I'm the Official Counter. I count to zero.\"</p>", "<p>And Pip, who was eleven, who had a label maker, who had a brother who was very good at counting, felt the ground under the fog go solid, because a room where a six-year-old promises to count to zero is a room that has decided what winning looks like.</p>", "<p>Zero. Nothing missing. Everything home.</p>", "<p>\"Okay,\" said Pip. \"Okay, Ollie. You count to zero. And I'll find the how.\" He looked at the case board, at the WHY, at the gear, at the string. \"Tomorrow we watch the Keeper. Tomorrow we see it take something. And tomorrow we find the crack in it. Because every machine has a crack. Every cage has a door. And every heartbreak...\" He thought of Goldie's pocket, of the marble and the paperclip and the rubber band, of <em>the sad is the good kind, if you let it be.</em> \"Every heartbreak has an answer. We just have to find it.\"</p>", "<p>Under the hill, the Keeper hummed, patient and keeping, reaching harder, pulling warmer, and it had eighteen things, and it wanted the nineteenth, and the nineteenth was a small green dinosaur behind a walrus's desk.</p>", "<p>But that was tomorrow's problem. Tonight there was a number that was going to go back down, and an Official Counter who was going to count it, and a boy who had decided to find the crack.</p>", "<p>Tonight, that was enough.</p>"]}, {"id": "ch16", "label": "Chapter 16", "title": "Chapter 16 - The File in the Back (Administrative)", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\">\n<defs>\n    <g id=\"pip\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <line x1=\"-10\" y1=\"372\" x2=\"-10\" y2=\"384\"/>\n      <line x1=\"10\" y1=\"372\" x2=\"10\" y2=\"384\"/>\n      <rect x=\"-32\" y=\"382\" width=\"64\" height=\"88\" fill=\"#E4572E\"/>\n      <line x1=\"-32\" y1=\"398\" x2=\"-52\" y2=\"446\"/>\n      <line x1=\"32\" y1=\"398\" x2=\"56\" y2=\"438\"/>\n      <circle cx=\"-52\" cy=\"450\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"46\" y=\"428\" width=\"34\" height y2=\"552\"/>\n      <ellipse cx=\"-44\" cy=\"554\" rx=\"12\" ry=\"6\" fill=\"#E9C46A\"/>\n      <ellipse cx=\"44\" cy=\"554\" rx=\"12\" ry=\"6\" fill=\"#E9C46A\"/>\n      <path d=\"M -66 486 Q -88 470 -80 446\" fill=\"none\"/>\n      <circle cx=\"52\" cy=\"452\" r=\"40\" fill=\"#E9C46A\"/>\n      <ellipse cx=\"70\" cy=\"466\" rx=\"22\" ry=\"16\" fill=\"#FFF8EC\"/>\n      <ellipse cx=\"84\" cy=\"462\" rx=\"8\" ry=\"6\" fill=\"#2B2B2B\"/>\n      <circle cx=\"56\" cy=\"444\" r=\"4\" fill=\"#2B2B2B\"/>\n      <path d=\"M 30 424 Q 20 404 36 400 Q 48 402 44 424 Z\" fill=\"#8B5E3C\"/>\n      <path d=\"M 66 478 Q 74 486 84 478\" fill=\"none\"/>\n      <path d=\"M 40 486 Q 52 494 64 486\" fill=\"none\"/>\n    </g>\n    <g id=\"captain-chomp\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <path d=\"M -40 500 Q -70 490 -74 460 Q -70 440 -52 446\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"0\" cy=\"490\" rx=\"52\" ry=\"60\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"6\" cy=\"506\" rx=\"30\" ry=\"36\" fill=\"#E9C46A\"/>\n      <line x1=\"-6\" y1=\"486\" x2=\"18\" y2=\"486\"/>\n      <line x1=\"-6\" y1=\"502\" x2=\"18\" y2=\"502\"/>\n      <line x1=\"-6\" y1=\"518\" x2=\"18\" y2=\"518\"/>\n      <ellipse cx=\"-22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <line x1=\"-30\" y1=\"450\" x2=\"-48\" y2=\"470\"/>\n      <line x1=\"30\" y1=\"450\" x2=\"50\" y2=\"468\"/>\n      <circle cx=\"6\" cy=\"400\" r=\"42\" fill=\"#2A9D8F\"/>\n      <path d=\"M 30 380 L 56 388 L 32 398 Z\" fill=\"#2A9D8F\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"3\" fill=\"#2B2B2B\"/>\n      <circle cx=\"-12\" cy=\"392\" r=\"8\" fill=\"#E9C46A\"/>\n      <line x1=\"-16\" y1=\"388\" x2=\"-8\" y2=\"396\"/>\n      <line x1=\"-8\" y1=\"388\" x2=\"-16\" y2=\"396\"/>\n      <path d=\"M 20 416 Q 30 424 42 416\" fill=\"none\"/>\n      <path d=\"M -20 362 L -14 348 L -6 362 L 2 348 L 10 362\" fill=\"none\"/>\n    </g>\n  </defs>\n  <rect x=\"0\" y=\"0\" width=\"800\" height=\"600\" fill=\"#FFF8EC\"/>\n  <rect x=\"480\" y=\"240\" width=\"240\" height=\"320\" fill=\"#8B5E3C\"/>\n  <rect x=\"500\" y=\"280\" width=\"200\" height=\"60\" fill=\"#FFF8EC\"/>\n  <rect x=\"500\" y=\"360\" width=\"200\" height=\"60\" fill=\"#FFF8EC\"/>\n  <rect x=\"500\" y=\"440\" width=\"200\" height=\"60\" fill=\"#E9C46A\"/>\n  <text x=\"600\" y=\"478\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#2B2B2B\">BELL. ADMINISTRATIVE.</text>\n  <path d=\"M 580 320 q 0 -26 20 -26 q 20 0 20 26 l 6 14 l -52 0 Z\" fill=\"#E9C46A\"/>\n  <circle cx=\"600\" cy=\"340\" r=\"5\" fill=\"#2B2B2B\"/>\n  <use href=\"#miss-whisk\" transform=\"translate(300,168) scale(0.7)\"/>\n  <use href=\"#pip\" transform=\"translate(140,224) scale(0.6)\"/>\n  <text x=\"400\" y=\"60\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"22\" fill=\"#8B5E3C\">the bell file</text>\n  <text x=\"400\" y=\"592\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"15\" fill=\"#2B2B2B\">everyone has a bell</text></svg>\n", "head": "Chapter 16 - The File in the Back (Administrative)", "paras": ["<p>Pip found the file by accident, which is how you find the things that matter, because the things that matter are always in the back, under <em>administrative</em>, where nobody thinks to look.</p>", "<p>He was in the back of the Bureau, looking for a spare dusting cloth, because Captain Chomp needed extra dusting now, being the warmest thing, being the nineteenth the Keeper wanted. The back of the Bureau was where the files were, rows and rows of them, and most of them were labeled in Miss Whisk's precise hand, and one of them was not.</p>", "<p>One of them was labeled in a handwriting that was younger and rounder and less precise, a handwriting that had not yet learned to be furious and graceful, a handwriting that was, Pip realized, Miss Whisk's, from before she was Miss Whisk. And the label said:</p>", "<p class=\"chip\">BELL. ADMINISTRATIVE.</p>", "<p>Pip knew he should not open it. He was eleven. He knew the rule about other people's files. But his hand was already on the drawer, because the drawer had a temperature, the temperature of a thing that has been waiting a long time, and Pip, who was learning to hear the floors under lightness, could not leave it alone.</p>", "<p>He opened it.</p>", "<p>Inside was a single page. And on the page was a drawing, done in pencil, of a bell. A small bell, the kind that goes on a collar. And under the drawing, in the young, round handwriting, was a description:</p>", "<p><em>One bell. From a collar. The collar was red. The person was a girl. She called me Whisper, because I was quiet, and she said the bell was so she could hear me even when I was quiet. The bell fell off in the tall grass. I looked. I looked for a long time. I did not find it. I found the Bureau instead. The Bureau did not have the bell. The Bureau had me. I stayed. The bell is administrative. I do not wait for it. I merely keep the file.</em></p>", "<p>Pip read it three times, and the third time he understood.</p>", "<p>\"I do not wait for it,\" said a voice behind him, \"is a lie. I would like that on the record.\"</p>", "<p>Pip turned. Miss Whisk was standing in the aisle, and her spectacles caught the lamplight, and her paw was on her empty collar, and her face was the face of someone who has been caught holding the thing she pretends not to hold.</p>", "<p>\"I'm sorry,\" said Pip. \"I was looking for a dusting cloth. I shouldn't have-\"</p>", "<p>\"You should have,\" said Miss Whisk. \"That's why I left it where you'd find it.\" She walked up the aisle, and she sat down on a lost step, and she patted the step beside her, and Pip sat, because you did not argue with Miss Whisk, and because, he thought, sometimes the cat who keeps the record of everyone's loving needs someone to read her own.</p>", "<p>\"I was a lost thing,\" she said. \"Did you know that? Nobody tells you. They think the staff were always the staff. But I was a lost thing once. A kitten. Quiet. The girl called me Whisper. She put a bell on me so she could hear me even when I was quiet, because I was very quiet, and she was afraid of losing me in the tall grass.\" Her paw went to her collar. \"And then I was lost. And the bell fell off. And I looked for the bell, and I found the Bureau instead. And Barnaby waited with me. And nobody came. And I stayed. And I became the Head Cataloguer. And I told myself the bell was administrative.\"</p>", "<p>\"Is it?\" said Pip. \"Administrative?\"</p>", "<p>Miss Whisk was quiet for a long moment. Then she said, \"No. It's the opposite of administrative. It's the whole thing. It's the whole reason I keep the record. Because I know what it is to be a thing that is lost, and to have the loving written down, and to wait. And I know what it is to have the waiting go on so long that you start to file it under <em>administrative</em>, because <em>administrative</em> is a word you can hold, and <em>I miss her</em> is not.\" She looked at Pip over her spectacles. \"I keep the file. I tell myself I don't wait. But I wait. I wait a little. I wait the way you keep a bowl out. Not because you think they'll come. Because leaving the bowl out is the only thing left that looks like love.\"</p>", "<p>Pip felt the ground under the fog go warm and sad at the same time, because he understood, now, the thing he had been hearing under Miss Whisk's lightness all week. The floor. The floor was a bell. The floor was a girl who called her Whisper. The floor was a red collar and a tall grass and a waiting that had gone on so long it had learned to call itself administrative.</p>", "<p>\"Everyone has a bell,\" he said.</p>", "<p>Miss Whisk looked at him. \"What?\"</p>", "<p>\"Everyone has a bell,\" said Pip. \"A thing in the back. Under administrative. You have the bell. Mr. Snell has the dog. Mrs. Crumb has the bowl. Thimble has... \" He thought. \"Thimble has the buttons. He keeps spares because he knows things come loose. That's his bell. That's his way of keeping the bowl out.\" He looked at Miss Whisk. \"And I have... \" He thought of his label maker, of STILL HERE, of FOUND, COMES BACK TO. \"I have the labels. I label things so they don't get lost. That's my bell. That's my bowl.\"</p>", "<p>Miss Whisk stared at him for a long moment. And then she did the thing rarer than a blue moon: she smiled, actually smiled, not the almost-smile but the real one. For a second she was not the Head Cataloguer. She was Whisper, a quiet kitten loved by a girl in the tall grass.</p>", "<p>\"Yes,\" she said. \"Everyone has a bell. That's the whole thing, Pip. That's the whole thing about the Bureau, and about the Keeper, and about the man in the curtained house. Everyone has a bell. And the question is what you do with the bell. You can keep the file and call it administrative and wait a little. Or you can build a machine so you never have to lose another bell. Or you can...\" She paused. \"Or you can leave the bowl out. And let the bowl be enough.\"</p>", "<p>\"Mr. Snell built a machine,\" said Pip. \"Because he couldn't leave the bowl out. Because the bowl wasn't enough. Because losing the dog was too much, and he decided he would never lose anything again.\"</p>", "<p>\"Yes,\" said Miss Whisk. \"And that is the most understandable thing in the world. And it is also the thing that is eating the town. Because you cannot answer a bell by building a cage. You can only answer a bell by... \" She searched for the word. \"By letting the bell be a bell. By letting the lost thing be lost, and the love stay. The love stays, Pip. Even when the bell is gone. The love stays. That's the thing he doesn't know. That's the thing the machine doesn't know. The love stays.\"</p>", "<p>Pip sat on the lost step, and he held the thing she had given him, which was too big for a label, and he turned it over, and he felt the shape of the answer start to form.</p>", "<p>The love stays. Even when the bell is gone. Even when the dog runs off. Even when the thing is lost. The love stays. And the Keeper was taking the things because it thought the love was in the things, and it was not. The love was in the people. And you could not keep the love by keeping the things. You could only keep the love by letting the things go, and letting the love stay.</p>", "<p>\"Miss Whisk,\" he said. \"I think I know how to answer the heartbreak.\"</p>", "<p>Miss Whisk looked at him. \"Do you?\"</p>", "<p>\"I think so. I think... \" He thought of Goldie's pocket, of the marble and the paperclip and the rubber band, of <em>the sad is the good kind, if you let it be.</em> \"I think we have to show him that the love stays. That he can let the things go and still have the love. That Biscuit... \" He paused, because he did not know about Biscuit, not really, not the whole thing. \"That the dog is not the love. The dog is the thing the love wears. And the love is still there. Even after eight years. Even with the curtains closed.\"</p>", "<p>Miss Whisk was quiet for a long moment. Then she reached out, and she put her paw on Pip's hand, which surprised them both.</p>", "<p>\"Then you are the one who will answer it,\" she said. \"I knew it when you asked to see the record. A boy who understands that the record keeps the loving, not the things - that boy can answer a heartbreak.\" She stood, and she smoothed her fur, and she was the Head Cataloguer again, but the almost-smile was still there, in the corner, permanent now. \"Go love your dinosaur. And Pip?\"</p>", "<p>\"Yes?\"</p>", "<p>\"Put the file back. Under administrative.\" She paused, and her paw went to her empty collar, and she said, very quietly, \"But leave the drawer open a little. So it gets some air. So it knows it's not forgotten. That's... that's the bowl. That's my bowl. Leave it open a little.\"</p>", "<p>And Pip put the file back, and he left the drawer open a little, and he went to love his dinosaur. He had the answer now, the shape of it. All he needed was the how, and three days.</p>", "<p>And under the hill, the Keeper hummed, patient and keeping, not knowing that a boy in the Bureau had just learned the thing it was built to avoid: that the love stays, even when the bell is gone.</p>"]}, {"id": "ch17", "label": "Chapter 17", "title": "Chapter 17 - Goldie Minds (Just This Once)", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\">\n<defs>\n    <g id=\"pip\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <line x1=\"-10\" y1=\"372\" x2=\"-10\" y2=\"384\"/>\n      <line x1=\"10\" y1=\"372\" x2=\"10\" y2=\"384\"/>\n      <rect x=\"-32\" y=\"382\" width=\"64\" height=\"88\" fill=\"#E4572E\"/>\n      <line x1=\"-32\" y1=\"398\" x2=\"-52\" y2=\"446\"/>\n      <line x1=\"32\" y1=\"398\" x2=\"56\" y2=\"438\"/>\n      <circle cx=\"-52\" cy=\"450\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"46\" y=\"428\" width=\"34\" height=\"22\" fill=\"#E9C46A\"/>\n      <line x1=\"52\" y1=\"439\" x2=\"74\" y2=\"439\"/>\n      <rect x=\"80\" y=\"435\" width=\"12\" height=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"56\" cy=\"442\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"-32\" y=\"466\" width=\"64\" height=\"20\" fill=\"#2B2B2B\"/>\n      <line x1=\"-14\" y1=\"486\" x2=\"-14\" y2=\"550\"/>\n      <line x1=\"14\" y1=\"486\" x2=\"14\" y2=\"550\"/>\n      <ellipse cx=\"-16\" cy=\"552\" rx=\"16\" ry=\"8\" fill=\"#2B2B2B\"/>\n      <ellipse cx=\"18\" cy=\"552\" rx=\"16\" ry=\"8\" fill=\"#2B2B2B\"/>\n      <circle cx=\"0\" cy=\"338\" r=\"40\" fill=\"#FFF8EC\"/>\n      <path d=\"M -40 334 Q -40 296 0 296 Q 40 296 40 334 Q 26 314 0 316 Q -26 314 -40 334 Z\" fill=\"#2B2B2B\"/>\n      <circle cx=\"8\" cy=\"336\" r=\"4\" fill=\"#2B2B2B\"/>\n      <circle cx=\"26\" cy=\"336\" r=\"4\" fi
