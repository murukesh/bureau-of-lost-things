/>\n      <circle cx=\"56\" cy=\"444\" r=\"4\" fill=\"#2B2B2B\"/>\n      <path d=\"M 30 424 Q 20 404 36 400 Q 48 402 44 424 Z\" fill=\"#8B5E3C\"/>\n      <path d=\"M 66 478 Q 74 486 84 478\" fill=\"none\"/>\n      <path d=\"M 40 486 Q 52 494 64 486\" fill=\"none\"/>\n    </g>\n    <g id=\"captain-chomp\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <path d=\"M -40 500 Q -70 490 -74 460 Q -70 440 -52 446\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"0\" cy=\"490\" rx=\"52\" ry=\"60\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"6\" cy=\"506\" rx=\"30\" ry=\"36\" fill=\"#E9C46A\"/>\n      <line x1=\"-6\" y1=\"486\" x2=\"18\" y2=\"486\"/>\n      <line x1=\"-6\" y1=\"502\" x2=\"18\" y2=\"502\"/>\n      <line x1=\"-6\" y1=\"518\" x2=\"18\" y2=\"518\"/>\n      <ellipse cx=\"-22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <line x1=\"-30\" y1=\"450\" x2=\"-48\" y2=\"470\"/>\n      <line x1=\"30\" y1=\"450\" x2=\"50\" y2=\"468\"/>\n      <circle cx=\"6\" cy=\"400\" r=\"42\" fill=\"#2A9D8F\"/>\n      <path d=\"M 30 380 L 56 388 L 32 398 Z\" fill=\"#2A9D8F\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"3\" fill=\"#2B2B2B\"/>\n      <circle cx=\"-12\" cy=\"392\" r=\"8\" fill=\"#E9C46A\"/>\n      <line x1=\"-16\" y1=\"388\" x2=\"-8\" y2=\"396\"/>\n      <line x1=\"-8\" y1=\"388\" x2=\"-16\" y2=\"396\"/>\n      <path d=\"M 20 416 Q 30 424 42 416\" fill=\"none\"/>\n      <path d=\"M -20 362 L -14 348 L -6 362 L 2 348 L 10 362\" fill=\"none\"/>\n    </g>\n  </defs>\n  <rect x=\"0\" y=\"0\" width=\"800\" height=\"600\" fill=\"#FFF8EC\"/>\n  <rect x=\"380\" y=\"180\" width=\"300\" height=\"340\" fill=\"#E9C46A\"/>\n  <circle cx=\"460\" cy=\"260\" r=\"36\" fill=\"#C9A66B\"/>\n  <circle cx=\"600\" cy=\"280\" r=\"30\" fill=\"#C9A66B\"/>\n  <circle cx=\"530\" cy=\"270\" r=\"14\" fill=\"#8B5E3C\"/>\n  <circle cx=\"530\" cy=\"270\" r=\"4\" fill=\"#2B2B2B\"/>\n  <path d=\"M 420 380 l 0 40 q 0 12 12 12 l 0 -44\" fill=\"none\" stroke=\"#9AA5B1\" stroke-width=\"6\"/>\n  <rect x=\"60\" y=\"240\" width=\"150\" height=\"320\" fill=\"#2A9D8F\"/>\n  <circle cx=\"185\" cy=\"400\" r=\"9\" fill=\"#E9C46A\"/>\n  <rect x=\"80\" y=\"430\" width=\"110\" height=\"32\" fill=\"#FFF8EC\" transform=\"rotate(-5 135 446)\"/>\n  <text x=\"135\" y=\"451\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#2B2B2B\" transform=\"rotate(-5 135 446)\">FOUND. COMES BACK TO.</text>\n  <use href=\"#thimble\" transform=\"translate(300,308) scale(0.45)\"/>\n  <use href=\"#goldie\" transform=\"translate(720,252) scale(0.55)\"/>\n  <text x=\"400\" y=\"60\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"22\" fill=\"#8B5E3C\">button, paperclip, label</text>\n  <text x=\"400\" y=\"592\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"15\" fill=\"#2B2B2B\">the gears stopped</text></svg>\n", "head": "Chapter 36 - A Button, a Paperclip, and a Very Brave Label", "paras": ["<p>The Keeper gave one last pull, and the pull was a big one, and the pull was a thing that reached out of the house and down the hill and into the town, and the pull grabbed the green door.</p>", "<p>The green door. The small green door behind the school's lost-and-found bin. The door that was shy. The door that only showed itself to people who had lost something they truly loved. The door that was the way in, and the way out, and the way home. The Keeper grabbed it, and the Keeper pulled it, and the green door came out of the school wall with a sound like a tooth coming out of a gum, and it flew up the hill, and it landed in the keeping room, and it lay there, on the floor, among the kept things, and it was being kept, and the way home was being kept.</p>", "<p>\"The door,\" said Pip. \"The door. The way home. It's... it's being kept. The Keeper took the door. The Keeper took the way home.\" He looked at the green door, on the floor, among the kept things, and he felt the thing go cold, because the way home was being kept, and the things could not go home if the way home was being kept, and the Keeper was keeping the way home.</p>", "<p>And then he saw the label.</p>", "<p>The label. The crooked one. The one he had pressed onto the green door on the third day, the one that said FOUND. COMES BACK TO., the one that was slightly crooked, the one that he had pressed onto the door because he wanted the door to know it was found. The label was on the green door. The label was crooked. And the label was the thing that marked the door, the thing that said <em>this is the door, this is the way home, this is the thing that comes back to</em>, and the label was the thing that made the door not just a kept thing, but the way home.</p>", "<p>\"The label,\" said Pip. \"The label marks the door. The label marks the way home.\" He went to the green door, and he knelt down, and he pressed the label flat, the crooked label, the FOUND. COMES BACK TO., and he said, \"You're not kept. You're the way home. You're the way home. You come back to. You come back to.\" And he propped the green door up, against the wall, against the keeping, and he opened it, and the door opened, and behind the door was not the keeping room, behind the door was the schoolyard, behind the door was the town, behind the door was the way home. And the way home was open. And the way home was marked. And the way home was found.</p>", "<p>And the Keeper pulled, and the Keeper pulled, and the Keeper tried to close the door, and the door would not close, because the label was on it, because the label said FOUND. COMES BACK TO., because the label was a promise, because the label said I expect you to come loose, and I expect to fix you, and I am not going anywhere. And the door would not close. And the way home was open. And the way home was found.</p>", "<p>\"The panel,\" said Goldie. \"The panel. The maintenance panel. The place where you get in. The place where the gears are. The place where the button goes.\" She was looking at the Keeper, at the brass, at the gears, at the springs, at the little copper wires, and she was looking at the panel, the maintenance panel, the place where you get in, and the panel was latched, and the latch was brass, and the latch was pulled, and the latch was being kept. \"The latch is brass. The latch is being kept. I can't... I can't open it with my hands. The latch is being kept.\"</p>", "<p>\"The paperclip,\" said Pip. \"The paperclip. The paperclip picks the latch. The paperclip opens the panel.\"</p>", "<p>And Goldie took out the paperclip. The silver one. The bent one. The one that was bent because she had bent it thinking about her dad. The one that had been bent for years so it could be ready for this job. And she bent it, a little, a little more, the way you bend a paperclip when you are thinking, and she slid it into the latch, and she picked, and she picked, and she picked, and the latch was brass, and the latch was being kept, but the paperclip was thin, and the paperclip was bent, and the paperclip was ready, and the paperclip picked the latch, and the latch opened, and the panel opened, and the gears were there.</p>", "<p>\"The gears,\" said Thimble. \"The gears. The teeth. The place where the button goes.\" And he reached up, very carefully, and he worked a button loose from his quills. A small brown button. Four-holed. The kind that holds a coat together. The kind that is a promise. The kind that says I expect you to come loose, and I expect to fix you, and I am not going anywhere. And he held the button in his paw, and he looked at the gears, at the teeth, at the turning, and he said, \"The spare is a promise. And the promise is... the promise is let go. And I'm going to fix you. I'm going to fix you by making you stop. I'm going to fix you by making you let go.\" And he put the button in the gears.</p>", "<p>And the gears stopped.</p>", "<p>The button went into the teeth, and the teeth caught the button, and the button was a thing that did not turn, and the gears were a thing that turned, and the thing that did not turn met the thing that turned, and the thing that turned stopped. And the Keeper stopped. The Keeper stopped the way a thing stops when a button is in its gears, which is to say with a sound, which is to say with a grind, which is to say with a whine, a small, mechanical whine, the sound of a machine that has been told to stop by a hedgehog's spare button. And the Keeper stopped. And the pull stopped. And the wanting stopped. And the not-thinking stopped. And the hill let go. And the town let go. And the coats let go. And the buttons let go. And the socks let go. And the umbrellas let go. And the Keeper stopped.</p>", "<p>And the silence that followed was the silence of a machine that has been told to stop, and the silence was loud, and the silence was the loudest thing, because the hum was gone, and the hum had been there for eight years, and the hum was gone, and the gone was a thing you could hear.</p>", "<p>\"It stopped,\" said Ollie, and his voice was small, and his voice was loud, and his voice was the voice of a six-year-old who is watching the number stop going the wrong way. \"It stopped. The Keeper stopped. The number stopped going up. The number stopped going up.\" He looked at his page, at the OFFICIAL COUNTER, at the number, and he said, \"Now I count down. Now I count down. Now I count to zero. Now I count to zero.\"</p>", "<p>And the button had jammed the gears. And the paperclip had opened the panel. And the label had marked the door. And the three things had done the job. And the three things were useless. And the three things were ready. And the three things had been useless so they could be ready. And the three things had saved the day.</p>", "<p>And Thimble, who was small and round and the color of toast, who had given a red star button to a lost coat, who had had the red star button popped off and taken, who had just put a small brown button in the gears of a machine that keeps, said, \"There. There. I fixed you. I fixed you. I expect you to come loose, and I expect to fix you, and I am not going anywhere. And I fixed you. And I'm not going anywhere. And the word is let go. And the word is let go.\" And his quills clicked, and the buttons were there, one fewer, and the one fewer was the one that had done the job, and the one that had done the job was the one that was a promise, and the promise was let go.</p>", "<p>And the Keeper was stopped. And the Keeper was jammed. And the Keeper was not pulling. And the Keeper was not keeping. And the way home was open. And the way home was marked. And the way home was found.</p>", "<p>But the Keeper was not let go. The Keeper was stopped, but the Keeper was not let go. The Keeper was jammed, but the Keeper was still keeping. The Keeper was still holding the things. The Keeper was still holding the eighteen, and the nineteen, and the twenty, and the everything. And the things were still kept. And the things were still cold. And the things were still almost.</p>", "<p>\"The socks,\" said Thimble. \"The socks. The lonely socks. The socks go home. The socks lead the way. The socks lead the way home. And the things follow. And the things follow the socks home. And the Keeper... the Keeper lets go. The Keeper lets go when the socks go home. The Keeper lets go when the love stays.\"</p>", "<p>And the next thing was the socks. And the next thing was the rubber band. And the next thing was the trail. And the next thing was the home.</p>", "<p>But that was later. That was the next chapter. That was the answer.</p>", "<p>For now, there was a button in the gears, and a paperclip in the latch, and a label on the door, and a Keeper that was stopped.</p>", "<p>For now, that was enough.</p>"]}, {"id": "ch37", "label": "Chapter 37", "title": "Chapter 37 - The Sock Trail Home \"592\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"15\" fill=\"#2B2B2B\">the duck sock</text></svg>\n", "head": "Chapter 37 - The Sock Trail Home", "paras": ["<p>The Keeper was jammed, but the Keeper was still holding, and the holding was a thing that needed a letting go, and the letting go was a thing that needed a lead, and the lead was the socks, and the socks were the lonely socks, and the lonely socks were the homing things, and the homing things were the thing that led the way home.</p>", "<p>\"Thimble,\" said Pip. \"The socks. The lonely socks. Release the socks. Let them go home. Let them lead the way.\"</p>", "<p>And Thimble, who sorted the socks, who gave spare buttons to lost coats, who was prepared for loss, went to the bin, the special bin, the one he had labeled READY / GOING HOME / SMELLS LIKE SOMEONE, and he opened it, and the lonely socks were there, the single socks, the ones that smelled like toast and rain and grass and someone else's house, and they were leaning, all of them, leaning toward the green door, leaning toward the way home, leaning toward the pairs, leaning toward the people, leaning toward the home.</p>", "<p>\"They want home,\" said Thimble. \"They want home more than anything. More than a glove wants its glove. More than a key wants its lock. A lonely sock is a homing thing. And a homing thing does not stay kept. A homing thing finds its way.\" He picked up a sock, a small gray one, and he held it to his nose, and he closed his eyes, and he said, \"Toast. This one smells like toast. This one... this one is the loneliest. This one wants home the most.\" And he held up the sock, and it was the duck sock. The duck sock. Ollie's duck sock. The one from the dryer. The one that smelled like toast. The one that had gone missing from the Bureau. The one that had been kept.</p>", "<p>\"The duck sock,\" said Ollie. \"The duck sock. My duck sock. My duck sock. It's... it's here. It's here. It's here.\" And he reached for it, and Thimble held it up, and he said, \"The duck sock goes first. The duck sock is the loneliest. The duck sock wants home the most. And the duck sock leads the way. The duck sock leads the way home.\"</p>", "<p>\"But the Keeper,\" said Goldie. \"The Keeper is still holding. The Keeper is jammed, but the Keeper is still holding. The socks... the socks can't get out. The Keeper is holding the way. The Keeper is holding the... the grip. The socks can't get past the grip.\"</p>", "<p>And she was right. The Keeper was jammed, but the Keeper was still holding, and the holding was a grip, a brass grip, a thing that held the way, and the socks could not get past the grip, and the socks could not get out, and the socks could not lead the way home, because the grip was holding the way.</p>", "<p>\"The rubber band,\" said Goldie. \"The rubber band. The rubber band launches. The rubber band launches the first sock. The rubber band launches the duck sock. The rubber band launches the duck sock past the grip. The rubber band launches the duck sock out the door. And the duck sock leads the way. And the other socks follow. And the trail starts. And the trail leads home.\" She took out the rubber band. The red one. The cracked one. The stretched one. The one that had held her hair the day she learned to ride a bike. The one that had been cracked for years so it could be ready for this job. \"The rubber band's a snap. The rubber band's a launch. The rubber band's the thing that starts the trail.\"</p>", "<p>And she made a slingshot. She made a slingshot the way you make a slingshot when you are twelve and you know every shortcut and your pocket has been knowing things for years, which is to say she made it out of the rubber band and her two fingers and the duck sock, and she pulled it back, and she pulled it back, and she pulled it back, and the rubber band stretched, and the rubber band cracked, and the rubber band was about to snap, and the rubber band was ready, and the rubber band was the thing that started the trail.</p>", "<p>\"Let go,\" said Goldie. And she let go.</p>", "<p>And the rubber band snapped. And the duck sock flew. The duck sock flew past the grip, past the brass, past the holding, past the keeping, and the duck sock flew out the green door, out the way home, out into the town, out into the first day of fall, and the duck sock flew home. And the duck sock flew toward Ollie. And the duck sock flew toward the pair. And the duck sock flew toward the home. And the duck sock led the way.</p>", "<p>And the other socks followed.</p>", "<p>The lonely socks followed the duck sock. The single socks followed the duck sock. The ones that smelled like toast and rain and grass and someone else's house followed the duck sock, and they flew past the grip, past the brass, past the holding, past the keeping, and they flew out the green door, out the way home, out into the town, and they flew home. And they flew toward their pairs. And they flew toward their people. And they flew toward the home. And they formed a trail. A trail of single socks. A trail of lonely socks. A trail of homing things. And the trail led from the house, through the green door, down the hill, into the town, and the trail led home.</p>", "<p>And the kept things followed.</p>", "<p>The kept things followed the socks. The music box followed the socks. The telescope followed the socks. The harmonica followed the socks. The red mitten followed the socks. The eighteen followed the socks. The nineteen followed the socks. The twenty followed the socks. The everything followed the socks. And the kept things flew out the green door, out the way home, out into the town, and they flew home. And they flew toward their people. And they flew toward the ones who loved them. And they flew toward the home. And the Keeper let go. The Keeper let go the things. The Keeper let go the grip. The Keeper let go the keeping. And the things went home. And the things went home along the sock trail. And the sock trail led the way. And the sock trail led home.</p>", "<p>And the trail led everyone home.</p>", "<p>Pip followed the trail. Goldie followed the trail. Ollie followed the trail. Barnaby followed the trail. Miss Whisk followed the trail. Thimble followed the trail. And Snell followed the trail. Snell, who was a man shaped like an umbrella, who had been alone eight years, who had built a machine so nothing he loves is ever lost again, followed the sock trail, and the sock trail led him out the green door, out the way home, down the hill, into the town, and the sock trail led him home. And the sock trail led him toward the bakery. And the sock trail led him toward The Warm Loaf. And the sock trail led him toward the bowl. And the sock trail led him toward the dog.</p>", "<p>But that was later. That was the reunion. That was the next chapter.</p>", "<p>For now, there was a sock trail, and a rubber band that had snapped, and a duck sock that had led the way, and a Keeper that had let go.</p>", "<p>And the rubber band had saved the day. The rubber band had launched the first sock. The rubber band had started the trail. The rubber band had been cracked for years so it could be ready for this job. And the rubber band had done the job. And the rubber band had saved the day.</p>", "<p>And the lonely socks had saved the day. The lonely socks had led the way home. The lonely socks had been homing things. And the homing things had led the way. And the trail of single socks had led everyone home. And the trail had led home.</p>", "<p>And Goldie's pocket was empty. The marble was spent. The paperclip was spent. The rubber band was spent. The three useless things had done the job. The three useless things had saved the day. And the pocket was empty. And the pocket jingled, but the jingle was a different jingle, the jingle of a pocket that has done the job, the jingle of a pocket that is empty and is full, the jingle of a pocket that has loved and has let go.</p>", "<p>And Goldie patted the empty pocket, and she said, \"Good pocket. Good pocket. You did the job. You did the job.\" And she smiled, the shortcut smile, the <em>this is a terrible idea and I'm in</em> smile, and she said, \"The sad's the good kind. The sad's the good kind. The kind that means it was real.\"</p>", "<p>And the sock trail led home. And the sock trail led everyone home. And the sock trail led toward the bakery. And the sock trail led toward the bowl. And the sock trail led toward the dog.</p>", "<p>But that was later. That was the reunion. That was the answer.</p>", "<p>For now, there was a sock trail, and an empty pocket, and a Keeper that had let go, and a man following the trail home.</p>", "<p>For now, that was enough.</p>"]}, {"id": "ch38", "label": "Chapter 38", "title": "Chapter 38 - The Keeping Lever", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\">\n<defs>\n    <g id=\"pip\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <line x1=\"-10\" y1=\"372\" x2=\"-10\" y2=\"384\"/>\n      <line x1=\"10\" y1=\"372\" x2=\"10\" y2=\"384\"/>\n      <rect x=\"-32\" y=\"382\" width=\"64\" height=\"88\" fill=\"#E4572E\"/>\n      <line x1=\"-32\" y1=\"398\" x2=\"-52\" y2=\"446\"/>\n      <line x1=\"32\" y1=\"398\" x2=\"56\" y2=\"438\"/>\n      <circle cx=\"-52\" cy=\"450\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"46\" y=\"428\" width=\"34\" height=\"22\" fill=\"#E9C46A\"/>\n      <line x1=\"52\" y1=\"439\" x2=\"74\" y2=\"439\"/>\n      <rect x=\"80\" y=\"435\" width=\"12\" height=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"56\" cy=\"442\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"-32\" y=\"466\" width=\"64\" height=\"20\" fill=\"#2B2B2B\"/>\n      <line x1=\"-14\" y1=\"486\" x2=\"-14\" y2=\"550\"/>\n      <line x1=\"14\" y1=\"486\" x2=\"14\" y2=\"550\"/>\n      <ellipse cx=\"-16\" cy=\"552\" rx=\"16\" ry=\"8\" fill=\"#2B2B2B\"/>\n      <ellipse cx=\"18\" cy=\"552\" rx=\"16\" ry=\"  fill=\"#E4572E\"/>\n  <use href=\"#snell\" transform=\"translate(280,112) scale(0.8)\"/>\n  <rect x=\"320\" y=\"430\" width=\"40\" height=\"26\" fill=\"#9AA5B1\"/>\n  <circle cx=\"340\" cy=\"443\" r=\"4\" fill=\"#2B2B2B\"/>\n  <use href=\"#pip\" transform=\"translate(120,252) scale(0.55)\"/>\n  <use href=\"#ollie\" transform=\"translate(200,308) scale(0.45)\"/>\n  <text x=\"400\" y=\"60\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"22\" fill=\"#8B5E3C\">the keeping lever</text>\n  <text x=\"400\" y=\"592\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"15\" fill=\"#2B2B2B\">the love stays</text></svg>\n", "head": "Chapter 38 - The Keeping Lever", "paras": ["<p>The things had gone home, and the Keeper was quiet, and the quiet was a thing that had a sound, and the sound was the sound of a machine that has let go of everything except the one thing it was built around.</p>", "<p>Because the Keeper was still humming. Faintly. At the edge of things. A low, steady, keeping note, but small now, small and tired, the hum of a machine that has let go of everything except the first thing, the thing in the jar, the collar tag, the dog, the love. And the Keeper was still holding the collar tag. And the Keeper was still built around the collar tag. And the Keeper was not going to stop, not all the way, not until the collar tag was let go. And the collar tag was the thing Snell had to let go. And the letting go was the thing Snell had to do. And the doing was the thing that was hard.</p>", "<p>\"There's a lever,\" said Snell. He was standing at the heart of the house, at the Keeper, at the brass and the gears and the springs and the little copper wires, and he was shaped like an umbrella, and his long hands were folded, and his face was the face of a man who is about to do the thing he has been avoiding for eight years. \"There's a lever. The keeping lever. The... the release. I built it. I built it so... so I could stop. In case. In case I ever... in case I ever wanted to stop. And I never... I never pulled it. I never pulled it. Because pulling it means... pulling it means letting go. And I... I don't know how to let go. I've been keeping for eight years. And I don't know how to let go.\"</p>", "<p>And the lever was there. The keeping lever. The release. A small brass lever, set into the heart of the machine, next to the jar, next to the collar tag, next to the first thing. And the lever was the thing that would stop the Keeper. And the lever was the thing that would let go. And the lever was the thing Snell had to pull. And the pulling was the thing that was hard.</p>", "<p>\"Mr. Snell,\" said Pip. \"The love stays. Even when the thing is gone. The love stays. You don't have to keep the collar tag to keep the love. The love is not in the collar tag. The love is in you. And the love stays. Even when the collar tag is let go. Even when Biscuit is... even when Biscuit is gone. The love stays.\"</p>", "<p>\"But Biscuit is gone,\" said Snell, and his voice broke on the word <em>gone</em>, the way a voice breaks when a man has been keeping everything for eight years and has just decided to let one thing go. \"Biscuit is gone. And the collar tag is... the collar tag is the last thing. The collar tag is the last thing I have of him. And if I let it go... if I let it go, then... then he's really gone. Then he's really gone. And I can't... I can't let him be really gone. I can't.\"</p>", "<p>And the silence that followed had a temperature, and the temperature was a collar tag, and a dog that was gone, and a man who could not let the last thing go.</p>", "<p>And then Ollie, who was six, who was brave in small, loud ways, said, \"Mr. Snell. Biscuit's not gone. Biscuit's lost. And lost is not the same as gone. And... and maybe Biscuit is being loved back. Maybe Biscuit is remembering the way home. Maybe Biscuit is... maybe Biscuit is not gone. Maybe Biscuit is just lost. And lost is not the same as gone.\" He looked at Snell with his whole face. \"And the love stays. Even when the thing is lost. The love stays. And... and maybe the thing comes back. Maybe the thing comes back differently. But the love stays. And maybe... maybe Biscuit comes back. Maybe Biscuit comes back differently. But the love stays.\"</p>", "<p>And Snell, who was a man shaped like an umbrella, who had been alone eight years, looked at the six-year-old who had just said <em>maybe Biscuit comes back differently</em>, and the crack opened, wider than it had ever been, and for a long moment he did not speak. And then he said, \"Differently. Biscuit comes back... differently.\" He looked at the collar tag, at the small metal thing, at the first thing, at the thing that started it. \"Differently. He'd be... he'd be old now. He'd be fat. He'd be... he'd be different. He'd be different. And I... I would still love him. I would still love him. Even different. Even old. Even fat. I would still love him. Because the love stays. The love stays. Even different. Even when the thing comes back differently. The love stays.\"</p>", "<p>And he reached into the jar. He reached into the heart of the machine, and he took out the collar tag, the small metal thing, the first thing, the thing that started it, and he held it in his long hand, and he looked at it, and he said, \"Biscuit. Biscuit. I... I loved you. I loved you. And I kept everything. I kept everything so I would never lose anything again. And I... I lost the loving. I lost the loving. Because keeping is not loving. Keeping is being afraid, with a machine. And I was afraid. And I was afraid for eight years. And I... I'm not going to be afraid anymore. I'm not going to be afraid anymore. I'm going to let go. I'm going to let go. And the love stays. The love stays. Even when the thing is gone. Even when the thing comes back differently. The love stays.\"</p>", "<p>And he put the collar tag in his pocket. Not in the machine. Not in the jar. Not in the keeping. In his pocket. A healthy keeping. A carrying. A leaving-the-bowl-out. And he pulled the lever.</p>", "<p>And the Keeper stopped.</p>", "<p>The Keeper stopped the way a thing stops when a man has let go, which is to say with a sound, which is to say with a sigh, which is to say with a long, low, mechanical sigh, the sound of a machine that has been keeping for eight years and has just been told that the love stays. And the hum went out. The hum went out like a candle. And the brass went still. And the gears went still. And the springs went still. And the little copper wires went still. And the Keeper was not a Keeper anymore. The Keeper was a machine. The Keeper was a thing. The Keeper was a... the Keeper was a shed. The Keeper was an ordinary shed. The Keeper was a thing that had been keeping and had just let go. And the house stopped growing. The house stopped growing, and the rooms... the rooms did not go away, but the rooms stopped growing, and the house was a house again, and the house was not a Bureau that keeps, and the house was a house, and the house was a home.</p>", "<p>And the silence that followed was the silence of a machine that has let go, and the silence was loud, and the silence was the loudest thing, because the hum was gone, and the hum had been there for eight years, and the hum was gone, and the gone was a thing you could hear. And the gone was a thing that was a relief. And the gone was a thing that was a start.</p>", "<p>And Snell, who was a man shaped like an umbrella, who had been alone eight years, who had built a machine so nothing he loves is ever lost again, who had just let go, stood at the heart of the house, at the ordinary shed, at the thing that had been a Keeper, and he held the collar tag in his pocket, and he said, \"The love stays. The love stays. I... I let go. And the love stays. I let go. And the love stays.\" And his face was the face of a man who has just done the thing he has been avoiding for eight years, and the thing is true, and the thing is a relief, and the thing is a start.</p>", "<p>The collar tag was in his pocket, and it was warm, and it was a homing thing. It wanted Biscuit. It wanted the dog. It wanted home. And it led the way.</p>", "<p>The sock trail was still there, leading from the house, through the green door, down the hill, into the town. Toward the bakery. Toward The Warm Loaf. Toward the bowl. Toward the dog.</p>", "<p>The collar tag followed the sock trail, and Snell followed the collar tag, toward the bakery, toward the bowl, toward the dog.</p>", "<p>\"Mr. Snell,\" said Pip. \"The collar tag. The collar tag wants home. The collar tag wants Biscuit. The collar tag... the collar tag is leading the way. Follow the collar tag. Follow the sock trail. Follow the way home.\"</p>", "<p>And Snell, who was a man shaped like an umbrella, who had been alone eight years, who had just let go, followed the collar tag, and the collar tag followed the sock trail, and the sock trail led down the hill, into the town, toward the bakery, toward The Warm Loaf, toward the bowl, toward the dog.</p>", "<p>And the reunion was coming. The reunion was coming. The reunion was the next chapter. The reunion was the answer.</p>", "<p>But that was later. That was the reunion. That was the next chapter.</p>", "<p>For now, there was a man who had let go, and a collar tag in a pocket, and a sock trail that led home, and a Keeper that was an ordinary shed.</p>", "<p>For now, that was enough.</p>"]}, {"id": "ch39", "label": "Chapter 39", "title": "Chapter 39 - The Dog Under the Proofing Rack", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\">\n<defs>\n    <g id=\"pip\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <line x1=\"-10\" y1=\"372\" x2=\"-10\" y2=\"384\"/>\n      <line x1=\"10\" y1=\"372\" x2=\"10\" y2=\"384\"/>\n      <rect x=\"-32\" y=\"382\" width=\"64\" height=\"88\" fill=\"#E4572E\"/>\n      <line x1=\"-32\" y1=\"398\" x y1=\"530\" x2=\"-44\" y2=\"552\"/>\n      <line x1=\"-16\" y1=\"536\" x2=\"-16\" y2=\"554\"/>\n      <line x1=\"16\" y1=\"536\" x2=\"16\" y2=\"554\"/>\n      <line x1=\"44\" y1=\"530\" x2=\"44\" y2=\"552\"/>\n      <ellipse cx=\"-44\" cy=\"554\" rx=\"12\" ry=\"6\" fill=\"#E9C46A\"/>\n      <ellipse cx=\"44\" cy=\"554\" rx=\"12\" ry=\"6\" fill=\"#E9C46A\"/>\n      <path d=\"M -66 486 Q -88 470 -80 446\" fill=\"none\"/>\n      <circle cx=\"52\" cy=\"452\" r=\"40\" fill=\"#E9C46A\"/>\n      <ellipse cx=\"70\" cy=\"466\" rx=\"22\" ry=\"16\" fill=\"#FFF8EC\"/>\n      <ellipse cx=\"84\" cy=\"462\" rx=\"8\" ry=\"6\" fill=\"#2B2B2B\"/>\n      <circle cx=\"56\" cy=\"444\" r=\"4\" fill=\"#2B2B2B\"/>\n      <path d=\"M 30 424 Q 20 404 36 400 Q 48 402 44 424 Z\" fill=\"#8B5E3C\"/>\n      <path d=\"M 66 478 Q 74 486 84 478\" fill=\"none\"/>\n      <path d=\"M 40 486 Q 52 494 64 486\" fill=\"none\"/>\n    </g>\n    <g id=\"captain-chomp\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <path d=\"M -40 500 Q -70 490 -74 460 Q -70 440 -52 446\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"0\" cy=\"490\" rx=\"52\" ry=\"60\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"6\" cy=\"506\" rx=\"30\" ry=\"36\" fill=\"#E9C46A\"/>\n      <line x1=\"-6\" y1=\"486\" x2=\"18\" y2=\"486\"/>\n      <line x1=\"-6\" y1=\"502\" x2=\"18\" y2=\"502\"/>\n      <line x1=\"-6\" y1=\"518\" x2=\"18\" y2=\"518\"/>\n      <ellipse cx=\"-22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <line x1=\"-30\" y1=\"450\" x2=\"-48\" y2=\"470\"/>\n      <line x1=\"30\" y1=\"450\" x2=\"50\" y2=\"468\"/>\n      <circle cx=\"6\" cy=\"400\" r=\"42\" fill=\"#2A9D8F\"/>\n      <path d=\"M 30 380 L 56 388 L 32 398 Z\" fill=\"#2A9D8F\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"3\" fill=\"#2B2B2B\"/>\n      <circle cx=\"-12\" cy=\"392\" r=\"8\" fill=\"#E9C46A\"/>\n      <line x1=\"-16\" y1=\"388\" x2=\"-8\" y2=\"396\"/>\n      <line x1=\"-8\" y1=\"388\" x2=\"-16\" y2=\"396\"/>\n      <path d=\"M 20 416 Q 30 424 42 416\" fill=\"none\"/>\n      <path d=\"M -20 362 L -14 348 L -6 362 L 2 348 L 10 362\" fill=\"none\"/>\n    </g>\n  </defs>\n  <rect x=\"0\" y=\"0\" width=\"800\" height=\"600\" fill=\"#FFF8EC\"/>\n  <rect x=\"480\" y=\"200\" width=\"280\" height=\"200\" fill=\"#8B5E3C\"/>\n  <line x1=\"500\" y1=\"240\" x2=\"740\" y2=\"240\"/>\n  <line x1=\"500\" y1=\"290\" x2=\"740\" y2=\"290\"/>\n  <line x1=\"500\" y1=\"340\" x2=\"740\" y2=\"340\"/>\n  <ellipse cx=\"560\" cy=\"225\" rx=\"30\" ry=\"14\" fill=\"#E9C46A\"/>\n  <ellipse cx=\"660\" cy=\"275\" rx=\"30\" ry=\"14\" fill=\"#C9A66B\"/>\n  <use href=\"#biscuit\" transform=\"translate(620,308) scale(0.45)\"/>\n  <use href=\"#snell\" transform=\"translate(300,168) scale(0.7)\"/>\n  <path d=\"M 120 520 q 0 -26 34 -26 q 34 0 34 26 l 0 12 l -68 0 Z\" fill=\"#2A9D8F\"/>\n  <use href=\"#pip\" transform=\"translate(120,252) scale(0.55)\"/>\n  <use href=\"#ollie\" transform=\"translate(220,308) scale(0.45)\"/>\n  <text x=\"400\" y=\"60\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"22\" fill=\"#8B5E3C\">the proofing rack</text>\n  <text x=\"400\" y=\"592\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"15\" fill=\"#2B2B2B\">back differently</text></svg>\n", "head": "Chapter 39 - The Dog Under the Proofing Rack", "paras": ["<p>The sock trail led to The Warm Loaf, and the collar tag led to The Warm Loaf, and Snell followed the collar tag, and the collar tag followed the sock trail, and the sock trail led to the door, the door with the blue bowl by it, the bowl with the chipped rim, the bowl that was full of clean water, the bowl that had been full of clean water for eight years, the bowl that Mrs. Crumb had left out, the bowl that was the job, the bowl that was the only thing left that looked like love.</p>", "<p>And Mrs. Crumb was at the door. She was wiping her floury hands, and she was looking at the sock trail, at the collar tag, at the man shaped like an umbrella, and her face did the thing, the soft thing, the kind thing, the thing that had decided a long time ago to be kind and had never found a reason to stop.</p>", "<p>\"Silas,\" she said. \"Silas Snell. It's... it's been eight years.\"</p>", "<p>\"It has,\" said Snell. \"It's been eight years. I... I didn't come in. I didn't come in. I was... I was building. I was building the Keeper. And I didn't come in.\" He looked at the bowl, at the blue bowl with the chipped rim, and his face was the face of a man looking at a thing he has not seen in eight years. \"You... you left the bowl out. You left the bowl out. For eight years. You left the bowl out.\"</p>", "<p>\"I left the bowl out,\" said Mrs. Crumb. \"That's the job. You leave the bowl out, and the things come home. You leave the bowl out.\" She looked at the collar tag, at the small metal thing in Snell's long hand, and her face did a thing, a remembering thing, a almost-knowing thing. \"That's... that's Biscuit's tag. That's Biscuit's collar tag. That's... that's the dog. That's the dog that ran off. That's Biscuit.\"</p>", "<p>\"Biscuit,\" said Snell, and his voice broke on the word <em>Biscuit</em>, the way a voice breaks when a man has been keeping everything for eight years and has just decided to let one thing go. \"Biscuit. Biscuit. I... I loved him. I loved him. And he ran off. And I looked. And I looked. And I didn't find him. And I... I built the Keeper. I built the Keeper so nothing I love is ever lost again. And I... I lost the loving. I lost the loving. Because keeping is not loving. And I... I let go. I let go. And the love stays. The love stays. And the collar tag... the collar tag led me here. The collar tag led me to the bowl. The collar tag led me to... to the dog.\"</p>", "<p>The collar tag was warm, a homing thing, and it wanted Biscuit. It led past the bowl, past the door, past the counter, past the oven, to the proofing rack. To the proofing rack. Where it was warm. Where the bread rose. Where the stray slept. Where the biscuit-colored dog slept like it had never had a worry in its life.</p>", "<p>And Biscuit was there.</p>", "<p>Biscuit was under the proofing rack, fat, happy, asleep, the color of a biscuit, the color of a thing loved and fed and warm for eight years. Old now. Different from the thin, wary, hungry stray that had come to the bowl eight years ago. Different, and the same. Biscuit.</p>", "<p>Snell looked at the dog under the proofing rack, and he did not recognize him. Not at first. Not at first. Because the dog was fat. Because the dog was old. Because the dog was different. Because the dog was not the thin, wary, hungry stray that had come to the bowl eight years ago. And Snell looked at the dog, and he said, \"That's... that's not Biscuit. That's not... that's not my dog. My dog was... my dog was thin. My dog was... my dog was wary. My dog was... my dog was hungry. That's... that's not my dog.\"</p>", "<p>And Mrs. Crumb, who was a large, floury, unhurried woman with forearms like a rower and a face that had decided a long time ago to be kind, said, \"Silas. Silas. Look. Look at the dog. Look at the dog. It's... it's been eight years. Eight years. The dog's been... the dog's been fed. The dog's been warm. The dog's been loved. The dog's been... the dog's been under the proofing rack, where it's warm, where the bread rises, and I've been... I've been leaving the bowl out. And the dog's been drinking. And the dog's been... the dog's been happy. And the dog's been... the dog's been waiting. The dog's been waiting for you. The dog's been waiting for you for eight years. And the dog's... the dog's different. But the dog's the same. The dog's Biscuit. The dog's Biscuit. Some things come back differently, Silas. Some things come back differently. But the love stays. The love stays.\"</p>", "<p>And Snell, who was a man shaped like an umbrella, who had been alone eight years, looked at the dog under the proofing rack, and he looked at the fat, and the old, and the happy, and the different, and he said, \"Differently. Biscuit comes back... differently.\" And he knelt down. He knelt down, the way you kneel when you are about to do a thing you have been avoiding for eight years, and he held out the collar tag, the small metal thing, the first thing, the thing that started it, and he said, \"Biscuit. Biscuit. It's... it's me. It's me. It's Silas. It's... it's the bowl. It's the bowl. It's the... it's the head on the foot. It's the head on the foot. It's the... it's the never once late. It's me. It's me. Biscuit. Biscuit. It's me.\"</p>", "<p>And Biscuit woke up.</p>", "<p>Biscuit woke up the way a dog wakes up when it hears a voice it has been waiting for for eight years, which is to say all at once, which is to say with a sound, which is to say with a sound that was not quite a bark and not quite a whine, a sound that was eight years of waiting, coming home. And Biscuit looked at the man shaped like an umbrella, and Biscuit looked at the collar tag, and Biscuit looked at the long hand, and Biscuit... Biscuit remembered. Biscuit remembered the bowl. Biscuit remembered the head on the foot. Biscuit remembered the never once late. Biscuit remembered the love. And Biscuit came to him, all at once, with a sound that was a homecoming. And Biscuit put his head on Snell's foot. Just his head. On his foot. The way he used to. The way he always did. And Snell, who was a man shaped like an umbrella, who had been alone eight years, who had just let go, put his long hand on Biscuit's head, and he said, \"Biscuit. Biscuit. You're... you're here. You're here. You're here. You're... you're different. You're fat. You're old. You're... you're different. And I... I still love you. I still love you. Even different. Even old. Even fat. I still love you. Because the love stays. The love stays. Even when the thing comes back differently. The love stays.\"</p>", "<p>And Biscuit put his head on Snell's foot, and Snell put his long hand on Biscuit's head, and the reunion was a reunion, and the love stayed.</p>", "<p>And Mrs. Crumb, who was a large, floury, unhurried woman, wiped her eyes on her apron, and she said, \"I left the bowl out. That's the job. You leave the bowl out, and the things come home. You leave the bowl out.\" And she refilled the bowl, the way she did every morning, the way she had every morning for eight years, and the bowl was full, and the bowl was the job, and the bowl was the only thing left that looked like love.</p>", "<p>And Pip, who was eleven, who had a label maker, who had just watched a man shaped like an umbrella kneel down and put his long hand on a fat, old, happy dog's head, felt the thing go warm in his chest, the rearranging, the furniture-moving, the thing he did not have a label for yet. And he thought: <em>some things come back differently. Some things come back differently. But the love stays. The love stays. Even when the thing comes back differently. The love stays.</em> And he filed it. He filed it with a little star on the tag. And he thought: <em>that's the answer. That's the whole answer. Some things come back differently. But the love stays.</em></p>", "<p>And Ollie, who was six, who was brave in small, loud ways, who was holding Captain Chomp, who was the Official Counter, who was going to count to zero, looked at the dog, at the man, at the reunion, and he said, \"The dog came back. The dog came back differently. But the dog came back. And the love stays. And the love stays.\" And he looked at Pip with his whole face. \"Pip. The number. The number. I'm going to count to zero. I'm going to count to zero. I promise.\"</p>", "<p>And the reunion was a reunion, and the love stayed.</p>", "<p>And the picnic was coming. The picnic was the next chapter. The picnic was the bring-a-thing-you-love. The picnic was the answer.</p>", "<p>But that was later. That was the picnic. That was the next chapter.</p>", "<p>For now, there was a dog under a proofing rack, and a man with a long hand on a fat, old, happy head, and a bowl that was full, and a love that stayed.</p>", "<p>For now, that was enough.</p>"]}, {"id": "ch40", "label": "Chapter 40", "title": "Chapter 40 - The Lost-and-Found Picnic", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\">\n<defs>\n    <g id=\"pip\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <line x1=\"-10\" y1=\"372\" x2=\"-10\" y2=\"384\"/>\n      <line x1=\"10\" y1=\"372\" x2=\"10\" y2=\"384\"/>\n      <rect x=\"-32\" y=\"382\" width=\"64\" height=\"88\" fill=\"#E4572E\"/>\n      <line x1=\"-32\" y1=\"398\" x2=\"-52\" y2=\"446\"/>\n      <line x1=\"32\" y1=\"398\" x2=\"56\" y2=\"438\"/>\n      <circle cx=\"-52\" cy=\"450\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"46\" y=\"428\" width=\"34\" height=\"22\" fill=\"#E9C46A\"/>\n      <line x1=\"52\" y1=\"439\" x2=\"74\" y2=\"439\"/>\n      <rect x=\"80\" y=\"435\" width=\"12\" height=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"56\" cy=\"442\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"-32\" y=\"466\" width=\"64\" height=\"20\" fill=\"#2B2B2B\"/>\n      <line x1=\"-14\" y1=\"486\" x2=\"-14\" y2=\"550\"/>\n      <line x1=\"14\" y1=\"486\" x2=\"14\" y2=\"550\"/>\n      <ellipse cx=\"-16\" cy=\"552\" rx=\"16\" ry=\"8\" fill=\"#2B2B2B\"/>\n      <ellipse cx=\"18\" cy=\"552\" rx=\"16\" ry=\"8\" fill=\"#2B2B2B\"/>\n      <circle cx=\"0\" cy=\"338\" r=\"40\" fill=\"#FFF8EC\"/>\n      <path d=\"M -40 334 Q -40 296 0 296 Q 40 296 40 334 Q 26 314 0 316 Q -26 314 -40 334 Z\" fill=\"#2B2B2B\"/>\n      <circle cx=\"8\" cy=\"336\" r=\"4\" fill=\"#2B2B2B\"/>\n      <circle cx=\"26\" cy=\"336\" r=\"4\" fill=\"#2B2B2B\"/>\n      <path d=\"M 12 356 Q 22 364 32 356\" fill=\"none\"/>\n    </g>\n    <g id=\"goldie\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke cx=\"6\" cy=\"506\" rx=\"30\" ry=\"36\" fill=\"#E9C46A\"/>\n      <line x1=\"-6\" y1=\"486\" x2=\"18\" y2=\"486\"/>\n      <line x1=\"-6\" y1=\"502\" x2=\"18\" y2=\"502\"/>\n      <line x1=\"-6\" y1=\"518\" x2=\"18\" y2=\"518\"/>\n      <ellipse cx=\"-22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <line x1=\"-30\" y1=\"450\" x2=\"-48\" y2=\"470\"/>\n      <line x1=\"30\" y1=\"450\" x2=\"50\" y2=\"468\"/>\n      <circle cx=\"6\" cy=\"400\" r=\"42\" fill=\"#2A9D8F\"/>\n      <path d=\"M 30 380 L 56 388 L 32 398 Z\" fill=\"#2A9D8F\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"3\" fill=\"#2B2B2B\"/>\n      <circle cx=\"-12\" cy=\"392\" r=\"8\" fill=\"#E9C46A\"/>\n      <line x1=\"-16\" y1=\"388\" x2=\"-8\" y2=\"396\"/>\n      <line x1=\"-8\" y1=\"388\" x2=\"-16\" y2=\"396\"/>\n      <path d=\"M 20 416 Q 30 424 42 416\" fill=\"none\"/>\n      <path d=\"M -20 362 L -14 348 L -6 362 L 2 348 L 10 362\" fill=\"none\"/>\n    </g>\n  </defs>\n  <rect x=\"0\" y=\"0\" width=\"800\" height=\"600\" fill=\"#FFF8EC\"/>\n  <path d=\"M 40 110 Q 200 150 400 110 Q 600 150 760 110\" fill=\"none\" stroke=\"#E4572E\" stroke-width=\"5\"/>\n  <path d=\"M 140 128 l 14 26 l 14 -26 Z\" fill=\"#E9C46A\"/>\n  <path d=\"M 340 128 l 14 26 l 14 -26 Z\" fill=\"#2A9D8F\"/>\n  <path d=\"M 540 128 l 14 26 l 14 -26 Z\" fill=\"#E9C46A\"/>\n  <rect x=\"600\" y=\"220\" width=\"150\" height=\"340\" fill=\"#2A9D8F\"/>\n  <circle cx=\"725\" cy=\"390\" r=\"9\" fill=\"#E9C46A\"/>\n  <rect x=\"625\" y=\"300\" width=\"100\" height=\"44\" fill=\"#FFF8EC\"/>\n  <text x=\"675\" y=\"331\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"24\" fill=\"#2B2B2B\">FOUND</text>\n  <rect x=\"120\" y=\"470\" width=\"360\" height=\"24\" fill=\"#8B5E3C\"/>\n  <use href=\"#pip\" transform=\"translate(480,168) scale(0.7)\"/>\n  <use href=\"#ollie\" transform=\"translate(200,280) scale(0.5)\"/>\n  <use href=\"#captain-chomp\" transform=\"translate(280,330) scale(0.4)\"/>\n  <use href=\"#goldie\" transform=\"translate(380,252) scale(0.55)\"/>\n  <use href=\"#barnaby\" transform=\"translate(120,224) scale(0.6)\"/>\n  <use href=\"#snell\" transform=\"translate(560,252) scale(0.55)\"/>\n  <use href=\"#biscuit\" transform=\"translate(60,330) scale(0.4)\"/>\n  <text x=\"400\" y=\"60\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"22\" fill=\"#8B5E3C\">the lost-and-found picnic</text>\n  <text x=\"400\" y=\"592\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"15\" fill=\"#2B2B2B\">zero: nothing's missing</text></svg>\n", "head": "Chapter 40 - The Lost-and-Found Picnic", "paras": ["<p>The picnic was the picnic, and the picnic was the bring-a-thing-you-love, and the town came. The town came with its things. The town came with the things it loved. The town came with the music boxes and the telescopes and the harmonicas and the red mittens, the things that had gone home along the sock trail, the things that had been kept and were now warm, the things that had been almost and were now home. And the town sat together, in the park, on the first day of fall, under the bunting and the lights, and the town ate, and the town was together, and the town brought a thing it loved.</p>", "<p>And Ollie, who was six, who was the Official Counter, who was brave in small, loud ways, stood on a table, because you stood on a table when you were about to do a thing you had promised, and he held his page, the one that said OFFICIAL COUNTER, OLLIE PARKER, AGE 6, VERY GOOD AT COUNTING, and he said, \"I'm going to count to zero. I'm going to count to zero. I promised. I'm the Official Counter. I count to zero. And zero means nothing's missing. And zero is the best number. And I'm going to count to zero.\"</p>", "<p>He counted the things home - the music box, the telescope, the harmonica, the red mitten, the eighteen, the nineteen, the twenty, the everything. He counted them down, and the town counted with him, and the number went down, and down, and down.</p>", "<p>And the number got to zero.</p>", "<p>\"Zero,\" said Ollie. \"Zero. Nothing's missing. Nothing's missing. Zero.\" And he looked at Pip with his whole face, and he said, \"I counted to zero. I counted to zero. I promised. And I did it. I did it. I counted to zero.\" And he held up the page, and the page said ZERO, and the town cheered, and the town cheered for the Official Counter, and the town cheered for the zero, and the zero was the best number, and the zero was the nothing's missing, and the zero was the home.</p>", "<p>And Goldie, who was twelve, who knew every shortcut, who had a pocket that was empty, the marble spent, the paperclip spent, the rubber band spent, the three useless things that had done the job, sat on the grass, and she patted the empty pocket, and the pocket jingled, but the jingle was a different jingle, the jingle of a pocket that has done the job, the jingle of a pocket that is empty and is full. And she reached into the pocket, and she found a thing, a new thing, a thing she had not known was there, a button, a small blue button, four-holed, the kind that holds a coat together, the kind that is a promise. And she held it up, and she said, \"Huh. A button. A new button. A new useless thing.\" And she smiled the shortcut smile and said, \"The sad's the good kind. The sad's the good kind. The kind that means it was real. And the pocket... the pocket's got a new thing. The pocket's got a new useless thing. And I love it. And I don't mind when it goes. Those are two different things.\" And she put the button in the pocket, and the pocket jingled the small, satisfied jingle, and the pocket was full again, and the pocket was the pocket, and the pocket was the love.</p>", "<p>And Thimble, who sorted the socks, who gave spare buttons to lost coats, who was prepared for loss, got his red star button back. The coat came home, the coat that had been kept, the coat that had been pulled, the coat that had had the red star button popped off, and the coat came home along the sock trail, and the red star button came home with it, and Thimble held the red star button in his paw, and he said, \"There. There. You came back. You came back. I expect you to come loose, and I expect to fix you, and I am not going anywhere. And you came back. And I'm not going anywhere. And the word is let go. And the word is let go. And the word is... the word is home.\" And he put the red star button back in his quills, and his quills clicked, and the buttons were there, and the red star was there, and the red star was home.</p>", "<p>And Miss Whisk, who was the Head Cataloguer, who kept the record of everyone's loving, who had a bell in the back under administrative, stamped the ledger, and the stamp said GOING HOME, and it was the last GOING HOME, and her paw did not shake, and the almost-smile was there, in the corner, permanent now. And she went to the back, to the file, to the BELL. ADMINISTRATIVE., and she left the drawer open a little, so it got some air, so it knew it was not forgotten. And she said, \"The love stays. Even when the bell is gone. The love stays. And the bowl... the bowl is left out. The bowl is left out. And that's the job. That's the whole job.\" And her paw went to her empty collar, and she did not mind, and the not-minding was the good kind, the kind that means it was real.</p>", "<p>And Snell came to the picnic. Snell came to the picnic with Biscuit. Biscuit, who was fat, who was happy, who was old, who was different, who was the same, who was Biscuit. Snell sat on the grass, and Biscuit put his head on his foot, just his head, on his foot, the way he used to, the way he always did, and Snell put his long hand on Biscuit's head, and he was not alone. He was not alone. He was not alone. And the town came to him, and the town said, \"Silas. Silas Snell. Welcome back. Welcome back. It's been eight years. Welcome back.\" And Snell said, \"Thank you. Thank you. It's... it's good to be back. It's good to be... it's good to be not alone.\" And the collar tag was in his pocket, and the collar tag was warm, and the collar tag was home.</p>", "<p>And the Keeper was an ordinary shed. The Keeper was an ordinary shed, and the town made it a shelter, a place for the picnic, a place for the things, a place for the waiting, and the shed was not a Keeper anymore, the shed was a shed, and the shed was a home. And the house with too many curtains opened the curtains. The house opened the curtains, and the light came in, and the house was not holding its breath anymore, and the house was a house, and the house was a home.</p>", "<p>And Pip, who was eleven, who had a label maker, who had come to Marrow's End feeling like a lost thing, who had labeled his shoe STILL HERE because he had not been sure it was true, sat on the grass, and he looked at the town, at the picnic, at the things that were home, at the brother who had counted to zero, at the girl whose pocket was full again, at the hedgehog whose red star was home, at the cat whose almost-smile was permanent, at the walrus who leaked contentedly, at the man shaped like an umbrella who was not alone, at the dog who was fat and happy and different and the same. And he felt the thing go warm in his chest, the rearranging, the furniture-moving, the thing he did not have a label for yet. And he thought: <em>I'm not a lost thing anymore. I'm found. I'm a keeper. And the love stays - even when the thing is lost, even when it's kept, even when it's gone, even when it comes back differently. The love stays.</em></p>", "<p>And he thought: <em>feeling lost is not the same as being unloved. I felt lost, and I was loved the whole time. The loving was the ground under the fog. I just needed to find the Bureau to see it. And I found the Bureau. And I found the home.</em></p>", "<p>And the picnic was the picnic, and the town was together, and the things were home, and the love stayed, and the zero was the best number, and the first day of fall was the first day of fall, and the Finding Day was the Finding Day, and the best day was the best day.</p>", "<p>And Pip, who was eleven, who had a label maker, who had decided on the first night that nothing in this family would ever get lost, who had learned that you can't keep everything you love, who had learned that some things come back differently, who had learned that the love stays, took out the label maker. And he went to the Bureau. He went to the green door, the small green door, the door that was shy, the door that only showed itself to people who had lost something they truly loved, the door that was the way in, and the way out, and the way home. And the door was back in the school wall, where it belonged, where it had been pulled from, where it had come back to. And the door was found. And the door was home.</p>", "<p>And Pip printed one last label. And the label was the last label on the roll, the little white tongue of it, the one that had been waiting, the one that had been waiting since the first night, since the STILL HERE, since the FOUND. COMES BACK TO., since the CAPTAIN CHOMP. HOME. And the label was the last label. And the label was the answer. And the label was the love. And the label was the home.</p>", "<p>Then Pip printed one last label, pressed it onto the Bureau's door, and stepped back to read it: FOUND.</p>"]}, {"id": "library", "label": "The Cast", "title": "The Cast of Characters", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\">\n  <defs>\n    <g id=\"pip\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <line x1=\"-10\" y1=\"372\" x2=\"-10\" y2=\"384\"/>\n      <line x1=\"10\" y1=\"372\" x2=\"10\" y2=\"384\"/>\n      <rect x=\"-32\" y=\"382\" width=\"64\" height=\"88\" fill=\"#E4572E\"/>\n      <line x1=\"-32\" y1=\"398\" x2=\"-52\" y2=
