 362 L -14 348 L -6 362 L 2 348 L 10 362\" fill=\"none\"/>\n    </g>\n  </defs>\n  <rect x=\"0\" y=\"0\" width=\"800\" height=\"600\" fill=\"#FFF8EC\"/>\n  <rect x=\"120\" y=\"400\" width=\"560\" height=\"30\" fill=\"#8B5E3C\"/>\n  <line x1=\"160\" y1=\"430\" x2=\"160\" y2=\"560\"/>\n  <line x1=\"640\" y1=\"430\" x2=\"640\" y2=\"560\"/>\n  <ellipse cx=\"300\" cy=\"390\" rx=\"40\" ry=\"12\" fill=\"#FFF8EC\"/>\n  <ellipse cx=\"480\" cy=\"390\" rx=\"40\" ry=\"12\" fill=\"#FFF8EC\"/>\n  <rect x=\"560\" y=\"330\" width=\"80\" height=\"70\" fill=\"#C9A66B\"/>\n  <use href=\"#captain-chomp\" transform=\"translate(600,252) scale(0.4)\"/>\n  <use href=\"#ollie\" transform=\"translate(220,224) scale(0.6)\"/>\n  <use href=\"#pip\" transform=\"translate(420,168) scale(0.7)\"/>\n  <rect x=\"250\" y=\"340\" width=\"120\" height=\"30\" fill=\"#FFF8EC\"/>\n  <text x=\"310\" y=\"361\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#2B2B2B\">HOME. COMES BACK TO.</text>\n  <text x=\"400\" y=\"60\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"22\" fill=\"#8B5E3C\">reports for duty</text>\n  <text x=\"400\" y=\"592\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"15\" fill=\"#2B2B2B\">ground under fog</text></svg>\n", "head": "Chapter 29 - Captain Chomp Reports for Duty", "paras": ["<p>Captain Chomp reported for duty at six o'clock, which was dinner time, and reporting for duty meant sitting at the table in his own chair, which Ollie had made for him out of a shoebox and a great deal of tape, and it meant being served a bite of everything, and it meant roaring, once, at full volume, to announce that he was home and that he was a secret pirate and that the hat was invisible.</p>", "<p>\"He's home,\" Ollie announced, to the table, to the house, to the town, to the world. \"Captain Chomp's home. He's home. He's home. And he's reporting for duty. And he's never going to be lost again. I labeled him. Pip labeled him. The label's a promise. The label says I expect you to come loose, and I expect to fix you, and I am not going anywhere.\"</p>", "<p>\"That's a very good label,\" said Pip's mother, who was setting down the potatoes, and who looked at the dinosaur in the shoebox chair, and who looked at Ollie, and who looked at Pip, and who had the tired-and-proud look, but more proud than tired now, much more proud than tired. \"That's a very good promise.\"</p>", "<p>\"It's Thimble's promise,\" said Ollie. \"Thimble's a hedgehog. He sorts the socks by smell. And he gives spare buttons to lost coats. And he's prepared for loss. And he's not going anywhere.\" He fed Captain Chomp a bite of potato. \"And the label's a spare. And the label's a promise. And I'm not going anywhere either. I'm the Official Counter. I count to zero. And zero means nothing's missing.\"</p>", "<p>Pip's father, who was wrestling a serving spoon, which was a thing he did, which was a thing he always did, looked up and said, \"Who's Thimble?\" And then he said, \"Wait. Don't tell me. It's a long story. It's a... it's a Bureau story.\" He looked at Pip. \"You've been... you've been somewhere. You've been somewhere good. I can tell. You've got the... you've got the look. The look of a boy who's found a place.\"</p>", "<p>And Pip, who was eleven, who had a label maker, who had come to Marrow's End feeling like a lost thing, who had labeled his shoe STILL HERE because he had not been sure it was true, felt something go warm in his chest, because his father had seen it. His father had seen the thing he had not been able to say, which was that he had found a place, that he was not a lost thing anymore, that he was a Friend of the Lost, that he had a job and a title and a cat who corrected his spelling and a hedgehog who gave him spare buttons and a walrus who made up contracts and a girl who took him through fences.</p>", "<p>\"I found a place,\" said Pip. \"I found... I found the Bureau. The Bureau of Lost Things. And I'm a Friend of the Lost. It's not official. Barnaby made it up. But it's true.\" He looked at his father. \"And I'm not... I'm not a lost thing anymore. I was. I was a lost thing. When we moved. I was a lost thing. But I'm not. I'm found. I'm... I'm a keeper. I'm one of the keepers.\"</p>", "<p>And Pip's father, who wrestled furniture and usually lost, set down the serving spoon, and he looked at Pip, and he said, \"Well. Well, look at that. The boy's a keeper. The boy's found a place.\" He reached across the table, and he put his hand on Pip's shoulder, and he said, \"I'm glad. I'm glad you found a place. I'm... I'm glad you're not a lost thing anymore. Because you were never... you were never unloved, Pip. You were never unloved. You were just... you were just new. And new is a kind of lost. And lost is a kind of fog. But the loving was the ground under the fog. It was there the whole time. We were... we were here the whole time.\"</p>", "<p>And Pip, who was eleven, who had a label maker, who had just heard his father say <em>the loving was the ground under the fog</em>, felt the thing go warm in his chest, the rearranging, the furniture-moving, because his father had said the thing he had learned at the Bureau, the thing he had learned on the lost step, the thing about feeling lost not being the same as being unloved. His father had known it the whole time. His father had been the ground under the fog the whole time. And Pip had just... Pip had just needed to find the Bureau to see it.</p>", "<p>They ate. They ate the potatoes and the roast and the peas, and Captain Chomp was served a bite of everything, and he roared, once, at full volume, and the hat was invisible, and the homecoming was a homecoming, and the narrow house, the house with the creaky middle stair and the refrigerator that hummed like it knew a secret, was a home, was a home, was a home.</p>", "<p>And then the hum came.</p>", "<p>It was faint, at the edge of things, under the hill, under the town, a low, steady, keeping note, and it came up through the floor of the narrow house, and Pip felt it, and his mother felt it, and his father felt it, and Ollie felt it, and Captain Chomp, in his shoebox chair, seemed to lean away from it, just a little, just a tremor.</p>", "<p>\"What's that?\" said Pip's mother. \"That hum. What's that hum?\"</p>", "<p>\"The Keeper,\" said Pip. \"It's... it's the Keeper. It's the machine. The man on the hill. Mr. Snell. He built a machine so nothing he loves is ever lost again. And it... it keeps. It keeps everything. And tomorrow, on Finding Day, it's going to keep everything. Everything that's lost. Everything that's loved. And we're going to... we're going to answer it. We're going to show it the love stays.\"</p>", "<p>And Pip's mother, who was a polite person, who had the tired-and-proud look, looked at Pip, and she said, \"The man on the hill. The Snell place. The house with too many curtains.\" She paused, and her face did a thing, a remembering thing. \"I knew him. Before. I knew Silas. He used to... he used to come to the school fairs. He used to make things. He made... he made a music box once, for the fair. And it played a waltz. And everyone danced. And he... he was kind. He was very kind. And then the dog ran off, and he... he stopped coming. He stopped coming to everything.\" She looked at Pip. \"And you're going to help him? You're going to... you're going to answer the heartbreak?\"</p>", "<p>\"We're going to try,\" said Pip. \"Tomorrow. On Finding Day. We're going to show him the love stays. We're going to show him he can let go and still have the love. And we're going to get the things home. The eighteen. The music box. The telescope. The harmonica. The red mitten. We're going to get them home.\"</p>", "<p>And Pip's mother, who was a polite person, who had decided a long time ago to be kind, reached across the table, and she put her hand on Pip's hand, and she said, \"Then I'll bring a thing I love. To the picnic. Tomorrow. I'll bring a thing I love. And I'll... I'll leave the bowl out. That's the job. You leave the bowl out, and the things come home.\" She looked at Pip with the tired-and-proud look, all proud now, all proud. \"You leave the bowl out, Pip. That's the whole thing. You leave the bowl out.\"</p>", "<p>And the hum went on, patient and keeping, under the hill, under the town, and the Keeper was getting ready for Finding Day, and the Keeper was going to keep everything, and the Keeper had let one thing go and did not like it, and the Keeper was going to try again.</p>", "<p>But the narrow house was a home, and the dinosaur was under a chin, and the label said HOME, COMES BACK TO, and the family was together, and the loving was the ground under the fog, and it was there the whole time, and it was there now.</p>", "<p>And tomorrow was Finding Day. And tomorrow, they were going to prove that the love stays.</p>", "<p>But tonight, there was a roast, and a shoebox chair, and a secret pirate with an invisible hat, and a father who wrestled serving spoons, and a mother who had decided to leave the bowl out.</p>", "<p>And tonight, that was a start.</p>"]}, {"id": "ch30", "label": "Chapter 30", "title": "Chapter 30 - The House Grew a New Room", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\">\n<defs>\n    <g id=\"pip\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <line x1=\"-10\" y1=\"372\" x2=\"-10\" y2=\"384\"/>\n      <line x1=\"10\" y1=\"372\" x2=\"10\" y2=\"384\"/>\n      <rect x=\"-32\" y=\"382\" width=\"64\" height=\"88\" fill=\"#E4572E\"/>\n      <line x1=\"-32\" y1=\"398\" x2=\"-52\" y2=\"446\"/>\n      <line x1=\"32\" y1=\"398\" x2=\"56\" y2=\"438\"/>\n      <circle cx=\"-52\" cy=\"450\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"46\" y=\"428\" width=\"34\" height=\"22\" fill=\"#E9C46A\"/>\n      <line x1=\"52\" y1=\"439\" x2=\"74\" y2=\"439\"/>\n      <rect x=\"80\" y=\"435\" width=\"12\" height= "800\" height=\"600\" fill=\"#FFF8EC\"/>\n  <rect x=\"440\" y=\"200\" width=\"240\" height=\"360\" fill=\"#8B5E3C\"/>\n  <rect x=\"680\" y=\"280\" width=\"100\" height=\"280\" fill=\"#C9A66B\"/>\n  <rect x=\"470\" y=\"240\" width=\"50\" height=\"50\" fill=\"#FFF8EC\"/>\n  <rect x=\"560\" y=\"240\" width=\"50\" height=\"50\" fill=\"#FFF8EC\"/>\n  <rect x=\"700\" y=\"320\" width=\"50\" height=\"50\" fill=\"#FFF8EC\"/>\n  <path d=\"M 440 200 L 560 130 L 680 200 Z\" fill=\"#E4572E\"/>\n  <path d=\"M 680 280 L 730 240 L 780 280 Z\" fill=\"#E4572E\"/>\n  <use href=\"#pip\" transform=\"translate(180,168) scale(0.7)\"/>\n  <use href=\"#ollie\" transform=\"translate(300,252) scale(0.55)\"/>\n  <use href=\"#barnaby\" transform=\"translate(90,224) scale(0.6)\"/>\n  <text x=\"400\" y=\"60\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"22\" fill=\"#8B5E3C\">a new room</text>\n  <text x=\"400\" y=\"592\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"15\" fill=\"#2B2B2B\">the false victory</text></svg>\n", "head": "Chapter 30 - The House Grew a New Room", "paras": ["<p>They celebrated, because you celebrated a homecoming, because a homecoming was a thing you celebrated, because the captain was home and the label said HOME, COMES BACK TO, and the shoebox chair had been upgraded to a proper chair, which Ollie had made out of a shoebox and a great deal of tape and a great deal of love, and the celebration was a celebration.</p>", "<p>Barnaby came to the narrow house, which was a thing he did not do, which was a thing he had never done, because the Chief of the Bureau did not leave the Bureau, except on Finding Day, except for a homecoming, except for a secret pirate who had been loved back and had remembered the way. He came through the green door, which showed itself to him because he had lost something he truly loved, which was the whole town, which was the whole waiting, and he came up the hill, and he came to the narrow house, and he was the size of a sofa and gray and could not, by any reasonable definition, be invisible, and he did not try to be, because a homecoming was a thing you were visible for.</p>", "<p>\"To the captain,\" said Barnaby, raising a bun, because he had brought buns, because you did not come to a homecoming without buns, because it was a rule, he had just made it up, but it was true. \"To the captain. To the secret pirate. To the hat that is invisible. To the homecoming.\" He paused, and his whiskers moved, and he said, \"To the first thing going home. To the first of the many. To the zero that is coming.\"</p>", "<p>\"To zero,\" said Ollie, at full volume, which was his way of signing a contract.</p>", "<p>And Miss Whisk came, which was a thing she did not do, which was a thing she had never done, because the Head Cataloguer did not leave the record, except for a homecoming, except to stamp a GOING HOME in person, and she came, and she stamped the ledger, which she had brought, because you did not leave the record at home, and the stamp said GOING HOME, and her paw did not shake, and the almost-smile was there, in the corner, permanent now.</p>", "<p>And Thimble came, which was a thing he did not do, because the rain ones were difficult, because the rain ones smelled like bus stops, but he came, because a homecoming was a thing you came to, and he brought a button, a green one, round, four-holed, almost exactly the green of Captain Chomp, and he said, \"For the captain. A spare. In case. That's what spares are for.\" And Ollie took it with both hands, the way you take a thing that is made of glass, that is made of gold, and he said, \"Thank you. Thank you. The spare's a promise. The spare says I expect you to come loose, and I expect to fix you, and I am not going anywhere.\"</p>", "<p>And Goldie came, which was a thing she always did, because Goldie came to everything, because Goldie was the kind of neighbor who came to everything, and she brought her pocket, the marble and the paperclip and the rubber band, the three useless things that were loved and were not kept, and she said, \"To the captain. To the homecoming. To the love stays.\" And the pocket jingled the small, satisfied jingle, and the homecoming was a homecoming, and the celebration was a celebration.</p>", "<p>And for a little while, for a golden little while, it was enough. For a little while, the captain was home, and the label said HOME, COMES BACK TO, and the family was together, and the Bureau was there, and the buns were eaten, and the loving was the ground under the fog, and it was there the whole time, and it was there now. For a little while, it was enough. For a little while, they had won. They had gotten one thing home. They had answered one heartbreak, a little, just a crack. They had proven that a thing could go home. They had proven that the love stays.</p>", "<p>And then Ollie, who was the Official Counter, who therefore looked at things, who therefore looked out the window, said, \"Pip. Pip, look. The house. The Snell place. Look.\"</p>", "<p>And Pip looked. And the house had grown a new room.</p>", "<p>It was a small thing, at first, a thing you saw the way you see a plant grow, which is to say you saw it if you looked, and if you looked away and looked back it was a little bigger. But this was not a little bigger. This was a new room. A whole new room, on the side of the house, a room that had not been there, a room that the outside of the house did not have room for, a room with a curtained window, a room that was holding its breath. And the hum was louder. The hum was much louder. The hum was a hum you felt in your teeth, in your bones, in the part of you that knows when a thing is too big for the room it is in, and the house was making room, and the Keeper was filling it, and the Keeper was growing.</p>", "<p>\"It grew,\" said Pip. \"The house. It grew a new room.\"</p>", "<p>\"The Keeper grows,\" said Barnaby, and his whiskers went down, and his voice was the voice of a walrus who has been the Chief for a very long time and has just seen a thing he was afraid of. \"The more it keeps, the bigger it gets. And the bigger it gets, the more room it needs. And the house makes room.\" He looked at the new room, at the curtained window, and he said, \"We let one thing go. We let the captain go. And the Keeper... the Keeper compensated. The Keeper kept harder. The Keeper grew. Because... because a machine that keeps does not like to let go. And when it lets one thing go, it keeps everything else harder. It... it makes up for it. It grows.\"</p>", "<p>And Pip, who was eleven, who had a label maker, who had just watched a house grow a new room, felt the ground under the fog go cold, because the homecoming was a homecoming, but the homecoming was also a... the homecoming was also a thing that made the Keeper grow. They had gotten one thing home, and the Keeper had grown. They had answered one heartbreak, a little, just a crack, and the Keeper had grown. They had proven that a thing could go home, and the Keeper had decided to keep everything else harder.</p>", "<p>\"The false victory,\" said Miss Whisk, quietly, and her paw went to her empty collar. \"We won one thing. And the machine grew. That's... that's the false victory. That's the thing that looks like winning and is actually... is actually the machine getting stronger.\" She looked at the new room, at the curtained window, and she said, \"Tomorrow is Finding Day. And tomorrow, the Keeper is going to keep everything. And the Keeper is bigger now. The Keeper is much bigger now. And tomorrow... tomorrow is going to be harder than we thought.\"</p>", "<p>And the celebration was still a celebration, because the captain was home, because the label said HOME, COMES BACK TO, because the family was together, because the loving was the ground under the fog. But the celebration was also a... the celebration was also a thing with a new room in it, a thing with a hum that was louder, a thing with a Keeper that was bigger, a thing with a tomorrow that was going to be harder than they thought.</p>", "<p>And Pip, who was eleven, who had a label maker, who had just watched a house grow a new room, looked at the Bureau, at the walrus and the cat and the hedgehog and the girl, and he said, \"Tomorrow. Tomorrow we answer it. Tomorrow we show it the love stays. Tomorrow we... we make it stop. We have to. We have to make it stop. Because if we don't... if we don't, the Keeper is going to keep everything. And the town is going to forget. And the things are going to be cold. And the almost is going to be everything. We have to make it stop.\"</p>", "<p>\"Tomorrow,\" said Barnaby. \"On Finding Day. The best day. And we are going to make it the best day. We are going to answer the heartbreak. We are going to prove that the love stays.\" He looked at Pip with his small, kind eyes. \"Are you ready, Friend of the Lost?\"</p>", "<p>\"I'm ready,\" said Pip. And he was. He was ready. He had a pocket full of useless junk that was going to help, and a cat with a stamp, and a walrus who says no, and a hedgehog who sorts the socks, and a six-year-old who counts to zero. He was ready. He did not know the how. He did not know the exactly. But he was ready, and being ready was the thing you could do, and the how was the thing that would come, and the how would come because he was ready.</p>", "<p>And the house with too many curtains held its breath, and the new room held its breath, and the Keeper hummed, patient and keeping, bigger now, much bigger now, getting ready for Finding Day.</p>", "<p>And tomorrow was Finding Day. And tomorrow, they were going to prove that the love stays. And tomorrow, they were going to make the best day the best day.</p>", "<p>But tonight, there was a homecoming, and a new room, and a hum that was louder, and a boy who had decided to make a machine stop.</p>", "<p>And tonight, that was a start.</p>"]}, {"id": "ch31", "label": "Chapter 31", "title "head": "Chapter 31 - The Machine That Learned to Want", "paras": ["<p>Finding Day arrived the way the first day of fall always arrives, which is to say it arrived politely, with a coolness in the air and a goldness in the light and a smell of leaves that had decided, overnight, to be beautiful about dying. The town woke up. The town hung the last of the bunting. The town set out the last of the tables. The town was going to sit together, in the park, and eat, and bring a thing it loved, and the picnic was the picnic, and the first day of fall was the first day of fall.</p>", "<p>And under the hill, the Keeper woke up too, and the Keeper had learned to want.</p>", "<p>It started with the hum. The hum, which had been patient and keeping, which had been a low, steady, keeping note, went up. It went up the way a kettle goes up, the way a thing goes up when it has decided to stop being patient. And the town felt it. The town felt it in its teeth, in its bones, in the part of it that knows when a thing is too big for the room it is in. And the town looked up the hill, at the house with too many curtains, at the new room, at the curtained windows, and the town said, \"What's that hum?\" And the town did not know. And the town was about to find out.</p>", "<p>The Keeper pulled.</p>", "<p>It pulled the lost things first. It pulled them from the Bureau, from the shelves, from the bins, from the jars, the claimed and the ready and the going-home, and it pulled them up the hill, into the house, into the keeping room, into the new room, into the rooms that the outside of the house did not have room for. And the Bureau's shelves emptied. The Bureau's shelves emptied the way a beach empties when the tide goes out, which is to say all at once, which is to say with a sound, which is to say with the sound of eighteen clean squares becoming nineteen, becoming twenty, becoming a number that Ollie, who was the Official Counter, did not want to count.</p>", "<p>\"It's taking them,\" Ollie said, and his voice was small, and his voice was loud, and his voice was the voice of a six-year-old who is watching the number go the wrong way. \"It's taking them. It's taking them all. The number's going up. The number's going up. I'm supposed to count to zero. I'm supposed to count to zero. And the number's going up.\"</p>", "<p>\"Count,\" said Miss Whisk, and her voice was flat and precise and dangerous, the voice of the truth's secretary. \"Count them. Count them all. If they're counted, they're not forgotten. If they're not forgotten, they're not gone. Count.\" And Ollie counted. And Ollie counted. And Ollie counted, and the number went up, and the number went up, and the number went up.</p>", "<p>And then the Keeper pulled the town.</p>", "<p>It started with the buttons. The buttons popped off the coats, all of them, all at once, a hundred small brass pops, a hundred small blue pops, a hundred small pearl pops, and the buttons flew up the hill, toward the house, toward the Keeper, and the town stood there, in the park, in the bunting, with its coats unbuttoned, and the town said, \"My buttons!\" And the town did not know. And the town was about to find out.</p>", "<p>And then the socks. The socks migrated. The socks came off the feet, the single socks, the lonely socks, the ones that smelled like toast and rain and grass and someone else's house, and they flew up the hill, toward the house, toward the Keeper, and the town stood there, in the park, in the bunting, with one sock on and one sock off, and the town said, \"My socks!\" And the town did not know. And the town was about to find out.</p>", "<p>And then the umbrellas. The umbrellas flew. The umbrellas came out of the stands, out of the halls, out of the hands, and they flew up the hill, furled and patient, a whole orchard of them, and the town stood there, in the park, in the bunting, under a sky that was suddenly full of umbrellas, and the town said, \"My umbrellas!\" And the town did not know. And the town was about to find out.</p>", "<p>And the Keeper pulled, and the Keeper pulled, and the Keeper pulled, and the hum was loud, and the hum was proud, and the hum was the hum of a machine that had learned to want, and the machine wanted everything, and the machine was going to keep everything, and the machine did not know when to stop.</p>", "<p>\"It's out of control,\" said Barnaby, and he was standing in the Bureau, in the emptying shelves, in the clean squares, and his whiskers were down, and his voice was the voice of a walrus who has been the Chief for a very long time and has just seen a thing he was afraid of. \"It's out of control. The missing gear. The growing. The... the letting the captain go. It compensated. It kept harder. And now it's... now it's keeping everything. It's not just keeping the lost things. It's keeping everything. It's... it's learned to want. And it wants everything. And it does not know when to stop.\"</p>", "<p>\"Mr. Snell,\" said Pip. \"Mr. Snell has to stop it. Mr. Snell built it. Mr. Snell has to stop it.\"</p>", "<p>\"Mr. Snell can't,\" said Goldie, and she was looking up the hill, at the house, at the new room, at the curtained windows, and her face was the face of a girl who knows every shortcut and has just seen a thing that does not have a shortcut. \"Mr. Snell can't stop it. Look.\" And she pointed. And Pip looked. And Snell was at the gate, at the gate of the house with too many curtains, and he was shaped like an umbrella, and he was waving his long arms, and he was shouting at the house, at the Keeper, at the machine, and the machine did not listen. The machine did not listen. The machine pulled, and the machine pulled, and the machine pulled, and Snell was at the gate, and Snell was waving his long arms, and Snell was shouting, and the machine did not listen.</p>", "<p>\"He can't stop it,\" said Pip. \"He built it, and he can't stop it. The machine... the machine learned to want. And the machine wants everything. And the machine does not know when to stop.\" He looked at the Bureau, at the walrus and the cat and the hedgehog and the girl, and he said, \"Then we stop it. We stop it. We answer the heartbreak. We show it the love stays. We... we make it stop. We have to. We have to make it stop.\"</p>", "<p>And the Keeper pulled, and the Keeper pulled, and the Keeper pulled, and the town stood there, in the park, in the bunting, with its coats unbuttoned and its socks off and its umbrellas gone, and the town said, \"What's happening?\" And the town did not know. And the town was about to find out.</p>", "<p>But Pip knew. Pip knew. Pip knew that the machine had learned to want, and that the machine wanted everything, and that the machine did not know when to stop, and that the only thing that could stop a machine that keeps was a thing that lets go. And the thing that lets go was the love stays. And the love stays was the answer. And the answer was the picnic. And the picnic was the bring-a-thing-you-love. And the bring-a-thing-you-love was the thing they were going to show the machine.</p>", "<p>\"Get the pocket,\" said Pip. \"Get the pocket. Get the marble. Get the paperclip. Get the rubber band. Get the button. Get the label. Get the socks. Get the lonely socks. Get everything. We're going up the hill. We're going to answer the heartbreak. We're going to make the machine stop.\"</p>", "<p>And Goldie patted the pocket, and the marble and the paperclip and the rubber band clicked together, the small, satisfied jingle, the jingle of three useless things that were ready, that had been waiting for a job, that were going to help. And Thimble's quills clicked, and the buttons were there, the spare buttons, the promises, the <em>I expect you to come loose, and I expect to fix you, and I am not going anywhere.</em> And Miss Whisk stamped the floor, DO NOT, and the stamp was the truth, and the truth was no. And Barnaby leaked, and the leaking was the leaking of a walrus who was going to say no, and the no was going to be a very large, very kind no.</p>", "<p>And they went to the Bureau, to the emptying shelves, to the clean squares, to plan. Because you did not go up the hill to answer a heartbreak without a plan. Because the plan was the thing. Because the plan was the pocket and the button and the socks and the label, and the plan was the how, and the how was the thing they needed.</p>", "<p>And the town watched them go. And the town said, \"Who are they?\" And the town did not know. And the town was about to find out.</p>", "<p>But that was later. That was the climax. That was the answer.</p>", "<p>For now, there was a machine that had learned to want, and a town with its buttons off, and a pocket full of ready things, and a boy who had decided to make a machine stop.</p>", "<p>For now, that was enough.</p>"]}, {"id": "ch32", "label": "Chapter 32", "title": "Chapter 32 - Everything Is Missing (Including the Missing Things)", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\">\n<defs>\n    <g id=\"pip\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <line x1=\"-10\" y1=\"372\" x2=\"-10\" y2=\"384\"/>\n      <line x1=\"10\" y1=\"372\" x2=\"10\" y2=\"384\"/>\n      <rect x=\"-32\" y=\"382\" width=\"64\" height=\"88\" fill=\"#E4572E\"/>\n      <line x1=\"-32\" y1=\"398\" x2=\"-52\" y2=\"446\"/>\n      <line x1=\"32\" y1=\"398\" x2=\"56\" y2=\"438\"/>\n      <circle cx=\"-52\" cy=\"450\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"46\" y=\"428\" width=\"34\" height=\"22\" fill=\"#E9C46A\"/>\n      <line x1=\"52\" y1=\"439\" x2=\"74\" y2=\"439\"/>\n      <rect x=\"80\" y=\"435\" width=\"12\" height=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"56\" cy=\"442\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"-32\" y=\"466\" width=\"64\" height=\"20\" fill=\"#2B2B2B\"/>\n      <line x1=\"-14\" y1=\"486\" x2=\"-14\" y2=\"550\"/>\n      <line x1=\"14\" y1=\"486\" x2=\"14\" y2=\"550\"/>\n  fill=\"#2B2B2B\"/>\n      <circle cx=\"56\" cy=\"444\" r=\"4\" fill=\"#2B2B2B\"/>\n      <path d=\"M 30 424 Q 20 404 36 400 Q 48 402 44 424 Z\" fill=\"#8B5E3C\"/>\n      <path d=\"M 66 478 Q 74 486 84 478\" fill=\"none\"/>\n      <path d=\"M 40 486 Q 52 494 64 486\" fill=\"none\"/>\n    </g>\n    <g id=\"captain-chomp\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <path d=\"M -40 500 Q -70 490 -74 460 Q -70 440 -52 446\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"0\" cy=\"490\" rx=\"52\" ry=\"60\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"6\" cy=\"506\" rx=\"30\" ry=\"36\" fill=\"#E9C46A\"/>\n      <line x1=\"-6\" y1=\"486\" x2=\"18\" y2=\"486\"/>\n      <line x1=\"-6\" y1=\"502\" x2=\"18\" y2=\"502\"/>\n      <line x1=\"-6\" y1=\"518\" x2=\"18\" y2=\"518\"/>\n      <ellipse cx=\"-22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <line x1=\"-30\" y1=\"450\" x2=\"-48\" y2=\"470\"/>\n      <line x1=\"30\" y1=\"450\" x2=\"50\" y2=\"468\"/>\n      <circle cx=\"6\" cy=\"400\" r=\"42\" fill=\"#2A9D8F\"/>\n      <path d=\"M 30 380 L 56 388 L 32 398 Z\" fill=\"#2A9D8F\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"3\" fill=\"#2B2B2B\"/>\n      <circle cx=\"-12\" cy=\"392\" r=\"8\" fill=\"#E9C46A\"/>\n      <line x1=\"-16\" y1=\"388\" x2=\"-8\" y2=\"396\"/>\n      <line x1=\"-8\" y1=\"388\" x2=\"-16\" y2=\"396\"/>\n      <path d=\"M 20 416 Q 30 424 42 416\" fill=\"none\"/>\n      <path d=\"M -20 362 L -14 348 L -6 362 L 2 348 L 10 362\" fill=\"none\"/>\n    </g>\n  </defs>\n  <rect x=\"0\" y=\"0\" width=\"800\" height=\"600\" fill=\"#FFF8EC\"/>\n  <rect x=\"40\" y=\"220\" width=\"300\" height=\"16\" fill=\"#8B5E3C\"/>\n  <rect x=\"40\" y=\"340\" width=\"300\" height=\"16\" fill=\"#8B5E3C\"/>\n  <rect x=\"70\" y=\"170\" width=\"60\" height=\"50\" fill=\"#FFF8EC\" stroke-dasharray=\"6 6\"/>\n  <rect x=\"160\" y=\"170\" width=\"60\" height=\"50\" fill=\"#FFF8EC\" stroke-dasharray=\"6 6\"/>\n  <rect x=\"250\" y=\"170\" width=\"60\" height=\"50\" fill=\"#FFF8EC\" stroke-dasharray=\"6 6\"/>\n  <rect x=\"120\" y=\"380\" width=\"180\" height=\"40\" fill=\"#E4572E\"/>\n  <text x=\"210\" y=\"406\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"16\" fill=\"#FFF8EC\">DO NOT</text>\n  <use href=\"#barnaby\" transform=\"translate(500,168) scale(0.7)\"/>\n  <use href=\"#miss-whisk\" transform=\"translate(660,224) scale(0.6)\"/>\n  <use href=\"#ollie\" transform=\"translate(400,280) scale(0.5)\"/>\n  <use href=\"#thimble\" transform=\"translate(740,308) scale(0.45)\"/>\n  <text x=\"400\" y=\"60\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"22\" fill=\"#8B5E3C\">everything is missing</text>\n  <text x=\"400\" y=\"592\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"15\" fill=\"#2B2B2B\">you wait</text></svg>\n", "head": "Chapter 32 - Everything Is Missing (Including the Missing Things)", "paras": ["<p>The Bureau was emptying, and the Bureau had never emptied, and the emptying was a thing that had a sound, and the sound was the sound of a waiting room becoming a room that was not waiting anymore.</p>", "<p>Miss Whisk stamped the floor. She stamped it DO NOT, the way she had stamped it when the Keeper reached for Goldie's pocket, the way she had stamped it when the Keeper reached for the captain, and the stamp was the truth, and the truth was no. And the Keeper slowed. The Keeper slowed the way a thing slows when it is told no by a cat with a stamp. But the Keeper did not stop. The Keeper was bigger now. The Keeper was much bigger now. And the Keeper slowed, and the Keeper kept pulling, and the shelves kept emptying, and Miss Whisk stamped, and Miss Whisk stamped, and Miss Whisk stamped, and her paw was shaking, and the almost-smile was gone, and the truth was no, and the no was not enough.</p>", "<p>\"It's not enough,\" she said, and her voice was flat and precise and dangerous, but it was also, for the first time, a little afraid. \"The stamp. The no. It's not enough. The Keeper is bigger. The Keeper is much bigger. And the no... the no is not enough.\" She looked at her stamp, and her paw was shaking, and she put it behind her back so nobody would see. \"I have been the truth's secretary for a long time. And the truth has always been enough. And now... now the truth is not enough. And I do not know what to do when the truth is not enough.\"</p>", "<p>And Barnaby, who was the Chief, who had been the Chief for a very long time, who had spent his whole life keeping things safe and had just learned that safe was not a thing you could promise, sat down on a lost step, heavily, and the step said STEP. STILL LOOKING., and Barnaby put his face in his flippers, and he made a sound that was not quite a sob and not quite a hum, a sound that was a walrus who has been the Chief for a very long time and has just learned that the no is not enough.</p>", "<p>\"I don't know,\" he said. \"I don't know what to do. I have been the Chief for a very long time. And I have always known what to do. And now... now I don't know. The Keeper is bigger. The Keeper is much bigger. And the no is not enough. And the stamp is not enough. And the... and the waiting is not enough. And I don't know what to do.\" He looked up, and his small eyes were wet, and his whiskers were down, and he was a very old, very kind, very tired walrus who had just learned that the thing he had been the Chief of was not enough. \"I don't know what to do.\"</p>", "<p>And the Bureau was quiet. The Bureau was quiet the way a room is quiet when the person who is supposed to know what to do has just said <em>I don't know what to do.</em> And the shelves kept emptying. And the Keeper kept pulling. And the hum was loud. And the hum was proud. And the hum was the hum of a machine that had learned to want.</p>", "<p>And then Ollie, who was six, who was the Official Counter, who was brave in small, loud ways, said, \"You wait.\"</p>", "<p>Barnaby looked up. \"What?\"</p>", "<p>\"You wait,\" said Ollie. \"That's what you do. You wait. You said. You said a thing that is lost is not gone. It's waiting. And a thing that is waiting should not wait alone. That's what you said. That's the whole Bureau. The rest is paperwork.\" He looked at Barnaby with his whole face. \"So you wait. You wait with the things. You wait with the things that are being taken. You wait with them. And you love them back. And you remember them. And you count them. And you... you don't let them be forgotten. That's what you do. That's the whole thing. You wait.\"</p>", "<p>And Barnaby, who was the Chief, who had been the Chief for a very long time, who had just said <em>I don't know what to do</em>, looked at the six-year-old who had just said <em>you wait</em>, and the thing that had gone out of him came back, a little, just a little, just a spark, and he said, \"I wait. I wait with the things. I wait with them. And I love them back. And I remember them. And I count them. And I don't let them be forgotten.\" He stood up, heavily, and his whiskers moved, and he said, \"That's what I do. That's the whole thing. I wait. And the waiting is not nothing. The waiting is the thing. The waiting is the love. And the love stays. Even when the thing is taken. Even when the thing is kept. Even when the thing is gone. The love stays.\"</p>", "<p>And Miss Whisk, who was the Head Cataloguer, who kept the record of everyone's loving, took her paw from behind her back, and she looked at her stamp, and she said, \"The no is not enough. But the record is enough. The record is the truth. And the truth is that the things are loved. And the truth is that the love stays. And I am going to write it down. I am going to write down every thing that is taken, and every person who loves it, and I am going to write down that the love stays. And the record is going to be the thing that is enough. Because the record is the love. And the love stays.\" And she stamped the ledger, and the stamp said LOVED, and it was a new stamp, a stamp she had just made up, and it was true.</p>", "<p>And Thimble, who sorted the socks, who gave spare buttons to lost coats, who was prepared for loss, said, \"The socks. The lonely socks. They want home. They want home more than anything. And the Keeper is taking them. But the socks... the socks are homing things. And a homing thing does not stay kept. A homing thing finds its way. And the socks are going to find their way. And they're going to lead the way. And I'm going to help them.\" And his quills clicked, and the buttons were there, the spare buttons, the promises, and he was going to use one, and he was going to have a word.</p>", "<p>And Goldie, who knew every shortcut, who had a pocket full of useless junk, patted the pocket, and the marble and the paperclip and the rubber band clicked together, the small, satisfied jingle, and she said, \"The pocket's ready. The pocket's been ready. The pocket's been knowing things for years. And the pocket knows the how. And the how is the marble, and the paperclip, and the rubber band. And the how is the three useless things. And the how is the thing we're going to show the machine.\" She looked at Pip with her shortcut eyes, her kind, calm, shortcut eyes. \"The pocket knows, Pip. The pocket knows the how. And we're going to listen.\"</p>", "<p>And Pip, who was eleven, who had a label maker, who had a pocket full of ready things and a cat with a stamp and a walrus who waits and a hedgehog who sorts the socks and a six-year-old who counts to zero, felt the thing settle into him, hard and clear, like a label pressed onto a thing that was not going anywhere. The how was coming. The how was the pocket. The how was the socks. The how was the button. The how was the label. And the how was the love stays. And the love stays was the answer. And the answer was the thing they were going to show the machine.</p>", "<p>\"Then we go,\" said Pip. \"We go up the hill. We go to the house. We go to the Keeper. And we answer the heartbreak. And we show it the love stays. And we make it stop.\" He looked at the Bureau, at the walrus and the cat and the hedgehog and the girl and the six-year-old, and he said, \"Are you ready?\"</p>", "<p>\"I'm ready,\" said Barnaby.</p>", "<p>\"I'm ready,\" said Miss Whisk.</p>", "<p>\"I'm ready,\" said Thimble.</p>", "<p>\"I'm ready,\" said Goldie.</p>", "<p>\"I'm ready,\" said Ollie, at full volume, which was his way of signing a contract. \"I'm the Official Counter. I count to zero. And I'm going to count to zero. I promise.\"</p>", "<p>And they went to the big door, the one at the back, the one that was the only way in or out, and Barnaby opened it, and the door opened the way a door opens when a walrus has decided to be brave, and they went out, into the town, into the first day of fall, into the bunting and the tables and the unbuttoned coats and the one-sock-on feet and the sky that was full of umbrellas.</p>", "<p>And the town watched them go. And the town said, \"Who are they?\" And the town did not know. And the town was about to find out.</p>", "<p>And under the hill, the Keeper hummed, patient and keeping, bigger now, much bigger now, and it had learned to want, and it wanted everything, and it did not know when to stop.</p>", "<p>But the Bureau was going up the hill. The Bureau was going to answer the heartbreak. The Bureau was going to show the machine the love stays.</p>", "<p>And the machine was going to find out that the love stays, even when the thing is kept, even when the thing is gone.</p>", "<p>But that was the climax. That was the answer.</p>", "<p>For now, there was a Bureau going up the hill, and a pocket full of ready things, and a six-year-old who was going to count to zero.</p>", "<p>For now, that was enough.</p>"]}, {"id": "ch33", "label": "Chapter 33", "title": "Chapter =\"#FFF8EC\">leads home</text>\n  <rect x=\"330\" y=\"380\" width=\"140\" height=\"40\" fill=\"#FFF8EC\"/>\n  <text x=\"400\" y=\"406\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#2B2B2B\">FOUND. COMES BACK TO.</text>\n  <use href=\"#pip\" transform=\"translate(80,252) scale(0.55)\"/>\n  <use href=\"#goldie\" transform=\"translate(720,252) scale(0.55)\"/>\n  <text x=\"400\" y=\"60\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"22\" fill=\"#8B5E3C\">the plan</text>\n  <text x=\"400\" y=\"592\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"15\" fill=\"#2B2B2B\">useless, so ready</text></svg>\n", "head": "Chapter 33 - A Plan with Socks in It", "paras": ["<p>They made the plan on the back of a lost door, because the case board was there, and because Goldie said the best plans were made on lost things, because lost things knew what it was to need a plan.</p>", "<p>\"Here's what we've got,\" said Pip, printing labels and sticking them to the door, connecting them with string Goldie found in her pocket. \"The pocket. The button. The label. The socks. And the love stays, which is the answer. The rest is the how. So let's figure out the how.\"</p>", "<p>\"The pocket first,\" said Goldie, and she turned the pocket half inside out, the way she did, and let the contents spill into her palm. \"Exhibit A. The marble. The paperclip. The rubber band. Three useless things. Three ready things.\" She held up the marble, the cat's-eye, the swirl of green and gold. \"The marble. It's glass. It's not brass. It's not metal. And the Keeper... the Keeper is brass. The Keeper pulls with the brass - the metal things, the things that answer to the brass. But the marble is glass. Glass does not answer to the brass. Glass does not get pulled.\" She set the marble on the door, and it rolled an inch, and she stopped it with one finger without looking. \"So the marble can go where we can't. Into the Keeper. It can roll to the heart and show us the off.\"</p>", "<p>\"The off?\" said Ollie.</p>", "<p>\"The off,\" said Goldie. \"Every machine has an off. Every machine has a... a place where it stops. And the marble is going to find it. The marble is going to roll into the Keeper, and the marble is going to roll to the heart, and the marble is going to show us the off. Because the marble is glass. And the glass does not get pulled. And the glass can go where we can't.\" She looked at Pip. \"That's the marble's job. It's been useless for six years so it could be ready for this one.\"</p>", "<p>And Pip, who was eleven, who had a label maker, who had just heard a girl say <em>the marble's been useless for six years so it could be ready for this job</em>, felt the thing click, quietly, in the drawer where he kept the things that mattered. He filed it. He filed it with a little star on the tag. <em>The marble finds the off.</em></p>", "<p>\"The paperclip,\" said Goldie, and she held up the paperclip, silver and bent. \"The paperclip is bent. The paperclip is thin. And the paperclip can pick. The paperclip can pick a latch. The paperclip can pick a panel. The paperclip can open the thing that needs opening. The Keeper has a panel. The Keeper has a... a maintenance panel. A place where you get in. And the panel is latched. And the paperclip can pick the latch. And the paperclip can open the panel. And then we can get to the heart. And then we can get to the off.\" She hooked the paperclip onto her collar. \"That's the paperclip's job. Bent for years, so it's ready for this one.\"</p>", "<p>\"The rubber band,\" said Goldie, and she held up the rubber band, red and cracked and stretched. \"The rubber band is... the rubber band is a snap. The rubber band is a... a thing that snaps. And the Keeper has a belt. The Keeper has a... a drive belt. A thing that turns. And the rubber band can snap the belt. Or... or the rubber band can launch. The rubber band can launch the first sock. The rubber band can... can start the trail.\" She looked at Thimble. \"That's the rubber band's job. But it needs the socks. And the socks are Thimble's. And the socks are the homing things. And the socks are the trail.\"</p>", "<p>And Thimble, who sorted the socks, who gave spare buttons to lost coats, who was prepared for loss, said, \"The socks. The lonely socks. They want home. They want home more than anything. More than a glove wants its glove. More than a key wants its lock. A lonely sock is a homing thing. And a homing thing does not stay kept. A homing thing finds its way.\" He looked at the bin, the special bin, the one he had labeled READY / GOING HOME / SMELLS LIKE SOMEONE, and he said, \"When the Keeper stops... when the Keeper is jammed, when the Keeper is... when the Keeper is not pulling... the socks go home. The socks find their pairs. The socks find their people. And the socks lead the way. The socks lead the way home. And the things follow the socks home. That's the thing about lonely socks. They're homing things. And a homing thing leads the way.\"</p>", "<p>\"And the button,\" said Pip, and he looked at Thimble, and Thimble's quills clicked, and the buttons were there, the spare buttons, the promises. \"The button. The button jams the gears. The button is... the button is a thing that jams. A button in the gears. A button in the... the teeth. And the gears stop. And the Keeper is jammed. And then the socks go home. And then the things follow. And then the love stays.\" He looked at Thimble. \"That's the button's job. The spare is a promise. And the promise is... the promise is I expect you to come loose, and I expect to fix you, and I am not going anywhere. And the button is going to fix the Keeper. The button is going to fix the Keeper by... by jamming it. By making it stop. By making it... by making it let go.\"</p>", "<p>And Thimble, who was small and round and the color of toast, who had given a red star button to a lost coat, who had had the red star button popped off and taken, who was going to have a word, said, \"The button. Yes. The button. I have a great many spares. I am prepared for loss. And I am going to use it to jam the gears. And I am going to have a word. And the word is let go.\" And his quills clicked, and the buttons were there, and he was going to use one, and he was going to have a word.</p>", "<p>\"And the label,\" said Pip, and he took out the label maker, and he printed a label, and the label said FOUND. COMES BACK TO., and it was the label he had pressed onto the green door, the crooked one, the one that was slightly crooked, the one that would matter. \"The label. The label marks the door. The green door. The door is... the door is going to move. The Keeper is going to pull the door. The Keeper is going to pull everything, and the door is a thing, and the door is going to move. And when the door moves, the label marks it. And we can find it. And we can follow it. And the label is the way home.\" He looked at the label, at the crooked printing, and he said, \"The label's a promise. The label says I expect you to come loose, and I expect to fix you, and I am not going anywhere. And the label is going to mark the door, and lead us back, and be the way home.\"</p>", "<p>The plan was the marble finds the off, the paperclip opens the panel, the button jams the gears, the rubber band launches the first sock, the socks lead the way home, the label marks the door. It was absurd. It was a pocket full of junk and a spare button and a crooked label and a bin of lonely socks. It was the love stays. It was the answer.</p>", "<p>\"It's a terrible plan,\" said Goldie, grinning the shortcut grin. \"The worst. A plan made of junk and socks and a button. A plan that should not work.\" She patted the pocket, and the marble and the paperclip and the rubber band clicked together. \"And it's going to work, because it's made of things that are loved. And things that are loved are ready. And things that are ready save the day. That's the thing about useless things. They're useless so they're ready.\"</p>", "<p>Pip felt the thing settle into him, hard and clear, like a label pressed onto a thing that was not going anywhere. The plan was the answer. The plan was the love stays. And the plan was going to work, because it was made of the things that are loved.</p>", "<p>\"Then we go,\" said Pip. \"Up the hill. To the Keeper. And we answer the heartbreak. And we make it stop.\"</p>", "<p>They were ready. All of them. Even Ollie, who was going to count to zero, who had promised, who was the Official Counter.</p>", "<p>And they went up the hill, toward the house with too many curtains, toward the Keeper, toward the machine that had learned to want. The plan was a pocket full of junk, a spare button, a crooked label, and a bin of lonely socks. The plan was the love stays. And the plan was going to work.</p>"]}, {"id": "ch34", "label": "Chapter 34", "title": "Chapter 34 - The Hill Grew Teeth (Metaphorically)", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\">\n<defs>\n    <g id=\"pip\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <line x1=\"-10\" y1=\"372\" x2=\"-10\" y2=\"384\"/>\n      <line x1=\"10\" y1=\"372\" x2=\"10\" y2=\"384\"/>\n      <rect x=\"-32\" y=\"382\" width=\"64\" height=\"88\" fill=\"#E4572E\"/>\n      <line x1=\"-32\" y1=\"398\" x2=\"-52\" y2=\"446\"/>\n      <line x1=\"32\" y1=\"398\" x2=\"56\" y2=\"438\"/>\n      <circle cx=\"-52\" cy=\"450\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"46\" y=\"428\" width=\"34\" height=\"22\" fill=\"#E9C46A\"/>\n      <line x1=\"52\" y1=\"439\" x2=\"74\" y2=\"439\"/>\n      <rect x=\"80\" y=\"435\" width=\"12\" height=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"56\" cy=\"442\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"-32\" y=\"466\" width=\"64\" height=\"20\" fill=\"#2B2B2B\"/>\n      <line x1=\"-14\" y1=\"486\" x2=\"-14\" y2=\"550\"/>\n      <line x1=\"14\" y1=\"486\" 120\" fill=\"#C9A66B\"/>\n  <rect x=\"740\" y=\"180\" width=\"60\" height=\"140\" fill=\"#C9A66B\"/>\n  <rect x=\"590\" y=\"150\" width=\"40\" height=\"40\" fill=\"#FFF8EC\"/>\n  <rect x=\"660\" y=\"150\" width=\"40\" height=\"40\" fill=\"#FFF8EC\"/>\n  <line x1=\"480\" y1=\"400\" x2=\"480\" y2=\"480\"/>\n  <line x1=\"520\" y1=\"380\" x2=\"520\" y2=\"460\"/>\n  <line x1=\"480\" y1=\"420\" x2=\"520\" y2=\"400\"/>\n  <use href=\"#snell\" transform=\"translate(500,224) scale(0.6)\"/>\n  <use href=\"#pip\" transform=\"translate(140,252) scale(0.55)\"/>\n  <use href=\"#goldie\" transform=\"translate(240,280) scale(0.5)\"/>\n  <use href=\"#barnaby\" transform=\"translate(360,252) scale(0.55)\"/>\n  <text x=\"400\" y=\"60\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"22\" fill=\"#8B5E3C\">the hill's teeth</text>\n  <text x=\"400\" y=\"592\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"15\" fill=\"#2B2B2B\">ready to let go</text></svg>\n", "head": "Chapter 34 - The Hill Grew Teeth (Metaphorically)", "paras": ["<p>The hill had grown teeth, metaphorically, which was the only way Pip could think of it, because the hill was pulling, and the pulling was a thing you felt in your feet, and the pulling was a thing that made the grass lean uphill, and the leaning was a thing that made the hill look like it was... like it was grabbing, like it was holding on, like it had grown teeth and the teeth were the pull and the pull was the Keeper.</p>", "<p>They went up the hill, and the hill pulled. It pulled their coats. It pulled their buttons. It pulled the loose change in Goldie's pocket, the pennies and the paperclip and the marble, and Goldie held the pocket shut with both hands, and she said, \"The hill's got teeth. The hill's got teeth. I don't like the hill's teeth.\" And the hill pulled, and the hill pulled, and the hill pulled, and they leaned into it, the way you lean into a wind, and they went up, and they went up, and they went up.</p>", "<p>And the house was huge.</p>", "<p>The house with too many curtains had grown. It had grown rooms, and rooms, and rooms, and the rooms were stacked and leaned and curved, and the house was the size of a hill now, and the house was the size of a Bureau, and the house was the size of a thing that had been keeping for eight years and had just decided to keep everything. And every window was curtained, and every curtain was drawn, and the house was holding its breath, and the breath was the hum, and the hum was loud, and the hum was proud, and the hum was the hum of a machine that had learned to want.</p>", "<p>And Snell was at the gate.</p>", "<p>He was shaped like an umbrella, and he was waving his long arms, and he was shouting at the house, at the Keeper, at the machine, and the machine did not listen. And when he saw them, when he saw Pip and Goldie and Ollie and Barnaby and Miss Whisk and Thimble, his face did the thing, the soft-sad thing, the thing that was a dog-shaped hole, and he said, \"I can't stop it. I can't stop it. I built it, and I can't stop it. It... it learned to want. It learned to want everything. And I can't stop it. I've been shouting. I've been shouting at it. And it doesn't listen. It doesn't listen anymore. It... it used to listen. It used to hum happy when I was close. And now... now it just pulls. And I can't stop it.\"</p>", "<p>\"Mr. Snell,\" said Pip. \"We're going to stop it. We're going to answer the heartbreak. We're going to show it the love stays. We're going to make it stop.\"</p>", "<p>\"You can't,\" said Snell. \"You can't. It's too big. It's much too big. It's... it's keeping everything. And it's going to keep everything. And you can't... you can't stop a thing that keeps. You can't. I built it to keep. And it keeps. And it keeps. And it keeps.\" He looked at the house, at the rooms, at the curtained windows, and his face was the face of a man looking at a thing he has built and cannot control. \"I built it to keep. And it keeps. And I can't... I can't make it let go. I can't make it let go. I've been trying. I've been trying since... since I let the dinosaur go. Since I let the captain go. And the Keeper... the Keeper kept harder. The Keeper grew. And now... now it's keeping everything. And I can't make it let go.\"</p>", "<p>\"Then we make it,\" said Pip. \"We make it let go. We show it the love stays. We show it that... that keeping is not loving. That keeping is being afraid, with a machine. And we show it that the love stays, even when the thing goes. And we make it let go.\" He looked at Snell with his eleven-year-old eyes, his label-maker eyes, his <em>I will find this and I will write it down and I will make it right</em> eyes. \"Mr. Snell. We need you. We need you to help us. We need you to... to let go. To let go with us. To let go together. Because the Keeper is built around the love. And the love is yours. And the letting go is yours. And we can't... we can't make it let go without you. We need you. We need you to let go.\"</p>", "<p>And Snell, who was a man shaped like an umbrella, who had been alone eight years, who had built a machine so nothing he loves is ever lost again, looked at the boy with the label-maker eyes, and the crack opened, wider than it had ever been, and for a long moment he did not speak. And then he said, \"I... I don't know how. I don't know how to let go. I've been keeping for eight years. I've been keeping. And I don't... I don't know how to let go. I don't know how.\"</p>", "<p>\"We'll show you,\" said Goldie, and she patted the pocket, and the marble and the paperclip and the rubber band clicked together, the small, satisfied jingle. \"We'll show you. The pocket knows. The pocket's been knowing things for years. And the pocket knows how to let go. And we'll show you.\" She looked at Snell with her shortcut eyes, her kind, calm, shortcut eyes. \"I love my stuff, Mr. Snell. I love my stuff. And I don't mind when it goes. Those are two different things. And I'll show you. I'll show you the difference. And you'll see. You'll see that the love stays.\"</p>", "<p>And the hill pulled, and the hill pulled, and the hill pulled, and the house was huge, and the hum was loud, and the Keeper was keeping everything, and it did not know when to stop.</p>", "<p>\"Then we go in,\" said Pip. \"We go in. We go to the heart. We go to the Keeper. And we answer the heartbreak. And we make it stop.\" He looked at the Bureau, at the walrus and the cat and the hedgehog and the girl and the six-year-old, and he looked at Snell, at the man shaped like an umbrella, and he said, \"Are you ready?\"</p>", "<p>\"I'm ready,\" said Barnaby.</p>", "<p>\"I'm ready,\" said Miss Whisk.</p>", "<p>\"I'm ready,\" said Thimble.</p>", "<p>\"I'm ready,\" said Goldie.</p>", "<p>\"I'm ready,\" said Ollie, at full volume, which was his way of signing a contract.</p>", "<p>And Snell, who was a man shaped like an umbrella, who had been alone eight years, who had built a machine so nothing he loves is ever lost again, looked at the boy with the label-maker eyes, and he said, \"I'm... I'm ready. I'm ready to... to try. I'm ready to try to let go.\" And the crack was there, wide, wider than it had ever been, and the man was ready to try, and the trying was the thing, and the trying was the start.</p>", "<p>And they went to the door, the front door, the door of the house with too many curtains, and the door was open, because the Keeper was pulling, and the Keeper was pulling everything, and the door was a thing, and the door was being pulled, and the door was open. And they went in, into the house, into the keeping room, into the rooms that the outside of the house did not have room for, and the Keeper hummed, and the Keeper pulled, and the Keeper was keeping everything, and it did not know when to stop.</p>", "<p>And the hill had grown teeth, metaphorically, and the teeth were the pull, and the pull was the Keeper, and the Keeper was keeping everything, and the Keeper did not know when to stop.</p>", "<p>But the Bureau was in the house. The Bureau was in the house, and the Bureau was going to answer the heartbreak, and the Bureau was going to show the machine the love stays.</p>", "<p>And the machine was going to find out. The machine was going to find out that the love stays, even when the thing is kept, even when the thing is gone.</p>", "<p>But that was later. That was the climax. That was the answer.</p>", "<p>For now, there was a hill with teeth, and a house that was huge, and a man who was ready to try to let go, and a pocket full of ready things.</p>", "<p>For now, that was enough.</p>"]}, {"id": "ch35", "label": "Chapter 35", "title": "Chapter 35 - The Marble That Knew Which Way Was Down", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\">\n<defs>\n    <g id=\"pip\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <line x1=\"-10\" y1=\"372\" x2=\"-10\" y2=\"384\"/>\n      <line x1=\"10\" y1=\"372\" x2=\"10\" y2=\"384\"/>\n      <rect x=\"-32\" y=\"382\" width=\"64\" height=\"88\" fill=\"#E4572E\"/>\n      <line x1=\"-32\" y1=\"398\" x2=\"-52\" y2=\"446\"/>\n      <line x1=\"32\" y1=\"398\" x2=\"56\" y2=\"438\"/>\n      <circle cx=\"-52\" cy=\"450\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"46\" y=\"428\" width=\"34\" height=\"22\" fill=\"#E9C46A\"/>\n      <line x1=\"52\" y1=\"439\" x2=\"74\" y2=\"439\"/>\n      <rect x=\"80\" y=\"435\" width=\"12\" height=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"56\" cy=\"442\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"-32\" y=\"466\" width=\"64\" height=\"20\" fill=\"#2B2B2B\"/>\n      <line x1=\"-14\" y1=\"486\" x2=\"-14\" y2=\"550\"/>\n      <line x1=\"14\" y1=\"486\" x2=\"14\" y2=\"550\"/>\n      <ellipse cx=\"-16\" cy=\"552\" rx=\"16\" ry=\"8\" fill=\"#2B2B2B\"/>\n      <ellipse cx=\"18\" cy=\"552\" rx=\"16\" ry=\"8\" fill=\"#2B2B2B\"/>\n      <circle cx=\"0\" cy=\"338\" r=\"40\" fill=\"#FFF8EC\"/>\ =\"none\"/>\n      <path d=\"M 40 486 Q 52 494 64 486\" fill=\"none\"/>\n    </g>\n    <g id=\"captain-chomp\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <path d=\"M -40 500 Q -70 490 -74 460 Q -70 440 -52 446\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"0\" cy=\"490\" rx=\"52\" ry=\"60\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"6\" cy=\"506\" rx=\"30\" ry=\"36\" fill=\"#E9C46A\"/>\n      <line x1=\"-6\" y1=\"486\" x2=\"18\" y2=\"486\"/>\n      <line x1=\"-6\" y1=\"502\" x2=\"18\" y2=\"502\"/>\n      <line x1=\"-6\" y1=\"518\" x2=\"18\" y2=\"518\"/>\n      <ellipse cx=\"-22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <line x1=\"-30\" y1=\"450\" x2=\"-48\" y2=\"470\"/>\n      <line x1=\"30\" y1=\"450\" x2=\"50\" y2=\"468\"/>\n      <circle cx=\"6\" cy=\"400\" r=\"42\" fill=\"#2A9D8F\"/>\n      <path d=\"M 30 380 L 56 388 L 32 398 Z\" fill=\"#2A9D8F\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"3\" fill=\"#2B2B2B\"/>\n      <circle cx=\"-12\" cy=\"392\" r=\"8\" fill=\"#E9C46A\"/>\n      <line x1=\"-16\" y1=\"388\" x2=\"-8\" y2=\"396\"/>\n      <line x1=\"-8\" y1=\"388\" x2=\"-16\" y2=\"396\"/>\n      <path d=\"M 20 416 Q 30 424 42 416\" fill=\"none\"/>\n      <path d=\"M -20 362 L -14 348 L -6 362 L 2 348 L 10 362\" fill=\"none\"/>\n    </g>\n  </defs>\n  <rect x=\"0\" y=\"0\" width=\"800\" height=\"600\" fill=\"#FFF8EC\"/>\n  <rect x=\"440\" y=\"180\" width=\"320\" height=\"380\" fill=\"#E9C46A\"/>\n  <circle cx=\"520\" cy=\"260\" r=\"34\" fill=\"#C9A66B\"/>\n  <circle cx=\"680\" cy=\"300\" r=\"28\" fill=\"#C9A66B\"/>\n  <circle cx=\"540\" cy=\"480\" r=\"26\" fill=\"#C9A66B\"/>\n  <rect x=\"580\" y=\"330\" width=\"70\" height=\"90\" fill=\"#FFF8EC\"/>\n  <rect x=\"600\" y=\"356\" width=\"30\" height=\"18\" fill=\"#9AA5B1\"/>\n  <path d=\"M 120 520 Q 300 500 440 440 Q 520 400 580 380\" fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"4\" stroke-dasharray=\"8 8\"/>\n  <circle cx=\"180\" cy=\"512\" r=\"18\" fill=\"#2A9D8F\"/>\n  <path d=\"M 172 505 q 8 -6 16 0\" fill=\"none\" stroke=\"#E9C46A\" stroke-width=\"4\"/>\n  <use href=\"#goldie\" transform=\"translate(120,224) scale(0.6)\"/>\n  <use href=\"#pip\" transform=\"translate(280,252) scale(0.55)\"/>\n  <text x=\"400\" y=\"60\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"22\" fill=\"#8B5E3C\">the marble</text>\n  <text x=\"400\" y=\"592\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"15\" fill=\"#2B2B2B\">the free thing</text></svg>\n", "head": "Chapter 35 - The Marble That Knew Which Way Was Down", "paras": ["<p>Inside the house, the pull was a thing you could not think in, and the not-thinking was the problem, because the plan needed thinking, and the pull was a thing that ate thinking, and the pull was a thing that made you want to go uphill, toward the Keeper, toward the keeping, toward the cold, and the wanting was not your wanting, and the wanting was the Keeper's wanting, and the Keeper had learned to want, and the Keeper wanted you to want to be kept.</p>", "<p>\"Think,\" said Pip, and he was leaning into the pull, and his feet were sliding, and his coat was pulling, and his buttons were pulling, and he was thinking, he was trying to think, but the pull was a thing that ate thinking. \"Think. The plan. The marble. The marble finds the off. The marble finds the heart. The marble... the marble...\" He looked at the rooms, at the keeping room, at the rooms that the outside of the house did not have room for, and he could not see the heart. He could not see the way. The pull was a thing that made everything lean uphill, and the leaning was a thing that made everything look the same, and the same was a thing that made you lost, and the lost was a thing that the Keeper wanted, because the Keeper wanted everything to be lost, because the Keeper wanted everything to be kept.</p>", "<p>\"Goldie,\" said Pip. \"The marble. The marble. Roll the marble.\"</p>", "<p>And Goldie, who was leaning into the pull, who was holding the pocket shut with both hands, who was fighting the wanting, the wanting that was not her wanting, the wanting that was the Keeper's wanting, took out the marble. The cat's-eye. The swirl of green and gold. The chip from the church steps. The six years of useless. The six years of ready.</p>", "<p>\"The marble,\" said Goldie. \"The marble's glass. The marble's not brass. The marble doesn't answer to the brass. The marble doesn't get pulled.\" She set the marble on the floor. And the marble did not lean uphill. The marble did not want to be kept. The marble did not answer to the brass. The marble was glass. And the glass was free.</p>", "<p>And the marble rolled.</p>", "<p>It rolled the way a marble rolls, which is to say it rolled true, which is to say it rolled the way the floor went, and the floor went toward the heart, because the floor of the house leaned toward the heart, because the heart was the thing that was pulling, and the floor was the thing that was being pulled, and the floor leaned toward the heart. And the marble rolled toward the heart. And the marble rolled true. And the marble did not lean the way the pull wanted it to lean. The marble rolled the way the floor actually went. And the floor actually went toward the heart. And the marble showed them the way.</p>", "<p>\"Follow the marble,\" said Pip. \"Follow the marble. The marble knows which way is down. The marble knows which way is the heart. The marble... the marble's not pulled. The marble's free. And the free thing shows the way. Follow the marble.\"</p>", "<p>And they followed the marble. They followed the marble through the keeping room, through the rooms that the outside of the house did not have room for, through the pull, through the wanting, through the not-thinking, and the marble rolled true, and the marble rolled toward the heart, and the marble showed them the way. And the pull was a thing that ate thinking, but the marble was a thing that did not think, and the not-thinking was the thing that saved them, because the marble did not think, and the marble did not want, and the marble did not answer to the brass, and the marble rolled true, and the true was the way.</p>", "<p>And the marble rolled to the heart.</p>", "<p>The heart of the house was a room, and the room was the Keeper, and the Keeper was brass and gears and springs and little copper wires, and it was the size of a room, and it was growing, and it was pulling, and it was keeping everything, and it did not know when to stop. And in the middle of the Keeper, in the very heart of it, there was a jar. A small glass jar, set into the brass, held there by the gears, the way a heart is held by the ribs. And in the jar there was something small. Something metal. Something that caught the lamplight. A collar tag. A dog's collar tag. Biscuit's collar tag. The first thing. The thing that started it. The thing the Keeper was built around.</p>", "<p>And the marble rolled to the jar. The marble rolled to the heart. And the marble stopped, because the marble had found the thing it was looking for, because the marble had found the off, because the off was the heart, because the off was the jar, because the off was the love, because the off was the thing the Keeper was built around, and the thing the Keeper was built around was the thing that could make it let go.</p>", "<p>\"There,\" said Goldie. \"There. The marble found it. The marble found the heart. The marble found the off.\" She looked at the jar, at the small metal thing, at the collar tag, and she said, \"The off is the love. The off is the thing the Keeper is built around. The off is... the off is the dog. The off is Biscuit. The off is the love stays.\" She looked at Snell, at the man shaped like an umbrella, and she said, \"Mr. Snell. The off is the love. The off is the thing you built it around. The off is... the off is letting go. The off is letting the love stay, even when the thing goes. The off is you. The off is you letting go.\"</p>", "<p>And Snell, who was a man shaped like an umbrella, who had been alone eight years, who had built a machine so nothing he loves is ever lost again, looked at the jar, at the collar tag, at the first thing, at the thing that started it, and the crack opened, wider than it had ever been, and for a long moment he did not speak. And then he said, \"Biscuit. Biscuit. I... I built it around Biscuit. I built it around... around the love. And the love... the love is still there. The love is still there. Even after eight years. Even with the curtains closed. The love is still there.\"</p>", "<p>\"The love stays,\" said Pip. \"The love stays. Even when the thing is gone. The love stays. And the Keeper is built around the love. And the Keeper does not know that the love stays without the keeping. And we're going to show it. We're going to show it the love stays. And we're going to make it let go.\"</p>", "<p>And the marble had saved the day. The marble had found the heart. The marble had found the off. The marble had shown them the way, because the marble was glass, and the glass was free, and the free thing showed the way. And the marble was useless. And the marble was ready. And the marble had been useless for six years so it could be ready for this job. And the marble had done the job. And the marble had saved the day.</p>", "<p>And Goldie picked up the marble, and she held it, and she said, \"Good marble. Good marble. You did the job. You did the job.\" And she put the marble back in the pocket, and the pocket jingled the small, satisfied jingle, and the marble was spent, and the marble was ready for the next thing, and the next thing was the paperclip, and the next thing was the button, and the next thing was the rubber band, and the next thing was the socks.</p>", "<p>But the marble had done the job. The marble had found the heart. The marble had found the off. And the off was the love. And the off was the letting go. And the off was Snell.</p>", "<p>And the Keeper hummed, and the Keeper pulled, and the Keeper was keeping everything, and it did not know when to stop.</p>", "<p>But the marble had found the heart. And the heart was the thing they needed. And the heart was the thing they were going to answer.</p>", "<p>And the next thing was the paperclip. And the next thing was the button. And the next thing was the rubber band. And the next thing was the socks.</p>", "<p>But that was later. That was the next chapter. That was the answer.</p>", "<p>For now, there was a marble that had found the heart, and a jar with a collar tag, and a man who was ready to try to let go.</p>", "<p>For now, that was enough.</p>"]}, {"id": "ch36", "label": "Chapter 36", "title": "Chapter 36 - A Button, a Paperclip, and a Very Brave Label", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\">\n<defs>\n    <g id=\"pip\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <line x1=\"-10\" y1=\"372\" x2=\"-10\" y2=\"384\"/>\n      <line x1=\"10\" y1=\"372\" x2=\"10\" y2=\"384\"/>\n      <rect x=\"-32\" y=\"382\" width=\"64\" height=\"88\" fill=\"#E4572E\"/>\n      <line x1=\"-32\" y1=\"398\" x2=\"-52\" y2=\"446\"/>\n      <line x1=\"32\" y1=\"398\" x2=\"56\" y2=\"438\"/>\n      <circle cx=\"-52\" cy=\"450\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"46\" y=\"428\" width=\"34\" height=\"22\" fill=\"#E9C46A\"/>\n      <line x1=\"52\" y1=\"439\" x2=\"74\" y2=\"439\"/>\n      <rect x=\"80\" y=\"435\" width=\"12\" height=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"56\" cy=\"442\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"-32\" y=\"466\" width=\"64\" height=\"20\" fill=\"#2B2B2B\"/>\n      <line x1=\"-14\" y1=\"486\" x2=\"-14\" y2=\"550\"/>\n      <line x1=\"14\" y1=\"486\" x2=\"14\" y2=\"550\"/>\n      <ellipse cx=
