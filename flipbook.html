 500 Q -70 490 -74 460 Q -70 440 -52 446\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"0\" cy=\"490\" rx=\"52\" ry=\"60\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"6\" cy=\"506\" rx=\"30\" ry=\"36\" fill=\"#E9C46A\"/>\n      <line x1=\"-6\" y1=\"486\" x2=\"18\" y2=\"486\"/>\n      <line x1=\"-6\" y1=\"502\" x2=\"18\" y2=\"502\"/>\n      <line x1=\"-6\" y1=\"518\" x2=\"18\" y2=\"518\"/>\n      <ellipse cx=\"-22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <line x1=\"-30\" y1=\"450\" x2=\"-48\" y2=\"470\"/>\n      <line x1=\"30\" y1=\"450\" x2=\"50\" y2=\"468\"/>\n      <circle cx=\"6\" cy=\"400\" r=\"42\" fill=\"#2A9D8F\"/>\n      <path d=\"M 30 380 L 56 388 L 32 398 Z\" fill=\"#2A9D8F\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"3\" fill=\"#2B2B2B\"/>\n      <circle cx=\"-12\" cy=\"392\" r=\"8\" fill=\"#E9C46A\"/>\n      <line x1=\"-16\" y1=\"388\" x2=\"-8\" y2=\"396\"/>\n      <line x1=\"-8\" y1=\"388\" x2=\"-16\" y2=\"396\"/>\n      <path d=\"M 20 416 Q 30 424 42 416\" fill=\"none\"/>\n      <path d=\"M -20 362 L -14 348 L -6 362 L 2 348 L 10 362\" fill=\"none\"/>\n    </g>\n  </defs>\n  <rect x=\"0\" y=\"0\" width=\"800\" height=\"600\" fill=\"#FFF8EC\"/>\n  <use href=\"#goldie\" transform=\"translate(280,112) scale(0.8)\"/>\n  <path d=\"M 340 440 q 40 -10 80 0 M 340 460 q 40 -10 80 0 M 340 480 q 40 -10 80 0\" fill=\"none\" stroke=\"#9AA5B1\" stroke-width=\"5\"/>\n  <circle cx=\"450\" cy=\"450\" r=\"14\" fill=\"#2A9D8F\"/>\n  <path d=\"M 480 440 l 0 26 q 0 8 8 8\" fill=\"none\" stroke=\"#9AA5B1\" stroke-width=\"5\"/>\n  <circle cx=\"520\" cy=\"452\" r=\"12\" fill=\"none\" stroke=\"#E4572E\" stroke-width=\"6\"/>\n  <use href=\"#miss-whisk\" transform=\"translate(620,168) scale(0.7)\"/>\n  <rect x=\"560\" y=\"480\" width=\"140\" height=\"50\" fill=\"#E4572E\" transform=\"rotate(-8 630 505)\"/>\n  <text x=\"630\" y=\"513\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"22\" fill=\"#FFF8EC\" transform=\"rotate(-8 630 505)\">DO NOT</text>\n  <use href=\"#pip\" transform=\"translate(120,224) scale(0.6)\"/>\n  <text x=\"400\" y=\"60\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"22\" fill=\"#8B5E3C\">Goldie minds</text>\n  <text x=\"400\" y=\"592\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"15\" fill=\"#2B2B2B\">going vs. kept</text></svg>\n", "head": "Chapter 17 - Goldie Minds (Just This Once)", "paras": ["<p>The Keeper came for Goldie's pocket on the fifth day, at eleven in the morning, which was rude, because eleven was bun o'clock, and Barnaby was low, and nobody should have to deal with a machine that keeps things on an empty stomach.</p>", "<p>It started with the hum. The hum, which was always under the floor, under the hill, came up through the Bureau like a tide, and it was louder than it had ever been, and it was not careful this time, it was not turned down, it was reaching, and the socks in the sock wing leaned away from it, all of them, a whole field of small gray wheat in a wind that came from below.</p>", "<p>\"It's reaching,\" said Thimble, looking up from the rain ones. \"It's reaching further. The missing gear. It's compensating. I told you. A machine that's missing a gear pulls harder.\"</p>", "<p>And then Goldie's pocket jingled.</p>", "<p>It jingled the way it always jingled, the small, satisfied jingle of the marble and the paperclip and the rubber band. But this time the jingle was wrong. This time the jingle was a jingle that was moving, and Goldie looked down, and her face did a thing Pip had never seen it do, which was afraid.</p>", "<p>The pocket was pulling. The bulge of it was sliding, toward the seam, toward the hole she'd never fixed, and the marble was rolling, and the paperclip was sliding, and the rubber band was stretching, and all three of them were going, going, toward the hole, toward the floor, toward the hum.</p>", "<p>\"No,\" said Goldie.</p>", "<p>She grabbed the pocket. She grabbed it with both hands, and she held it shut, and the pull went on, and it was strong, stronger than a pocket should have to fight, and Goldie's heels skidded on the floor, and she said, \"No, no, no, you don't, you do not, those are mine-\"</p>", "<p>\"Goldie!\" Pip grabbed her arm. Ollie grabbed her other arm, which was not helpful, because Ollie was six and weighed about as much as a determined cat, but he grabbed it anyway, because he was brave in small, loud ways. Barnaby heaved himself up from the desk and put his great gray bulk between Goldie and the floor, between Goldie and the hum, and he said, in his deep, wet, certain voice, \"No. You do not. Not in my Bureau. Not while I am the Chief.\"</p>", "<p>And Miss Whisk did the thing that saved them, which was that she stamped the floor.</p>", "<p>She stamped it with the DO NOT stamp, the one she used for things that must not, and she stamped it right on the floor where the pull was strongest, and she said, \"This is a Bureau. This is a waiting room. This is not a keeping room. And you-\" she stamped again, DO NOT, DO NOT, \"-are not allowed to keep here. The record says so. And I am the truth's secretary. And the truth says NO.\"</p>", "<p>And the pull stopped.</p>", "<p>It did not fade. It stopped, all at once, the way a radio stops when someone unplugs it, and the silence that replaced it was the silence of a machine that has been told no by a cat with a stamp, and the marble rolled back into the pocket, and the paperclip slid back, and the rubber band snapped back into shape, and Goldie's pocket jingled the small, satisfied jingle, and Goldie sat down on the floor, hard, and held her pocket with both hands, and breathed.</p>", "<p>The silence went on. And then, from under the hill, very faintly, came a sound that was almost a whine. A small, mechanical whine. The sound of a machine that had wanted something and had been told no, and was thinking about it.</p>", "<p>\"It's thinking,\" said Goldie, breathing hard. \"Pip. It's thinking about it. It's not going to stop. It's just... thinking about how to try again.\"</p>", "<p>\"It won't try again here,\" said Miss Whisk, and she stamped the floor one more time, DO NOT, for good measure. \"The record is the truth. And the truth is that this is a waiting room, and waiting rooms do not keep. It can reach. It can pull. But it cannot take, not while the record says no. Not while I am the secretary.\" She looked at her stamp, and her paw was shaking, just a little, and she put it behind her back so nobody would see. \"But it reached. It reached into the Bureau. It has never reached into the Bureau before. The missing gear. It is getting stronger.\"</p>", "<p>Goldie sat on the floor, and she held her pocket, and she did not let go, and Pip sat down next to her, and Ollie sat down on her other side, and they sat there, the three of them, in the silence that had a temperature.</p>", "<p>\"I minds,\" said Goldie, at last. Her voice was small. \"I know I said I don't mind. I know I said things go, that's what things do. And I meant it. I mean it. When the acorn went, I didn't mind. When the good acorn went, I shrugged.\" She held the pocket tighter. \"But this. This I mind. This I mind a lot.\"</p>", "<p>\"Because it wasn't going,\" said Pip. \"It was being taken.\"</p>", "<p>Goldie looked at him. \"Yes,\" she said. \"Yes. That's it. That's the whole thing. When a thing goes, that's... that's the thing being a thing. Things go. But when a thing is taken, when a thing is kept, when a thing is put in a cage and told it can't go home - that's not the thing being a thing. That's somebody being afraid. And I don't want my things to be somebody's afraid.\" She looked at the pocket, at the marble and the paperclip and the rubber band. \"These are mine. They're useless. And they're mine. And I love them. And I don't mind when they go. But I mind when they're kept. And I didn't know there was a difference until just now. And there's a difference. There's a whole difference.\"</p>", "<p>Pip felt the ground under the fog go solid, because Goldie had just said the thing he had been trying to say, the thing that was the answer to the heartbreak, the thing that was the crack in the Keeper. The difference between going and being kept. The difference between letting go and being taken. The difference between a bowl left out and a cage locked shut.</p>", "<p>\"That's it,\" he said. \"Goldie. That's the answer. That's the thing we have to show him. The difference between going and being kept. He thinks he's saving them. But he's not saving them. He's keeping them. And keeping is not saving. Keeping is... keeping is being afraid, with a machine.\"</p>", "<p>Goldie looked at him. And then she grinned, the shortcut grin, the <em>this is a terrible idea and I'm in</em> grin, but this time it had something new in it, something hard and clear, something that had been decided.</p>", "<p>\"Then we show him,\" she said. \"We show him the difference. And we do it with these.\" She patted the pocket, and the marble and the paperclip and the rubber band clicked together, the small, satisfied jingle. \"These three useless things. They're going to help. I can feel it. They've been waiting for a job. That's why I kept them. That's why they're useless. They're useless so they're ready. They're ready for the one job that matters.\" She looked at Pip. \"Don't ask me how I know. I just know. The pocket knows. The pocket's been knowing things for years. I just listen.\"</p>", "<p>And Pip, who was eleven, who had a label maker, who had a friend whose pocket knew things, felt the shape of the answer settle into him, hard and clear, like a label pressed onto a thing that was not going anywhere.</p>", "<p>The marble. The paperclip. The rubber band. Three useless things. Three ready things. He did not know how. He did not know when. But he knew, the way Goldie knew, the way the pocket knew, that they were going to matter, that they were going to be the crack in the Keeper, that they were going to help answer the heartbreak.</p>", "<p>\"Okay,\" he said. \"Okay. We keep them ready. And we keep Captain Chomp safe. And we find the how.\" He looked at the floor, where Miss Whisk had stamped DO NOT, and at the great door at the back, and at the hill beyond. \"The Keeper reached today. It reached for Goldie's pocket. And it got told no. And it's thinking about how to try again.\" He looked at Barnaby, who was holding Captain Chomp, who was the warmest thing, who was the nineteenth. \"It's going to try again. And next time it's going to reach for the warmest thing. So we have to be ready. We have to answer it first.\"</p>", "<p>\"Three days,\" said Barnaby. \"Finding Day is in three days.\"</p>", "<p>\"Three days,\" Pip agreed. \"And a pocket full of ready things. And a cat with a stamp. And a walrus who says no. And a six-year-old who counts to zero.\" He looked at Ollie, who was holding his pencil like a sword. \"We've got a lot. We've got enough. We just have to find the how.\"</p>", "<p>Under the hill, the Keeper hummed, patient and keeping, thinking about how to try again, and it had eighteen things, and it wanted the nineteenth, and it had just learned that a cat with a stamp could tell it no.</p>", "<p>But a machine that keeps things does not like to be told no. And it was going to remember. And it was going to try again.</p>", "<p>But that was tomorrow's problem. Tonight there was a pocket full of ready things, and a girl who had learned the difference between going and being kept, and a boy who had decided to answer a heartbreak.</p>", "<p>Tonight, that was enough.</p>"]}, {"id": "ch18", "label": "Chapter 18", "title": "Chapter 18 - The Night Shift (Everyone Is Bad at Hiding)", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\">\n<defs>\n    <g id=\"pip\" stroke=\"#2B2B2B\" stroke-width=\"6\  cx=\"6\" cy=\"400\" r=\"42\" fill=\"#2A9D8F\"/>\n      <path d=\"M 30 380 L 56 388 L 32 398 Z\" fill=\"#2A9D8F\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"3\" fill=\"#2B2B2B\"/>\n      <circle cx=\"-12\" cy=\"392\" r=\"8\" fill=\"#E9C46A\"/>\n      <line x1=\"-16\" y1=\"388\" x2=\"-8\" y2=\"396\"/>\n      <line x1=\"-8\" y1=\"388\" x2=\"-16\" y2=\"396\"/>\n      <path d=\"M 20 416 Q 30 424 42 416\" fill=\"none\"/>\n      <path d=\"M -20 362 L -14 348 L -6 362 L 2 348 L 10 362\" fill=\"none\"/>\n    </g>\n  </defs>\n  <rect x=\"0\" y=\"0\" width=\"800\" height=\"600\" fill=\"#FFF8EC\"/>\n  <rect x=\"0\" y=\"0\" width=\"800\" height=\"300\" fill=\"#9AA5B1\"/>\n  <circle cx=\"680\" cy=\"80\" r=\"34\" fill=\"#FFF8EC\"/>\n  <use href=\"#snell\" transform=\"translate(400,112) scale(0.8)\"/>\n  <rect x=\"470\" y=\"430\" width=\"60\" height=\"44\" fill=\"#E9C46A\"/>\n  <circle cx=\"500\" cy=\"420\" r=\"8\" fill=\"#8B5E3C\"/>\n  <rect x=\"330\" y=\"440\" width=\"30\" height=\"44\" fill=\"#E9C46A\"/>\n  <line x1=\"345\" y1=\"440\" x2=\"345\" y2=\"420\"/>\n  <use href=\"#pip\" transform=\"translate(120,280) scale(0.5)\"/>\n  <use href=\"#ollie\" transform=\"translate(220,320) scale(0.45)\"/>\n  <use href=\"#miss-whisk\" transform=\"translate(680,280) scale(0.5)\"/>\n  <text x=\"400\" y=\"40\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"22\" fill=\"#2B2B2B\">the night shift</text>\n  <text x=\"400\" y=\"592\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"15\" fill=\"#2B2B2B\">I've got you</text></svg>\n", "head": "Chapter 18 - The Night Shift (Everyone Is Bad at Hiding)", "paras": ["<p>They staked out the Bureau that night, and they were all bad at hiding, which was the problem with a stakeout that consisted of a walrus, a hedgehog, a cat, a girl, an eleven-year-old, and a six-year-old.</p>", "<p>\"The point of a stakeout,\" Miss Whisk whispered, \"is to be invisible.\"</p>", "<p>\"I am invisible,\" said Barnaby, who was the size of a sofa and gray and could not, by any reasonable definition, be invisible.</p>", "<p>\"You are a sofa,\" said Miss Whisk. \"A sofa is not invisible. A sofa is the most visible thing in a room. You are a sofa that is leaking.\"</p>", "<p>\"I am a strategic sofa,\" said Barnaby, with dignity. \"I am hiding behind the desk. The desk is also a sofa. We are a sofa arrangement.\"</p>", "<p>Ollie, who was hiding behind a bin of single gloves, said, at a volume that was respectful for Ollie, which is to say only slightly louder than a normal person's shout, \"I'm invisible too. I'm a glove.\"</p>", "<p>\"You're a very loud glove,\" said Goldie.</p>", "<p>\"I'm a brave glove.\"</p>", "<p>\"Shh,\" said everyone.</p>", "<p>They waited. The Bureau at night was a different Bureau. The lamps were low, and the shadows were long, and the lost things stood in their rows like a crowd that had been told to wait and had decided to be patient about it. The umbrella orchard made its rain-that-wasn't-there sound. The jar of keys hummed its question. And under the floor, under the hill, the Keeper hummed, patient and keeping, and tonight it was not careful, tonight it was not turned down, tonight it was reaching.</p>", "<p>\"It's coming,\" said Thimble, who was hiding in the sock wing, which was the only sensible hiding place, because the socks were already leaning away from the hum and a hedgehog among leaning socks is just one more leaning thing. \"It's reaching for the warmest thing. I told you. The nineteenth.\"</p>", "<p>Barnaby's flipper tightened on Captain Chomp, who was behind the desk, who was the warmest thing, who was being dusted even now, at night, because Barnaby did not stop dusting. \"Let it reach,\" said Barnaby, quietly. \"Let it reach and find a walrus. Let it reach and find a no.\"</p>", "<p>And the hum came up through the floor, and it reached, and it reached for Captain Chomp, and Pip felt the pull of it, the cold keeping pull, and he watched Barnaby hold the dinosaur and say no, and he watched the pull break against the walrus like a wave against a very large, very kind rock.</p>", "<p>But the pull did not stop. It split. It went around Barnaby, the way water goes around a rock, and it reached for the next warmest thing, and the next, and it found a small music box on a high shelf - not the one that was gone, a different one, one that was claimed and ready and going home on Finding Day - and it pulled, and the music box shivered, and a button popped off its little coat of dust, and the music box slid, slid, toward the edge of the shelf.</p>", "<p>And then the great door at the back of the Bureau opened.</p>", "<p>None of them had ever seen it open. It opened now, quietly, the way a door opens when someone has a key, and through it came a man.</p>", "<p>He was tall, and he was thin, and he was shaped like an umbrella, all long lines and a curved top, and he wore a coat that had been mended many times, and he carried a lantern that was turned down low. He moved quietly, the way a man moves who has spent eight years not wanting to be heard. He came up the aisle, and he went to the shelf where the music box was sliding, and he caught it, gently, in two long hands, the way you catch a thing you are afraid of breaking.</p>", "<p>\"There now,\" he said. His voice was soft, and it was tired, and it was kind, and it was the kind of kind that has been alone a long time. \"There now. You're safe. You'll never be lost again. I've got you. I've got you.\"</p>", "<p>And he held the music box to his chest, and he rocked it, slightly, the way you rock a thing you love, and Pip, hiding behind the desk, felt the ground under the fog go cold and sad at the same time, because the man was not a monster. The man was a man who caught music boxes gently and rocked them and said <em>I've got you</em>, and the man was Silas Snell, and the man was the Keeper, and the man was the heartbreak.</p>", "<p>Snell turned to go. And as he turned, his coat caught the edge of the shelf, and a button popped - a big brass button, the kind that holds a heavy coat together - and it fell, and it rolled, and it came to rest against Pip's shoe.</p>", "<p>Snell did not notice. He went out the great door, quietly, the way he had come, and the door closed behind him, and the hum went down, down, down, turned itself down, careful now, the way it did when it was listened to, and the Bureau was quiet, the full-quiet, the library-quiet, and the music box was gone, and the nineteenth was taken, and a big brass button lay against Pip's shoe.</p>", "<p>Nobody moved for a long moment. Then Ollie, who was a very loud glove, said, \"He was nice.\"</p>", "<p>\"Yes,\" said Barnaby, quietly. \"He was.\"</p>", "<p>\"He caught it gently,\" said Ollie. \"He rocked it. He said I've got you.\" He looked at Pip with his whole face. \"Pip. He was nice. Why is he taking them if he's nice?\"</p>", "<p>And Pip, who was eleven, who had a label maker, who had just watched a man shaped like an umbrella catch a music box gently and rock it and say <em>I've got you</em>, felt the answer form, the shape of it, the why of it, and he said, \"Because he's not taking them to be mean. He's taking them to be safe. He's taking them because he lost something once, and he could not bear it, and he decided he would never lose anything again. He's taking them because he loves them. And he thinks loving them means keeping them.\" He looked at the brass button against his shoe. \"And he's wrong. But he's not mean. He's wrong, and he's sad, and he's nice, and that's the hardest kind of wrong there is.\"</p>", "<p>Miss Whisk came out from behind the ledger, and she picked up the brass button, and she looked at it, and her paw went to her empty collar.</p>", "<p>\"He dropped his button,\" she said. \"A nervous one. His own coat.\" She turned it over. \"He's been mending that coat for years. You can see the stitches. He mends it and mends it. He won't let it go.\" She set the button on the desk, gently. \"A man who mends a coat for eight years and won't let it go. A man who catches music boxes gently. A man who built a machine so nothing he loves is ever lost again.\" She looked at Pip over her spectacles. \"He's not a villain, Pip. He's a bell. He's a bell that fell off in the tall grass, and he's been looking for it for eight years, and he's built a machine to make sure he never loses another one. And the machine is eating the town. And he doesn't know. Or he knows, and he can't stop. And that's the hardest kind of wrong there is.\"</p>", "<p>Pip picked up the brass button. It was warm. It was warm the way a thing is warm that has been against a person all day, and he thought of Thimble's socks, of <em>a sock has been against the skin all day, a sock knows</em>, and he thought: this button knows Silas Snell. This button knows the mending and the rocking and the <em>I've got you</em>. This button knows the heartbreak.</p>", "<p>\"We talk to him,\" said Pip. \"Tomorrow. We don't watch him. We don't stake him out. We talk to him. We knock on his door, and we talk to him, and we tell him the difference between going and being kept. We tell him the love stays. We answer the heartbreak.\"</p>", "<p>\"Yes,\" said Barnaby. \"But gently. He is a bell. You do not shout at a bell. You ring it. You ring it softly, and you listen, and you hope it remembers the sound.\" He looked at the great door, closed now, and at the hill beyond. \"Tomorrow we knock. Tomorrow we ring the bell.\"</p>", "<p>And under the hill, the Keeper hummed, patient and keeping, and it had nineteen things now, and it wanted the twentieth, and the twentieth was a small green dinosaur behind a walrus's desk.</p>", "<p>But tomorrow they were going to knock. Tomorrow they were going to ring the bell. And Pip, holding the warm brass button, felt the ground under the fog go solid, because he had the why, and he had the shape of the answer, and all he needed was the how, and three days, and a man shaped like an umbrella who caught music boxes gently.</p>", "<p>It was, he thought, enough to start with. It would have to be. Because the Keeper was getting stronger, and Finding Day was coming, and the bell was waiting to be rung.</p>", "<p>But that was tomorrow's problem. Tonight there was a warm brass button, and a man who was nice and wrong and sad, and a boy who had decided to knock.</p>", "<p>Tonight, that was enough.</p>"]}, {"id": "ch19", "label": "Chapter 19", "title": "Chapter 19 - What the Baker Knew", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\">\n<defs>\n    <g id=\"pip\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <line x1=\"-10\" y1=\"372\" x2=\"-10\" y2=\"384\"/>\n      <line x1=\"10\" y1=\"372\" x2=\"10\" y2=\"384\"/>\n      <rect x=\"-32\" y=\"382\" width=\"64\" height=\"88\" fill=\"#E4572E\"/>\n      <line x1=\"-32\" y1=\"398\" x2=\"-52\" y2=\"446\"/>\n      <line x1=\"32\" y1=\"398\" x2=\"56\" y2=\"438\"/>\n      <circle cx=\"-52\" cy=\"450\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"46\" y=\"428\" width=\"34\" height=\"22\" fill=\"#E9C46A\"/>\n      <line x1=\"52\" y1=\"439\" x2=\"74\" y2=\"439\"/>\n      <rect x=\"80\" y=\"435\" width=\"12\" height=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"56\" cy=\"442\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"-32\" y=\"466\" width=\"64\" height=\"20\" fill=\"#2B2B2B\"/>\n      <line x1=\"-14\" y1=\"486\" x2=\"-14\" y2=\"550\"/>\n      <line x1=\"14\" y1=\"486\" x2=\"14\" y2=\"550\"/>\n      <ellipse cx=\"-16\" cy=\"552\" rx=\"16\" ry=\"8\" fill=\"#2B2B2B\"/>\n      <ellipse cx=\"18\" cy=\"552\" rx=\"16\" ry=\"8\" fill=\"#2B2B2B\"/>\n      <circle cx=\"0\" cy=\"338\" r=\"40\" fill=\"#FFF8EC\"/>\n      <path d=\"M -40 334 Q -40 296 0 296 Q 40 296 40 334 Q 26 314 0 316 Q -26 314 -40 334 Z\" fill=\"#2B2B2B\"/>\n      <circle cx=\"8\" cy=\"336\" r=\"4\" fill=\ \"round\" stroke-linejoin=\"round\">\n      <path d=\"M -40 500 Q -70 490 -74 460 Q -70 440 -52 446\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"0\" cy=\"490\" rx=\"52\" ry=\"60\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"6\" cy=\"506\" rx=\"30\" ry=\"36\" fill=\"#E9C46A\"/>\n      <line x1=\"-6\" y1=\"486\" x2=\"18\" y2=\"486\"/>\n      <line x1=\"-6\" y1=\"502\" x2=\"18\" y2=\"502\"/>\n      <line x1=\"-6\" y1=\"518\" x2=\"18\" y2=\"518\"/>\n      <ellipse cx=\"-22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <line x1=\"-30\" y1=\"450\" x2=\"-48\" y2=\"470\"/>\n      <line x1=\"30\" y1=\"450\" x2=\"50\" y2=\"468\"/>\n      <circle cx=\"6\" cy=\"400\" r=\"42\" fill=\"#2A9D8F\"/>\n      <path d=\"M 30 380 L 56 388 L 32 398 Z\" fill=\"#2A9D8F\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"3\" fill=\"#2B2B2B\"/>\n      <circle cx=\"-12\" cy=\"392\" r=\"8\" fill=\"#E9C46A\"/>\n      <line x1=\"-16\" y1=\"388\" x2=\"-8\" y2=\"396\"/>\n      <line x1=\"-8\" y1=\"388\" x2=\"-16\" y2=\"396\"/>\n      <path d=\"M 20 416 Q 30 424 42 416\" fill=\"none\"/>\n      <path d=\"M -20 362 L -14 348 L -6 362 L 2 348 L 10 362\" fill=\"none\"/>\n    </g>\n  </defs>\n  <rect x=\"0\" y=\"0\" width=\"800\" height=\"600\" fill=\"#FFF8EC\"/>\n  <rect x=\"40\" y=\"200\" width=\"280\" height=\"14\" fill=\"#8B5E3C\"/>\n  <ellipse cx=\"110\" cy=\"180\" rx=\"40\" ry=\"22\" fill=\"#E9C46A\"/>\n  <ellipse cx=\"220\" cy=\"178\" rx=\"44\" ry=\"24\" fill=\"#C9A66B\"/>\n  <rect x=\"480\" y=\"300\" width=\"240\" height=\"260\" fill=\"#8B5E3C\"/>\n  <circle cx=\"540\" cy=\"360\" r=\"26\" fill=\"#E9C46A\"/>\n  <circle cx=\"540\" cy=\"360\" r=\"8\" fill=\"#8B5E3C\"/>\n  <circle cx=\"610\" cy=\"380\" r=\"20\" fill=\"#E9C46A\"/>\n  <circle cx=\"610\" cy=\"380\" r=\"6\" fill=\"#8B5E3C\"/>\n  <circle cx=\"660\" cy=\"350\" r=\"16\" fill=\"#E9C46A\"/>\n  <rect x=\"500\" y=\"440\" width=\"200\" height=\"40\" fill=\"#FFF8EC\"/>\n  <text x=\"600\" y=\"466\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#2B2B2B\">BRASS. GEARS. SPRINGS.</text>\n  <path d=\"M 120 520 q 0 -26 34 -26 q 34 0 34 26 l 0 12 l -68 0 Z\" fill=\"#2A9D8F\"/>\n  <use href=\"#pip\" transform=\"translate(300,224) scale(0.6)\"/>\n  <use href=\"#goldie\" transform=\"translate(400,252) scale(0.55)\"/>\n  <text x=\"400\" y=\"60\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"22\" fill=\"#8B5E3C\">what the baker knew</text>\n  <text x=\"400\" y=\"592\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"15\" fill=\"#2B2B2B\">eight years of brass</text></svg>\n", "head": "Chapter 19 - What the Baker Knew", "paras": ["<p>On the fifth day, before they went to knock on the door of the man shaped like an umbrella, Pip and Goldie went to The Warm Loaf, because Mrs. Crumb knew things, and because you did not go to answer a heartbreak without asking the baker first.</p>", "<p>Mrs. Crumb was kneading. She kneaded the way Barnaby leaked, constantly and without apology, and she listened to the whole thing - the hum, the buttons, the music box, the man shaped like an umbrella who caught things gently - and she did not interrupt, and she did not say <em>I told you so</em>, and when they were done she wiped her hands on her apron and said, \"Sit down. You're going to want a bun for this.\"</p>", "<p>They sat. She gave them buns. And then she told them what she knew.</p>", "<p>\"Silas Snell,\" she said, \"has been buying brass for eight years.\"</p>", "<p>\"Brass?\" said Goldie.</p>", "<p>\"Brass. And gears. And springs. And little copper wires. And things I don't have names for.\" Mrs. Crumb leaned on the counter, and her floury forearms were crossed, and her face was the face of a woman who has been watching a slow sadness for a long time and has decided to finally say so. \"He used to come in for the loaf, every morning, with the dog. And then the dog ran off, and he stopped coming in for the loaf. But he started coming in for the brass. He'd order it through the hardware, and the hardware boy would bring it up the hill, and I'd see the boxes. Brass. Gears. Springs. Week after week. Month after month. Eight years.\" She shook her head. \"You don't buy brass for eight years unless you're building something. And you don't build something for eight years unless you're trying to fix something that can't be fixed.\"</p>", "<p>\"The Keeper,\" said Pip.</p>", "<p>\"The Keeper,\" Mrs. Crumb agreed. \"That's what he calls it. I heard him say it once, to the hardware boy. <em>It's for the Keeper,</em> he said. <em>So nothing I love is ever lost again.</em>\" She looked at Pip. \"The hardware boy thought it was a cupboard. I knew it wasn't a cupboard. You don't say <em>so nothing I love is ever lost again</em> about a cupboard. You say it about a... \" She paused. \"You say it about a promise you're making to a ghost.\"</p>", "<p>The silence that followed had a temperature, and the temperature was eight years of brass.</p>", "<p>\"Has it been growing?\" Pip asked. \"The machine?\"</p>", "<p>Mrs. Crumb nodded, slowly. \"I think so. I can't see it. The curtains are closed. But I can hear it. The hum. It used to be a little hum, a quiet hum, a hum you'd miss if you weren't listening. And now it's a big hum. A hum you feel in your teeth. And the hill...\" She paused, and she looked out the window, toward the curtained house. \"The hill sounds different. The hill sounds full. Like there's more in it than there used to be. Like the house is... holding more than a house should hold.\" She looked at Pip. \"I think the machine is growing. I think it's been growing for eight years. And I think it's getting to the point where it's too big for the house. And I think, when a machine that keeps things gets too big for the house, it starts keeping the house. And then it starts keeping the hill. And then...\" She did not finish. She did not have to.</p>", "<p>\"And then it starts keeping the town,\" said Pip.</p>", "<p>Mrs. Crumb looked at him, and her face was the face of a woman who has been afraid of a thing for a long time and has just heard someone else say it out loud, and the saying-it-out-loud is a relief and a terror at the same time.</p>", "<p>\"Yes,\" she said. \"And then it starts keeping the town. And I've been leaving the bowl out, and I've been making the loaf, and I've been hoping, because hoping is easier than knowing. And now you've come, and you know, and you're going to knock on his door.\" She looked at Pip with her kind, floury face. \"So I'm going to tell you the thing I know about Silas Snell, the thing that matters, the thing you need to know before you knock.\"</p>", "<p>\"What is it?\" said Pip.</p>", "<p>\"He's not going to yell at you,\" said Mrs. Crumb. \"He's not going to be mean. He's going to offer you tea. He's going to be gentle. He's going to be so gentle it breaks your heart. Because he's not a man who hates. He's a man who loves too much and doesn't know where to put it. And when you knock, he's going to open the door, and he's going to be glad to see you, because he's been alone eight years, and a knock on the door is the best thing that's happened to him in eight years.\" She paused, and her voice went soft. \"And that's the hard part. Because it's easy to be brave with a man who yells. It's hard to be brave with a man who offers you tea. You have to be brave enough to tell him the truth, even when he's gentle. Even when he's glad to see you. Even when it breaks his heart. Because the truth is the only thing that's going to save him. And the truth is going to hurt.\"</p>", "<p>Pip felt the ground under the fog go solid and sad, because Mrs. Crumb had just told him the hardest thing about answering a heartbreak, which was that the heartbreak was going to be kind, and the kindness was going to make it harder, and he was going to have to be brave enough to tell the truth to a man who offered him tea.</p>", "<p>\"I'll be brave,\" he said.</p>", "<p>\"I know you will,\" said Mrs. Crumb. \"You've got the look. You've got the label-maker look. The look of a boy who's going to put the world back in order.\" She reached under the counter, and she brought out a loaf, a warm one, wrapped in a cloth. \"Take this. For him. Nobody should have to face a hard conversation on an empty stomach. And nobody should have to answer a heartbreak without a loaf. It's a rule. I just made it up. But it's true.\"</p>", "<p>Pip took the loaf. It was warm. It smelled like the inside of a good decision. And he thought of the bowl by the door, the blue bowl with the chipped rim, full of clean water, and he thought of Mrs. Crumb, who kept the bowl out for a stray she did not own, and who made the loaf for a man who had stopped coming in, and who had been leaving the bowl out and making the loaf for eight years, because leaving the bowl out and making the loaf was the only thing left that looked like love.</p>", "<p>\"Mrs. Crumb,\" he said. \"The stray. The one who drinks from the bowl. Have you ever seen it?\"</p>", "<p>Mrs. Crumb looked at him, and her face did the soft thing. \"Now and then. Early morning. A biscuit-colored dog, fat as a loaf, happy as you please. It drinks, and it warms itself by the oven, and it goes before the shop's busy.\" She paused, and she looked out the window, toward the hill, and something moved in her face, a thought, a almost-thought, a thing she almost said and then did not. \"It's a stray. It sleeps where it likes. I don't ask it where. That's the rule. You leave the bowl out. You don't ask the stray to explain itself.\"</p>", "<p>Pip nodded. He did not know why his heart was beating a little faster. He filed the almost-thought, the thing Mrs. Crumb had almost said, with a little star on the tag. And he thought: <em>the dog is not the love. The dog is the thing the love wears. And the love is still there. Even after eight years. Even with the curtains closed.</em> He did not know where the stray slept. He did not know it was close. He only knew that the bowl was full, and that somebody drank from it, and that leaving it out was a kind of love that did not need to own the thing it loved.</p>", "<p>\"Thank you for the loaf,\" he said.</p>", "<p>\"Thank you for knocking,\" said Mrs. Crumb. \"Eight years is a long time to leave a bowl out. It's nice to think somebody's finally going to ring the bell.\"</p>", "<p>And Pip and Goldie went out into the town, into the morning, toward the hill, toward the house with too many curtains, carrying a warm loaf and a brass button and the shape of the answer, and behind them Mrs. Crumb refilled the bowl, the way she did every morning, the way she had every morning for eight years, and under the proofing rack, where it was warm, where the bread rose, a biscuit-colored dog slept like it had never had a worry in its life.</p>", "<p>But that was later. That was Finding Day. That was the reunion.</p>", "<p>For now, there was a door to knock on, and a man shaped like an umbrella, and a loaf, and a truth that was going to hurt.</p>", "<p>For now, that was enough.</p>"]}, {"id": "ch20", "label": "Chapter 20", "title": "Chapter 20 - He Wasn't Stealing. He Was Saving.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\">\n<defs>\n    <g id=\"pip\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <line x1=\"-10\" y1=\"372\" x2=\"-10\" y2=\"384\"/>\n      <line x1=\"10\" y1=\"372\" x2=\"10\" y2=\"384\"/>\n      <rect x=\"-32\" y=\"382\" width=\"64\" height=\"88\" fill=\"#E4572E\"/>\n      <line x1=\"-32\" y1=\"398\" x2=\"-52\" y2=\"446\"/>\n      <line x1=\"32\" y1=\"398\" x2=\"56\" y2=\"438\"/>\n      <circle cx=\"-52\" cy=\"450\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"46\" y=\"428\" width=\"34\" height=\"22\" fill=\"#E9C46A\"/>\n      <line x1=\"52\" y1=\"439\" 362\" fill=\"none\"/>\n    </g>\n  </defs>\n  <rect x=\"0\" y=\"0\" width=\"800\" height=\"600\" fill=\"#FFF8EC\"/>\n  <rect x=\"40\" y=\"200\" width=\"240\" height=\"14\" fill=\"#8B5E3C\"/>\n  <rect x=\"60\" y=\"150\" width=\"50\" height=\"50\" fill=\"#E9C46A\"/>\n  <rect x=\"130\" y=\"150\" width=\"50\" height=\"50\" fill=\"#2A9D8F\"/>\n  <rect x=\"200\" y=\"150\" width=\"50\" height=\"50\" fill=\"#E4572E\"/>\n  <rect x=\"300\" y=\"440\" width=\"220\" height=\"120\" fill=\"#8B5E3C\"/>\n  <path d=\"M 360 420 q 0 -24 26 -24 q 26 0 26 24 l 0 20 l -52 0 Z\" fill=\"#FFF8EC\"/>\n  <path d=\"M 412 424 q 16 4 12 18\" fill=\"none\"/>\n  <rect x=\"440\" y=\"420\" width=\"26\" height=\"20\" fill=\"#FFF8EC\"/>\n  <rect x=\"480\" y=\"420\" width=\"26\" height=\"20\" fill=\"#FFF8EC\"/>\n  <use href=\"#snell\" transform=\"translate(620,112) scale(0.8)\"/>\n  <use href=\"#pip\" transform=\"translate(140,224) scale(0.6)\"/>\n  <use href=\"#goldie\" transform=\"translate(250,252) scale(0.55)\"/>\n  <use href=\"#ollie\" transform=\"translate(350,280) scale(0.5)\"/>\n  <text x=\"400\" y=\"60\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"22\" fill=\"#8B5E3C\">saving, not stealing</text>\n  <text x=\"400\" y=\"592\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"15\" fill=\"#2B2B2B\">some tea?</text></svg>\n", "head": "Chapter 20 - He Wasn't Stealing. He Was Saving.", "paras": ["<p>They knocked on the door of the house with too many curtains, and the door opened, and Silas Snell said, \"Oh. Visitors. Would you like some tea?\"</p>", "<p>Pip had come to confront a thief, with a brass button in his pocket and a warm loaf under his arm. But Mrs. Crumb had been right. The man was not going to yell. The man was going to offer tea. And the tea was going to make it harder.</p>", "<p>Snell was tall and thin and shaped like an umbrella, all long lines and a curved top, and his coat had been mended many times, and his eyes were the kind of kind that has been alone a long time. He looked at Pip and Goldie and Ollie - Ollie had come, brave in small, loud ways, not to be left out of the ringing of the bell - with a gladness so plain and so hungry that Pip had to look away. A knock on the door was the best thing that had happened to this man in eight years.</p>", "<p>\"Tea,\" said Snell. \"Yes. I have tea. I have biscuits too. Come in. Come in out of the lane. The lane is drafty. The lane is very drafty.\" He ushered them in, so gentle it broke your heart, and Pip felt the truth of Mrs. Crumb's words: <em>it's hard to be brave with a man who offers you tea.</em></p>", "<p>The inside of the house was a museum of almosts.</p>", "<p>The inside of the house was shelves, and on the shelves were kept things. There was the music box Snell had caught gently, dusted, not playing. The telescope, the harmonica, the red mitten, a hundred other things, each on its own little shelf, each dusted, each labeled in a shaky, careful hand. And every window was curtained, and every curtain was drawn, and the light was the light of a house that has decided not to let the outside in.</p>", "<p>Under the floor the Keeper hummed, louder than it had ever been, a hum you felt in your teeth, in the part of you that knows when a thing is too big for the room it is in. And Pip looked at the shelves, at the kept things, and he thought: <em>the hill sounds full. Like there's more in it than there used to be.</em> And he thought: <em>the machine is growing. And it's getting too big for the house.</em></p>", "<p>\"You take them,\" said Pip. He said it because he had come to say it, because he had decided to be brave, because the truth was the only thing that was going to save this man. \"The things from the Bureau. You take them. The music box. The telescope. The harmonica. The red mitten. You take them, and you keep them, and they don't go home. Their people are waiting. Their people are going to forget how much they loved them, if they stay lost too long. You have to give them back.\"</p>", "<p>Snell was quiet for a long moment. He poured the tea. His hands were long and careful, and they did not shake, and he set a cup in front of each of them, and he set a biscuit on each saucer, and then he sat down, and he folded his long hands, and he said, \"I'm not stealing them.\"</p>", "<p>\"You take them,\" said Pip. \"You take them and you don't give them back. That's-\"</p>", "<p>\"I'm not stealing them,\" said Snell, gently. \"I'm saving them.\"</p>", "<p>And there it was. The thing that reframed everything. The thing Pip had known, in the shape of it, since Miss Whisk had said <em>he calls that saving</em>, since the brass button, since the music box caught gently and rocked and <em>I've got you</em>. But hearing it from Snell himself, in his soft, tired, kind voice, in his house of kept things, with the Keeper humming under the floor - hearing it was different. Hearing it was the ground under the fog going cold and solid at the same time.</p>", "<p>\"Saving them,\" said Goldie.</p>", "<p>\"Saving them,\" Snell agreed. He looked at the shelves, at the kept things, and his face was the face of a man looking at everything he loves. \"Do you know what happens to a lost thing? It waits. It waits in the cold. It waits to be claimed. And sometimes nobody comes. And sometimes the person forgets. And the thing is just... gone. Forgotten. Unloved.\" His voice went soft. \"I could not bear that. I could not bear the thought of a thing being lost and forgotten and unloved. So I built a way to save them. I built the Keeper. And the Keeper brings them here, and I keep them, and I dust them, and I love them, and they are never lost again. They are never forgotten. They are never unloved.\" He looked at Pip with his kind, tired eyes. \"I'm not stealing them. I'm saving them. I'm saving them from being lost.\"</p>", "<p>The silence was eight years of brass and a dog that ran off.</p>", "<p>\"But they're already loved,\" said Pip. \"The things you took. They were claimed. They were ready. They were going home on Finding Day. Their people love them. Their people are waiting. You didn't save them from being unloved. You took them from the people who love them. You-\" He searched for the word, the hard word, the word that was going to hurt. \"You caged them. You didn't save them. You caged them. And the people who love them are going to forget, because you kept them too long. You're not saving the love. You're... you're starving it.\"</p>", "<p>Snell went very still. His long hands folded tighter. And for a second, just a second, Pip saw the crack in him, the place where the truth got in, the place where the heartbreak was. And then the crack closed, the way a crack closes when a man has spent eight years building a machine to avoid it.</p>", "<p>\"You don't understand,\" said Snell, and his voice was still gentle, but it was gentle the way a wall is gentle, the way a thing is gentle that has decided not to move. \"You're young. You haven't lost anything yet. You don't know what it is to lose a thing you love. You don't know what it is to have it gone, and to look, and to look, and to not find it. You don't know what it is to put up posters, and to have the posters get rained on, and to take them down.\" He looked at the shelves. \"I do. I know. And I decided I would never let it happen again. Not to me. Not to anything I love. The Keeper keeps them. And keeping is not caging. Keeping is... keeping is love. Keeping is love that doesn't let go.\"</p>", "<p>\"Love that doesn't let go,\" said Goldie, quietly, \"is not love. It's fear. It's fear with a machine.\"</p>", "<p>Snell looked at her. And for a second, just a second, Pip saw the crack again, wider this time, the place where the truth got in. And then Snell stood, and he went to the window, and he looked out through the drawn curtain, at the lane, at the town, at the hill, and he said, \"You should go. You should finish your tea and go. The Keeper is... the Keeper is busy today. The Keeper is getting ready for Finding Day. And I have a great deal of dusting to do.\"</p>", "<p>And that was the end of the conversation. Not because Snell was mean. Because he was gentle and heartbroken and had decided not to move. The truth had gotten in, just a crack, and the crack had closed, and the man had gone to the window, and the Keeper hummed, getting ready for Finding Day.</p>", "<p>They finished their tea, because you did not leave tea unfinished in a house that had offered it. The tea was the only thing left that looked like love. And they went to the door, and Snell saw them out and said, \"Thank you for coming. Thank you for knocking. It's been a long time since anyone knocked.\"</p>", "<p>At the door, Pip turned and said, \"Mr. Snell. The dog. Biscuit. Do you still... do you still love him?\"</p>", "<p>Snell went very still. For a long moment he did not speak. Then he said, in a voice so soft it was almost not there, \"Every day. Every single day. That's the whole thing. That's the whole thing about the Keeper. I still love him. And he's gone. And I can't... I can't let anything else go. I can't. I can't.\" And he closed the door, gently, the way he did everything, and the house with too many curtains held its breath.</p>", "<p>They stood in the lane and looked at the door. The silence was a man who still loved a dog that was gone, and could not let anything else go, and had built a machine to make sure he never had to.</p>", "<p>\"He's not a villain,\" said Ollie, quietly, for him. \"He's a bell.\"</p>", "<p>\"Yes,\" said Pip. \"He's a bell. And we rang it, and it remembered the sound. Just a crack.\" He looked at the door. \"Now we have to make the crack bigger. We have to show him the love stays. That he can let go and still have the love.\" He thought of Goldie's pocket, of the marble and the paperclip and the rubber band, of <em>they're useless so they're ready.</em> \"We have to answer the heartbreak. And we have two days. And the Keeper is getting ready for Finding Day.\"</p>", "<p>Under the house the Keeper hummed. It had nineteen things. It wanted the twentieth. And it was getting bigger.</p>", "<p>But the crack was there. And a crack is where the light gets in, and where the answer starts.</p>", "<p>Finding Day was coming, and the bell was waiting, and the love was still there, even after eight years, even with the curtains closed. And they were going to prove it.</p>"]}, {"id": "ch21", "label": "Chapter 21", "title": "Chapter 21 - The House That Held Its Breath", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\">\n<defs>\n    <g id=\"pip\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <line x1=\"-10\" y1=\"372\" x2=\"-10\" y2=\"384\"/>\n      <line x1=\"10\" y1=\"372\" x2=\"10\" y2=\"384\"/>\n      <rect x=\"-32\" y=\"382\" width=\"64\" height=\"88\" fill=\"#E4572E\"/>\n      <line x1=\"-32\" y1=\"398\" x2=\"-52\" y2=\"446\"/>\n      <line x1=\"32\" y1=\"398\" x2=\"56\" y2=\"438\"/>\n      <circle cx=\"-52\" cy=\"450\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"46\" y=\"428\" width=\"34\" height=\"22\" fill=\"#E9C46A\"/>\n      <line x1=\"52\" y1=\"439\" x2=\"74\" y2=\"439\"/>\n      <rect x=\"80\" y=\"435\" width=\"12\" height=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"56\" cy=\"442\" r=\"8\" fill=\"#FFF8EC\"/>\n      <rect x=\"-32\" y=\"466\" width=\"64\" height=\"20\" fill=\"#2B2B2B\"/>\n      <line x1=\"-14\" y1=\"486\" x2=\"-14\" y2=\"550\"/>\n      <line x1=\"14\" y1=\"486\" x2=\"14\" y2=\"550\"/>\n      <ellipse cx=\"-16\" cy=\"552\" rx=\"16\" ry=\"8\" fill=\"#2B2B2B\"/>\n      <ellipse cx=\"18\" cy=\"552\" rx=\"16\" ry=\"8\" fill=\"#2B2B2B\"/>\n      <circle cx=\"0\" cy=\"338\" r=\"40\" fill=\"#FFF8EC\"/>\n      <path d=\"M -40 334 Q -40 296 0 296 Q 40 296 40 334 Q 26 314 0 316 Q -26 314 -40 334 Z\" fill=\"#2B2B2B\"/>\n      <circle cx=\"8\" cy=\"336\" r=\"4\" fill=\"#2B2B2B\"/>\n e-linejoin=\"round\">\n      <path d=\"M -40 500 Q -70 490 -74 460 Q -70 440 -52 446\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"0\" cy=\"490\" rx=\"52\" ry=\"60\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"6\" cy=\"506\" rx=\"30\" ry=\"36\" fill=\"#E9C46A\"/>\n      <line x1=\"-6\" y1=\"486\" x2=\"18\" y2=\"486\"/>\n      <line x1=\"-6\" y1=\"502\" x2=\"18\" y2=\"502\"/>\n      <line x1=\"-6\" y1=\"518\" x2=\"18\" y2=\"518\"/>\n      <ellipse cx=\"-22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <ellipse cx=\"22\" cy=\"552\" rx=\"18\" ry=\"8\" fill=\"#2A9D8F\"/>\n      <line x1=\"-30\" y1=\"450\" x2=\"-48\" y2=\"470\"/>\n      <line x1=\"30\" y1=\"450\" x2=\"50\" y2=\"468\"/>\n      <circle cx=\"6\" cy=\"400\" r=\"42\" fill=\"#2A9D8F\"/>\n      <path d=\"M 30 380 L 56 388 L 32 398 Z\" fill=\"#2A9D8F\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"8\" fill=\"#FFF8EC\"/>\n      <circle cx=\"14\" cy=\"392\" r=\"3\" fill=\"#2B2B2B\"/>\n      <circle cx=\"-12\" cy=\"392\" r=\"8\" fill=\"#E9C46A\"/>\n      <line x1=\"-16\" y1=\"388\" x2=\"-8\" y2=\"396\"/>\n      <line x1=\"-8\" y1=\"388\" x2=\"-16\" y2=\"396\"/>\n      <path d=\"M 20 416 Q 30 424 42 416\" fill=\"none\"/>\n      <path d=\"M -20 362 L -14 348 L -6 362 L 2 348 L 10 362\" fill=\"none\"/>\n    </g>\n  </defs>\n  <rect x=\"0\" y=\"0\" width=\"800\" height=\"600\" fill=\"#FFF8EC\"/>\n  <rect x=\"40\" y=\"160\" width=\"220\" height=\"400\" fill=\"#8B5E3C\"/>\n  <rect x=\"280\" y=\"120\" width=\"220\" height=\"440\" fill=\"#C9A66B\"/>\n  <rect x=\"520\" y=\"160\" width=\"220\" height=\"400\" fill=\"#8B5E3C\"/>\n  <rect x=\"60\" y=\"200\" width=\"60\" height=\"40\" fill=\"#E9C46A\"/>\n  <rect x=\"140\" y=\"200\" width=\"60\" height=\"40\" fill=\"#2A9D8F\"/>\n  <rect x=\"300\" y=\"160\" width=\"60\" height=\"40\" fill=\"#E4572E\"/>\n  <rect x=\"380\" y=\"160\" width=\"60\" height=\"40\" fill=\"#FFF8EC\"/>\n  <rect x=\"540\" y=\"200\" width=\"60\" height=\"40\" fill=\"#E9C46A\"/>\n  <rect x=\"620\" y=\"200\" width=\"60\" height=\"40\" fill=\"#9AA5B1\"/>\n  <use href=\"#snell\" transform=\"translate(400,224) scale(0.6)\"/>\n  <use href=\"#pip\" transform=\"translate(140,280) scale(0.5)\"/>\n  <use href=\"#goldie\" transform=\"translate(660,280) scale(0.5)\"/>\n  <text x=\"400\" y=\"60\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"22\" fill=\"#8B5E3C\">the house</text>\n  <text x=\"400\" y=\"592\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"15\" fill=\"#2B2B2B\">the house makes room</text></svg>\n", "head": "Chapter 21 - The House That Held Its Breath", "paras": ["<p>They were halfway down the lane when Snell called them back.</p>", "<p>\"Wait,\" he said. He was standing in the doorway, and he was shaped like an umbrella, and his long hands were folded, and his face was the face of a man who has just done a thing he cannot take back. \"Wait. You haven't seen the whole thing. Nobody's seen the whole thing. I... \" He paused, and the gladness was there again, the gladness of a man who has been alone eight years and cannot bear for his visitors to leave. \"Would you like to see the whole thing? I could show you. I could show you everything. I've been... I've been keeping it all. And nobody's seen it. And I think... I think I would like someone to see it.\"</p>", "<p>And Pip, who had come to confront a thief, who had a brass button in his pocket and the shape of the answer in his head, felt the ground under the fog go warm and sad at the same time, because the man was not asking them to see a machine. The man was asking them to see <em>him</em>. The man was saying <em>I have been keeping all this love, and nobody has seen it, and I would like someone to see it.</em> And that was the hardest thing to say no to in the world.</p>", "<p>\"Yes,\" said Pip. \"We'd like to see it.\"</p>", "<p>And Snell smiled, the real one, the one that changed his whole face, and he ushered them back in, and he said, \"Tea first. You can't see the whole thing without tea. It's a rule. I just made it up. But it's true.\"</p>", "<p>They had tea. And then Snell showed them the house.</p>", "<p>The house was bigger than it had been.</p>", "<p>Pip noticed it slowly, the way you notice a thing that is too big to notice all at once. The main room, the one with the shelves and the music box, was the same. But beyond it there was another room. And beyond that, another. And beyond that, another. Rooms Pip was sure had not been there, rooms that the outside of the house did not have room for, rooms that went back and back, like the Bureau, like the Bureau exactly, and Pip felt the two rooms click together in his head, the Bureau and the house, both of them full of kept things, both of them going back and back, and he thought: <em>the house is a Bureau. The house is a Bureau that keeps instead of waits.</em></p>", "<p>\"This is the keeping room,\" said Snell, and he showed them a room of single gloves, each one dusted, each one labeled. \"And this is the music room.\" A room of music boxes, none of them playing. \"And this is the reading room.\" A room of books, each one closed, each one dusted. \"And this is the... \" He paused, and he opened a door, and behind the door was a room that was full of umbrellas, furled and patient, a whole orchard of them, and Pip thought of the Bureau's umbrella orchard, and he thought: <em>he's copying it. He's copying the Bureau. He's building a Bureau that keeps.</em></p>", "<p>\"Mr. Snell,\" said Pip. \"These rooms. Were they always here?\"</p>", "<p>Snell was quiet for a moment. \"No,\" he said. \"They grew.\"</p>", "<p>\"They grew?\"</p>", "<p>\"The Keeper grows,\" said Snell, and he said it the way you say a thing you are proud of and a thing you are afraid of, both at once. \"The Keeper keeps. And the more it keeps, the bigger it gets. And the bigger it gets, the more room it needs. And the house... the house makes room.\" He looked at the rooms, at the kept things, and his face was the face of a man looking at a thing he has built and cannot control. \"The house makes room. I don't know how. I don't ask. The house makes room, and the Keeper fills it, and I dust it, and I love it, and it is never lost.\" He paused, and his voice went soft. \"It's a lot of room. It's more room than there used to be. Sometimes I... sometimes I get lost in it. Sometimes I go into a room and I don't remember which room it is. And I have to call out, and the house... the house answers. The house shows me the way out.\" He looked at Pip. \"The house is very kind. The house is very kind to me.\"</p>", "<p>And Pip, who was eleven, who had a label maker, who had just walked through a house that grew rooms, felt the ground under the fog go cold, because a house that grows rooms is a house that is being eaten, and a man who gets lost in his own house is a man who is being kept, and the Keeper was not just keeping the things. The Keeper was keeping the house. And the Keeper was keeping the man.</p>", "<p>\"Mr. Snell,\" said Pip, carefully. \"Do you ever go outside?\"</p>", "<p>Snell was quiet for a long moment. \"Sometimes,\" he said. \"To the gate. To get the brass. The hardware boy brings the brass.\" He paused. \"I don't go much further than the gate. The Keeper... the Keeper likes me to be here. The Keeper likes me to be close. It hums when I'm close. It hums... it hums happy when I'm close.\" He looked at Pip with his kind, tired eyes. \"It's the only thing that hums happy when I'm close. So I stay close.\"</p>", "<p>The silence that followed had a temperature, and the temperature was a man who stayed close to a machine because it was the only thing that hummed happy when he was close.</p>", "<p>Goldie, who had been quiet, who had been looking at the kept things with her shortcut eyes, said, \"Mr. Snell. Can I ask you a thing?\"</p>", "<p>\"Anything,\" said Snell, who was glad to be asked anything, who was glad to be asked at all.</p>", "<p>\"These things,\" said Goldie. \"The gloves. The music boxes. The books. Do you... do you use them? Do you play the music boxes? Do you read the books? Do you wear the gloves?\"</p>", "<p>Snell was quiet for a long moment. \"No,\" he said. \"No, I don't use them. I keep them. Using them... using them would wear them out. Using them would... would risk them. I keep them safe. I keep them dusted. I keep them... I keep them.\" He looked at the shelves, at the kept things, and his face was the face of a man who has just heard himself say the thing and has not yet understood it. \"I keep them. I don't use them. I keep them so they're never lost. And I... \" He paused, and the crack opened, just a little, just a crack. \"And I don't use them. I don't play the music boxes. I don't read the books. I just... keep them.\"</p>", "<p>\"Because you're afraid,\" said Goldie, gently, \"that if you use them, you'll lose them.\"</p>", "<p>\"Yes,\" said Snell, and the word came out so soft it was almost not there. \"Yes. That's it. That's the whole thing. If I use them, I'll lose them. If I play the music box, the song will end. If I read the book, the book will be finished. If I wear the gloves, the gloves will wear out. And I can't... I can't lose anything else. I can't. So I keep them. I keep them unused. I keep them... I keep them almost.\" He looked at Goldie with his kind, tired eyes. \"I keep them almost. That's the whole thing. I keep them almost.\"</p>", "<p>And Pip, who was eleven, who had a label maker, who had just heard a man say <em>I keep them almost</em>, felt the shape of the answer settle into him, hard and clear, like a label pressed onto a thing that was not going anywhere. The man was keeping everything almost. Almost played. Almost read. Almost worn. Almost loved. Because almost was safe, and almost was never lost, and almost was a cage, and the man did not know it was a cage, and the man was being kept in it too.</p>", "<p>\"Mr. Snell,\" said Pip. \"Can we come back tomorrow? We have... we have a thing to show you. A thing about the keeping. A thing about the almost.\"</p>", "<p>Snell looked at him, and the gladness was there, the plain, hungry gladness. \"Tomorrow,\" he said. \"Yes. Come back tomorrow. I'll make tea. I'll make... I'll make biscuits. The dog kind. I always make the dog kind. I don't know why. I always make the dog kind.\" He paused, and his face did the thing, the soft-sad thing, the thing that was a dog-shaped hole. \"I always make the dog kind. And there's no dog. And I make them anyway. I make them anyway.\"</p>", "<p>Pip felt the ground under the fog go warm and sad. The man was leaving the bowl out. The man was making the dog kind. The man was leaving the bowl out, in his way, in the only way he knew how, and the bowl was a machine, and the machine was eating the town, and the man did not know, and the man was kind, and the man was heartbroken, and the man was going to make biscuits tomorrow, the dog kind, and there was no dog, and he was going to make them anyway.</p>", "<p>\"We'll come back,\" said Pip. \"Tomorrow. We'll bring... we'll bring a thing. A thing about the almost.\"</p>", "<p>And they went out into the lane, into the dusk, and the house with too many curtains held its breath behind them, and the Keeper hummed, patient and keeping, and the house had grown rooms, and the man was being kept, and the biscuits were going to be the dog kind.</p>", "<p>Tonight there was a house that grew rooms, and a man who kept everything almost, and a boy who had decided to show him the difference between almost and home.</p>"]}, {"id": "ch22", "label": "Chapter 22", "title": "Chapter 22 - A Museum of Almosts", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\">\n<defs>\n    <g id=\"pip\" stroke=\"#2B2B2B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <line x1=\"-10\" y1=\"372\" x2=\"-10\" y2=\"384\"/>\n      <line x1=\"10\" y1=\"372\" x2=\"10\" y2=\"384\"/>\n      <rect x=\"-32\" y=\"382\" wi y=\"392\" r=\"3\" fill=\"#2B2B2B\"/>\n      <circle cx=\"-12\" cy=\"392\" r=\"8\" fill=\"#E9C46A\"/>\n      <line x1=\"-16\" y1=\"388\" x2=\"-8\" y2=\"396\"/>\n      <line x1=\"-8\" y1=\"388\" x2=\"-16\" y2=\"396\"/>\n      <path d=\"M 20 416 Q 30 424 42 416\" fill=\"none\"/>\n      <path d=\"M -20 362 L -14 348 L -6 362 L 2 348 L 10 362\" fill=\"none\"/>\n    </g>\n  </defs>\n  <rect x=\"0\" y=\"0\" width=\"800\" height=\"600\" fill=\"#FFF8EC\"/>\n  <rect x=\"40\" y=\"240\" width=\"300\" height=\"16\" fill=\"#8B5E3C\"/>\n  <rect x=\"60\" y=\"190\" width=\"60\" height=\"50\" fill=\"#E9C46A\"/>\n  <rect x=\"140\" y=\"190\" width=\"60\" height=\"50\" fill=\"#2A9D8F\"/>\n  <rect x=\"220\" y=\"190\" width=\"60\" height=\"50\" fill=\"#FFF8EC\"/>\n  <path d=\"M 480 380 q 0 -40 34 -40 q 34 0 34 40 l 0 30 l -20 0 l 0 -18 q 0 -10 -14 -10 q -14 0 -14 10 l 0 18 l -20 0 Z\" fill=\"#E4572E\"/>\n  <use href=\"#snell\" transform=\"translate(620,112) scale(0.8)\"/>\n  <use href=\"#pip\" transform=\"translate(180,224) scale(0.6)\"/>\n  <use href=\"#goldie\" transform=\"translate(320,252) scale(0.55)\"/>\n  <text x=\"400\" y=\"60\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"22\" fill=\"#8B5E3C\">a museum of almosts</text>\n  <text x=\"400\" y=\"592\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"15\" fill=\"#2B2B2B\">kept is not warm</text></svg>\n", "head": "Chapter 22 - A Museum of Almosts", "paras": ["<p>Pip found the red mitten on the third shelf of the keeping room, and he knew it, because he had seen it waving.</p>", "<p>It was the mitten from the school's lost-and-found bin, the one that had hung off the edge like it was waving for help, the one he had moved aside on the day Captain Chomp went missing. It had been bright red then, a loud red, a red that wanted to be found. And now it was on Snell's shelf, and it was dusted, and it was labeled in the shaky, careful hand, and it was not waving anymore. It was just... lying there. Kept. And the red was a little faded, a little tired, the red of a thing that has been kept instead of worn.</p>", "<p>\"You found the mitten,\" said Snell, pleased. \"That's a good one. That's a very good one. It was lost for a long time. Nobody claimed it. Nobody came. And I... I saved it. I brought it here. And now it's safe. Now it's never lost.\" He picked it up, gently, and he held it, and he said, \"It's a good mitten. It's a very good mitten.\"</p>", "<p>\"Mr. Snell,\" said Pip. \"Can I hold it?\"</p>", "<p>Snell hesitated. It was a small hesitation, but Pip saw it, the hesitation of a man who does not let people touch the kept things, because touching is using, and using is risking, and risking is losing. But Snell was glad to have visitors, and Snell wanted to be seen, and Snell handed the mitten over, gently, the way he did everything.</p>", "<p>Pip held the mitten. And it was cold.</p>", "<p>That was the thing. That was the thing that made Pip's stomach do a thing. The mitten was cold. Not cold like outside-cold. Cold like kept-cold. Cold like a thing that has not been worn, that has not been against a hand, that has not been warm in a long time. And Pip thought of the Bureau, of the things that were waiting, of the red mitten's cousins on the shelf of single gloves, and he thought: the Bureau's things are warm. The Bureau's things are warm because they're being loved back, because they're being waited with, because they're remembering. And this mitten is cold. This mitten is cold because it's being kept, because it's not being waited with, because it's not remembering. It's just... kept.</p>", "<p>\"Mr. Snell,\" said Pip. \"The mitten. It's cold.\"</p>", "<p>Snell looked at him. \"Cold?\"</p>", "<p>\"Kept-cold,\" said Pip. \"Not outside-cold. Kept-cold. Like it hasn't been warm in a long time.\" He held the mitten out. \"In the Bureau, the things are warm. The things that are waiting. They're warm because they're being loved back. Because they're remembering the way home. But this mitten... this mitten isn't remembering. It's just kept. And it's cold.\"</p>", "<p>Snell took the mitten back, and he held it, and he looked at it, and his face was the face of a man who is being told a thing he does not want to know. \"It's... it's safe,\" he said. \"It's safe. That's what matters. It's safe.\"</p>", "<p>\"Safe isn't the same as warm,\" said Goldie, quietly. \"Safe isn't the same as loved. A thing can be safe and cold. A thing can be kept and... and almost.\" She looked at the shelves, at the kept things, at the music boxes that were not playing and the books that were not read and the gloves that were not worn. \"Mr. Snell. These things. They're not happy. They're almost. They're almost played. Almost read. Almost worn. Almost loved. And almost is... almost is a cold place to be.\"</p>", "<p>Snell was quiet for a long moment. He held the red mitten, and he looked at it, and the crack opened, just a little, just a crack. \"I... I dust them,\" he said. \"I dust them every day. I label them. I... I talk to them. I tell them they're safe. I tell them they're never lost.\" His voice went soft. \"I tell them they're loved. I tell them every day. I tell them... I tell them.\" He looked at Pip with his kind, tired eyes. \"Don't I? I tell them they're loved. That's... that's the same as loving them. Isn't it? Telling them they're loved. That's the same.\"</p>", "<p>And Pip, who was eleven, who had a label maker, who had just heard a man ask <em>telling them they're loved, that's the same, isn't it</em>, felt the ground under the fog go cold and sad, because the man did not know. The man did not know that telling a thing it is loved is not the same as loving it. The man did not know that loving a thing is letting it be a thing, letting it be worn and played and read and used, letting it be warm, letting it risk being lost. The man did not know that love is not a label you press onto a thing. Love is a thing you do. And the man was pressing labels, and the man was dusting, and the man was telling, and the man was not loving, and the man did not know, and the man was kind, and the man was heartbroken, and the man was being kept in the cage too.</p>", "<p>\"Mr. Snell,\" said Pip, gently, because you did not shout at a bell, you rang it softly. \"Telling a thing it's loved is not the same as loving it. Loving a thing is... is letting it be a thing. Letting it be worn. Letting it be played. Letting it be warm. Letting it... letting it risk being lost. Because a thing that's never risked is never warm. And a thing that's never warm is... is almost. And almost is a cold place to be.\"</p>", "<p>Snell was quiet for a long moment. He held the red mitten, and he looked at it, and the crack opened wider, just a little, just a crack. And then he set the mitten back on the shelf, gently, the way he did everything, and he said, \"You should go. You should... you should finish your tea and go. The Keeper is... the Keeper is busy. The Keeper is getting ready for Finding Day. And I have a great deal of dusting to do.\"</p>", "<p>And that was the end of the conversation. Not because Snell was mean. Because Snell was gentle and heartbroken and had decided not to move. Because the truth had gotten in, just a crack, and the crack had closed, and the man had gone to the dusting, because the dusting was the thing he could do, the dusting was the thing that looked like love, and the man did not know the difference, and the man was not ready to know.</p>", "<p>They finished their tea. They went to the door. And Snell saw them out, and he was gentle, and he was glad, and he said, \"Thank you for coming. Thank you for seeing it. Nobody's seen it. Nobody's seen the whole thing.\" And the gladness was a thing you could see, and it was a thing you could break.</p>", "<p>And Pip, at the door, turned, and he said, \"Mr. Snell. Tomorrow. We'll bring the thing. The thing about the almost. The thing about the warm.\" And Snell nodded, and he said, \"Tomorrow. I'll make tea. I'll make the dog kind.\" And the door closed, gently, the way he did everything, and the house with too many curtains held its breath.</p>", "<p>They stood in the lane, the three of them, and they looked at the door, and the silence had a temperature, and the temperature was a red mitten that was cold, and a man who told things they were loved instead of loving them, and a house that grew rooms, and a machine that was getting ready for Finding Day.</p>", "<p>\"He doesn't know,\" said Ollie, quietly, for him. \"He doesn't know the difference.\"</p>", "<p>\"No,\" said Pip. \"He doesn't. And we have to show him. We have to show him the difference between almost and home. Between kept and warm. Between telling a thing it's loved and loving it.\" He looked at the door. \"And we have to do it before Finding Day. Because the Keeper is getting ready. And the Keeper is getting bigger. And if we don't show him... if we don't answer the heartbreak... the Keeper is going to keep something it can't give back.\"</p>", "<p>Under the house, the Keeper hummed, patient and keeping, and it had nineteen things, and it wanted the twentieth, and it was getting bigger, and it was getting ready.</p>", "<p>But the crack was there. Just a little. Just a crack. And a red mitten was cold, and a man was telling things they were loved, and a boy had decided to show him the difference.</p>", "<p>And that, Pip thought, was enough to start with. It would have to be. Because Finding Day was coming, and the bell was waiting, and the almost was a cold place to be, and the home was a warm place, and they were going to prove it.</p>", "<p>They were going to prove it. Tomorrow. With a thing. With a thing about the warm.</p>", "<p>But that was tomorrow's problem. Tonight there was a cold red mitten, and a man who made the dog kind, and a boy who had decided to answer a heartbreak.</p>", "<p>Tonight, that was enough.</p>"]}, {"id": "ch23", "label": "Chapter 23", "tit
